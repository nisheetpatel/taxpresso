  # sg-2025-guide-wegleitung p. 35 (Formular 2, Wertschriften- und Guthabenverzeichnis, which
  # everyone fills in, p. 6) and p. 36 (the banks' tax statements, enclosed or sent by eFiling).
  - use: banks
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=35'
      label:
        en: 'St. Gallen tax guide 2025, p. 35: securities and accounts'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 35 : Titres et avoirs'
        de: 'Wegleitung zur Steuererklärung 2025, S. 35: Wertschriften- und Guthabenverzeichnis'
        it: 'Guida fiscale di San Gallo 2025, p. 35: titoli e conti'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers. On the return: Wertschriften- und Guthabenverzeichnis (Formular 2), which everyone fills in.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers. Sur la déclaration : Wertschriften- und Guthabenverzeichnis (formulaire 2, état des titres et avoirs), que chacun remplit.'
      de: 'Zähl auch PostFinance, die Konten deiner Kinder und Online- oder ausländische Broker. Auf der Steuererklärung: Wertschriften- und Guthabenverzeichnis (Formular 2), das alle ausfüllen.'
      it: 'Conta anche PostFinance, i conti dei tuoi figli e i broker online o esteri. Nella dichiarazione: Wertschriften- und Guthabenverzeichnis (Formular 2), che tutti compilano.'

