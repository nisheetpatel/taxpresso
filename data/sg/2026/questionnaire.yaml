  # In 20 communes in 2026 the church areas (Kirchgemeinden) levy different Catholic or Evangelical
  # rates, or carry different footnotes (sg-2026-communal-steuerfuesse, one row per area). Asked only
  # there, and only of a member of a church whose rate differs between the areas; each option is
  # offered only in its own commune. Generated once from packages/rules-sg (areaOptions(2026)); a
  # test keeps this list and the condition equal to it. The names are the table's.
  - id: church_area
    key: sg.church_area
    group: detail
    type: choice
    when:
      any:
        - all:
            - { key: profile.commune, in: ['st-gallen', 'niederhelfenschwil', 'waldkirch'] }
            - { key: sg.church, in: [reformed], anyPerson: true }
        - all:
            - {
                key: profile.commune,
                in:
                  [
                    'au',
                    'berneck',
                    'balgach',
                    'vilters-wangs',
                    'mels',
                    'amden',
                    'gommiswald',
                    'wildhaus-alt-st-johann',
                    'wattwil',
                    'neckertal',
                    'mosnang',
                    'oberuzwil',
                    'gossau',
                    'gaiserwald',
                  ],
              }
            - { key: sg.church, in: [catholic], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['altstatten', 'oberriet', 'oberburen'] }
            - { key: sg.church, in: [catholic, reformed], anyPerson: true }
    explain:
      en: 'Your commune has church areas (Kirchgemeinden) that levy different church tax rates for your church. Choose the area you lived in on 31 December. The names are those of the canton’s table.'
      fr: 'Votre commune a des paroisses (Kirchgemeinden) qui prélèvent des taux d’impôt ecclésiastique différents pour votre Église. Choisissez celle où vous habitiez au 31 décembre. Les noms sont ceux du tableau du canton.'
      de: 'Deine Gemeinde hat Kirchgemeinden, die für deine Kirche verschiedene Kirchensteuerfüsse erheben. Wähl die Kirchgemeinde, in der du am 31. Dezember gewohnt hast. Die Namen sind die der Tabelle des Kantons.'
      it: 'Il tuo Comune ha più parrocchie (Kirchgemeinden) che prelevano aliquote d’imposta di culto diverse per la tua Chiesa. Scegli quella in cui vivevi il 31 dicembre. I nomi sono quelli della tabella del Cantone.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/tarife-und-steuerfuesse/steuerfuesse-st-gallische-gemeinden/Steuerf%C3%BCsse%202026%20f%C3%BCr%20Versand.pdf'
      label:
        en: 'Steuerfüsse of the St. Gallen communes and church areas, 2026'
        fr: 'Coefficients (Steuerfüsse) des communes et paroisses saint-galloises, 2026'
        de: 'Steuerfüsse der Gemeinden und Kirchgemeinden des Kantons St. Gallen im Jahr 2026'
        it: 'Steuerfüsse dei Comuni e delle parrocchie sangallesi, 2026'
    text:
      en: 'Which church area (Kirchgemeinde) of your commune did you live in on 31 December 2026?'
      fr: 'Dans quelle paroisse (Kirchgemeinde) de votre commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Kirchgemeinde deiner Gemeinde hast du am 31. Dezember 2026 gewohnt?'
      it: 'In quale parrocchia (Kirchgemeinde) del tuo Comune vivevi il 31 dicembre 2026?'
    help:
      en: 'Not sure? Your Kirchgemeinde or your commune’s tax office (Gemeindesteueramt) knows.'
      fr: 'Un doute ? Votre paroisse (Kirchgemeinde) ou le service des impôts de votre commune (Gemeindesteueramt) le sait.'
      de: 'Unsicher? Deine Kirchgemeinde oder das Gemeindesteueramt weiss es.'
      it: 'Hai un dubbio? Lo sa la tua Kirchgemeinde o l’ufficio di tassazione del tuo Comune (Gemeindesteueramt).'
