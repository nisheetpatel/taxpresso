      en: 'If so, it shows on the salary certificate (Lohnausweis, Ziffer 12).'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire (Lohnausweis, Ziffer 12).'
      de: 'Wenn ja, steht es auf dem Lohnausweis (Ziffer 12).'

  # Travel to work (Formular 4, 1. Fahrkosten zwischen Wohn- und Arbeitsstätte, sg-2025-form-
  # berufskosten p. 1; sg-2025-guide-wegleitung p. 23), each tax up to its own yearly limit
  # (sg-na-deductions-fahrt-arbeitsort p. 3 and 4; ch-2026-ifd-instructions-personnes-physiques
  # p. 6). No "over 2 hours a day" choice: only Geneva's meal rule needs it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten abgezogen, bei der Kantons- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=23'
      label:
        en: 'St. Gallen tax guide 2025, p. 23: travel to work'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 23 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Fahrkosten zwischen Wohn- und Arbeitsort'
    help:
      en: 'Choose how you went on most work days. On Formular 4 (Berufskosten): 1. Fahrkosten zwischen Wohn- und Arbeitsstätte.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire 4 (Berufskosten, frais professionnels) : 1. Fahrkosten zwischen Wohn- und Arbeitsstätte (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf dem Formular 4 (Berufskosten): 1. Fahrkosten zwischen Wohn- und Arbeitsstätte.'
    options:
      - value: public_transport
        label: { en: 'Public transport', fr: 'Transports publics', de: 'Öffentlicher Verkehr' }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Motorfahrrad mit gelbem Kontrollschild',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice' }

  # sg-2025-guide-wegleitung p. 23 (1.1, public transport: the actual costs).
  - use: commute_transit_cost
    explain:
      en: 'You deduct what public transport to work actually cost you (Öffentliche Verkehrsmittel), for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez ce que les transports publics pour aller au travail vous ont réellement coûté (Öffentliche Verkehrsmittel), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst ab, was dich der öffentliche Verkehr zur Arbeit tatsächlich gekostet hat (Öffentliche Verkehrsmittel), bei der Kantons- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=23'
      label:
        en: 'St. Gallen tax guide 2025, p. 23: travel to work'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 23 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Fahrkosten zwischen Wohn- und Arbeitsort'

  # St. Gallen counts public transport as necessary; a driver without a reason deducts what public
  # transport would have cost (sg-na-deductions-fahrt-arbeitsort p. 1, Ziff. 2.1). A car or a
  # motorbike counts in begründeten Fällen: the reasons Formular 4 lists (sg-2025-form-berufskosten
  # p. 1, 1.3 Begründung), as the Steuerbuch explains them (sg-na-deductions-fahrt-arbeitsort p. 1
  # and 2, Ziff. 2.2.2; sg-2025-guide-wegleitung p. 23).
  - use: commute_transit_usable
    explain:
      en: 'St. Gallen counts public transport as the cost of getting to work, so a driver deducts what public transport would have cost, for both taxes. The kilometres count only with a reason (in begründeten Fällen): no public transport for the trip, over 60 minutes a day saved by driving, the vehicle used constantly at your employer’s request, or public transport not reasonable because of illness or infirmity (with a doctor’s certificate).'
      fr: 'Saint-Gall compte les transports publics comme le coût du trajet au travail : un conducteur déduit donc ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent qu’avec une raison (in begründeten Fällen) : pas de transport public pour ce trajet, plus de 60 minutes gagnées par jour en véhicule, le véhicule utilisé en permanence à la demande de l’employeur, ou les transports publics impossibles à cause d’une maladie ou d’une infirmité (avec un certificat médical).'
      de: 'St. Gallen anerkennt den öffentlichen Verkehr als Kosten des Arbeitswegs: Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur in begründeten Fällen: kein öffentliches Verkehrsmittel für diesen Weg, eine Einsparung von über 60 Minuten pro Tag, die ständige Benützung des Fahrzeugs auf Verlangen des Arbeitgebers, oder der öffentliche Verkehr wegen Krankheit oder Gebrechlichkeit unzumutbar (mit Arztzeugnis).'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/steuerbuch/art-29-52-stg/039_3.pdf#page=1'
      label:
        en: 'St. Gallen Steuerbuch, StB 39 Nr. 3 Fahrt zum Arbeitsort (travel to work), p. 1: car or motorbike'
        fr: 'Manuel fiscal de Saint-Gall (Steuerbuch), StB 39 Nr. 3 Fahrt zum Arbeitsort (trajet au travail), p. 1 : Voiture ou moto'
        de: 'Steuerbuch, StB 39 Nr. 3 Fahrt zum Arbeitsort, S. 1: Privatauto und Motorrad'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
          }
      - value: 'no'
        label:
          {
            en: 'No, one of those reasons applies',
            fr: 'Non, l’une de ces raisons s’applique',
            de: 'Nein, einer dieser Gründe trifft zu',
          }

  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab, bei beiden Steuern, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=23'
      label:
        en: 'St. Gallen tax guide 2025, p. 23: travel to work'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 23 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Fahrkosten zwischen Wohn- und Arbeitsort'

  # sg-2025-guide-wegleitung p. 23 (1.3, a rate per kilometre driven, usually at most 220 working
  # days a year; Formular 4, 1.3 Motorfahrzeug, sg-2025-form-berufskosten p. 1).
  - use: commute_distance
    explain:
      en: 'With one of those reasons, both taxes count a fixed amount per kilometre (Motorfahrzeug), there and back once a day, each up to its own yearly limit.'
      fr: 'Avec l’une de ces raisons, les deux impôts comptent un montant fixe par kilomètre (Motorfahrzeug, véhicule à moteur), un aller et retour par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Mit einem dieser Gründe zählen beide Steuern einen festen Betrag pro Kilometer (Motorfahrzeug), einmal hin und zurück pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=23'
      label:
        en: 'St. Gallen tax guide 2025, p. 23: travel by car or motorbike'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 23 : Trajets en véhicule à moteur'
        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Benützung eines Motorfahrzeuges'

  - use: commute_drive_days
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=23'
      label:
        en: 'St. Gallen tax guide 2025, p. 23: travel by car or motorbike'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 23 : Trajets en véhicule à moteur'
        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Benützung eines Motorfahrzeuges'
    help:
      en: 'The days you actually drove to work; leave out holidays, sick days and days worked from home (Homeoffice). St. Gallen usually counts at most 220 a year, more only with proof.'
      fr: 'Les jours où vous êtes effectivement allé au travail en véhicule ; sans les vacances, les jours de maladie et les jours de télétravail (Homeoffice). Saint-Gall compte en général au plus 220 jours par an, davantage seulement sur preuve.'
      de: 'Die Tage, an denen du effektiv zur Arbeit gefahren bist; ohne Ferien, Krankheitstage und Tage im Homeoffice. St. Gallen rechnet in der Regel mit höchstens 220 Arbeitstagen im Jahr, mit mehr nur gegen Nachweis.'

  # Meals away from home (Formular 4, 2. Mehrkosten für Verpflegung: lunch break too short to go
  # home; half with box G), for both taxes: sg-2025-guide-wegleitung p. 24; none on days worked from
  # home (p. 23, margin).
  - use: meal_days
    explain:
      en: 'Lunch away from home costs more than at home when your break is too short to go home (Mehrkosten für Verpflegung, Formular 4). A fixed amount per day counts for both taxes, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur coûte plus cher qu’à la maison quand votre pause est trop courte pour rentrer (Mehrkosten für Verpflegung, formulaire 4). Un montant fixe par jour compte pour les deux impôts, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen kostet mehr als zu Hause, wenn die Arbeitspause für die Heimkehr zu kurz ist (Mehrkosten für Verpflegung, Formular 4). Für beide Steuern zählt ein fester Betrag pro Tag, bis zu einem jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=24'
      label:
        en: 'St. Gallen tax guide 2025, p. 24: meals'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 24 : Frais de repas'
        de: 'Wegleitung zur Steuererklärung 2025, S. 24: Mehrkosten für Verpflegung'
    help:
      en: 'Count the work days your lunch break was too short to go home; leave out days worked from home. 0 if you usually ate at home.'
      fr: 'Comptez les jours de travail où votre pause de midi était trop courte pour rentrer ; sans les jours de télétravail. 0 si vous mangiez en général à la maison.'
      de: 'Zähl die Arbeitstage, an denen die Mittagspause für die Heimkehr zu kurz war; ohne Tage im Homeoffice. 0, wenn du meistens zu Hause gegessen hast.'

  # sg-2025-guide-wegleitung p. 26 (13.1 Säule 3a: only the contributions paid in the year, with the
  # attestation; the catch-up from 2026, sg-2026-guide-merkblatt-unterjaehrig p. 4).
  - use: pillar3a
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=26'
      label:
        en: 'St. Gallen tax guide 2025, p. 26: pillar 3a'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 26 : Pilier 3a'
        de: 'Wegleitung zur Steuererklärung 2025, S. 26: Säule 3a'
    help:
      en: 'Your bank or insurer sends an attestation (Bescheinigung): attach it to your return. On the return: 13.1 Säule 3a.'
      fr: 'Votre banque ou votre assurance vous envoie une attestation (Bescheinigung) : joignez-la à votre déclaration. Sur la déclaration : 13.1 Säule 3a (pilier 3a).'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung: Leg sie der Steuererklärung bei. Auf der Steuererklärung: 13.1 Säule 3a.'

  # sg-2025-guide-wegleitung p. 26 (13.2: only what the net salary doesn't already account for;
  # attach the fund's attestation and the buy-in calculation).
  - use: lpp_buyin
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=26'
      label:
        en: 'St. Gallen tax guide 2025, p. 26: pension fund buy-ins'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 26 : Rachats au 2e pilier'
        de: 'Wegleitung zur Steuererklärung 2025, S. 26: Säule 2 (BVG) inkl. Einkaufsbeiträge'
    help:
      en: 'A voluntary payment on top of the usual contributions. Count only a buy-in your salary certificate doesn’t show. On the return: 13.2 Säule 2 (BVG) inkl. Einkaufsbeiträge.'
      fr: 'Un versement volontaire en plus des cotisations habituelles. Ne comptez qu’un rachat que votre certificat de salaire n’indique pas. Sur la déclaration : 13.2 Säule 2 (BVG) inkl. Einkaufsbeiträge (2e pilier, rachats compris).'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen. Zähl nur einen Einkauf, den dein Lohnausweis nicht zeigt. Auf der Steuererklärung: 13.2 Säule 2 (BVG) inkl. Einkaufsbeiträge.'

