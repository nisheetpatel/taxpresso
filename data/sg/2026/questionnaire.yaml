  # sg-2025-guide-wegleitung p. 14 (one salary certificate per employer) and p. 15 (1.1 and 1.2: the
  # net salary of the main job and of a side job for another employer).
  - use: employers
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=14'
      label:
        en: 'St. Gallen tax guide 2025, p. 14: employment income'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 14 : Revenu d’une activité dépendante'
        de: 'Wegleitung zur Steuererklärung 2025, S. 14: Einkünfte aus unselbständiger Erwerbstätigkeit'
    help:
      en: 'Each one gives you a salary certificate (Lohnausweis). On the return: 1.1 Haupterwerb, and 1.2 Nebenerwerb for a side job.'
      fr: 'Chacun vous remet un certificat de salaire (Lohnausweis). Sur la déclaration : 1.1 Haupterwerb (activité principale), et 1.2 Nebenerwerb (activité accessoire) pour un emploi secondaire.'
      de: 'Jeder gibt dir einen Lohnausweis. Auf der Steuererklärung: 1.1 Haupterwerb, und 1.2 Nebenerwerb für eine Nebenbeschäftigung.'

