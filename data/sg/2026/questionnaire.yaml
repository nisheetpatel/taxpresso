# St. Gallen questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not
# code: packages/questionnaire reads it, and every key and value must exist in St. Gallen's keys
# (packages/rules-sg, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of St. Gallen's return (Formular 1, sg-2025-form-steuererklaerung: page 1 personal details and
# children, page 2 income, page 3 deductions with Formular 4, page 4 wealth), with St. Gallen's own
# explanations and official pages. The questions only St. Gallen asks are written out here, as
# packages/rules-sg reads them (StGallenCantonal): who mainly bears the upkeep of children in shared
# custody without child support, each child's stage (not yet of school age, or in school or
# training) and, for a child in school or training, whether a minor, its education costs and its
# scholarships, the childcare paid for each child (the limit is per child), the commune and the
# move, each adult's church, and the church area where the commune's areas levy different rates.
# The child questions stay together after the children, as page 1 lists them.
#
# Wording and documents follow the St. Gallen guide for 2025 (sg-2025-guide-wegleitung): the 2026
# guide is not published yet (docs/sources/sg/NOTES.md, Gaps), so the questions say "2026" and link
# the 2025 guide, whose line numbers the return keeps until it appears. "p." is the page of the PDF
# file, as in the links, and the guide prints the same page numbers. The return and the guide are in
# German: the questions give the German term next to the gloss.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'St. Gallen', fr: 'Saint-Gall', de: 'St. Gallen' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}' }

# E-Tax SG is the canton's online return, a web app started at steuern.sg.ch/etaxnp
# (docs/sources/sg/NOTES.md, Filing channels; sg-na-efiling-etax-sg; sg-2025-guide-wegleitung p. 5
# and 10). No document of the library says it is free, so the text doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. E-Tax SG, the canton’s online return (steuern.sg.ch/etaxnp), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. E-Tax SG, la déclaration en ligne du canton (steuern.sg.ch/etaxnp), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. E-Tax SG, die Online-Steuererklärung des Kantons (steuern.sg.ch/etaxnp), oder eine Treuhand kann es.'

questions:
  - use: canton

  # sg-2025-guide-wegleitung p. 12 (Heirat, Trennung oder Scheidung: the situation of the whole
  # year) and p. 8 (spouses and registered partners are taxed together, on one return both sign).
  - use: civil_status
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=12'
      label:
        en: 'St. Gallen tax guide 2025, p. 12: marriage, separation or divorce'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 12 : Mariage, séparation ou divorce'
        de: 'Wegleitung zur Steuererklärung 2025, S. 12: Heirat, Trennung oder Scheidung'
    help:
      en: 'A registered partnership files like a married couple, on one return that both of you sign.'
      fr: 'Un partenariat enregistré déclare comme un couple marié, sur une seule déclaration que vous signez tous les deux.'
      de: 'Eine eingetragene Partnerschaft reicht wie ein Ehepaar eine gemeinsame Steuererklärung ein, die ihr beide unterschreibt.'

  # sg-2025-guide-wegleitung p. 13 (Kinder, für deren Unterhalt Sie zur Hauptsache aufkommen: page 1
  # of Formular 1 lists them, each Im Vorschulalter or In Schule oder Ausbildung) and p. 31 (23.1 and
  # 23.2: minors in your parental care or custody, and adult children in training).
  - use: children
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=13'
      label:
        en: 'St. Gallen tax guide 2025, p. 13: children'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 13 : Enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Kinder'
    help:
      en: 'Children whose upkeep you mainly bear (zur Hauptsache aufkommen): minors, and adult children still in school or training. Page 1 of the return (Formular 1) lists them.'
      fr: 'Les enfants dont vous assumez l’essentiel de l’entretien (zur Hauptsache aufkommen) : les mineurs, et les enfants majeurs encore à l’école ou en formation. La page 1 de la déclaration (Formular 1) les liste.'
      de: 'Kinder, für deren Unterhalt du zur Hauptsache aufkommst: Minderjährige und volljährige Kinder, die noch in Schule oder Ausbildung sind. Seite 1 der Steuererklärung (Formular 1) listet sie auf.'

  # Parents taxed apart: the child deduction goes to one parent only and is never split
  # (sg-na-deductions-kinderabzug p. 5, Ziff. 2.3).
  - use: children_custody
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/steuerbuch/art-29-52-stg/048_1.pdf#page=5'
      label:
        en: 'St. Gallen Steuerbuch, StB 48 Nr. 1 Kinderabzug (child deduction), p. 5: parents taxed apart'
        fr: 'Manuel fiscal de Saint-Gall (Steuerbuch), StB 48 Nr. 1 Kinderabzug (déduction pour enfant), p. 5 : Parents taxés séparément'
        de: 'Steuerbuch, StB 48 Nr. 1 Kinderabzug, S. 5: nicht gemeinsam besteuerte Eltern'
    help:
      en: 'Parents taxed apart: St. Gallen gives the child deduction (Kinderabzug) to one of you only, never half each.'
      fr: 'Parents taxés séparément : Saint-Gall n’accorde la déduction pour enfant (Kinderabzug) qu’à l’un de vous, jamais la moitié à chacun.'
      de: 'Getrennt besteuerte Eltern: St. Gallen gibt den Kinderabzug nur einem von euch, nie je die Hälfte.'

  # Parents taxed apart with joint custody: for the cantonal tax, the parent who receives child
  # support counts the children, and the one who pays deducts it (12.2) and has no child deduction;
  # without child support, the parent who mainly bears their upkeep (sg-2026-law-steuergesetz
  # Art. 48 Abs. 1 lit. a, p. 26; sg-na-deductions-kinderabzug p. 5 to 7, Ziff. 2.3.1 and 2.3.3;
  # sg-2025-guide-wegleitung p. 26 and 31); for the federal tax, half the child deduction each
  # without child support, the parental scale to the one who earns more
  # (ch-na-circulaire-30-epoux-famille p. 24).
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it counts them, and the one who pays it deducts it instead (12.2); without child support, St. Gallen counts them for the parent who mainly bears their upkeep, and the federal tax gives each parent half the child deduction and the parental scale (Elterntarif), a lower rate, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit les compte, et celui qui la verse la déduit à la place (12.2) ; sans contribution, Saint-Gall les compte pour le parent qui assume l’essentiel de leur entretien, et l’impôt fédéral donne à chacun la moitié de la déduction pour enfant et le barème parental (Elterntarif), un taux plus bas, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, zählt die Kinder, und wer sie bezahlt, zieht sie stattdessen ab (12.2); ohne Unterhaltsbeiträge zählt St. Gallen sie für den Elternteil, der zur Hauptsache für ihren Unterhalt aufkommt, und die Bundessteuer gibt jedem den halben Kinderabzug und den Elterntarif, einen tieferen Satz, dem, der mehr verdient.'
    learnMore:
      url: 'https://www.gesetzessammlung.sg.ch/api/de/versions/3822/pdf_file#page=26'
      label:
        en: 'St. Gallen tax law (Steuergesetz) 2026, Art. 48, p. 26: child deduction of parents taxed apart'
        fr: 'Loi fiscale de Saint-Gall (Steuergesetz) 2026, art. 48, p. 26 : Déduction pour enfant des parents taxés séparément'
        de: 'Steuergesetz, Stand 2026, Art. 48, S. 26: Kinderabzug nicht gemeinsam besteuerter Eltern'
    help:
      en: 'Child support (Unterhaltsbeiträge, Alimente) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge, Alimente) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge (Alimente) sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'

  # Without child support, the child deduction goes to the parent who mainly bears the upkeep; with
  # equal shares the canton presumes the parent with the lower net income (Reineinkommen)
  # (sg-na-deductions-kinderabzug p. 6 and 7, Ziff. 2.3.3, after BGE 141 II 338;
  # sg-2026-law-steuergesetz Art. 48 Abs. 1 lit. a, p. 26). The childcare deduction follows the
  # child deduction (sg-na-deductions-kinderbetreuungskosten p. 2), and a single parent living with
  # children they mainly support has Vollsplitting (sg-2025-guide-wegleitung p. 50). packages/rules-sg
  # asks rather than guess (NOTE.mainUpkeep).
  - id: main_upkeep
    key: sg.main_upkeep
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'With shared custody and no child support, St. Gallen counts the children for the parent who mainly bears their upkeep (zur Hauptsache für den Unterhalt aufkommen): that parent gets the child deduction (Kinderabzug), the childcare deduction and Vollsplitting, the lower rate for single parents. When you both bear the upkeep equally, the canton presumes it is the parent with the lower net income (Reineinkommen).'
      fr: 'En garde partagée sans contribution d’entretien, Saint-Gall compte les enfants pour le parent qui assume l’essentiel de leur entretien (zur Hauptsache für den Unterhalt aufkommen) : ce parent a la déduction pour enfant (Kinderabzug), la déduction des frais de garde et le Vollsplitting, le taux plus bas des familles monoparentales. Si vous assumez l’entretien à parts égales, le canton présume que c’est le parent au revenu net le plus bas (Reineinkommen).'
      de: 'Bei geteilter Obhut ohne Unterhaltsbeiträge zählt St. Gallen die Kinder für den Elternteil, der zur Hauptsache für ihren Unterhalt aufkommt: Er erhält den Kinderabzug, den Abzug für die Kinderbetreuungskosten und das Vollsplitting, den tieferen Satz für Einelternfamilien. Tragt ihr den Unterhalt zu gleichen Teilen, gilt vermutungsweise der Elternteil mit dem tieferen Reineinkommen.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/steuerbuch/art-29-52-stg/048_1.pdf#page=6'
      label:
        en: 'St. Gallen Steuerbuch, StB 48 Nr. 1 Kinderabzug (child deduction), p. 6: parents taxed apart without child support'
        fr: 'Manuel fiscal de Saint-Gall (Steuerbuch), StB 48 Nr. 1 Kinderabzug (déduction pour enfant), p. 6 : Parents taxés séparément sans contribution d’entretien'
        de: 'Steuerbuch, StB 48 Nr. 1 Kinderabzug, S. 6: keine Unterhaltsbeiträge zwischen getrennt besteuerten Eltern'
    text:
      en: 'In 2026, did you mainly bear the children’s upkeep (Unterhalt zur Hauptsache)?'
      fr: 'En 2026, assumiez-vous l’essentiel de l’entretien des enfants (Unterhalt zur Hauptsache) ?'
      de: 'Bist du 2026 zur Hauptsache für den Unterhalt der Kinder aufgekommen?'
    help:
      en: 'Upkeep means food, housing, clothing, care and education. If you share it equally, answer yes only if your net income (Reineinkommen) was the lower one. Not sure? Your last assessment (Veranlagung) shows whether you got the child deduction.'
      fr: 'L’entretien comprend la nourriture, le logement, les vêtements, la garde et la formation. Si vous le partagez à parts égales, répondez oui seulement si votre revenu net (Reineinkommen) était le plus bas. Un doute ? Votre dernière taxation (Veranlagung) indique si vous avez eu la déduction pour enfant.'
      de: 'Zum Unterhalt gehören Essen, Wohnen, Kleidung, Betreuung und Ausbildung. Teilt ihr ihn zu gleichen Teilen, antworte nur mit Ja, wenn dein Reineinkommen das tiefere war. Unsicher? Deine letzte Veranlagung zeigt, ob du den Kinderabzug erhalten hast.'
    chip: { en: 'Bears the upkeep', fr: 'Assume l’entretien', de: 'Bestreitet den Unterhalt' }

  # The child deduction is smaller for a child not yet of school age (23.1) than for a child in
  # school or training, an adult child in training too (23.2), on 31 December
  # (sg-2026-law-steuergesetz Art. 48 Abs. 1 lit. a Ziff. 1 and 2, p. 25; Abs. 2, p. 26). A child
  # becomes of school age on the 1 August after its fourth birthday, with kindergarten
  # (sg-na-deductions-kinderabzug p. 2, Ziff. 2.1.2; sg-2025-guide-wegleitung p. 13 and 31).
  - id: child_stage
    key: sg.child_stage
    type: choice
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'St. Gallen’s child deduction (Kinderabzug) is smaller for a child not yet of school age (23.1) than for a child in school or training (23.2). A child becomes of school age on the 1 August after its fourth birthday, when kindergarten starts: kindergarten counts as school. An adult child counts only while still in school or training.'
      fr: 'La déduction pour enfant de Saint-Gall (Kinderabzug) est plus petite pour un enfant pas encore en âge scolaire (23.1) que pour un enfant à l’école ou en formation (23.2). Un enfant atteint l’âge scolaire le 1er août qui suit son quatrième anniversaire, à l’entrée à l’école enfantine : l’école enfantine compte comme école. Un enfant majeur ne compte que s’il est encore à l’école ou en formation.'
      de: 'Der Kinderabzug ist in St. Gallen für ein Kind im Vorschulalter (23.1) kleiner als für ein Kind in Schule oder Ausbildung (23.2). Ein Kind wird am 1. August nach seinem vierten Geburtstag schulpflichtig, mit dem Eintritt in den Kindergarten: Der Kindergarten zählt als Schule. Ein volljähriges Kind zählt nur, solange es noch in Schule oder Ausbildung ist.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=31'
      label:
        en: 'St. Gallen tax guide 2025, p. 31: child deductions'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 31 : Déductions pour enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 31: Sozialabzüge, Kinderabzug'
    text:
      en: 'On 31 December 2026, was child {n} in school or training, or not yet of school age?'
      fr: 'Au 31 décembre 2026, l’enfant {n} était-il à l’école ou en formation, ou pas encore en âge scolaire ?'
      de: 'War Kind {n} am 31. Dezember 2026 in Schule oder Ausbildung oder noch im Vorschulalter?'
    help:
      en: 'Kindergarten counts as school. On page 1 of the return: Im Vorschulalter, or In Schule oder Ausbildung. Number your children the same way in every answer, for example from the oldest.'
      fr: 'L’école enfantine compte comme école. En page 1 de la déclaration : Im Vorschulalter (en âge préscolaire), ou In Schule oder Ausbildung (à l’école ou en formation). Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Der Kindergarten zählt als Schule. Auf Seite 1 der Steuererklärung: Im Vorschulalter oder In Schule oder Ausbildung. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
    options:
      - value: preschool
        label:
          {
            en: 'Not yet of school age (Vorschulalter)',
            fr: 'Pas encore en âge scolaire (Vorschulalter)',
            de: 'Im Vorschulalter',
          }
        chip: { en: 'Preschool child', fr: 'Enfant d’âge préscolaire', de: 'Kind im Vorschulalter' }
      - value: school
        label:
          {
            en: 'In school or training, kindergarten included (Schule oder Ausbildung)',
            fr: 'À l’école ou en formation, école enfantine comprise (Schule oder Ausbildung)',
            de: 'In Schule oder Ausbildung, Kindergarten inbegriffen',
          }
        chip:
          { en: 'Child in school or training', fr: 'Enfant en formation', de: 'Kind in Ausbildung' }

  # sg-2025-guide-wegleitung p. 34 (36.3: tax-free wealth for each minor child in your parental care
  # or custody); sg-2026-law-steuergesetz Art. 64 Abs. 1 (p. 29). A child not yet of school age is a
  # minor: asked only for a child in school or training.
  - id: child_minor
    key: sg.child_minor
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: sg.child_stage, in: [school] }
    explain:
      en: 'For each minor child, part of your wealth is tax-free (Abzug für jedes minderjährige Kind, 36.3). An adult child in training still gives the child deduction.'
      fr: 'Pour chaque enfant mineur, une partie de votre fortune est exonérée (Abzug für jedes minderjährige Kind, 36.3). Un enfant majeur en formation donne quand même droit à la déduction pour enfant.'
      de: 'Für jedes minderjährige Kind ist ein Teil deines Vermögens steuerfrei (Abzug für jedes minderjährige Kind, 36.3). Ein volljähriges Kind in Ausbildung gibt trotzdem den Kinderabzug.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=34'
      label:
        en: 'St. Gallen tax guide 2025, p. 34: social deductions on wealth'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 34 : Déductions sociales sur la fortune'
        de: 'Wegleitung zur Steuererklärung 2025, S. 34: Sozialabzüge beim Vermögen'
    text:
      en: 'Was child {n} a minor (under 18) on 31 December 2026?'
      fr: 'L’enfant {n} était-il mineur (moins de 18 ans) au 31 décembre 2026 ?'
      de: 'War Kind {n} am 31. Dezember 2026 minderjährig (unter 18)?'
    help:
      en: 'Number your children the same way in every answer, for example from the oldest.'
      fr: 'Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # 23.3, Ausbildungskosten für Kinder in Schule oder Ausbildung: for each child in school or
  # training, the costs you bear yourself above an excess, up to a limit per child, less the state
  # scholarships (sg-2026-law-steuergesetz Art. 48 Abs. 1 lit. a Ziff. 3, p. 26; Formular 10,
  # sg-na-form-ausbildungs-kinderbetreuungskosten p. 1; sg-2025-guide-wegleitung p. 29 and 31 on what
  # counts; the invoice date decides the year, sg-na-deductions-kinderabzug p. 10, Ziff. 3.5).
  - id: child_education
    key: sg.child_education
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: sg.child_stage, in: [school] }
    explain:
      en: 'For each child in school or training, St. Gallen also deducts the education costs you paid yourself (Ausbildungskosten, 23.3, Formular 10), above an excess (Selbstbehalt) and up to a limit per child, less state scholarships. Tuition fees, books and course notes count, and so do the extra costs of meals away from home and public transport to the place of training.'
      fr: 'Pour chaque enfant à l’école ou en formation, Saint-Gall déduit aussi les frais de formation que vous avez payés vous-même (Ausbildungskosten, 23.3, Formular 10), au-delà d’une part à votre charge (Selbstbehalt) et jusqu’à une limite par enfant, moins les bourses de l’État. Les écolages, les livres et les supports de cours comptent, de même que les frais supplémentaires de repas à l’extérieur et les transports publics jusqu’au lieu de formation.'
      de: 'Für jedes Kind in Schule oder Ausbildung zieht St. Gallen auch die Ausbildungskosten ab, die du selbst bezahlt hast (23.3, Formular 10), über einem Selbstbehalt und bis zu einem Höchstbetrag pro Kind, abzüglich der staatlichen Stipendien. Es zählen Schul- und Semestergebühren, Bücher und Skripte, die Mehrkosten der auswärtigen Verpflegung und der öffentliche Verkehr zum Ausbildungsort.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=31'
      label:
        en: 'St. Gallen tax guide 2025, p. 31: child deductions and education costs'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 31 : Déductions pour enfants et frais de formation'
        de: 'Wegleitung zur Steuererklärung 2025, S. 31: Kinderabzug und Ausbildungskosten'
    text:
      en: 'How much did you pay in 2026 for child {n}’s education (Ausbildungskosten)?'
      fr: 'Combien avez-vous payé en 2026 pour la formation de l’enfant {n} (Ausbildungskosten) ?'
      de: 'Wie viel hast du 2026 für die Ausbildung von Kind {n} bezahlt (Ausbildungskosten)?'
    help:
      en: 'In CHF, the costs invoiced in 2026 before any scholarship; 0 if none. For an apprentice, half the costs of the apprenticeship count. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, les frais facturés en 2026 avant toute bourse ; 0 s’il n’y en a pas. Pour un apprenti, la moitié des frais de l’apprentissage compte. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, die 2026 in Rechnung gestellten Kosten vor allfälligen Stipendien; 0, wenn keine. Bei einer Lehre zählt die Hälfte der Kosten. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # State scholarships (Stipendien) reduce the education costs (sg-2026-law-steuergesetz Art. 48
  # Abs. 1 lit. a, p. 26; Formular 10, Abzüglich Stipendien, sg-na-form-ausbildungs-
  # kinderbetreuungskosten p. 1); only state scholarships received or granted for the year, not
  # private ones or repayable study loans (sg-na-deductions-kinderabzug p. 9, Ziff. 3.4). Asked only
  # when the child's education costs are above 0.
  - id: child_scholarships
    key: sg.child_scholarships
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: sg.child_stage, in: [school] }
        - { key: sg.child_education, gt: 0 }
    explain:
      en: 'State scholarships (Stipendien) for a child reduce the education costs you deduct for that child. Private scholarships and study loans you must pay back don’t count.'
      fr: 'Les bourses d’études de l’État (Stipendien) pour un enfant réduisent les frais de formation que vous déduisez pour cet enfant. Les bourses privées et les prêts d’études à rembourser ne comptent pas.'
      de: 'Staatliche Stipendien für ein Kind verringern die Ausbildungskosten, die du für dieses Kind abziehst. Private Stipendien und rückzahlbare Studiendarlehen zählen nicht.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/steuerbuch/art-29-52-stg/048_1.pdf#page=9'
      label:
        en: 'St. Gallen Steuerbuch, StB 48 Nr. 1 Kinderabzug (child deduction), p. 9: scholarships'
        fr: 'Manuel fiscal de Saint-Gall (Steuerbuch), StB 48 Nr. 1 Kinderabzug (déduction pour enfant), p. 9 : Bourses (Stipendien)'
        de: 'Steuerbuch, StB 48 Nr. 1 Kinderabzug, S. 9: Stipendien'
    text:
      en: 'How much in state scholarships (Stipendien) did you or child {n} receive for 2026?'
      fr: 'Combien de bourses d’études de l’État (Stipendien) avez-vous reçues, vous ou l’enfant {n}, pour 2026 ?'
      de: 'Wie viel staatliche Stipendien hast du oder hat Kind {n} für 2026 erhalten?'
    help:
      en: 'In CHF, received or granted for 2026; 0 if none. On Formular 10: Abzüglich Stipendien.'
      fr: 'En CHF, reçues ou accordées pour 2026 ; 0 s’il n’y en a pas. Sur le formulaire 10 : Abzüglich Stipendien (moins les bourses).'
      de: 'In CHF, für 2026 erhalten oder zugesprochen; 0, wenn keine. Auf dem Formular 10: Abzüglich Stipendien.'

  # sg-2025-guide-wegleitung p. 28 (16.2, Kinderbetreuungskosten bei Drittbetreuung: children under
  # 14 living with you, while you work, train or cannot work; meals don't count; Formular 10); for a
  # couple, both (sg-na-deductions-kinderbetreuungskosten p. 1); lunch clubs and homework help don't
  # count (p. 2).
  - use: childcare
    explain:
      en: 'What you paid so someone else looks after a child under 14 while you work, train or can’t work; for a couple, while both of you do. Meals, lunch clubs (Mittagstisch) and homework help don’t count.'
      fr: 'Ce que vous avez payé pour faire garder un enfant de moins de 14 ans pendant que vous travaillez, êtes en formation ou ne pouvez pas travailler ; pour un couple, cela vaut pour vous deux. Les repas, les tables de midi (Mittagstisch) et l’aide aux devoirs ne comptent pas.'
      de: 'Was du bezahlt hast, damit jemand anderes ein Kind unter 14 betreut, während du arbeitest, in Ausbildung bist oder nicht erwerbsfähig bist; bei einem Paar gilt das für euch beide. Verpflegung, Mittagstisch und Aufgabenhilfe zählen nicht.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=28'
      label:
        en: 'St. Gallen tax guide 2025, p. 28: childcare by others'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 28 : Frais de garde par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 28: Kinderbetreuungskosten bei Drittbetreuung'
    help:
      en: 'A day mother (Tagesmutter), a crèche (Kita), day care (Hort) or a nanny. On the return: 16.2, Kinderbetreuungskosten bei Drittbetreuung (Formular 10, with the name and address of whoever looked after the child).'
      fr: 'Une maman de jour (Tagesmutter), une crèche (Kita), une garderie (Hort) ou une nourrice. Sur la déclaration : 16.2, Kinderbetreuungskosten bei Drittbetreuung (formulaire 10, frais de garde par des tiers, avec le nom et l’adresse de la personne qui a gardé l’enfant).'
      de: 'Eine Tagesmutter, eine Kita, ein Hort oder eine Nanny. Auf der Steuererklärung: 16.2, Kinderbetreuungskosten bei Drittbetreuung (Formular 10, mit Name und Adresse der betreuenden Person).'

  # The limit is per child under 14 (sg-2026-law-steuergesetz Art. 45 Abs. 1 lit. h, p. 24;
  # sg-2025-guide-wegleitung p. 28), and Formular 10 lists the childcare child by child
  # (sg-na-form-ausbildungs-kinderbetreuungskosten p. 2): with several children, how the invoices'
  # total splits can decide the deduction, so it is asked per child.
  - id: child_care
    key: sg.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'St. Gallen’s limit on childcare is per child (16.2), and Formular 10 lists the costs child by child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'La limite de Saint-Gall pour les frais de garde est par enfant (16.2), et le formulaire 10 liste les frais enfant par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Der Höchstbetrag für die Kinderbetreuungskosten gilt in St. Gallen pro Kind (16.2), und das Formular 10 listet die Kosten Kind für Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=28'
      label:
        en: 'St. Gallen tax guide 2025, p. 28: childcare by others'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 28 : Frais de garde par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 28: Kinderbetreuungskosten bei Drittbetreuung'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Kinderbetreuungskosten war für Kind {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # The commune of 31 December taxes the whole year: between communes, the law applies the federal
  # rules between cantons (sg-2026-law-steuergesetz Art. 233 Abs. 1, p. 90), and the canton where
  # you lived at the end of the year taxes the whole year (sg-2025-guide-wegleitung p. 11). The list
  # is St. Gallen's 75 political communes by name (packages/rules-sg, from
  # sg-2026-communal-steuerfuesse; the table has no BFS numbers). Each sets its Steuerfuss of the
  # einfache Steuer (Art. 5 and 6 Abs. 2 lit. b, p. 2).
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year. Each political commune (politische Gemeinde) sets its own Steuerfuss, a percentage of the simple tax (einfache Steuer), on top of the canton’s.'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année. Chaque commune politique (politische Gemeinde) fixe son propre coefficient (Steuerfuss), un pourcentage de l’impôt simple (einfache Steuer), en plus de celui du canton.'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr. Jede politische Gemeinde legt ihren eigenen Steuerfuss fest, einen Prozentsatz der einfachen Steuer, zusätzlich zu jenem des Kantons.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/tarife-und-steuerfuesse/steuerfuesse-st-gallische-gemeinden/Steuerf%C3%BCsse%202026%20f%C3%BCr%20Versand.pdf'
      label:
        en: 'Steuerfüsse of the St. Gallen communes, 2026'
        fr: 'Coefficients (Steuerfüsse) des communes saint-galloises, 2026'
        de: 'Steuerfüsse der Gemeinden des Kantons St. Gallen im Jahr 2026'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
    help:
      en: 'The official name, such as St. Gallen, Rapperswil-Jona or Wil.'
      fr: 'Le nom officiel, par exemple St. Gallen, Rapperswil-Jona ou Wil.'
      de: 'Der offizielle Name, zum Beispiel St. Gallen, Rapperswil-Jona oder Wil.'

  # Who files in St. Gallen: everyone living in the canton on 31 December (sg-2025-guide-wegleitung
  # p. 5); arriving from another canton, St. Gallen taxes the whole year (p. 11, Zuzug aus einem
  # anderen Kanton); arriving from abroad or leaving for abroad means a return for part of the year
  # (p. 11, Zuzug aus dem Ausland, Wegzug ins Ausland): not covered by rules-sg. A move within the
  # canton: the commune of 31 December (sg-2026-law-steuergesetz Art. 233 Abs. 1, p. 90).
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: St. Gallen taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Saint-Gall vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: St. Gallen besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/2025-hs/Wegleitung_NP_2025.pdf#page=11'
      label:
        en: 'St. Gallen tax guide 2025, p. 11: arriving and leaving during the year'
        fr: 'Guide fiscal de Saint-Gall 2025, p. 11 : Arrivée et départ en cours d’année'
        de: 'Wegleitung zur Steuererklärung 2025, S. 11: Beginn und Beendigung der Steuerpflicht'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein' } }
      - value: within_sg
        label:
          {
            en: 'Yes, within the canton of St. Gallen',
            fr: 'Oui, dans le canton de Saint-Gall',
            de: 'Ja, innerhalb des Kantons St. Gallen',
          }
        chip: { en: 'Moved in the canton', fr: 'Déménagé dans le canton', de: 'Umzug im Kanton' }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
          }
        notSupported:
          {
            en: 'Leaving Switzerland (Wegzug ins Ausland)',
            fr: 'Un départ de Suisse (Wegzug ins Ausland)',
            de: 'Ein Wegzug ins Ausland',
          }

  # Church tax (Kirchensteuer): members pay it to their Kirchgemeinde or the Jewish community
  # (sg-na-law-steuerverordnung Art. 1 Abs. 1, p. 1; sg-2026-law-steuergesetz Art. 3, p. 2); in a
  # mixed marriage, half to each spouse's church (Art. 2 Abs. 1). The Catholic and Evangelical rates
  # are set per church area and the Christ Catholic rate is one for the canton
  # (sg-2026-communal-steuerfuesse, Bemerkungen); the Jewish community's rate is not in the table,
  # so that option is not supported (packages/rules-sg fails closed). Page 1 of Formular 1 asks each
  # adult's Konfession. Opt-in: Taxpresso adds the church tax only for a member.
  - id: church
    key: sg.church
    type: choice
    perPerson: true
    explain:
      en: 'Members of a recognised religious community (Religionsgemeinschaft) pay church tax (Kirchensteuer): a Steuerfuss of the simple tax (einfache Steuer), set by the Catholic or the Evangelical Reformed Kirchgemeinde where they live, or one rate for the whole canton for the Christ Catholic church. In a mixed marriage, each spouse’s church gets half. Taxpresso adds it only for a member.'
      fr: 'Les membres d’une communauté religieuse reconnue (Religionsgemeinschaft) paient l’impôt ecclésiastique (Kirchensteuer) : un coefficient (Steuerfuss) de l’impôt simple (einfache Steuer), fixé par la paroisse (Kirchgemeinde) catholique ou évangélique réformée de leur domicile, ou un taux unique pour tout le canton pour l’Église catholique chrétienne. Dans un mariage mixte, l’Église de chaque conjoint en reçoit la moitié. Taxpresso ne l’ajoute que pour un membre.'
      de: 'Mitglieder einer anerkannten Religionsgemeinschaft zahlen Kirchensteuer: einen Steuerfuss der einfachen Steuer, den die katholische oder die evangelisch-reformierte Kirchgemeinde ihres Wohnorts festlegt, oder für die christkatholische Kirche einen Satz für den ganzen Kanton. In einer gemischten Ehe erhält die Kirche jedes Ehegatten die Hälfte. Taxpresso rechnet sie nur für Mitglieder dazu.'
    learnMore:
      url: 'https://www.gesetzessammlung.sg.ch/api/de/versions/3565/pdf_file#page=1'
      label:
        en: 'St. Gallen tax ordinance (Steuerverordnung), Art. 1 and 2, p. 1: religious communities'
        fr: 'Ordonnance fiscale de Saint-Gall (Steuerverordnung), art. 1 et 2, p. 1 : Communautés religieuses'
        de: 'Steuerverordnung, Art. 1 und 2, S. 1: anerkannte Religionsgemeinschaften'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these religious communities?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces communautés religieuses ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Religionsgemeinschaften?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these religious communities?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces communautés religieuses ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Religionsgemeinschaften?'
    help:
      en: 'Your Konfession, as on page 1 of the return (Formular 1). Another religion, or none, pays no church tax; leaving a church ends it from your valid declaration of leaving (Austrittserklärung).'
      fr: 'Votre confession (Konfession), comme en page 1 de la déclaration (Formular 1). Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique ; quitter une Église y met fin dès la déclaration de sortie valable (Austrittserklärung).'
      de: 'Deine Konfession, wie auf Seite 1 der Steuererklärung (Formular 1). Eine andere Religion oder keine zahlt keine Kirchensteuer; ein Kirchenaustritt beendet sie ab der rechtsgültigen Austrittserklärung.'
    options:
      - value: catholic
        label:
          {
            en: 'Roman Catholic (katholisch)',
            fr: 'Catholique romaine (katholisch)',
            de: 'Katholisch',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch' }
      - value: reformed
        label:
          {
            en: 'Evangelical Reformed (evangelisch-reformiert)',
            fr: 'Évangélique réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert' }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique chrétienne (christkatholisch)',
            de: 'Christkatholisch',
          }
        chip: { en: 'Christ Catholic', fr: 'Catholique chrétien(ne)', de: 'Christkatholisch' }
      - value: jewish
        label:
          {
            en: 'The Jewish community (Jüdische Gemeinde)',
            fr: 'La communauté juive (Jüdische Gemeinde)',
            de: 'Jüdische Gemeinde',
          }
        chip: { en: 'Jewish community', fr: 'Communauté juive', de: 'Jüdische Gemeinde' }
        notSupported:
          {
            en: 'The tax of the Jewish community (Jüdische Gemeinde)',
            fr: 'L’impôt de la communauté juive (Jüdische Gemeinde)',
            de: 'Die Steuer der Jüdischen Gemeinde',
          }
      - value: none
        label: { en: 'None of these', fr: 'Aucune de ces communautés', de: 'Keine davon' }

  # In 20 communes in 2026 the church areas (Kirchgemeinden) levy different Catholic or Evangelical
  # rates, or carry different footnotes (sg-2026-communal-steuerfuesse, one row per area). Asked only
  # there, and only of a member of a church whose rate differs between the areas; each option is
  # offered only in its own commune. Generated once from packages/rules-sg (areaOptions(2026)); a
  # test keeps this list and the condition equal to it. The names are the table's.
  - id: church_area
    key: sg.church_area
    type: choice
    when:
      any:
        - all:
            - { key: profile.commune, in: ['st-gallen', 'niederhelfenschwil', 'waldkirch'] }
            - { key: sg.church, in: [reformed], anyPerson: true }
        - all:
            - {
                key: profile.commune,
                in:
                  [
                    'au',
                    'berneck',
                    'balgach',
                    'vilters-wangs',
                    'mels',
                    'amden',
                    'gommiswald',
                    'wildhaus-alt-st-johann',
                    'wattwil',
                    'neckertal',
                    'mosnang',
                    'oberuzwil',
                    'gossau',
                    'gaiserwald',
                  ],
              }
            - { key: sg.church, in: [catholic], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['altstatten', 'oberriet', 'oberburen'] }
            - { key: sg.church, in: [catholic, reformed], anyPerson: true }
    explain:
      en: 'Your commune has church areas (Kirchgemeinden) that levy different church tax rates for your church. Choose the area you lived in on 31 December. The names are those of the canton’s table.'
      fr: 'Votre commune a des paroisses (Kirchgemeinden) qui prélèvent des taux d’impôt ecclésiastique différents pour votre Église. Choisissez celle où vous habitiez au 31 décembre. Les noms sont ceux du tableau du canton.'
      de: 'Deine Gemeinde hat Kirchgemeinden, die für deine Kirche verschiedene Kirchensteuerfüsse erheben. Wähl die Kirchgemeinde, in der du am 31. Dezember gewohnt hast. Die Namen sind die der Tabelle des Kantons.'
    learnMore:
      url: 'https://www.sg.ch/content/dam/sgch/steuern-finanzen/steuern/formulare-und-wegleitungen/einkommens-und-vermoegenssteuer/tarife-und-steuerfuesse/steuerfuesse-st-gallische-gemeinden/Steuerf%C3%BCsse%202026%20f%C3%BCr%20Versand.pdf'
      label:
        en: 'Steuerfüsse of the St. Gallen communes and church areas, 2026'
        fr: 'Coefficients (Steuerfüsse) des communes et paroisses saint-galloises, 2026'
        de: 'Steuerfüsse der Gemeinden und Kirchgemeinden des Kantons St. Gallen im Jahr 2026'
    text:
      en: 'Which church area (Kirchgemeinde) of your commune did you live in on 31 December 2026?'
      fr: 'Dans quelle paroisse (Kirchgemeinde) de votre commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Kirchgemeinde deiner Gemeinde hast du am 31. Dezember 2026 gewohnt?'
    help:
      en: 'Not sure? Your Kirchgemeinde or your commune’s tax office (Gemeindesteueramt) knows.'
      fr: 'Un doute ? Votre paroisse (Kirchgemeinde) ou le service des impôts de votre commune (Gemeindesteueramt) le sait.'
      de: 'Unsicher? Deine Kirchgemeinde oder das Gemeindesteueramt weiss es.'
    options:
      - value: 'st-gallen:St. Gallen Centrum (C)'
        label:
          {
            en: 'St. Gallen: St. Gallen Centrum (C)',
            fr: 'St. Gallen : St. Gallen Centrum (C)',
            de: 'St. Gallen: St. Gallen Centrum (C)',
          }
        when: { key: profile.commune, eq: 'st-gallen' }
      - value: 'st-gallen:St. Gallen Tablat (O)'
        label:
          {
            en: 'St. Gallen: St. Gallen Tablat (O)',
            fr: 'St. Gallen : St. Gallen Tablat (O)',
            de: 'St. Gallen: St. Gallen Tablat (O)',
          }
        when: { key: profile.commune, eq: 'st-gallen' }
      - value: 'st-gallen:St. Gallen Straubenzell (W)'
        label:
          {
            en: 'St. Gallen: St. Gallen Straubenzell (W)',
            fr: 'St. Gallen : St. Gallen Straubenzell (W)',
            de: 'St. Gallen: St. Gallen Straubenzell (W)',
          }
        when: { key: profile.commune, eq: 'st-gallen' }
      - value: 'au:Au'
        label: { en: 'Au: Au', fr: 'Au : Au', de: 'Au: Au' }
        when: { key: profile.commune, eq: 'au' }
      - value: 'au:Heerbrugg'
        label: { en: 'Au: Heerbrugg', fr: 'Au : Heerbrugg', de: 'Au: Heerbrugg' }
        when: { key: profile.commune, eq: 'au' }
      - value: 'berneck:Berneck'
        label: { en: 'Berneck: Berneck', fr: 'Berneck : Berneck', de: 'Berneck: Berneck' }
        when: { key: profile.commune, eq: 'berneck' }
      - value: 'berneck:Heerbrugg'
        label: { en: 'Berneck: Heerbrugg', fr: 'Berneck : Heerbrugg', de: 'Berneck: Heerbrugg' }
        when: { key: profile.commune, eq: 'berneck' }
      - value: 'balgach:Balgach'
        label: { en: 'Balgach: Balgach', fr: 'Balgach : Balgach', de: 'Balgach: Balgach' }
        when: { key: profile.commune, eq: 'balgach' }
      - value: 'balgach:Heerbrugg'
        label: { en: 'Balgach: Heerbrugg', fr: 'Balgach : Heerbrugg', de: 'Balgach: Heerbrugg' }
        when: { key: profile.commune, eq: 'balgach' }
      - value: 'altstatten:Altstätten'
        label:
          {
