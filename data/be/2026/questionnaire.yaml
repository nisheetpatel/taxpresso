# Bern questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not code:
# packages/questionnaire reads it, and every key and value must exist in Bern's keys
# (packages/rules-be, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Bern return (forms 1 to 6 of be-2025-steuererklaerung-formulare-de), with Bern's own
# explanations and official pages. The questions only Bern asks are written out here: keeping your
# own household alone (form 1.2), the tariff and the wealth deduction of a parent sharing custody
# without child support (from the last assessment), education costs per child (form 2.1), the
# commune, the move, the church of each person and the part of the commune whose parishes levy
# different rates, and payments to political parties per person (form 4.4).
#
# Wording and documents follow the Bern guide for 2025 (be-2025-wegleitung-np-de), the latest
# published; the 2026 guide is not published yet (docs/sources/be/NOTES.md, Gaps): re-check against
# it. "p." is the page of the PDF file, as in the links; the guide prints its own page number
# ("Seite") 9 lower, and its table of contents (p. 2 to 9) gives the Seite of each form line. The
# French terms are those of the French guide (be-2025-wegleitung-np-fr), next to the German ones
# printed on the form.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'Bern', fr: 'Berne', de: 'Bern' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}' }

# TaxMe-Online is the canton's online return, logged in with BE-Login at www.taxme.ch
# (be-2025-wegleitung-np-de p. 1 and p. 18; be-2025-info-np-jan2026-de p. 3). No document of the
# library says it is free, so the text doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. TaxMe-Online, the canton’s online return (www.taxme.ch, with BE-Login), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. TaxMe-Online, la déclaration en ligne du canton (www.taxme.ch, avec BE-Login), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. TaxMe-Online, die Online-Steuererklärung des Kantons (www.taxme.ch, mit BE-Login), oder eine Treuhand kann es.'

questions:
  - use: canton

  # Form 1.2, Zivilstand am 31.12. (be-2025-steuererklaerung-formulare-de p. 1);
  # be-2025-wegleitung-np-de p. 20 (Seite 11, Eheleute) and p. 21 (Seite 12: a registered
  # partnership files as a married couple).
  - use: civil_status
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=20'
      label:
        en: 'Bern tax guide 2025, p. 20: married couples'
        fr: 'Guide fiscal bernois 2025, p. 20 : Époux'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Eheleute'
    help:
      en: 'On form 1.2: Zivilstand am 31.12. A registered partnership files like a married couple.'
      fr: 'Sur le formulaire 1.2 : Zivilstand am 31.12. (état civil au 31 décembre). Un partenariat enregistré déclare comme un couple marié.'
      de: 'Auf dem Formular 1.2: Zivilstand am 31.12. Eine eingetragene Partnerschaft füllt die Steuererklärung wie ein Ehepaar aus.'

  # Form 1.2, "Führen Sie alleine einen eigenen Haushalt?" (be-2025-steuererklaerung-formulare-de
  # p. 1); be-2025-wegleitung-np-de p. 19 (Seite 10, Alleinstehende); be-2026-stg-de Art. 40 Abs. 2
  # (p. 29, Abzug für Alleinstehende). Only for someone filing alone: married couples and registered
  # partners file together. Social deductions follow the situation at the end of the year
  # (be-2026-stg-de Art. 67 Abs. 3, p. 42).
  - id: own_household
    key: be.own_household
    type: yesno
    when: { key: profile.civil_status, in: [single, separated, divorced, widowed] }
    explain:
      en: 'You keep your own household alone if you live alone, only with your own children who give you a child deduction, or with a person in need who can’t work and whom you support. Living with a partner (Konkubinat) or in a flat share (Wohngemeinschaft) doesn’t count. A yes gives you the deduction for people living alone (Abzug für Alleinstehende).'
      fr: 'Vous tenez ménage indépendant seul si vous vivez seul, seulement avec vos enfants donnant droit à la déduction pour enfant, ou avec une personne dans le besoin incapable d’exercer une activité rémunérée que vous entretenez. Vivre en concubinage ou en communauté ne compte pas. Un oui vous donne la déduction pour personne seule (Abzug für Alleinstehende).'
      de: 'Du führst alleine einen eigenen Haushalt, wenn du allein lebst, nur mit deinen eigenen Kindern, für die du den Kinderabzug erhältst, oder mit einer unterstützungsbedürftigen, erwerbsunfähigen Person. Im Konkubinat oder in einer Wohngemeinschaft zählt es nicht. Ein Ja gibt dir den Abzug für Alleinstehende.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=19'
      label:
        en: 'Bern tax guide 2025, p. 19: people living alone'
        fr: 'Guide fiscal bernois 2025, p. 19 : Personne seule'
        de: 'Wegleitung zur Steuererklärung 2025, S. 19: Alleinstehende'
    text:
      en: 'On 31 December 2026, did you keep your own household alone?'
      fr: 'Au 31 décembre 2026, teniez-vous ménage indépendant seul ou seule ?'
      de: 'Hast du am 31. Dezember 2026 alleine einen eigenen Haushalt geführt?'
    help:
      en: 'On form 1.2: Führen Sie alleine einen eigenen Haushalt?'
      fr: 'Sur le formulaire 1.2 : Führen Sie alleine einen eigenen Haushalt? (Tenez-vous ménage indépendant seul·e ?)'
      de: 'Auf dem Formular 1.2: Führen Sie alleine einen eigenen Haushalt?'
    chip: { en: 'Own household', fr: 'Ménage indépendant', de: 'Eigener Haushalt' }

  # be-2025-wegleitung-np-de p. 30 (Seite 21, Kinderabzug für minderjährige Kinder) and p. 31
  # (Seite 22, volljährige Kinder); form 2.1 (be-2025-steuererklaerung-formulare-de p. 2).
  - use: children
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=30'
      label:
        en: 'Bern tax guide 2025, p. 30: child deduction'
        fr: 'Guide fiscal bernois 2025, p. 30 : Déduction pour enfant'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Kinderabzug'
    help:
      en: 'On form 2.1: Kinder (children).'
      fr: 'Sur le formulaire 2.1 : Kinder (enfants).'
      de: 'Auf dem Formular 2.1: Kinder.'

  # be-2025-wegleitung-np-de p. 29 (Seite 20, Kind wohnt bei mir/uns?: yes also when the child
  # lives with each parent in turn).
  - use: children_custody
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=29'
      label:
        en: 'Bern tax guide 2025, p. 29: does the child live with you?'
        fr: 'Guide fiscal bernois 2025, p. 29 : L’enfant habite-t-il chez vous ?'
        de: 'Wegleitung zur Steuererklärung 2025, S. 29: Kind wohnt bei mir/uns?'
    help:
      en: 'On form 2.1, column wohnt bei mir/uns (lives with me or us): yes also when the children live with each parent in turn.'
      fr: 'Sur le formulaire 2.1, colonne wohnt bei mir/uns (habite chez moi ou chez nous) : oui aussi quand les enfants vivent alternativement chez chaque parent.'
      de: 'Auf dem Formular 2.1, Spalte wohnt bei mir/uns: Ja auch dann, wenn die Kinder abwechselnd bei beiden Elternteilen leben.'

  # Parents taxed apart in two homes: with child support, the parent taxed on it has the child
  # deduction; without, each has half (be-2025-wegleitung-np-de p. 30, Seite 21; be-2026-stg-de
  # Art. 40 Abs. 3 Bst. a, p. 30). For the federal parental scale: ch-na-circulaire-30-epoux-famille
  # p. 24.
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it gets the child deduction (Kinderabzug) in full; without child support, you each get half. For the federal tax, the parental scale (Elterntarif), a lower rate, goes to the parent who receives child support or, without it, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit a droit à toute la déduction pour enfant (Kinderabzug) ; sans contribution, chacun en a la moitié. Pour l’impôt fédéral, le barème parental, un taux plus bas, revient au parent qui reçoit la contribution ou, sans contribution, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, bekommt den ganzen Kinderabzug; ohne Unterhaltsbeiträge erhält jeder die Hälfte. Bei der Bundessteuer geht der Elterntarif, ein tieferer Satz, an den Elternteil, der Unterhaltsbeiträge erhält, oder ohne Unterhaltsbeiträge an den, der mehr verdient.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=30'
      label:
        en: 'Bern tax guide 2025, p. 30: child deduction of parents taxed apart'
        fr: 'Guide fiscal bernois 2025, p. 30 : Déduction pour enfant des parents taxés séparément'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Kinderabzug getrennt veranlagter Eltern'
    help:
      en: 'Child support (Kinderalimente, Unterhaltsbeiträge) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Kinderalimente, Unterhaltsbeiträge) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Kinderalimente (Unterhaltsbeiträge) sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'

  # The tariff for married couples and single parents (be-2026-stg-de Art. 42 Abs. 1, p. 31) goes
  # to a parent who lives with the children and mainly bears their upkeep; the canton's page names
  # only parents living together (be-na-tariff-taxinfo-tarif-einkommenssteuer, 1 and 3). How it is
  # decided between two homes with shared custody and no child support is not in the documents
  # (docs/sources/be/NOTES.md, Open points for the rules): Taxpresso asks what the last assessment
  # applied (packages/rules-be, explain.ts, NOTE.marriedTariff).
  - id: married_tariff
    key: be.married_tariff
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'Bern has two income tax tariffs: a lower one for married couples and single parents (Tarif für Verheiratete und Einelternfamilien), and one for everyone else. With shared custody and no child support, the lower one goes to the parent who mainly supports the children, and Bern’s documents don’t say how that is decided between two homes. Taxpresso uses what your last assessment applied.'
      fr: 'Berne a deux barèmes de l’impôt sur le revenu : un plus bas pour les couples mariés et les familles monoparentales (Tarif für Verheiratete und Einelternfamilien), et un pour toutes les autres personnes. En garde partagée sans contribution d’entretien, le plus bas revient au parent qui assume l’essentiel de l’entretien des enfants, et les documents bernois ne disent pas comment on le décide entre deux ménages. Taxpresso reprend ce que votre dernière taxation a appliqué.'
      de: 'Bern hat zwei Tarife für die Einkommenssteuer: einen tieferen für Verheiratete und Einelternfamilien (Verheiratetentarif) und einen für alle übrigen Personen. Bei geteilter Obhut ohne Unterhaltsbeiträge erhält den tieferen der Elternteil, der hauptsächlich für die Kinder aufkommt, und die Berner Unterlagen sagen nicht, wie das zwischen zwei Haushalten entschieden wird. Taxpresso übernimmt, was deine letzte Veranlagung angewendet hat.'
    learnMore:
      url: 'https://www.taxinfo.sv.fin.be.ch/taxinfo/f3ad83d5-30d6-41c9-8f79-c34e192c57ad'
      label:
        en: 'Income tax tariffs (TaxInfo, Bern tax administration)'
        fr: 'Barèmes de l’impôt sur le revenu (TaxInfo, Intendance des impôts)'
        de: 'Tarif Einkommenssteuer (TaxInfo, Steuerverwaltung)'
    text:
      en: 'Did your last assessment (Veranlagungsverfügung) tax you at the tariff for married couples and single parents?'
      fr: 'Votre dernière décision de taxation (Veranlagungsverfügung) vous a-t-elle appliqué le barème des couples mariés et des familles monoparentales ?'
      de: 'Hat dich deine letzte Veranlagungsverfügung zum Tarif für Verheiratete und Einelternfamilien besteuert?'
    help:
      en: 'Your last assessment names the tariff it used. No assessment yet, or not sure? The tax administration (Steuerverwaltung) can tell you.'
      fr: 'Votre dernière décision de taxation indique le barème appliqué. Pas encore de décision, ou un doute ? L’Intendance des impôts (Steuerverwaltung) peut vous le dire.'
      de: 'Deine letzte Veranlagungsverfügung nennt den angewendeten Tarif. Noch keine Veranlagung, oder unsicher? Die Steuerverwaltung kann es dir sagen.'
    chip: { en: 'Married tariff', fr: 'Barème des familles', de: 'Verheiratetentarif' }

  # The wealth deduction per child goes with the child deduction (be-2026-stg-de Art. 64 Abs. 1
  # Bst. b, p. 41); Art. 40 Abs. 8 (p. 31) halves only the income deductions it lists. Whether a
  # shared child deduction gives it in full or half is not in the documents (docs/sources/be/
  # NOTES.md, Open points for the rules; packages/rules-be, explain.ts, NOTE.sharedChildWealth).
  - id: child_wealth
    key: be.child_wealth
    type: choice
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'Each child who gives a child deduction also lowers your taxable wealth (Kinderabzug auf dem Vermögen). With shared custody and no child support, you each get half the child deduction on income, but the law doesn’t say whether the one on wealth is halved too. Taxpresso uses what your last assessment applied.'
      fr: 'Chaque enfant donnant droit à la déduction pour enfant diminue aussi votre fortune imposable (Kinderabzug auf dem Vermögen). En garde partagée sans contribution d’entretien, chacun a la moitié de la déduction pour enfant sur le revenu, mais la loi ne dit pas si celle sur la fortune est aussi partagée. Taxpresso reprend ce que votre dernière taxation a appliqué.'
      de: 'Jedes Kind, für das du den Kinderabzug erhältst, senkt auch dein steuerbares Vermögen (Kinderabzug auf dem Vermögen). Bei geteilter Obhut ohne Unterhaltsbeiträge erhält jeder die Hälfte des Kinderabzugs auf dem Einkommen, aber das Gesetz sagt nicht, ob auch der Abzug auf dem Vermögen halbiert wird. Taxpresso übernimmt, was deine letzte Veranlagung angewendet hat.'
    learnMore:
      url: 'https://www.belex.sites.be.ch/api/de/versions/3330/pdf_file#page=41'
      label:
        en: 'Bern tax law (Steuergesetz), Art. 64: deductions from wealth'
        fr: 'Loi bernoise sur les impôts (Steuergesetz), art. 64 : Déductions sur la fortune'
        de: 'Steuergesetz, Art. 64: Sozialabzüge auf dem Vermögen'
    text:
      en: 'On your last assessment (Veranlagungsverfügung), how much of the wealth deduction per child did you get?'
      fr: 'Sur votre dernière décision de taxation (Veranlagungsverfügung), quelle part de la déduction sur la fortune par enfant avez-vous obtenue ?'
      de: 'Wie viel vom Kinderabzug auf dem Vermögen hast du auf deiner letzten Veranlagungsverfügung erhalten?'
    help:
      en: 'It changes only your wealth tax (Vermögenssteuer). Not sure, or no assessment yet? The tax administration (Steuerverwaltung) can tell you.'
      fr: 'Cela ne change que votre impôt sur la fortune (Vermögenssteuer). Un doute, ou pas encore de décision ? L’Intendance des impôts (Steuerverwaltung) peut vous le dire.'
      de: 'Es ändert nur deine Vermögenssteuer. Unsicher, oder noch keine Veranlagung? Die Steuerverwaltung kann es dir sagen.'
    options:
      - value: full
        label:
          {
            en: 'The full deduction for each child',
            fr: 'La déduction entière pour chaque enfant',
            de: 'Den ganzen Abzug für jedes Kind',
          }
      - value: half
        label:
          {
            en: 'Half of it for each child',
            fr: 'La moitié pour chaque enfant',
            de: 'Die Hälfte für jedes Kind',
          }

  # be-2025-wegleitung-np-de p. 23 (Seite 14, Kinderdrittbetreuungskosten) and p. 24 (Seite 15:
  # name the person who looked after the child); be-na-deductions-taxinfo-kinderdrittbetreuung.
  - use: childcare
    learnMore:
      url: 'https://www.taxinfo.sv.fin.be.ch/taxinfo/291bf1b9-10c8-42eb-bdd4-fd54f1a8e708'
      label:
        en: 'Childcare costs (TaxInfo, Bern tax administration)'
        fr: 'Frais de garde des enfants par des tiers (TaxInfo, Intendance des impôts)'
        de: 'Kinderdrittbetreuungskosten (TaxInfo, Steuerverwaltung)'
    help:
      en: 'A crèche (Kita), a day school (Tagesschule) or day parents (Tageseltern), while you work or study. Meals don’t count. On form 2.1: Bezahlte Kinderdrittbetreuungskosten, with the name and address of whoever looked after the child.'
      fr: 'Une crèche, une école à journée continue ou des parents de jour, pendant que vous travaillez ou étudiez. Les repas ne comptent pas. Sur le formulaire 2.1 : Bezahlte Kinderdrittbetreuungskosten (frais de garde des enfants par des tiers), avec le nom et l’adresse de la personne qui a gardé l’enfant.'
      de: 'Kita, Tagesschule oder Tageseltern, während du arbeitest oder in Ausbildung bist. Mahlzeiten zählen nicht. Auf dem Formular 2.1: Bezahlte Kinderdrittbetreuungskosten, mit Name und Adresse der betreuenden Person.'

  # Form 2.1 asks the childcare paid per child, and the limit is per child (be-2025-steuererklaerung-
  # formulare-de p. 2; be-2025-wegleitung-np-de p. 23, Seite 14; be-na-deductions-taxinfo-
  # kinderdrittbetreuung). With several children, how the invoices' total splits can decide the
  # deduction: asked per child.
  - id: child_care
    key: be.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Form 2.1 asks the childcare paid for each child, and Bern’s limit is per child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'Le formulaire 2.1 demande les frais de garde payés pour chaque enfant (Bezahlte Kinderdrittbetreuungskosten), et la limite bernoise est par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Das Formular 2.1 fragt die bezahlten Kinderdrittbetreuungskosten für jedes Kind, und der Berner Höchstbetrag gilt pro Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
    learnMore:
      url: 'https://www.taxinfo.sv.fin.be.ch/taxinfo/291bf1b9-10c8-42eb-bdd4-fd54f1a8e708'
      label:
        en: 'Childcare costs (TaxInfo, Bern tax administration)'
        fr: 'Frais de garde des enfants par des tiers (TaxInfo, Intendance des impôts)'
        de: 'Kinderdrittbetreuungskosten (TaxInfo, Steuerverwaltung)'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Kinderdrittbetreuungskosten war für Kind {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # Form 2.1, column "Auswärtige bzw. zusätzliche Ausbildungskosten" (be-2025-steuererklaerung-
  # formulare-de p. 2); be-2025-wegleitung-np-de p. 25 (Seite 16, Ausbildungskosten: cantonal and
  # communal tax only, a limit per child); be-2026-stg-de Art. 40 Abs. 3 Bst. b (p. 30). Asked only
  # with children who live with you, also in turn (p. 29, Seite 20).
  - id: education
    key: be.education
    type: yesno
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'For each child who gives you a child deduction, Bern also deducts the extra costs of an education away from home, or other education costs you can prove (auswärtige bzw. zusätzliche Ausbildungskosten), up to a limit per child. Only the cantonal and communal tax have this deduction, not the federal tax.'
      fr: 'Pour chaque enfant donnant droit à la déduction pour enfant, Berne déduit aussi les frais supplémentaires d’une instruction à l’extérieur, ou d’autres frais de formation que vous pouvez prouver (auswärtige bzw. zusätzliche Ausbildungskosten), jusqu’à une limite par enfant. Seuls les impôts cantonal et communal ont cette déduction, pas l’impôt fédéral.'
      de: 'Für jedes Kind, für das du den Kinderabzug erhältst, zieht Bern auch die Mehrkosten einer auswärtigen Ausbildung oder andere nachgewiesene zusätzliche Ausbildungskosten ab, bis zu einem Höchstbetrag pro Kind. Diesen Abzug gibt es nur bei den Kantons- und Gemeindesteuern, nicht bei der Bundessteuer.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=25'
      label:
        en: 'Bern tax guide 2025, p. 25: education costs'
        fr: 'Guide fiscal bernois 2025, p. 25 : Frais de formation'
        de: 'Wegleitung zur Steuererklärung 2025, S. 25: Ausbildungskosten'
    text:
      en: 'In 2026, did you pay for a child’s education away from home, or extra education costs you can prove?'
      fr: 'En 2026, avez-vous payé pour un enfant des frais d’instruction à l’extérieur, ou des frais supplémentaires de formation que vous pouvez prouver ?'
      de: 'Hast du 2026 für ein Kind auswärtige Ausbildungskosten oder nachgewiesene zusätzliche Ausbildungskosten bezahlt?'
    help:
      en: 'On form 2.1, column Auswärtige bzw. zusätzliche Ausbildungskosten. Keep the proof.'
      fr: 'Sur le formulaire 2.1, colonne Auswärtige bzw. zusätzliche Ausbildungskosten (frais d’instruction à l’extérieur ou supplémentaires). Gardez les justificatifs.'
      de: 'Auf dem Formular 2.1, Spalte Auswärtige bzw. zusätzliche Ausbildungskosten. Bewahr die Belege auf.'
    chip: { en: 'Education costs', fr: 'Frais de formation', de: 'Ausbildungskosten' }

  # The amount per child, for the column of form 2.1 (be-2025-steuererklaerung-formulare-de p. 2);
  # be-2025-wegleitung-np-de p. 25 (Seite 16: the limit applies per child).
  - id: child_education
    key: be.child_education
    type: money
    perChild: true
    when: { key: be.education, is: true }
    explain:
      en: 'The extra education costs of this child that you paid yourself. Taxpresso applies the limit per child.'
      fr: 'Les frais supplémentaires de formation de cet enfant que vous avez payés vous-même. Taxpresso applique la limite par enfant.'
      de: 'Die zusätzlichen Ausbildungskosten dieses Kindes, die du selbst bezahlt hast. Taxpresso rechnet mit dem Höchstbetrag pro Kind.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=25'
      label:
        en: 'Bern tax guide 2025, p. 25: education costs'
        fr: 'Guide fiscal bernois 2025, p. 25 : Frais de formation'
        de: 'Wegleitung zur Steuererklärung 2025, S. 25: Ausbildungskosten'
    text:
      en: 'How much did you pay in 2026 for child {n}’s education away from home or extra education costs?'
      fr: 'Combien avez-vous payé en 2026 pour l’enfant {n} en frais d’instruction à l’extérieur ou en frais supplémentaires de formation ?'
      de: 'Wie viel hast du 2026 für Kind {n} an auswärtigen oder zusätzlichen Ausbildungskosten bezahlt?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # The commune of 31 December taxes the whole year (be-2026-stg-de Art. 165 Abs. 1 and 4, p. 89;
  # Art. 251 Abs. 1, p. 127). The list is Bern's 334 communes of 2026 by BFS number (packages/
  # rules-be, from be-na-communal-steueranlagen-1983-2026 sheet Daten Gde, checked against
  # be-2026-steueranlagen-gemeinden-de table 2.1, p. 13 to 20). The Steueranlage is a multiple of
  # the einfache Steuer (be-2026-steueranlagen-gemeinden-de p. 3 and 13).
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year. Each commune sets its own Steueranlage, a multiple of the simple tax (einfache Steuer), as the canton does.'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année. Chaque commune fixe sa propre quotité d’impôt (Steueranlage), un multiple de l’impôt simple (einfache Steuer), comme le canton.'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr. Jede Gemeinde legt ihre eigene Steueranlage fest, ein Vielfaches der einfachen Steuer, wie der Kanton.'
    learnMore:
      url: 'https://www.fin.be.ch/content/dam/fin/dokumente/de/finanzverwaltung/finanzausgleich/publikationen/fv-stat-steueranlage_2026_1.pdf#page=13'
      label:
        en: 'Communal tax multipliers and church tax rates 2026, p. 13'
        fr: 'Quotités d’impôt des communes et taux des impôts paroissiaux 2026, p. 13'
        de: 'Steueranlagen der Gemeinden und Steuersätze der Kirchgemeinden 2026, S. 13'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
    help:
      en: 'The official name, such as Biel/Bienne. In a few communes, the parishes of different parts levy different church tax rates: Taxpresso asks for your part later, only if it changes your tax.'
      fr: 'Le nom officiel, par exemple Biel/Bienne. Dans quelques communes, les paroisses de différentes parties prélèvent des taux d’impôt paroissial différents : Taxpresso vous demande votre partie plus tard, seulement si cela change votre impôt.'
      de: 'Der offizielle Name, zum Beispiel Biel/Bienne. In einigen Gemeinden erheben die Kirchgemeinden verschiedener Teile verschiedene Kirchensteuersätze: Taxpresso fragt später nach deinem Teil, nur wenn er deine Steuer ändert.'

  # Who files in Bern: everyone living in the canton at the end of the year (be-2025-wegleitung-np-
  # de p. 10, Seite 1); a move within Switzerland follows the federal harmonisation law
  # (be-2026-stg-de Art. 9 Abs. 3, p. 6), so the canton of 31 December taxes the whole year (as for
  # the federal tax, ch-na-law-lifd art. 105 al. 1, p. 58). Arriving from abroad or leaving
  # Switzerland means a return for part of the year (p. 15, Seite 6: Unterjährige Steuererklärung;
  # be-2026-stg-de Art. 9 Abs. 1 and 2, p. 6): not covered by rules-be.
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Bern taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Berne vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Bern besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=10'
      label:
        en: 'Bern tax guide 2025, p. 10: who files a return'
        fr: 'Guide fiscal bernois 2025, p. 10 : Obligation de déclarer'
        de: 'Wegleitung zur Steuererklärung 2025, S. 10: Steuererklärungspflicht'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein' } }
      - value: within_bern
        label:
          {
            en: 'Yes, within the canton of Bern',
            fr: 'Oui, dans le canton de Berne',
            de: 'Ja, innerhalb des Kantons Bern',
          }
        chip: { en: 'Moved in Bern', fr: 'Déménagé à Berne', de: 'Umzug im Kanton' }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
          }
        notSupported:
          {
            en: 'Leaving Switzerland (Wegzug ins Ausland)',
            fr: 'Un départ de Suisse (Wegzug ins Ausland)',
            de: 'Ein Wegzug ins Ausland',
          }

  # Church tax (Kirchensteuer, impôt paroissial): each parish sets its rate as a fraction of the
  # einfache Steuer, in three columns, Reformed, Roman Catholic and Christ Catholic
  # (be-2026-steueranlagen-gemeinden-de p. 3 and table 2.1 from p. 13; the rates per commune in
  # be-na-communal-steueranlagen-1983-2026 sheet Daten Gde). The commune's tax register records the
  # Konfession on 31 December (be-2025-wegleitung-np-de p. 18, Seite 9; TaxMe's summary,
  # be-2025-steuererklaerung-formulare-de p. 9). Opt-in: Taxpresso adds it only for a member.
  - id: church
    key: be.church
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Reformed, Roman Catholic or Christ Catholic church pay church tax (Kirchensteuer), a fraction of the simple tax (einfache Steuer) set by their parish (Kirchgemeinde). Taxpresso adds it only for a member.'
      fr: 'Les membres de l’Église réformée, catholique romaine ou catholique chrétienne paient l’impôt paroissial (Kirchensteuer), un multiplicateur de l’impôt simple (einfache Steuer) fixé par leur paroisse (Kirchgemeinde). Taxpresso ne l’ajoute que pour un membre.'
      de: 'Mitglieder der reformierten, der römisch-katholischen oder der christkatholischen Kirche zahlen Kirchensteuer, einen Bruchteil der einfachen Steuer, den ihre Kirchgemeinde festlegt. Taxpresso rechnet sie nur für Mitglieder dazu.'
    learnMore:
      url: 'https://www.fin.be.ch/content/dam/fin/dokumente/de/finanzverwaltung/finanzausgleich/publikationen/fv-stat-steueranlage_2026_1.pdf#page=13'
      label:
        en: 'Communal tax multipliers and church tax rates 2026, p. 13'
        fr: 'Quotités d’impôt des communes et taux des impôts paroissiaux 2026, p. 13'
        de: 'Steueranlagen der Gemeinden und Steuersätze der Kirchgemeinden 2026, S. 13'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these churches?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces Églises ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these churches?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces Églises ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
    help:
      en: 'Your commune’s tax register (Steuerregister) records it on 31 December, as Konfession. Another religion, or none, pays no church tax.'
      fr: 'Le registre de l’impôt de votre commune l’indique au 31 décembre, sous Konfession (confession). Une autre religion, ou aucune, ne paie pas d’impôt paroissial.'
      de: 'Das Steuerregister deiner Gemeinde führt sie per 31. Dezember als Konfession. Eine andere Religion oder keine zahlt keine Kirchensteuer.'
    options:
      - value: reformed
        label:
          {
            en: 'Reformed (evangelisch-reformiert)',
            fr: 'Réformée évangélique (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert' }
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch' }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique chrétienne (christkatholisch)',
            de: 'Christkatholisch',
          }
        chip: { en: 'Christ Catholic', fr: 'Catholique chrétien(ne)', de: 'Christkatholisch' }
      - value: none
        label: { en: 'None of these', fr: 'Aucune de ces Églises', de: 'Keine davon' }

  # In 21 communes the parishes of different parts (Unterabteilungen, sections) levy different
  # church tax rates in 2026 (be-na-communal-steueranlagen-1983-2026 sheet Daten Gde, one row per
  # part; be-2026-steueranlagen-gemeinden-de table 2.1, p. 13 to 20). Asked only there, and only of
  # a member of a church whose rate differs between the parts; each option is offered only in its
  # own commune. Generated once from packages/rules-be (parishOptions(2026)); a test keeps this list
  # and the condition equal to it. The names are the table's, sometimes shortened.
  - id: parish
    key: be.parish
    type: choice
    when:
      any:
        - all:
            - { key: profile.commune, in: ['304', '310'] }
            - { key: be.church, in: [reformed, christ_catholic], anyPerson: true }
        - all:
            - {
                key: profile.commune,
                in:
                  [
                    '306',
                    '329',
                    '538',
                    '540',
                    '567',
                    '608',
                    '784',
                    '908',
                    '938',
                    '939',
                    '948',
                    '957',
                    '981',
                  ],
              }
            - { key: be.church, in: [reformed], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['716', '889'] }
            - { key: be.church, in: [catholic], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['767', '770', '879'] }
            - { key: be.church, in: [reformed, catholic], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['872'] }
            - { key: be.church, in: [catholic, christ_catholic], anyPerson: true }
    explain:
      en: 'Your commune has parts whose parishes levy different church tax rates for your church. Choose the part you lived in on 31 December. The names are those of the canton’s table, sometimes shortened.'
      fr: 'Votre commune a des parties dont les paroisses prélèvent des taux d’impôt paroissial différents pour votre Église. Choisissez la partie où vous habitiez au 31 décembre. Les noms sont ceux du tableau du canton, parfois abrégés.'
      de: 'Deine Gemeinde hat Teile, deren Kirchgemeinden für deine Kirche verschiedene Kirchensteuersätze erheben. Wähl den Teil, in dem du am 31. Dezember gewohnt hast. Die Namen sind die der Tabelle des Kantons, teils abgekürzt.'
    learnMore:
      url: 'https://www.fin.be.ch/content/dam/fin/dokumente/de/finanzverwaltung/finanzausgleich/publikationen/fv-stat-steueranlage_2026_1.pdf#page=13'
