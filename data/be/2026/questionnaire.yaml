  # be-2025-wegleitung-np-de p. 36 (Seite 27, Haupterwerb: one entry per salary certificate) and
  # p. 40 (Seite 31: Bern employers send the certificate to the tax administration, others give you
  # two copies).
  - use: employers
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=36'
      label:
        en: 'Bern tax guide 2025, p. 36: main employment'
        fr: 'Guide fiscal bernois 2025, p. 36 : Activité principale'
        de: 'Wegleitung zur Steuererklärung 2025, S. 36: Haupterwerb'
    help:
      en: 'Each one gives you a salary certificate (Lohnausweis). An employer in Bern also sends it to the tax administration; one outside the canton gives you two copies.'
      fr: 'Chacun vous remet un certificat de salaire (Lohnausweis). Un employeur bernois l’envoie aussi à l’Intendance des impôts ; un employeur hors du canton vous en remet deux exemplaires.'
      de: 'Jeder gibt dir einen Lohnausweis. Ein Arbeitgeber im Kanton Bern schickt ihn auch der Steuerverwaltung; einer ausserhalb des Kantons gibt dir zwei Exemplare.'

  # People taxed at source (Quellensteuer) file an ordinary return only when they must or ask for
  # it by 31 March of the next year (nachträgliche ordentliche Veranlagung, NOV): be-2025-nov-info-de
  # p. 1; be-2025-wegleitung-np-de p. 15 (Seite 6). Not covered by rules-be.
  - use: taxed_at_source
    yesNotSupported:
      en: 'Tax at source in Bern (Quellensteuer) and the ordinary assessment that follows it (nachträgliche ordentliche Veranlagung, NOV)'
      fr: 'L’impôt à la source à Berne (Quellensteuer) et la taxation ordinaire ultérieure qui suit (nachträgliche ordentliche Veranlagung, NOV)'
      de: 'Die Quellensteuer im Kanton Bern und die nachträgliche ordentliche Veranlagung (NOV)'
    learnMore:
      url: 'https://www.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/info_10minuten/info-nov_de.pdf'
      label:
        en: 'Ordinary assessment after tax at source (NOV), Bern tax administration'
        fr: 'Taxation ordinaire ultérieure (NOV), Intendance des impôts du canton de Berne'
        de: 'Nachträgliche ordentliche Veranlagung (NOV), Steuerverwaltung des Kantons Bern'
    help:
      en: 'If so, it shows on the salary certificate (Lohnausweis, Ziffer 12).'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire (Lohnausweis, Ziffer 12).'
      de: 'Wenn ja, steht es auf dem Lohnausweis (Ziffer 12).'

  # be-na-deductions-taxinfo-saeule-3a; be-2025-wegleitung-np-de p. 201 (Seite 192: counted only
  # with the attestation); form 1.1 (be-2025-steuererklaerung-formulare-de p. 1).
  - use: pillar3a
    learnMore:
      url: 'https://www.taxinfo.sv.fin.be.ch/taxinfo/a2830da2-1a00-4928-b58b-74da5d48a598'
      label:
        en: 'Pillar 3a contributions (TaxInfo, Bern tax administration)'
        fr: 'Cotisations au pilier 3a (TaxInfo, Intendance des impôts)'
        de: 'Beiträge an die Säule 3a (TaxInfo, Steuerverwaltung)'
    help:
      en: 'Your bank or insurer sends an attestation, and Bern counts the payments only with it. On form 1.1: Beiträge an die Säule 3a.'
      fr: 'Votre banque ou votre assurance vous envoie une attestation, et Berne ne compte les versements qu’avec elle. Sur le formulaire 1.1 : Beiträge an die Säule 3a (cotisations au pilier 3a).'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung, und Bern berücksichtigt die Einzahlungen nur damit. Auf dem Formular 1.1: Beiträge an die Säule 3a.'

  # be-2025-wegleitung-np-de p. 199 (Seite 190, Einkauf 2. Säule: only buy-ins the salary
  # certificate doesn't show); form 1.1 (be-2025-steuererklaerung-formulare-de p. 1).
  - use: lpp_buyin
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=199'
      label:
        en: 'Bern tax guide 2025, p. 199: pension fund buy-ins'
        fr: 'Guide fiscal bernois 2025, p. 199 : Rachat au 2e pilier'
        de: 'Wegleitung zur Steuererklärung 2025, S. 199: Einkauf 2. Säule'
    help:
      en: 'A voluntary payment on top of the usual contributions. Count only a buy-in your salary certificate doesn’t show. On form 1.1: Beiträge an die 2. Säule.'
      fr: 'Un versement volontaire en plus des cotisations habituelles. Ne comptez qu’un rachat que votre certificat de salaire n’indique pas. Sur le formulaire 1.1 : Beiträge an die 2. Säule (cotisations au 2e pilier).'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen. Zähl nur einen Einkauf, den dein Lohnausweis nicht zeigt. Auf dem Formular 1.1: Beiträge an die 2. Säule.'

  # Travel to work (Fahrkosten, form 6.1) for both taxes, each up to its own cap:
  # be-na-deductions-taxinfo-fahrkosten; be-2025-wegleitung-np-de p. 184 to 188 (Seite 175 to 179);
  # ch-2026-ifd-instructions-personnes-physiques p. 6. No "over 2 hours a day" choice: only Geneva's
  # meal rule needs it (rules-be, keys.ts, bernKeys).
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten abgezogen, bei der Kantons- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
    learnMore:
      url: 'https://www.taxinfo.sv.fin.be.ch/taxinfo/1613b2e2-276f-4293-ad05-3995d29b40cb'
      label:
        en: 'Travel to work (TaxInfo, Bern tax administration)'
        fr: 'Frais de déplacement (TaxInfo, Intendance des impôts)'
        de: 'Fahrkosten für den Arbeitsweg (TaxInfo, Steuerverwaltung)'
    help:
      en: 'Choose how you went on most work days. On form 6.1: Fahrkosten.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire 6.1 : Fahrkosten (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf dem Formular 6.1: Fahrkosten.'
    options:
      - value: public_transport
        label: { en: 'Public transport', fr: 'Transports publics', de: 'Öffentlicher Verkehr' }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Motorfahrrad mit gelbem Kontrollschild',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice' }

  # be-2025-wegleitung-np-de p. 186 (Seite 177, Fahrkosten Öffentlicher Verkehr)
  - use: commute_transit_cost
    explain:
      en: 'You deduct the public transport you paid to get to work, for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez les transports publics payés pour aller au travail, pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst den bezahlten öffentlichen Verkehr zur Arbeit ab, bei der Kantons- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=186'
      label:
        en: 'Bern tax guide 2025, p. 186: public transport'
        fr: 'Guide fiscal bernois 2025, p. 186 : Frais de déplacement en transports publics'
        de: 'Wegleitung zur Steuererklärung 2025, S. 186: Fahrkosten Öffentlicher Verkehr'

  # Bern counts the kilometres only for one of four reasons: no public transport, illness or
  # frailty, a stop far from home or work, or more than one hour more per day by public transport
  # (be-na-deductions-taxinfo-fahrkosten, 4; be-2025-wegleitung-np-de p. 187, Seite 178); otherwise
  # what public transport would have cost.
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. The kilometres count only if you had a reason: no public transport for the trip, a health reason, a stop far from your home or workplace, or public transport taking over an hour more per day.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent que si vous aviez une raison : pas de transport public pour ce trajet, une raison de santé, un arrêt éloigné de votre domicile ou de votre lieu de travail, ou des transports publics qui prennent plus d’une heure de plus par jour.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur mit einem Grund: kein öffentliches Verkehrsmittel für diesen Weg, ein gesundheitlicher Grund, eine Haltestelle weit weg von Wohn- oder Arbeitsort, oder ein zeitlicher Mehraufwand mit dem öffentlichen Verkehr von mehr als einer Stunde pro Tag.'
    learnMore:
      url: 'https://www.taxinfo.sv.fin.be.ch/taxinfo/1613b2e2-276f-4293-ad05-3995d29b40cb'
      label:
        en: 'Travel to work (TaxInfo, Bern tax administration)'
        fr: 'Frais de déplacement (TaxInfo, Intendance des impôts)'
        de: 'Fahrkosten für den Arbeitsweg (TaxInfo, Steuerverwaltung)'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
          }
      - value: 'no'
        label:
          {
            en: 'No: none for the trip, a health reason, a stop far away, or over an hour more per day',
            fr: 'Non : aucun pour ce trajet, une raison de santé, un arrêt éloigné, ou plus d’une heure de plus par jour',
            de: 'Nein: keiner für diesen Weg, ein gesundheitlicher Grund, eine weit entfernte Haltestelle oder über eine Stunde mehr pro Tag',
          }

  # be-2025-wegleitung-np-de p. 187 (Seite 178)
  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab, bei beiden Steuern, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=187'
      label:
        en: 'Bern tax guide 2025, p. 187: driving to work'
        fr: 'Guide fiscal bernois 2025, p. 187 : Frais de déplacement en véhicule privé'
        de: 'Wegleitung zur Steuererklärung 2025, S. 187: Fahrkosten für private Motorfahrzeuge'

  # be-2025-wegleitung-np-de p. 188 (Seite 179: a rate per kilometre, once there and back a day)
  - use: commute_distance
    explain:
      en: 'With a reason to drive, both taxes count a fixed amount per kilometre, there and back once a day, each up to its own yearly limit.'
      fr: 'Avec une raison de prendre votre véhicule, les deux impôts comptent un montant fixe par kilomètre, un aller et retour par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Mit einem Grund zu fahren zählen beide Steuern einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=188'
      label:
        en: 'Bern tax guide 2025, p. 188: working out travel costs'
        fr: 'Guide fiscal bernois 2025, p. 188 : Calcul des frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 188: Berechnung der Fahrkosten'

  # be-2025-wegleitung-np-de p. 188 (Seite 179: 220 working days a year for full-time work, as a
  # rule; fewer for part-time).
  - use: commute_drive_days
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=188'
      label:
        en: 'Bern tax guide 2025, p. 188: working out travel costs'
        fr: 'Guide fiscal bernois 2025, p. 188 : Calcul des frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 188: Berechnung der Fahrkosten'
    help:
      en: 'Leave out holidays, sick days and days worked from home. The guide counts 220 days for a full year of full-time work, as a rule, and fewer for part-time work.'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail. Le guide compte en règle générale 220 jours pour une année entière à plein temps, et moins à temps partiel.'
      de: 'Ohne Ferien, Krankheitstage und Tage im Homeoffice. Die Wegleitung zählt in der Regel 220 Tage für ein ganzes Jahr Vollzeit, bei Teilzeit weniger.'

  # Meals away from home (auswärtige Verpflegung, form 6.2), for both taxes: a fixed amount per
  # day, half of it when the employer makes meals cheaper, none when expenses cover them
  # (be-2025-wegleitung-np-de p. 189, Seite 180).
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work, when you can’t go home, costs more than at home (auswärtige Verpflegung). A fixed amount per day counts for both taxes, each up to its own yearly limit, half of it when your employer makes your meals cheaper (a canteen, Lunch-Checks).'
      fr: 'Manger à l’extérieur à cause du travail, quand vous ne pouvez pas rentrer, coûte plus cher qu’à la maison (auswärtige Verpflegung). Un montant fixe par jour compte pour les deux impôts, chacun jusqu’à sa propre limite annuelle, la moitié quand votre employeur vous offre des repas meilleur marché (cantine, Lunch-Checks).'
      de: 'Auswärts essen wegen der Arbeit, wenn du nicht nach Hause kannst, kostet mehr als zu Hause (auswärtige Verpflegung). Für beide Steuern zählt ein fester Betrag pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber die Verpflegung verbilligt (Kantine, Lunch-Checks).'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=189'
      label:
        en: 'Bern tax guide 2025, p. 189: meals away from home'
        fr: 'Guide fiscal bernois 2025, p. 189 : Repas pris à l’extérieur'
        de: 'Wegleitung zur Steuererklärung 2025, S. 189: Auswärtige Verpflegung'
    help:
      en: 'Count the work days you couldn’t eat lunch at home; 0 if you usually did. Leave out days your employer paid for the meal as expenses.'
      fr: 'Comptez les jours de travail où vous ne pouviez pas manger à la maison à midi ; 0 si vous le pouviez en général. Sans les jours où votre employeur a payé le repas comme frais.'
      de: 'Zähl die Arbeitstage, an denen du mittags nicht zu Hause essen konntest; 0, wenn du es meistens konntest. Ohne die Tage, an denen dein Arbeitgeber das Essen als Spesen bezahlt hat.'

  # be-2025-wegleitung-np-de p. 129 (Seite 120, Vermögenswerte/Wertschriften) and p. 130 (Seite
  # 121, eSteuerauszug); form 3 (be-2025-steuererklaerung-formulare-de p. 3).
  - use: banks
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=129'
      label:
        en: 'Bern tax guide 2025, p. 129: securities and accounts'
        fr: 'Guide fiscal bernois 2025, p. 129 : Éléments de fortune et titres'
        de: 'Wegleitung zur Steuererklärung 2025, S. 129: Vermögenswerte und Wertschriften'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers (Interactive Brokers, DEGIRO). If a bank offers an e-tax statement (eSteuerauszug), ask for it: it has everything in one document. On form 3: Wertschriftenverzeichnis.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers (Interactive Brokers, DEGIRO). Si une banque propose un relevé fiscal numérique (eSteuerauszug), demandez-le : il contient tout en un seul document. Sur le formulaire 3 : Wertschriftenverzeichnis (état des titres).'
      de: 'Zähl auch PostFinance, die Konten deiner Kinder und Online- oder ausländische Broker (Interactive Brokers, DEGIRO). Bietet eine Bank einen eSteuerauszug an, verlang ihn: Er enthält alles in einem Dokument. Auf dem Formular 3: Wertschriftenverzeichnis.'

  # be-2025-wegleitung-np-de p. 144 (Seite 135, Kryptowährungen under the other investments);
  # be-2025-info-np-jan2026-de p. 2 (in the securities list, valued on 31 December).
  - use: crypto
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=144'
      label:
        en: 'Bern tax guide 2025, p. 144: cryptocurrencies and other investments'
        fr: 'Guide fiscal bernois 2025, p. 144 : Cryptomonnaies et autres capitaux'
        de: 'Wegleitung zur Steuererklärung 2025, S. 144: Kryptowährungen und sonstige Kapitalanlagen'
    help:
      en: 'They go in the securities list (Wertschriftenverzeichnis, form 3), at their value on 31 December.'
      fr: 'Elles figurent dans l’état des titres (Wertschriftenverzeichnis, formulaire 3), à leur valeur au 31 décembre.'
      de: 'Sie gehören ins Wertschriftenverzeichnis (Formular 3), zum Wert per 31. Dezember.'

  # Payments to political parties are a deduction of their own (form 4.4; be-2025-wegleitung-np-de
  # p. 207, Seite 198), apart from donations to tax-exempt institutions (form 5.3; p. 208, Seite
  # 199); medical costs (form 5.4; p. 213, Seite 204); debt interest (form 4.3; p. 183, Seite 174:
  # no leasing); alimony and child support paid (form 5.1; p. 209, Seite 200). Form pages:
  # be-2025-steuererklaerung-formulare-de p. 4 and 5.
  - use: payments
    explain:
      en: 'Each of these can lower your tax if you keep the proof. In Bern, payments to political parties are a deduction of their own, apart from donations to charities.'
      fr: 'Chacun de ces frais peut diminuer votre impôt si vous en gardez la preuve. À Berne, les versements aux partis politiques sont une déduction à part, distincte des dons aux associations.'
      de: 'Jede dieser Ausgaben kann deine Steuer senken, wenn du den Beleg aufbewahrst. In Bern sind Beiträge an politische Parteien ein eigener Abzug, getrennt von Spenden an gemeinnützige Organisationen.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=207'
      label:
        en: 'Bern tax guide 2025, p. 207: political parties'
        fr: 'Guide fiscal bernois 2025, p. 207 : Cotisations et dons aux partis politiques'
        de: 'Wegleitung zur Steuererklärung 2025, S. 207: Mitgliederbeiträge und Spenden an politische Parteien'
    help:
      en: 'Choose all that apply. Leasing interest doesn’t count as loan interest.'
      fr: 'Choisissez tout ce qui s’applique. Les intérêts d’un leasing ne comptent pas comme intérêts d’emprunt.'
      de: 'Wähl alles, was zutrifft. Leasingzinsen zählen nicht als Schuldzinsen.'
    options:
      - value: medical_costs
        label:
          {
            en: 'Medical or dental costs that insurance didn’t cover',
            fr: 'Des frais médicaux ou dentaires non remboursés',
            de: 'Arzt- oder Zahnarztkosten, die die Versicherung nicht bezahlt hat',
          }
        chip: { en: 'Medical costs', fr: 'Frais médicaux', de: 'Krankheitskosten' }
      - value: donations
        label:
          {
            en: 'Donations to charities in Switzerland',
            fr: 'Des dons à des associations d’utilité publique en Suisse',
            de: 'Spenden an gemeinnützige Organisationen in der Schweiz',
          }
        chip: { en: 'Donations', fr: 'Dons', de: 'Spenden' }
      - value: political_party
        label:
          {
            en: 'Membership fees or donations to political parties',
            fr: 'Des cotisations ou des dons à des partis politiques',
            de: 'Mitgliederbeiträge oder Spenden an politische Parteien',
          }
        chip: { en: 'Political party', fr: 'Parti politique', de: 'Politische Partei' }
      - value: loan_interest
        label:
          {
            en: 'Interest on a loan, such as a consumer or car loan',
            fr: 'Des intérêts d’emprunt, par exemple un crédit ou un prêt auto',
            de: 'Schuldzinsen, zum Beispiel für einen Konsum- oder Autokredit',
          }
        chip: { en: 'Loan interest', fr: 'Intérêts d’emprunt', de: 'Schuldzinsen' }
      - value: alimony_paid
        label:
          {
            en: 'Alimony or child support',
            fr: 'Une pension alimentaire',
            de: 'Unterhaltsbeiträge',
          }
        chip: { en: 'Pays alimony', fr: 'Verse une pension', de: 'Zahlt Unterhalt' }

  # Form 4.4, Mitgliederbeiträge und Zuwendungen an politische Parteien (be-2025-steuererklaerung-
  # formulare-de p. 4); be-2025-wegleitung-np-de p. 207 (Seite 198: which parties count; the
  # cantonal limit is per person, spouses each up to it; the federal one is for the return).
  - id: party
    key: be.party
    type: money
    perPerson: true
    when: { key: profile.payments, includes: political_party }
    explain:
      en: 'Membership fees and donations to political parties (Mitgliederbeiträge und Zuwendungen an politische Parteien) are deducted up to a limit per person for the cantonal and communal tax, and up to one limit for the whole return for the federal tax. That’s why Taxpresso asks each of you.'
      fr: 'Les cotisations et les dons aux partis politiques (Mitgliederbeiträge und Zuwendungen an politische Parteien) se déduisent jusqu’à une limite par personne pour les impôts cantonal et communal, et jusqu’à une seule limite pour toute la déclaration pour l’impôt fédéral. C’est pourquoi Taxpresso le demande à chacun de vous.'
      de: 'Mitgliederbeiträge und Zuwendungen an politische Parteien werden bei den Kantons- und Gemeindesteuern bis zu einem Höchstbetrag pro Person abgezogen, bei der Bundessteuer bis zu einem einzigen Höchstbetrag für die ganze Steuererklärung. Darum fragt Taxpresso jede Person einzeln.'
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=207'
      label:
        en: 'Bern tax guide 2025, p. 207: political parties'
        fr: 'Guide fiscal bernois 2025, p. 207 : Cotisations et dons aux partis politiques'
        de: 'Wegleitung zur Steuererklärung 2025, S. 207: Mitgliederbeiträge und Spenden an politische Parteien'
    text:
      p1:
        en: 'How much did you pay to political parties in 2026, in membership fees and donations?'
        fr: 'Combien avez-vous versé à des partis politiques en 2026, en cotisations et en dons ?'
        de: 'Wie viel hast du 2026 an politische Parteien bezahlt, an Mitgliederbeiträgen und Spenden?'
      p2:
        en: 'How much did your spouse or partner pay to political parties in 2026, in membership fees and donations?'
        fr: 'Combien votre conjoint ou partenaire a-t-il versé à des partis politiques en 2026, en cotisations et en dons ?'
        de: 'Wie viel hat dein Partner oder deine Partnerin 2026 an politische Parteien bezahlt, an Mitgliederbeiträgen und Spenden?'
    help:
      en: 'In CHF, 0 if none. A party counts if it is in the party register (Parteienregister), sits in a cantonal parliament, or had enough votes at a canton’s last election; gifts to candidates, campaign or initiative committees, or unions don’t.'
      fr: 'En CHF, 0 si rien. Un parti compte s’il est inscrit au registre des partis (Parteienregister), siège dans un parlement cantonal ou a obtenu assez de voix aux dernières élections d’un canton ; les dons à des candidats, à des comités de campagne ou d’initiative, ou à des syndicats ne comptent pas.'
      de: 'In CHF, 0, wenn nichts. Eine Partei zählt, wenn sie im Parteienregister eingetragen ist, in einem kantonalen Parlament sitzt oder bei den letzten Wahlen in einem Kanton genug Stimmen erreicht hat; Spenden an Kandidierende, Wahlkampf- oder Initiativkomitees oder Gewerkschaften zählen nicht.'

  # What Taxpresso can't prepare for Bern yet: property (form 7, be-2025-wegleitung-np-de p. 156,
  # Seite 147), inheritances and gifts (form 8, p. 126 and 127, Seite 117 and 118), income from
  # abroad, capital payments (Kapitalleistungen, p. 117, Seite 108). TaxMe-Online, in BE-Login, is
  # the canton's online return (be-2025-info-np-jan2026-de p. 3).
  - use: special
    learnMore:
      url: 'https://www.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/info_10minuten/info-np_januar2026_de.pdf#page=3'
      label:
        en: 'Filling in your return online in BE-Login (Bern tax administration, January 2026)'
        fr: 'Remplir sa déclaration en ligne dans BE-Login (Intendance des impôts, janvier 2026)'
        de: 'Steuererklärung in BE-Login online ausfüllen (Steuerverwaltung, Januar 2026)'
    options:
      - value: real_estate
        label:
          {
            en: 'I own real estate, in Switzerland or abroad',
            fr: 'Je suis propriétaire d’un bien immobilier, en Suisse ou à l’étranger',
            de: 'Ich besitze eine Liegenschaft, in der Schweiz oder im Ausland',
          }
        notSupported:
          {
            en: 'Real estate (Formular 7, Grundstücke)',
            fr: 'Les immeubles (formulaire 7, Grundstücke)',
            de: 'Grundstücke (Formular 7)',
          }
      - value: inheritance_or_gift
        label:
          {
            en: 'I received an inheritance or a large gift',
            fr: 'J’ai reçu un héritage ou une donation importante',
            de: 'Ich habe eine Erbschaft oder eine grosse Schenkung erhalten',
          }
        notSupported:
          {
            en: 'An inheritance or a gift (Formular 8, Erbschaften, Schenkungen)',
            fr: 'Un héritage ou une donation (formulaire 8, Erbschaften, Schenkungen)',
            de: 'Eine Erbschaft oder Schenkung (Formular 8)',
          }
      - value: foreign_income
        label:
          {
            en: 'I had income from abroad (salary, pension, rent)',
            fr: 'J’ai eu des revenus de l’étranger (salaire, rente, loyer)',
            de: 'Ich hatte Einkünfte aus dem Ausland (Lohn, Rente, Miete)',
          }
        notSupported:
          {
            en: 'Income from abroad',
            fr: 'Des revenus de l’étranger',
            de: 'Einkünfte aus dem Ausland',
          }
      - value: pension_capital
        label:
          {
            en: 'I withdrew pension capital (2nd or 3rd pillar)',
            fr: 'J’ai retiré un capital de prévoyance (2e ou 3e pilier)',
            de: 'Ich habe Vorsorgekapital bezogen (2. Säule oder Säule 3a)',
          }
        notSupported:
          {
            en: 'A pension capital withdrawal (Kapitalleistung)',
            fr: 'Un retrait de capital de prévoyance (Kapitalleistung)',
            de: 'Ein Kapitalbezug aus der Vorsorge (Kapitalleistung)',
          }

