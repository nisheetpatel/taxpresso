      label:
        en: 'Bern tax guide 2025, p. 35: employment income'
        fr: 'Guide fiscal bernois 2025, p. 35 : Activité dépendante'
        de: 'Wegleitung zur Steuererklärung 2025, S. 35: Unselbstständiger Erwerb'
    options:
      - { value: salary, label: { en: 'A salary', fr: 'Un salaire', de: 'Ein Lohn' } }
      - value: replacement_income
        label:
          en: 'Unemployment, sickness or accident benefits'
          fr: 'Des indemnités (chômage, maladie, accident)'
          de: 'Taggelder (Arbeitslosigkeit, Krankheit, Unfall)'
        chip: { en: 'Benefits', fr: 'Indemnités', de: 'Taggelder' }
      - value: pension
        label:
          {
            en: 'A pension (AHV, IV or pension fund)',
            fr: 'Une rente (AVS, AI ou caisse de pension)',
            de: 'Eine Rente (AHV, IV oder Pensionskasse)',
          }
        chip: { en: 'Pension', fr: 'Rente', de: 'Rente' }
      - value: alimony
        label:
          {
            en: 'Alimony or child support received',
            fr: 'Une pension alimentaire reçue',
