  # be-2025-wegleitung-np-de p. 35 (Seite 26, Unselbstständiger Erwerb), p. 112 (Seite 103,
  # Renten), p. 115 (Seite 106, Entschädigungen Erwerbsausfall), p. 116 (Seite 107, Unterhalts-
  # beiträge); self-employment is form 9 (p. 43, Seite 34), not covered by rules-be.
  - use: income_sources
    learnMore:
      url: 'https://www.wegleitung.sv.fin.be.ch/content/dam/sv_fin/dokumente/de/wegleitungen/2025/wl_natuerliche-personen_2025_de.pdf#page=35'
      label:
        en: 'Bern tax guide 2025, p. 35: employment income'
        fr: 'Guide fiscal bernois 2025, p. 35 : Activité dépendante'
        de: 'Wegleitung zur Steuererklärung 2025, S. 35: Unselbstständiger Erwerb'
        it: 'Guida fiscale di Berna 2025, p. 35: reddito da attività dipendente'
    options:
      - {
          value: salary,
          label: { en: 'A salary', fr: 'Un salaire', de: 'Ein Lohn', it: 'Un salario' },
        }
      - value: replacement_income
        label:
          en: 'Unemployment, sickness or accident benefits'
          fr: 'Des indemnités (chômage, maladie, accident)'
          de: 'Taggelder (Arbeitslosigkeit, Krankheit, Unfall)'
          it: 'Indennità di disoccupazione, malattia o infortunio'
        chip: { en: 'Benefits', fr: 'Indemnités', de: 'Taggelder', it: 'Indennità' }
      - value: pension
        label:
          {
            en: 'A pension (AHV, IV or pension fund)',
            fr: 'Une rente (AVS, AI ou caisse de pension)',
            de: 'Eine Rente (AHV, IV oder Pensionskasse)',
            it: 'Una rendita (AVS, AI o cassa pensione)',
          }
        chip: { en: 'Pension', fr: 'Rente', de: 'Rente', it: 'Rendita' }
      - value: alimony
        label:
          {
            en: 'Alimony or child support received',
            fr: 'Une pension alimentaire reçue',
            de: 'Erhaltene Unterhaltsbeiträge',
            it: 'Alimenti o contributi di mantenimento ricevuti',
          }
        chip:
          {
            en: 'Receives alimony',
            fr: 'Reçoit une pension',
            de: 'Erhält Unterhalt',
            it: 'Riceve alimenti',
          }
      - value: self_employment
        label:
          {
            en: 'Income from self-employment',
            fr: 'Un revenu d’activité indépendante',
            de: 'Einkommen aus selbstständiger Erwerbstätigkeit',
            it: 'Reddito da attività lucrativa indipendente',
