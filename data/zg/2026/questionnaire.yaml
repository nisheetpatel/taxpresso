  # Travel to work (Code 201, 202, form BA: Fahrkosten zwischen Wohn- und Arbeitsort) for both taxes,
  # each up to its own yearly limit: zg-2025-guide-wegleitung p. 32; ch-2026-ifd-instructions-
  # personnes-physiques p. 6. No "over 2 hours a day" choice: only Geneva's meal rule needs it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten abgezogen, bei der Kantons- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto per andare al lavoro si deduce come spese di trasporto (Fahrkosten), per l’imposta cantonale e per quella federale, ciascuna fino al proprio limite annuo. Il mezzo che usi decide come vengono calcolate.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=32'
      label:
        en: 'Zug tax guide 2025, p. 32: travel to work'
        fr: 'Guide fiscal de Zoug 2025, p. 32 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Fahrkosten zwischen Wohn- und Arbeitsort'
        it: 'Guida fiscale di Zugo 2025, p. 32: tragitto casa-lavoro'
    help:
      en: 'Choose how you went on most work days. On the Berufsauslagen form (BA): Fahrkosten zwischen Wohn- und Arbeitsort.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire Berufsauslagen (BA, frais professionnels) : Fahrkosten zwischen Wohn- und Arbeitsort (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf dem Formular Berufsauslagen (BA): Fahrkosten zwischen Wohn- und Arbeitsort.'
      it: 'Scegli come ci andavi nella maggior parte dei giorni di lavoro. Sul modulo Berufsauslagen (BA): Fahrkosten zwischen Wohn- und Arbeitsort.'
    options:
      - value: public_transport
        label:
          {
            en: 'Public transport',
            fr: 'Transports publics',
            de: 'Öffentlicher Verkehr',
            it: 'Trasporti pubblici',
          }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto', it: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
            it: 'Moto o scooter con targa bianca',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Motorfahrrad mit gelbem Kontrollschild',
            it: 'Bicicletta, e-bike o ciclomotore con targa gialla',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss', it: 'A piedi' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
            it: 'Da casa, quasi tutti i giorni',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice', it: 'Telelavoro' }

  # zg-2025-guide-wegleitung p. 32 (public transport: the Zuger Pass or the GA, the cost).
  - use: commute_transit_cost
    explain:
      en: 'You deduct the public transport you paid to get to work, for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez les transports publics payés pour aller au travail, pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst den bezahlten öffentlichen Verkehr zur Arbeit ab, bei der Kantons- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Deduci i trasporti pubblici che hai pagato per andare al lavoro, per l’imposta cantonale e per quella federale, ciascuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=32'
      label:
        en: 'Zug tax guide 2025, p. 32: travel to work'
        fr: 'Guide fiscal de Zoug 2025, p. 32 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Fahrkosten zwischen Wohn- und Arbeitsort'
        it: 'Guida fiscale di Zugo 2025, p. 32: tragitto casa-lavoro'

  # Zug recognises "grundsätzlich" public transport only; a private vehicle needs a reason: no public
  # transport, over an hour and a quarter saved a day, health, or the car needed at work at the
  # employer's request (zg-2025-guide-wegleitung p. 32; the form BA, zg-2025-guide-en-how-to-fill
  # p. 3). Otherwise what public transport would have cost.
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. The kilometres count only if you had a reason: no public transport for the trip, over an hour and a quarter saved each day, a health reason, or the car needed at work at your employer’s request.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent que si vous aviez une raison : pas de transport public pour ce trajet, plus d’une heure et quart gagnée par jour, une raison de santé, ou la voiture nécessaire au travail à la demande de l’employeur.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur mit einem Grund: kein öffentliches Verkehrsmittel für diesen Weg, über 1¼ Stunden Zeitgewinn pro Tag, ein gesundheitlicher Grund, oder das Auto laut Bestätigung des Arbeitgebers für die Arbeit nötig.'
      it: 'Chi va al lavoro in auto deduce quanto sarebbero costati i trasporti pubblici, per entrambe le imposte. I chilometri contano solo se avevi un motivo: nessun trasporto pubblico per quel tragitto, più di un’ora e un quarto risparmiata ogni giorno, un motivo di salute, o l’auto necessaria al lavoro su richiesta del tuo datore di lavoro.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=32'
      label:
        en: 'Zug tax guide 2025, p. 32: travel to work'
        fr: 'Guide fiscal de Zoug 2025, p. 32 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Fahrkosten zwischen Wohn- und Arbeitsort'
        it: 'Guida fiscale di Zugo 2025, p. 32: tragitto casa-lavoro'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
            it: 'Sì, avrei potuto usare i trasporti pubblici',
          }
      - value: 'no'
        label:
          {
            en: 'No, one of those reasons applies',
            fr: 'Non, l’une de ces raisons s’applique',
            de: 'Nein, einer dieser Gründe trifft zu',
            it: 'No, vale uno di questi motivi',
          }

  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab, bei beiden Steuern, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'È questo prezzo che deduci per andare al lavoro con il tuo veicolo, per entrambe le imposte, ciascuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=32'
      label:
        en: 'Zug tax guide 2025, p. 32: travel to work'
        fr: 'Guide fiscal de Zoug 2025, p. 32 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Fahrkosten zwischen Wohn- und Arbeitsort'
        it: 'Guida fiscale di Zugo 2025, p. 32: tragitto casa-lavoro'

  # zg-2025-guide-wegleitung p. 32 (cars and motorbikes per km, on the actual working days, at most
  # 220 a year).
  - use: commute_distance
    explain:
      en: 'With one of those reasons, both taxes count a fixed amount per kilometre, there and back once a day, each up to its own yearly limit.'
      fr: 'Avec l’une de ces raisons, les deux impôts comptent un montant fixe par kilomètre, un aller et retour par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Mit einem dieser Gründe zählen beide Steuern einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Con uno di questi motivi, entrambe le imposte contano un importo fisso per chilometro, andata e ritorno una volta al giorno, ciascuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=32'
