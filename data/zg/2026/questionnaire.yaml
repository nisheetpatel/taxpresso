            de: 'Ortsbürger von Steinhausen',
          }
      - value: risch
        label: { en: 'Risch', fr: 'Risch', de: 'Risch' }
        chip: { en: 'Ortsbürger of Risch', fr: 'Bourgeois de Risch', de: 'Ortsbürger von Risch' }
      - value: walchwil
        label: { en: 'Walchwil', fr: 'Walchwil', de: 'Walchwil' }
        chip:
          {
