            fr: 'Bourgeois de Menzingen',
            de: 'Ortsbürger von Menzingen',
          }
      - value: baar
        label: { en: 'Baar', fr: 'Baar', de: 'Baar' }
        chip: { en: 'Ortsbürger of Baar', fr: 'Bourgeois de Baar', de: 'Ortsbürger von Baar' }
      - value: cham
