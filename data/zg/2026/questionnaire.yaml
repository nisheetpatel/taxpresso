        en: 'Zug tax guide 2025, p. 20: income'
        fr: 'Guide fiscal de Zoug 2025, p. 20 : Revenus'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Einkünfte im In- und Ausland'
