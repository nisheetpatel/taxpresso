      fr: 'Votre banque ou votre assurance vous envoie une attestation (Bescheinigung) : joignez-la à votre déclaration. Sur le formulaire K : 220, Beiträge gebundene Vorsorge (cotisations au 3e pilier A).'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung: Leg sie der Steuererklärung bei. Auf dem Formular K: 220, Beiträge gebundene Vorsorge.'

