  # The renters' deduction (Mietzinsabzug, 407): a share of the rent of the home you live in at your
  # residence in Zug, without service charges, up to a yearly maximum (StG § 33 Abs. 1 Ziff. 5,
  # zg-2026-law-steuergesetz p. 25; zg-2025-guide-wegleitung p. 42, Code 407, form MZ).
  - id: rent
    key: zg.rent
    type: money
    explain:
      en: 'Renters in Zug deduct part of the rent of the home they live in (Mietzinsabzug), up to a yearly limit. Only the net rent counts, without service charges (Nebenkosten) such as heating.'
      fr: 'Les locataires à Zoug déduisent une partie du loyer du logement qu’ils habitent (Mietzinsabzug), jusqu’à une limite annuelle. Seul le loyer net compte, sans les charges (Nebenkosten) comme le chauffage.'
      de: 'Wer in Zug zur Miete wohnt, zieht einen Teil der Wohnungsmiete ab (Mietzinsabzug), bis zu einem jährlichen Höchstbetrag. Es zählt nur die Miete ohne Nebenkosten wie die Heizung.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=42'
      label:
        en: 'Zug tax guide 2025, p. 42: renters’ deduction'
        fr: 'Guide fiscal de Zoug 2025, p. 42 : Déduction pour locataires'
        de: 'Wegleitung zur Steuererklärung 2025, S. 42: Mietzinsabzug'
    text:
      en: 'How much rent, without service charges, did you pay in 2026 for the home you lived in, in Zug?'
      fr: 'Combien de loyer, sans les charges, avez-vous payé en 2026 pour le logement où vous habitiez, à Zoug ?'
      de: 'Wie viel Wohnungsmiete ohne Nebenkosten hast du 2026 für deine Wohnung in Zug bezahlt?'
    help:
      en: 'The rent of the year without service charges (Nebenkosten), in CHF, for your household; 0 if you paid no rent. On form K: 407, Mietzinsabzug (form MZ).'
      fr: 'Le loyer de l’année sans les charges (Nebenkosten), en CHF, pour votre ménage ; 0 si vous n’avez pas payé de loyer. Sur le formulaire K : 407, Mietzinsabzug (formulaire MZ, déduction pour locataires).'
      de: 'Die Miete des Jahres ohne Nebenkosten, in CHF, für deinen Haushalt; 0, wenn du keine Miete bezahlt hast. Auf dem Formular K: 407, Mietzinsabzug (Formular MZ).'

  # Church tax (Kirchensteuer): the Roman Catholic parishes of each commune and the Evangelical
  # Reformed parish of the canton levy their Steuerfuss of the einfache Steuer
  # (zg-2026-communal-steuerfuesse; StG § 169 Abs. 1, zg-2026-law-steuergesetz p. 84). Opt-in:
  # Taxpresso adds it only for a member; packages/rules-zg says plainly when it can't compute it
  # (spouses in different parishes with children).
  - id: church
    key: zg.church
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Roman Catholic or the Evangelical Reformed parish (Kirchgemeinde) pay church tax (Kirchensteuer) at their parish’s Steuerfuss. Taxpresso adds it only for a member.'
      fr: 'Les membres de la paroisse catholique romaine ou évangélique réformée (Kirchgemeinde) paient l’impôt ecclésiastique (Kirchensteuer) au coefficient (Steuerfuss) de leur paroisse. Taxpresso ne l’ajoute que pour un membre.'
      de: 'Mitglieder der katholischen oder der evangelisch-reformierten Kirchgemeinde zahlen Kirchensteuer zum Steuerfuss ihrer Kirchgemeinde. Taxpresso rechnet sie nur für Mitglieder dazu.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:24fb8832-3383-4718-9a48-9461bc7501fc/Steuerf%C3%BCsse%202026_effektiv%2021.1.26.pdf'
      label:
        en: 'Steuerfüsse of the Zug communes and parishes, 2023 to 2026'
        fr: 'Coefficients (Steuerfüsse) des communes et paroisses zougoises, 2023 à 2026'
        de: 'Steuerfüsse der Gemeinden und Kirchgemeinden des Kantons Zug, 2023 bis 2026'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these parishes?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces paroisses ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchgemeinden?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these parishes?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces paroisses ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchgemeinden?'
    help:
      en: 'Another religion, or none, pays no church tax.'
      fr: 'Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique.'
      de: 'Eine andere Religion oder keine zahlt keine Kirchensteuer.'
    options:
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch' }
      - value: reformed
        label:
          {
            en: 'Evangelical Reformed (evangelisch-reformiert)',
            fr: 'Évangélique réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert' }
      - value: none
        label: { en: 'None of these', fr: 'Aucune de ces paroisses', de: 'Keine davon' }

  # Bürgergemeinde tax (Bürgersteuer): levied on the Ortsbürger living in the canton, at the
  # Bürgergemeinde's Steuerfuss; a married couple where only one spouse is a Zug Ortsbürger pays half
  # (StG § 170 Abs. 1 to 3, zg-2026-law-steuergesetz p. 84; zg-2026-communal-steuerfuesse). Opt-in:
  # Taxpresso adds it only for an Ortsbürger; packages/rules-zg says plainly when it can't compute it
  # (spouses citizens of two different Zug communes).
  - id: citizen_of
    key: zg.citizen_of
    type: choice
    perPerson: true
    explain:
      en: 'Some Bürgergemeinden levy a tax on their Ortsbürger (citizens of the commune, as in your place of origin, Heimatort) who live in the canton, at their own Steuerfuss. Taxpresso adds it only for an Ortsbürger.'
      fr: 'Certaines bourgeoisies (Bürgergemeinden) prélèvent un impôt sur leurs bourgeois (Ortsbürger, citoyens de la commune, comme votre lieu d’origine, Heimatort) qui habitent le canton, à leur propre coefficient (Steuerfuss). Taxpresso ne l’ajoute que pour un bourgeois.'
      de: 'Einige Bürgergemeinden erheben von ihren Ortsbürgerinnen und Ortsbürgern (Heimatort), die im Kanton wohnen, eine Steuer zu ihrem eigenen Steuerfuss. Taxpresso rechnet sie nur für Ortsbürger dazu.'
    learnMore:
      url: 'https://bgs.zg.ch/api/de/versions/2956/pdf_file#page=84'
      label:
        en: 'Zug tax law (Steuergesetz), § 170, p. 84: the Bürgergemeinde tax'
        fr: 'Loi fiscale de Zoug (Steuergesetz), § 170, p. 84 : Impôt de la bourgeoisie'
        de: 'Steuergesetz, § 170, S. 84: Steuern der Bürgergemeinden'
    text:
      p1:
        en: 'On 31 December 2026, were you an Ortsbürger (citizen) of a Zug commune?'
        fr: 'Au 31 décembre 2026, étiez-vous bourgeois (Ortsbürger) d’une commune zougoise ?'
        de: 'Warst du am 31. Dezember 2026 Ortsbürger oder Ortsbürgerin einer Zuger Gemeinde?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner an Ortsbürger (citizen) of a Zug commune?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il bourgeois (Ortsbürger) d’une commune zougoise ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Ortsbürger oder Ortsbürgerin einer Zuger Gemeinde?'
    help:
      en: 'Your place of origin (Heimatort), as on your passport or identity card. Most people are Ortsbürger of a commune outside the canton: then choose None.'
      fr: 'Votre lieu d’origine (Heimatort), comme sur votre passeport ou votre carte d’identité. La plupart des gens sont bourgeois d’une commune hors du canton : choisissez alors Aucune.'
      de: 'Dein Heimatort, wie im Pass oder in der Identitätskarte. Die meisten Leute sind Ortsbürger einer Gemeinde ausserhalb des Kantons: Dann wähl Keine.'
    options:
      - value: zug
        label: { en: 'Zug', fr: 'Zug', de: 'Zug' }
        chip: { en: 'Ortsbürger of Zug', fr: 'Bourgeois de Zug', de: 'Ortsbürger von Zug' }
      - value: oberageri
        label: { en: 'Oberägeri', fr: 'Oberägeri', de: 'Oberägeri' }
        chip:
          {
            en: 'Ortsbürger of Oberägeri',
            fr: 'Bourgeois de Oberägeri',
            de: 'Ortsbürger von Oberägeri',
          }
      - value: unterageri
        label: { en: 'Unterägeri', fr: 'Unterägeri', de: 'Unterägeri' }
        chip:
          {
            en: 'Ortsbürger of Unterägeri',
            fr: 'Bourgeois de Unterägeri',
            de: 'Ortsbürger von Unterägeri',
          }
      - value: menzingen
        label: { en: 'Menzingen', fr: 'Menzingen', de: 'Menzingen' }
        chip:
          {
