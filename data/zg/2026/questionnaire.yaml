        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Haupterwerb'
    help:
      en: 'Each one gives you a salary certificate (Lohnausweis).'
      fr: 'Chacun vous remet un certificat de salaire (Lohnausweis).'
      de: 'Jeder gibt dir einen Lohnausweis.'

  # People taxed at source (Quellensteuer) file an ordinary return only in the cases the guide lists,
  # or when they ask for it by 31 March of the next year (nachträgliche ordentliche Veranlagung,
  # NOV): zg-2025-guide-wegleitung p. 8; zg-na-source-tax-nov-antrag. Not covered by rules-zg.
  - use: taxed_at_source
    yesNotSupported:
      en: 'Tax at source in Zug (Quellensteuer) and the ordinary assessment that follows it (nachträgliche ordentliche Veranlagung, NOV)'
      fr: 'L’impôt à la source à Zoug (Quellensteuer) et la taxation ordinaire ultérieure qui suit (nachträgliche ordentliche Veranlagung, NOV)'
      de: 'Die Quellensteuer im Kanton Zug und die nachträgliche ordentliche Veranlagung (NOV)'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=8'
