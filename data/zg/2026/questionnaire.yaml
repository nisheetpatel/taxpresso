        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Wertschriften- und Guthabenverzeichnis'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers. On the return: Wertschriften- und Guthabenverzeichnis (WV).'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers. Sur la déclaration : Wertschriften- und Guthabenverzeichnis (WV, état des titres et avoirs).'
      de: 'Zähl auch PostFinance, die Konten deiner Kinder und Online- oder ausländische Broker. Auf der Steuererklärung: Wertschriften- und Guthabenverzeichnis (WV).'

