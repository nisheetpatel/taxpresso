      fr: 'Si c’est le cas, cela figure sur le certificat de salaire (Lohnausweis, Ziffer 12).'
      de: 'Wenn ja, steht es auf dem Lohnausweis (Ziffer 12).'

  # zg-2025-guide-wegleitung p. 36 (Code 220, 221: only with the attestations; the catch-up,
  # nachträglicher Einkauf, from 2026).
  - use: pillar3a
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=36'
      label:
