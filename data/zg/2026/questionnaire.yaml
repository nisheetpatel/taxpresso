# Zug questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not code:
# packages/questionnaire reads it, and every key and value must exist in Zug's keys
# (packages/rules-zg, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of Zug's main form K (zg-2025-guide-wegleitung p. 15 to 19, the sample return), with Zug's own
# explanations and official pages. The questions only Zug asks are written out here, as
# packages/rules-zg reads them (ZugCantonal): who has the larger share of the care of children in
# shared custody without child support, whether each child was under 15 on 31 December and, if not,
# a minor, the childcare paid for each child (the limit is per child), the commune and the move, the
# net rent (Mietzinsabzug, 407), and each adult's parish and Bürgergemeinde.
#
# Wording and documents follow the Zug guide for 2025 (zg-2025-guide-wegleitung): the 2026 guide
# is not published yet (docs/sources/zg/NOTES.md, Gaps), so the questions say "2026" and link the
# 2025 guide, whose codes and rules form K keeps until it appears. "p." is the page of the PDF
# file, as in the links, and the guide prints the same page numbers. Form K and the guide are in
# German: the questions give the German term next to the gloss.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'Zug', fr: 'Zoug', de: 'Zug' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}' }

# eTax.zug is the canton's online return, in the browser with an AGOV login (docs/sources/zg/NOTES.md,
# Filing channels; zg-na-efiling-etax-zug). No document of the library says it is free, so the text
# doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. eTax.zug, the canton’s online return (zg.ch/etax), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. eTax.zug, la déclaration en ligne du canton (zg.ch/etax), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. eTax.zug, die Online-Steuererklärung des Kantons (zg.ch/etax), oder eine Treuhand kann es.'

questions:
  - use: canton

  # zg-2025-guide-wegleitung p. 9 (Heirat, Scheidung oder Trennung: the situation of the whole
  # year) and p. 13 (Person 1 and Person 2 for couples taxed together).
  - use: civil_status
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=9'
      label:
        en: 'Zug tax guide 2025, p. 9: marriage, divorce or separation'
        fr: 'Guide fiscal de Zoug 2025, p. 9 : Mariage, divorce ou séparation'
        de: 'Wegleitung zur Steuererklärung 2025, S. 9: Heirat, Scheidung oder Trennung'
    help:
      en: 'A registered partnership files like a married couple, on one return.'
      fr: 'Un partenariat enregistré déclare comme un couple marié, sur une seule déclaration.'
      de: 'Eine eingetragene Partnerschaft füllt wie ein Ehepaar eine gemeinsame Steuererklärung aus.'

  # zg-2025-guide-wegleitung p. 41 (Code 403, Kinderabzug: minors in your parental care or custody,
  # and adult children in training whom you mainly support); page 1 of form K lists them (I and II).
  - use: children
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=41'
      label:
        en: 'Zug tax guide 2025, p. 41: child deduction'
        fr: 'Guide fiscal de Zoug 2025, p. 41 : Déduction pour enfant'
        de: 'Wegleitung zur Steuererklärung 2025, S. 41: Kinderabzug'
    help:
      en: 'Minors in your care, and adult children in training whose upkeep you mainly bear. On page 1 of form K: Minderjährige Kinder, Volljährige Kinder in Ausbildung.'
      fr: 'Les mineurs à votre charge, et les enfants majeurs en formation dont vous assumez l’essentiel de l’entretien. En page 1 du formulaire K : Minderjährige Kinder, Volljährige Kinder in Ausbildung (enfants mineurs, enfants majeurs en formation).'
      de: 'Minderjährige, für die du sorgst, und volljährige Kinder in Ausbildung, deren Unterhalt du zur Hauptsache bestreitest. Auf Seite 1 des Formulars K: Minderjährige Kinder, Volljährige Kinder in Ausbildung.'

  # zg-2025-guide-wegleitung p. 13 (Zusatzangaben bei getrennt besteuerten Eltern, Formular KI).
  - use: children_custody
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=13'
      label:
        en: 'Zug tax guide 2025, p. 13: children of parents taxed apart'
        fr: 'Guide fiscal de Zoug 2025, p. 13 : Enfants de parents taxés séparément'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: getrennt besteuerte Eltern mit gemeinsamen Kindern'
    help:
      en: 'Parents taxed apart fill in form KI (Kinder) with child support, custody (Sorgerecht) and care (Obhut).'
      fr: 'Les parents taxés séparément remplissent le formulaire KI (Kinder) : contributions d’entretien, autorité parentale (Sorgerecht) et garde (Obhut).'
      de: 'Getrennt besteuerte Eltern füllen das Formular KI aus: Unterhaltsbeiträge, Sorgerecht und Obhut.'

  # Parents taxed apart with joint custody: for the cantonal tax, the parent who receives child
  # support counts the children; without it, the parent with the larger share of their actual care
  # (zg-na-law-verordnung-steuergesetz § 18 Abs. 2 and 3, p. 6); for the federal tax, half the child
  # deduction each without child support, the parental scale to the one who earns more
  # (zg-2025-guide-wegleitung p. 41; ch-na-circulaire-30-epoux-famille p. 24).
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it counts them; without child support, the cantonal tax counts them for the parent with the larger share of their care, and the federal tax gives each parent half the child deduction and the parental scale (Elterntarif), a lower rate, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit les compte ; sans contribution, l’impôt cantonal les compte pour le parent qui en assume la plus grande part de la garde, et l’impôt fédéral donne à chacun la moitié de la déduction pour enfant et le barème parental (Elterntarif), un taux plus bas, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, zählt die Kinder; ohne Unterhaltsbeiträge zählt die Kantonssteuer sie für den Elternteil mit dem grösseren Anteil an ihrer Betreuung, und die Bundessteuer gibt jedem den halben Kinderabzug und den Elterntarif, einen tieferen Satz, dem, der mehr verdient.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=13'
      label:
        en: 'Zug tax guide 2025, p. 13: children of parents taxed apart'
        fr: 'Guide fiscal de Zoug 2025, p. 13 : Enfants de parents taxés séparément'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: getrennt besteuerte Eltern mit gemeinsamen Kindern'
    help:
      en: 'Child support (Unterhaltsbeiträge, Alimente) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge, Alimente) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge (Alimente) sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'

  # zg-na-law-verordnung-steuergesetz § 18 Abs. 2 and 3 (p. 6): without child support, the large
  # personal deduction, the child deduction and the Mehrpersonentarif go to the parent with the
  # larger share of the actual care. packages/rules-zg asks rather than guess (NOTE.mainCare).
  - id: main_care
    key: zg.main_care
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'With shared custody and no child support, Zug counts the children for the parent with the larger share of their actual care (überwiegender Anteil an der tatsächlichen Betreuung): that parent gets the child deduction (Kinderabzug), the higher personal deduction and the Mehrpersonentarif, a lower rate. The insurance deduction for the children is shared half and half.'
      fr: 'En garde partagée sans contribution d’entretien, Zoug compte les enfants pour le parent qui en assume la plus grande part de la garde effective (überwiegender Anteil an der tatsächlichen Betreuung) : ce parent a la déduction pour enfant (Kinderabzug), la déduction personnelle plus élevée et le Mehrpersonentarif, un taux plus bas. La déduction d’assurance pour les enfants est partagée par moitié.'
      de: 'Bei geteilter Obhut ohne Unterhaltsbeiträge zählt Zug die Kinder für den Elternteil mit dem überwiegenden Anteil an der tatsächlichen Betreuung: Er erhält den Kinderabzug, den höheren persönlichen Abzug und den Mehrpersonentarif, einen tieferen Satz. Der Versicherungsabzug für die Kinder wird hälftig geteilt.'
    learnMore:
      url: 'https://bgs.zg.ch/api/de/versions/2286/pdf_file#page=6'
      label:
        en: 'Ordinance on the Zug tax law (Verordnung zum Steuergesetz), § 18, p. 6: children of parents taxed apart'
        fr: 'Ordonnance sur la loi fiscale de Zoug (Verordnung zum Steuergesetz), § 18, p. 6 : Enfants de parents taxés séparément'
        de: 'Verordnung zum Steuergesetz, § 18, S. 6: Kinder getrennt besteuerter Eltern'
    text:
      en: 'In 2026, did you have the larger share of the children’s care?'
      fr: 'En 2026, assumiez-vous la plus grande part de la garde des enfants ?'
      de: 'Hattest du 2026 den grösseren Anteil an der Betreuung der Kinder?'
    help:
      en: 'Who looked after them more of the time, as agreed or decided. Not sure? Your last assessment (Veranlagung) shows whether you got the child deduction.'
      fr: 'Qui s’en occupait la plus grande partie du temps, selon l’accord ou la décision. Un doute ? Votre dernière taxation (Veranlagung) indique si vous avez eu la déduction pour enfant.'
      de: 'Wer sich die meiste Zeit um sie gekümmert hat, wie vereinbart oder entschieden. Unsicher? Deine letzte Veranlagung zeigt, ob du den Kinderabzug erhalten hast.'
    chip: { en: 'Main care', fr: 'Garde principale', de: 'Hauptbetreuung' }

  # zg-2025-guide-wegleitung p. 41 (Code 403a: from the year the child turns 15, a higher child
  # deduction; Code 404: own care of each child under 15 with a child deduction); StG § 33 Abs. 1
  # Ziff. 2 and Abs. 2 (zg-2026-law-steuergesetz p. 25).
  - id: child_under15
    key: zg.child_under15
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Zug gives a deduction for your own care of each child under 15 (Eigenbetreuungsabzug), unless the childcare deduction for that child is higher; from the year a child turns 15, a higher child deduction (Kinderabzug Zusatz) instead.'
      fr: 'Zoug accorde une déduction pour la garde par les parents de chaque enfant de moins de 15 ans (Eigenbetreuungsabzug), sauf si la déduction des frais de garde pour cet enfant est plus élevée ; dès l’année où l’enfant a 15 ans, une déduction pour enfant plus élevée (Kinderabzug Zusatz) à la place.'
      de: 'Zug gewährt für jedes Kind unter 15 einen Eigenbetreuungsabzug, ausser der Kinderdrittbetreuungskostenabzug für dieses Kind ist höher; ab dem Jahr, in dem das Kind 15 wird, stattdessen einen höheren Kinderabzug (Kinderabzug Zusatz).'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=41'
      label:
        en: 'Zug tax guide 2025, p. 41: child deduction and own care'
        fr: 'Guide fiscal de Zoug 2025, p. 41 : Déduction pour enfant et garde par les parents'
        de: 'Wegleitung zur Steuererklärung 2025, S. 41: Kinderabzug und Eigenbetreuungsabzug'
    text:
      en: 'Was child {n} under 15 on 31 December 2026?'
      fr: 'L’enfant {n} avait-il moins de 15 ans au 31 décembre 2026 ?'
      de: 'War Kind {n} am 31. Dezember 2026 jünger als 15?'
    help:
      en: 'Number your children the same way in every answer, for example from the oldest.'
      fr: 'Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # zg-2025-guide-wegleitung p. 45 (Code 673: tax-free wealth for each minor child); StG § 44 Abs. 1
  # (zg-2026-law-steuergesetz p. 30). A child under 15 is a minor: asked only from 15.
  - id: child_minor
    key: zg.child_minor
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: zg.child_under15, is: false }
    explain:
      en: 'For each minor child, part of your wealth is tax-free (steuerfreier Betrag für jedes minderjährige Kind). An adult child in training still gives the child deduction.'
      fr: 'Pour chaque enfant mineur, une partie de votre fortune est exonérée (steuerfreier Betrag für jedes minderjährige Kind). Un enfant majeur en formation donne quand même droit à la déduction pour enfant.'
      de: 'Für jedes minderjährige Kind ist ein Teil deines Vermögens steuerfrei (steuerfreier Betrag für jedes minderjährige Kind). Ein volljähriges Kind in Ausbildung gibt trotzdem den Kinderabzug.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=45'
      label:
        en: 'Zug tax guide 2025, p. 45: tax-free wealth'
        fr: 'Guide fiscal de Zoug 2025, p. 45 : Fortune exonérée'
        de: 'Wegleitung zur Steuererklärung 2025, S. 45: steuerfreie Beträge'
    text:
      en: 'Was child {n} a minor (under 18) on 31 December 2026?'
      fr: 'L’enfant {n} était-il mineur (moins de 18 ans) au 31 décembre 2026 ?'
      de: 'War Kind {n} am 31. Dezember 2026 minderjährig (unter 18)?'
    help:
      en: 'Number your children the same way in every answer, for example from the oldest.'
      fr: 'Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # zg-2025-guide-wegleitung p. 38 (Code 253, Kinderdrittbetreuungskostenabzug: children under 14,
  # while you work, train or cannot work; for a married couple, both; meals don't count; form KDBK).
  - use: childcare
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=38'
      label:
        en: 'Zug tax guide 2025, p. 38: childcare by others'
        fr: 'Guide fiscal de Zoug 2025, p. 38 : Frais de garde par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 38: Kinderdrittbetreuungskostenabzug'
    help:
      en: 'A crèche (Kinderkrippe), day care or a nanny, for a child under 14, while you work or train. Meals don’t count. On form K: 253, Kinderdrittbetreuungskostenabzug (form KDBK).'
      fr: 'Une crèche (Kinderkrippe), une garderie ou une nourrice, pour un enfant de moins de 14 ans, pendant que vous travaillez ou êtes en formation. Les repas ne comptent pas. Sur le formulaire K : 253, Kinderdrittbetreuungskostenabzug (formulaire KDBK, frais de garde par des tiers).'
      de: 'Eine Kinderkrippe, ein Hort oder eine Nanny, für ein Kind unter 14, während du arbeitest oder in Ausbildung bist. Mahlzeiten zählen nicht. Auf dem Formular K: 253, Kinderdrittbetreuungskostenabzug (Formular KDBK).'

  # The limit is per child (StG § 30 Abs. 1 Bst. l, zg-2026-law-steuergesetz p. 23), and for a child
  # under 15 the deduction for own care applies when it is higher (§ 33 Abs. 2bis, p. 25): with
  # several children, how the invoices' total splits can decide the deduction, so it is asked per
  # child (form KDBK lists each child, zg-2025-guide-wegleitung p. 38).
  - id: child_care
    key: zg.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Zug’s limit on childcare is per child, and for a child under 15 the deduction for your own care applies when it is higher, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'La limite de Zoug pour les frais de garde est par enfant, et pour un enfant de moins de 15 ans la déduction pour la garde par les parents s’applique quand elle est plus élevée : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Der Höchstbetrag für die Kinderdrittbetreuung gilt in Zug pro Kind, und für ein Kind unter 15 gilt der Eigenbetreuungsabzug, wenn er höher ist: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=38'
      label:
        en: 'Zug tax guide 2025, p. 38: childcare by others'
        fr: 'Guide fiscal de Zoug 2025, p. 38 : Frais de garde par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 38: Kinderdrittbetreuungskostenabzug'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Kinderdrittbetreuungskosten war für Kind {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # The commune of 31 December taxes the whole year, and so do its parish and its Bürgergemeinde
  # (StG § 171, zg-2026-law-steuergesetz p. 84). The list is Zug's 11 communes by name
  # (packages/rules-zg, from zg-2026-communal-steuerfuesse; the table has no BFS numbers). Each levies
  # its Steuerfuss of the einfache Steuer (StG § 2 Abs. 1, p. 1).
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year, and so do its parish and its Bürgergemeinde. Each commune sets its own Steuerfuss, a percentage of the simple tax (einfache Steuer).'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année, de même que sa paroisse et sa bourgeoisie. Chaque commune fixe son propre coefficient (Steuerfuss), un pourcentage de l’impôt simple (einfache Steuer).'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr, ebenso ihre Kirchgemeinde und ihre Bürgergemeinde. Jede Gemeinde legt ihren eigenen Steuerfuss fest, einen Prozentsatz der einfachen Steuer.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:24fb8832-3383-4718-9a48-9461bc7501fc/Steuerf%C3%BCsse%202026_effektiv%2021.1.26.pdf'
      label:
        en: 'Steuerfüsse of the Zug communes, 2023 to 2026'
        fr: 'Coefficients (Steuerfüsse) des communes zougoises, 2023 à 2026'
        de: 'Steuerfüsse der Gemeinden des Kantons Zug, 2023 bis 2026'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
    help:
      en: 'The official name, such as Zug, Baar or Unterägeri.'
      fr: 'Le nom officiel, par exemple Zug, Baar ou Unterägeri.'
      de: 'Der offizielle Name, zum Beispiel Zug, Baar oder Unterägeri.'

  # Who files in Zug: everyone living in the canton on 31 December (zg-2025-guide-wegleitung p. 8);
  # arriving from another canton, Zug taxes the whole year (p. 24); leaving for another canton, the
  # new canton does; leaving for abroad ends the liability in Zug (p. 9). Arriving from abroad or
  # leaving Switzerland means a return for part of the year: not covered by rules-zg.
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Zug taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Zoug vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Zug besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
    learnMore:
      url: 'https://cdn.zg.ch/dam/jcr:17c572af-908f-43a5-96b0-0fd25983f924/Wegleitung_2025_StKtZug_A4_20251119.pdf#page=9'
      label:
        en: 'Zug tax guide 2025, p. 9: moving away during the year'
        fr: 'Guide fiscal de Zoug 2025, p. 9 : Départ en cours d’année'
        de: 'Wegleitung zur Steuererklärung 2025, S. 9: Beendigung der Steuerpflicht'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein' } }
      - value: within_zg
        label:
          {
            en: 'Yes, within the canton of Zug',
            fr: 'Oui, dans le canton de Zoug',
