      label:
        en: 'Tax at source in Basel-Stadt 2026, p. 11: the ordinary assessment afterwards, in German'
        fr: 'Impôt à la source à Bâle-Ville 2026, p. 11 : taxation ordinaire ultérieure, en allemand'
        de: 'Quellenbesteuerung 2026, S. 11: nachträgliche ordentliche Veranlagung'
        it: 'Imposta alla fonte a Basilea Città 2026, p. 11: la tassazione ordinaria ulteriore, in tedesco'
    help:
      en: 'If so, it shows on the salary certificate (Lohnausweis, Ziffer 12).'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire (Lohnausweis, chiffre 12).'
      de: 'Wenn ja, steht es auf dem Lohnausweis (Ziffer 12).'
      it: 'Se è così, lo trovi sul certificato di salario (Lohnausweis, Ziffer 12).'

  # Lines 620/625, Gebundene Selbstvorsorge (Säule 3a), with the attestation
  # (bs-2025-guide-wegleitung p. 33).
  - use: pillar3a
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=33'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 33: pillar 3a, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 33 : pilier 3a, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 33: Gebundene Selbstvorsorge (Säule 3a)'
        it: 'Guida fiscale di Basilea Città 2025, p. 33: pilastro 3a, in tedesco'
    help:
      en: 'Your bank or insurer sends an attestation (Bescheinigung). On the return: Gebundene Selbstvorsorge (Säule 3a), 620 and 625.'
      fr: 'Votre banque ou votre assurance vous envoie une attestation (Bescheinigung). Sur la déclaration : Gebundene Selbstvorsorge (Säule 3a), 620 et 625.'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung. In der Steuererklärung: Gebundene Selbstvorsorge (Säule 3a), Ziffern 620 und 625.'
      it: 'La tua banca o assicurazione ti manda un’attestazione (Bescheinigung). Nella dichiarazione: Gebundene Selbstvorsorge (Säule 3a), 620 e 625.'

  # Lines 610/615, Berufliche Vorsorge (Pensionskasse): buy-ins the salary certificate doesn't show
  # (bs-2025-guide-wegleitung p. 33).
  - use: lpp_buyin
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=33'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 33: pension fund buy-ins, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 33 : rachats de prévoyance professionnelle, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 33: Berufliche Vorsorge (Pensionskasse)'
        it: 'Guida fiscale di Basilea Città 2025, p. 33: riscatti nella cassa pensione, in tedesco'
    help:
      en: 'A voluntary payment on top of the usual contributions. Count only a buy-in your salary certificate doesn’t show. On the return: Berufliche Vorsorge (Pensionskasse), 610 and 615.'
      fr: 'Un versement volontaire en plus des cotisations habituelles. Comptez seulement un rachat que votre certificat de salaire ne montre pas. Sur la déclaration : Berufliche Vorsorge (Pensionskasse), 610 et 615.'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen. Zähl nur einen Einkauf, den dein Lohnausweis nicht zeigt. In der Steuererklärung: Berufliche Vorsorge (Pensionskasse), Ziffern 610 und 615.'
      it: 'Un versamento volontario oltre ai contributi abituali. Conta solo un riscatto che il tuo certificato di salario non indica. Nella dichiarazione: Berufliche Vorsorge (Pensionskasse), 610 e 615.'

  # Travel to work (Fahrkosten, form B 503/523) for both taxes, each up to its own cap:
  # bs-2025-guide-wegleitung p. 30; ch-2026-ifd-instructions-personnes-physiques p. 6. No "over 2
  # hours a day" choice: only Geneva's meal rule needs it (rules-bs, keys.ts, bsKeys).
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrkosten), pour l’impôt cantonal et l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten abgezogen, bei der Kantons- und der Bundessteuer, je bis zu ihrem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto per andare al lavoro si deduce come spese di trasporto (Fahrkosten), per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo. Il mezzo che usi decide come vengono contate.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=30'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 30: travel costs, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 30 : frais de déplacement, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Fahrkosten'
        it: 'Guida fiscale di Basilea Città 2025, p. 30: spese di trasporto, in tedesco'
    help:
      en: 'Choose how you went on most work days. On form B: Fahrkosten zwischen Wohn- und Arbeitsstätte.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire B : Fahrkosten zwischen Wohn- und Arbeitsstätte (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf dem Formular B: Fahrkosten zwischen Wohn- und Arbeitsstätte.'
      it: 'Scegli come ci andavi nella maggior parte dei giorni di lavoro. Sul modulo B: Fahrkosten zwischen Wohn- und Arbeitsstätte.'
    options:
      - value: public_transport
        label:
          {
            en: 'Public transport',
            fr: 'Transports publics',
            de: 'Öffentlicher Verkehr',
            it: 'Trasporti pubblici',
          }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto', it: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
            it: 'Moto o scooter con targa bianca',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Mofa mit gelbem Kontrollschild',
            it: 'Bicicletta, e-bike o ciclomotore con targa gialla',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss', it: 'A piedi' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
            it: 'Da casa, quasi tutti i giorni',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice', it: 'Telelavoro' }

  # bs-2025-guide-wegleitung p. 30 (503/523: a U-Abo TNW or a GA, form B).
  - use: commute_transit_cost
    explain:
      en: 'You deduct the public transport you paid to get to work, for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez les transports publics payés pour aller au travail, pour l’impôt cantonal et l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst die bezahlten Kosten des öffentlichen Verkehrs zur Arbeit ab, bei der Kantons- und der Bundessteuer, je bis zu ihrem eigenen jährlichen Höchstbetrag.'
      it: 'Deduci i trasporti pubblici che hai pagato per andare al lavoro, per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=30'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 30: public transport, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 30 : transports publics, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Fahrkosten für öffentliche Verkehrsmittel'
        it: 'Guida fiscale di Basilea Città 2025, p. 30: trasporti pubblici, in tedesco'
    help:
      en: 'What your tickets cost in the year: an annual or monthly U-Abo TNW, or a GA.'
      fr: 'Ce que vos abonnements ont coûté dans l’année : un U-Abo TNW annuel ou mensuel, ou un AG.'
      de: 'Was deine Abos im Jahr gekostet haben: ein U-Abo TNW (Jahres- oder Monatsabo) oder ein GA.'
      it: 'Quanto ti sono costati gli abbonamenti nell’anno: un U-Abo TNW annuale o mensile, o un abbonamento generale (AG).'

  # bs-2025-guide-wegleitung p. 30 (private vehicles: only when public transport can't reasonably
  # be used; otherwise what it would have cost).
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. The kilometres count only when public transport can’t reasonably be used for the trip.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent que si les transports publics ne peuvent raisonnablement pas être utilisés pour le trajet.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur, wenn der öffentliche Verkehr für den Weg nicht zumutbar ist.'
      it: 'Chi guida deduce quanto sarebbero costati i trasporti pubblici, per entrambe le imposte. I chilometri contano solo se per quel tragitto non si possono ragionevolmente usare i trasporti pubblici.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=30'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 30: private vehicles, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 30 : véhicules privés, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Fahrkosten für private Fahrzeuge'
        it: 'Guida fiscale di Basilea Città 2025, p. 30: veicoli privati, in tedesco'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nehmen können',
            it: 'Sì, avrei potuto usare i trasporti pubblici',
          }
      - value: 'no'
        label:
          {
            en: 'No, public transport could not reasonably be used for the trip',
            fr: 'Non, les transports publics ne pouvaient raisonnablement pas être utilisés pour le trajet',
            de: 'Nein, der öffentliche Verkehr war für den Weg nicht zumutbar',
            it: 'No, per quel tragitto non si potevano ragionevolmente usare i trasporti pubblici',
          }

  # bs-2025-guide-wegleitung p. 30
  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'Ce prix est ce que vous déduisez pour vos trajets en voiture, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Dieser Preis ist, was du für die Fahrten mit dem Fahrzeug abziehst, bei beiden Steuern, je bis zu ihrem eigenen jährlichen Höchstbetrag.'
      it: 'È questo prezzo che deduci per andare al lavoro con il tuo veicolo, per entrambe le imposte, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=30'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 30: travel costs, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 30 : frais de déplacement, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Fahrkosten'
        it: 'Guida fiscale di Basilea Città 2025, p. 30: spese di trasporto, in tedesco'

  # bs-2025-guide-wegleitung p. 30; form B (km a day x days = km a year, at a rate per km).
  - use: commute_distance
    explain:
      en: 'When public transport can’t be used, both taxes count a fixed amount per kilometre, there and back once a day, each up to its own yearly limit.'
      fr: 'Si les transports publics ne peuvent pas être utilisés, les deux impôts comptent un montant fixe par kilomètre, aller et retour une fois par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Wenn der öffentliche Verkehr nicht zumutbar ist, zählen beide Steuern einen festen Betrag pro Kilometer, einmal pro Tag hin und zurück, je bis zu ihrem eigenen jährlichen Höchstbetrag.'
      it: 'Se non si possono usare i trasporti pubblici, entrambe le imposte contano un importo fisso per chilometro, andata e ritorno una volta al giorno, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://media.bs.ch/original_file/630cae1c108bb2f52c9d0b4e45506b4f22e695d5/15020-fw-np-ste-25-02-berufskosten-ansichtsexemplar.pdf#page=1'
      label:
        en: 'Form B, professional costs (Berufskosten), in German'
        fr: 'Formulaire B, frais professionnels (Berufskosten), en allemand'
        de: 'Formular B, Berufskosten'
        it: 'Modulo B, spese professionali (Berufskosten), in tedesco'

  # bs-2025-guide-wegleitung p. 31 (220 working days a year at most).
  - use: commute_drive_days
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=31'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 31: working days, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 31 : jours de travail, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 31: Arbeitstage'
        it: 'Guida fiscale di Basilea Città 2025, p. 31: giorni di lavoro, in tedesco'
    help:
      en: 'Leave out holidays, sick days and days worked from home. Basel-Stadt counts at most 220 working days a year.'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail. Bâle-Ville compte au plus 220 jours de travail par an.'
      de: 'Ohne Ferien, Krankheitstage und Tage im Homeoffice. Basel-Stadt zählt höchstens 220 Arbeitstage im Jahr.'
      it: 'Escludi le vacanze, i giorni di malattia e i giorni di telelavoro. Basilea Città conta al massimo 220 giorni di lavoro all’anno.'

  # Meals away from home (Mehrkosten für auswärtige Verpflegung, form B 504/524), for both taxes: a
  # fixed amount per day, half of it with a canteen or meal vouchers (bs-2025-guide-wegleitung p. 31).
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work costs more than at home (Mehrkosten für auswärtige Verpflegung). A fixed amount per day counts for both taxes, each up to its own yearly limit, half of it when your employer makes your meals cheaper (a canteen, meal vouchers).'
      fr: 'Le repas de midi pris hors du domicile à cause du travail coûte plus cher qu’à la maison (Mehrkosten für auswärtige Verpflegung). Un montant fixe par jour compte pour les deux impôts, chacun jusqu’à sa propre limite annuelle, la moitié si votre employeur réduit le prix de vos repas (cantine, bons de repas).'
      de: 'Das Mittagessen auswärts wegen der Arbeit kostet mehr als zu Hause (Mehrkosten für auswärtige Verpflegung). Ein fester Betrag pro Tag zählt bei beiden Steuern, je bis zu ihrem eigenen jährlichen Höchstbetrag, die Hälfte, wenn dein Arbeitgeber die Mahlzeiten verbilligt (Kantine, Lunch-Checks).'
      it: 'Pranzare fuori casa per lavoro costa più che a casa (Mehrkosten für auswärtige Verpflegung). Un importo fisso al giorno conta per entrambe le imposte, ognuna fino al proprio limite annuo, e la metà se il tuo datore di lavoro rende i tuoi pasti meno cari (una mensa, buoni pasto).'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=31'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 31: meals away from home, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 31 : repas hors du domicile, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 31: Mehrkosten für auswärtige Verpflegung'
        it: 'Guida fiscale di Basilea Città 2025, p. 31: pasti fuori casa, in tedesco'
    help:
      en: 'Count the work days you couldn’t eat lunch at home; 0 if you usually did.'
      fr: 'Comptez les jours de travail où vous ne pouviez pas manger à la maison à midi ; 0 si vous le pouviez en général.'
      de: 'Zähl die Arbeitstage, an denen du mittags nicht zu Hause essen konntest; 0, wenn du es meistens konntest.'
      it: 'Conta i giorni di lavoro in cui non potevi pranzare a casa; 0 se di solito potevi.'

  # Accounts and securities (Guthaben und Wertschriften, form W, line 800; their income, line 369):
  # bs-2025-guide-wegleitung p. 24 and p. 40. Basel-Stadt taxes them at their market value or, when
  # lower, the mean of the market value and the income capitalised (form W, lines 11 to 16).
  - use: banks
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=40'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 40: accounts and securities, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 40 : avoirs et titres, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 40: Guthaben und Wertschriften'
        it: 'Guida fiscale di Basilea Città 2025, p. 40: conti e titoli, in tedesco'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers. In Basel-Stadt the income of each account matters even when it is zero: ask for the e-tax statement (eSteuerauszug) if your bank offers it. On form W: Wertschriftenverzeichnis.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers. À Bâle-Ville, le rendement de chaque compte compte même s’il est nul : demandez le relevé fiscal électronique (eSteuerauszug) si votre banque le propose. Sur le formulaire W : Wertschriftenverzeichnis (état des titres).'
      de: 'Zähl auch PostFinance, die Konten deiner Kinder und Online- oder ausländische Broker. In Basel-Stadt zählt der Ertrag jedes Kontos, auch wenn er null ist: Verlang den eSteuerauszug, wenn deine Bank ihn anbietet. Auf dem Formular W: Wertschriftenverzeichnis.'
      it: 'Conta anche PostFinance, i conti dei tuoi figli e i broker online o esteri. A Basilea Città il reddito di ogni conto è importante anche quando è zero: chiedi l’estratto fiscale elettronico (eSteuerauszug) se la tua banca lo offre. Sul modulo W: Wertschriftenverzeichnis.'

  # Crypto (bs-2025-other-krypto-merkblatt; bs-2025-guide-wegleitung p. 40: in form W, at the
  # price at the end of the year).
  - use: crypto
    learnMore:
      url: 'https://media.bs.ch/original_file/8c06838fade72c9930ac1c73967eca9ad0e70707/18023-mb-np-kryptowaehrungen-cd-bf.pdf'
      label:
        en: 'Taxation of cryptocurrencies in Basel-Stadt, in German'
        fr: 'Imposition des cryptomonnaies à Bâle-Ville, en allemand'
        de: 'Besteuerung von Kryptowährungen (Merkblatt)'
        it: 'Imposizione delle criptovalute a Basilea Città, in tedesco'
    help:
      en: 'They go in the securities list (Wertschriftenverzeichnis, form W), at their price on 31 December.'
      fr: 'Elles vont dans l’état des titres (Wertschriftenverzeichnis, formulaire W), à leur cours au 31 décembre.'
      de: 'Sie gehören ins Wertschriftenverzeichnis (Formular W), zum Kurs am 31. Dezember.'
      it: 'Vanno nell’elenco dei titoli (Wertschriftenverzeichnis, modulo W), al loro corso del 31 dicembre.'

  # Medical costs (725, form K: bs-2025-guide-wegleitung p. 37), donations (732, form Z: p. 38),
  # payments to political parties (680, form Z: p. 36), debt interest (550: p. 32), alimony and
  # child support paid (560, 561: p. 32).
  - use: payments
    explain:
      en: 'Each of these can lower your tax if you keep the proof. In Basel-Stadt, payments to political parties are a deduction of their own (line 680), apart from donations to charities (line 732).'
      fr: 'Chacun de ces frais peut diminuer votre impôt si vous en gardez la preuve. À Bâle-Ville, les versements aux partis politiques sont une déduction à part (ligne 680), distincte des dons aux œuvres (ligne 732).'
      de: 'Jeder dieser Posten kann deine Steuer senken, wenn du einen Beleg hast. In Basel-Stadt sind Beiträge an politische Parteien ein eigener Abzug (Ziffer 680), getrennt von den Zuwendungen (Ziffer 732).'
      it: 'Ognuna di queste spese può ridurre la tua imposta se ne conservi la prova. A Basilea Città, i versamenti ai partiti politici sono una deduzione a sé (riga 680), separata dalle donazioni a enti di pubblica utilità (riga 732).'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=37'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 37: illness costs, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 37 : frais de maladie, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 37: Krankheits-, Unfall- und Behinderungskosten'
        it: 'Guida fiscale di Basilea Città 2025, p. 37: spese di malattia, in tedesco'
    options:
      - value: medical_costs
        label:
          {
            en: 'Medical or dental costs that insurance didn’t cover',
            fr: 'Des frais médicaux ou dentaires non remboursés',
            de: 'Arzt- oder Zahnarztkosten, die die Versicherung nicht bezahlt hat',
            it: 'Spese mediche o dentistiche non coperte dall’assicurazione',
          }
        chip:
          { en: 'Medical costs', fr: 'Frais médicaux', de: 'Krankheitskosten', it: 'Spese mediche' }
      - value: donations
        label:
          {
            en: 'Donations to charities in Switzerland',
            fr: 'Des dons à des œuvres d’utilité publique en Suisse',
            de: 'Zuwendungen an gemeinnützige Institutionen in der Schweiz',
