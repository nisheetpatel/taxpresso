# Basel-Stadt questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not
# code: packages/questionnaire reads it, and every key and value must exist in Basel-Stadt's keys
# (packages/rules-bs, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Basel-Stadt return (bs-2025-form-hauptformular: page 1 the personal details, then forms B,
# K, Z and F, then pages 2 to 4), with Basel-Stadt's own explanations and official pages. The
# questions only Basel-Stadt asks follow what its engine reads (packages/rules-bs, BaselCantonal):
# the AHV reference age of a person filing alone (line 770), whether a single parent lives as a
# couple (page 1, section 3) and, with shared custody, mainly bears the children's upkeep (StV
# § 42), whether each child is under 18 (line 892), the childcare paid per child (form F), the
# commune (Basel, Riehen or Bettingen) and the move, church membership (StG § 2a), each person's
# work rate (form B) and payments to political parties (form Z, line 680).
#
# Wording and pages follow the Basel-Stadt guide for 2025 (bs-2025-guide-wegleitung), the latest
# for a whole year; the 2026 guide is not published yet, only the one for a liability ending in
# 2026 (docs/sources/bs/NOTES.md, Gaps): re-check against it. "p." is the page of the PDF file, as
# in the links. The guide is in German: the German term of the form is next to each gloss.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'Basel-Stadt', fr: 'Bâle-Ville', de: 'Basel-Stadt', it: 'Basilea Città' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du', it: 'Tu' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
      it: 'Il tuo coniuge o partner',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner', it: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}', it: 'Figlio {n}' }

# BalTax Online, in the eSteuern.BS portal with an AGOV login, is the canton's official tax
# software (bs-2025-efiling-baltax-tipps p. 1; bs-2025-efiling-steuerportal). No document of the
# library says it is free, so the text doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. BalTax Online, the canton’s official tax software in the eSteuern.BS portal, or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. BalTax Online, le logiciel fiscal officiel du canton dans le portail eSteuern.BS, ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. BalTax Online, die offizielle Steuersoftware des Kantons im Portal eSteuern.BS, oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Possono farlo BalTax Online, il software fiscale ufficiale del Cantone nel portale eSteuern.BS, o una fiduciaria.'

questions:
  - use: canton

  # Page 1 of the main form (Zivilstand); joint taxation of spouses and registered partners:
  # bs-2025-guide-wegleitung p. 7 (Familienbesteuerung); the form: "Die eingetragene Partnerschaft
  # gleichgeschlechtlicher Paare wird gleich behandelt wie die Ehe" (bs-2025-form-hauptformular p. 1).
  - use: civil_status
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=7'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 7: taxing the family, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 7 : imposition de la famille, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 7: Familienbesteuerung'
        it: 'Guida fiscale di Basilea Città 2025, p. 7: imposizione della famiglia, in tedesco'
    help:
      en: 'On page 1 of the return: Zivilstand. A registered partnership files like a married couple.'
      fr: 'Sur la page 1 de la déclaration : Zivilstand (état civil). Un partenariat enregistré déclare comme un couple marié.'
      de: 'Auf Seite 1 der Steuererklärung: Zivilstand. Eine eingetragene Partnerschaft füllt die Steuererklärung wie ein Ehepaar aus.'
      it: 'A pagina 1 della dichiarazione: Zivilstand. Un’unione domestica registrata compila la dichiarazione come una coppia sposata.'

  # Line 770, Abzug für alleinstehende Rentner/innen: for a person filing alone who reached the AHV
  # reference age, or whose income is mostly pensions (bs-na-law-stv § 43, p. 12;
  # bs-2025-guide-wegleitung p. 39). Basel-Stadt's engine decides it with this answer
  # (packages/rules-bs, retiree), and computes nothing without it.
  - id: reference_age
    key: bs.reference_age
    type: yesno
    perPerson: true
    when: { key: profile.civil_status, in: [single, separated, divorced, widowed] }
    explain:
      en: 'A person filing alone who reached the AHV reference age (Referenzalter) gets an extra deduction for single retirees (Abzug für alleinstehende Rentner/innen, line 770). Before that age, it depends on how much of the income is pensions.'
      fr: 'Une personne qui déclare seule et a atteint l’âge de référence AVS (Referenzalter) a droit à une déduction supplémentaire pour retraités seuls (Abzug für alleinstehende Rentner/innen, ligne 770). Avant cet âge, cela dépend de la part des rentes dans le revenu.'
      de: 'Wer allein deklariert und das AHV-Referenzalter erreicht hat, erhält zusätzlich den Abzug für alleinstehende Rentner/innen (Ziffer 770). Vor diesem Alter hängt er davon ab, wie viel des Einkommens Renten sind.'
      it: 'Chi presenta una dichiarazione individuale e ha raggiunto l’età di riferimento AVS (Referenzalter) riceve in più la deduzione per pensionati soli (Abzug für alleinstehende Rentner/innen, riga 770). Prima di quell’età, dipende da quanta parte del reddito è fatta di rendite.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=39'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 39: social deductions, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 39 : déductions sociales, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 39: Sozialabzüge'
        it: 'Guida fiscale di Basilea Città 2025, p. 39: deduzioni sociali, in tedesco'
    text:
      en: 'Had you reached the AHV reference age by 31 December 2026?'
      fr: 'Aviez-vous atteint l’âge de référence AVS au 31 décembre 2026 ?'
      de: 'Hattest du am 31. Dezember 2026 das AHV-Referenzalter erreicht?'
      it: 'Il 31 dicembre 2026 avevi raggiunto l’età di riferimento AVS?'
    help:
      en: 'The reference age (Referenzalter) is the age at which the AHV old-age pension starts as a rule.'
      fr: 'L’âge de référence (Referenzalter) est l’âge auquel la rente de vieillesse AVS commence en règle générale.'
      de: 'Das Referenzalter ist das Alter, ab dem die AHV-Altersrente in der Regel beginnt.'
      it: 'L’età di riferimento (Referenzalter) è l’età in cui di regola inizia la rendita di vecchiaia AVS.'
    chip:
      { en: 'Reference age', fr: 'Âge de référence', de: 'Referenzalter', it: 'Età di riferimento' }

  # Page 1, section 2 (minor children, children in education); line 750, Abzug für Kinder
  # (bs-2025-guide-wegleitung p. 38).
  - use: children
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=38'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 38: child deduction, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 38 : déduction pour enfants, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 38: Abzug für Kinder'
        it: 'Guida fiscale di Basilea Città 2025, p. 38: deduzione per i figli, in tedesco'
    help:
      en: 'On page 1 of the return: section 2, Kinder (children), in your household or outside it.'
      fr: 'Sur la page 1 de la déclaration : section 2, Kinder (enfants), dans votre ménage ou hors de celui-ci.'
      de: 'Auf Seite 1 der Steuererklärung: Abschnitt 2, Kinder im eigenen Haushalt oder ausserhalb.'
      it: 'A pagina 1 della dichiarazione: sezione 2, Kinder (figli), nella tua economia domestica o fuori.'

  # Page 1, section 2: Kinder im eigenen Haushalt, and for parents taxed apart: child support from
  # the other parent and joint custody (Gemeinsames Sorgerecht). Line 750 (bs-2025-guide-wegleitung
  # p. 38; StG § 35 al. 1 lit. a: half each without child support).
  - use: children_custody
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=38'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 38: child deduction, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 38 : déduction pour enfants, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 38: Abzug für Kinder'
        it: 'Guida fiscale di Basilea Città 2025, p. 38: deduzione per i figli, in tedesco'
    help:
      en: 'On page 1 of the return: Kinder im eigenen Haushalt (children in your household); with shared custody, the questions for parents taxed apart.'
      fr: 'Sur la page 1 de la déclaration : Kinder im eigenen Haushalt (enfants dans votre ménage) ; en garde partagée, les questions pour les parents imposés séparément.'
      de: 'Auf Seite 1 der Steuererklärung: Kinder im eigenen Haushalt; bei geteilter Obhut die Fragen für getrennt besteuerte Eltern.'
      it: 'A pagina 1 della dichiarazione: Kinder im eigenen Haushalt (figli nella tua economia domestica); con la custodia alternata, le domande per i genitori tassati separatamente.'

  # Parents taxed apart with joint custody: with child support, the parent taxed on it has the child
  # deduction; without, each has half (StG § 35 al. 1 lit. a, bs-2025-guide-wegleitung p. 38). For
  # the federal parental scale: ch-na-circulaire-30-epoux-famille p. 24.
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it gets the child deduction (Abzug für Kinder) in full; without child support, you each get half. For the federal tax, the parental scale, a lower rate, goes to the parent who receives child support or, without it, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit a droit à toute la déduction pour enfants (Abzug für Kinder) ; sans contribution, chacun en a la moitié. Pour l’impôt fédéral, le barème parental, un taux plus bas, revient au parent qui reçoit la contribution ou, sans contribution, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, bekommt den ganzen Abzug für Kinder; ohne Unterhaltsbeiträge erhält jeder die Hälfte. Bei der Bundessteuer geht der Elterntarif, ein tieferer Satz, an den Elternteil, der Unterhaltsbeiträge erhält, oder ohne Unterhaltsbeiträge an den, der mehr verdient.'
      it: 'Con la custodia alternata, sono i contributi di mantenimento a decidere chi conta i figli. Il genitore che li riceve ha diritto all’intera deduzione per i figli (Abzug für Kinder); senza contributi di mantenimento, ogni genitore ne riceve la metà. Per l’imposta federale, la tariffa per i genitori, un’aliquota più bassa, va al genitore che riceve i contributi di mantenimento o, senza contributi, a chi guadagna di più.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=38'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 38: child deduction of parents taxed apart, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 38 : déduction pour enfants des parents imposés séparément, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 38: Abzug für Kinder getrennt besteuerter Eltern'
        it: 'Guida fiscale di Basilea Città 2025, p. 38: deduzione per i figli di genitori tassati separatamente, in tedesco'
    help:
      en: 'Child support (Unterhaltsbeiträge für minderjährige Kinder) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge für minderjährige Kinder) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge für minderjährige Kinder sind ein regelmässiger Betrag, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'
      it: 'I contributi di mantenimento (Unterhaltsbeiträge für minderjährige Kinder) sono un importo regolare per i figli, fissato da una sentenza o da una convenzione. Guadagnare di più significa avere un reddito netto più alto.'

  # Page 1, section 3: "Leben Sie in einer Konkubinatspartnerschaft mit gemeinsamen / nicht
  # gemeinsamen Kindern?" (bs-2025-form-hauptformular p. 1). The deduction for single parents (765)
  # and the wealth allowance of 890 are not for cohabiting couples, who have their own deduction
  # (757): bs-2025-guide-wegleitung p. 39 and 43; packages/rules-bs does not compute them yet.
  - id: cohabiting
    key: bs.cohabiting
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Basel-Stadt gives single parents a deduction (Abzug für alleinerziehende Personen, line 765), a lower income tariff and a higher wealth allowance, but not to an unmarried couple living with children (Konkubinat), who have rules of their own.'
      fr: 'Bâle-Ville accorde aux familles monoparentales une déduction (Abzug für alleinerziehende Personen, ligne 765), un barème plus bas et un montant exonéré de fortune plus élevé, mais pas à un couple non marié vivant avec des enfants (Konkubinat), qui a ses propres règles.'
      de: 'Basel-Stadt gibt Alleinerziehenden einen Abzug (Abzug für alleinerziehende Personen, Ziffer 765), einen tieferen Tarif und einen höheren Freibetrag auf dem Vermögen, nicht aber einem Konkubinatspaar mit Kindern, für das eigene Regeln gelten.'
      it: 'Basilea Città concede ai genitori soli una deduzione (Abzug für alleinerziehende Personen, riga 765), una tariffa più bassa sul reddito e una quota esente di sostanza più alta, ma non a una coppia non sposata che vive con figli (Konkubinat), per la quale valgono regole proprie.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=39'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 39: deduction for single parents, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 39 : déduction pour familles monoparentales, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 39: Abzug für alleinerziehende Personen'
        it: 'Guida fiscale di Basilea Città 2025, p. 39: deduzione per genitori soli, in tedesco'
    text:
      en: 'In 2026, did you live as a couple with a partner you are not married to (Konkubinat), with your children or with shared children?'
      fr: 'En 2026, viviez-vous en couple avec un partenaire auquel vous n’êtes pas marié(e) (Konkubinat), avec vos enfants ou des enfants communs ?'
      de: 'Hast du 2026 mit einem Partner oder einer Partnerin, mit dem oder der du nicht verheiratet bist, im Konkubinat mit Kindern gelebt?'
      it: 'Nel 2026 hai vissuto in coppia senza essere sposato o sposata (Konkubinat), con i tuoi figli o con figli in comune?'
    help:
      en: 'On page 1 of the return, section 3: Leben Sie in einer Konkubinatspartnerschaft mit gemeinsamen / nicht gemeinsamen Kindern?'
      fr: 'Sur la page 1 de la déclaration, section 3 : Leben Sie in einer Konkubinatspartnerschaft mit gemeinsamen / nicht gemeinsamen Kindern? (Vivez-vous en concubinage avec des enfants communs ou non ?)'
      de: 'Auf Seite 1 der Steuererklärung, Abschnitt 3: Leben Sie in einer Konkubinatspartnerschaft mit gemeinsamen / nicht gemeinsamen Kindern?'
      it: 'A pagina 1 della dichiarazione, sezione 3: Leben Sie in einer Konkubinatspartnerschaft mit gemeinsamen / nicht gemeinsamen Kindern?'
    yesNotSupported:
      en: 'A single parent living as a couple with children (Konkubinat mit Kindern)'
      fr: 'Un parent seul vivant en couple avec des enfants (Konkubinat mit Kindern)'
      de: 'Alleinerziehend im Konkubinat mit Kindern'
      it: 'Un genitore solo che vive in coppia con figli (Konkubinat mit Kindern)'
    chip: { en: 'Living as a couple', fr: 'En concubinage', de: 'Konkubinat', it: 'Convivenza' }

  # A child in shared custody: the deduction for single parents (765), tariff B and the wealth
  # allowance of 890 go to the parent who mainly bears the child's upkeep, with their own income and
  # wealth and the child support they are taxed on (bs-na-law-stv § 42, p. 11;
  # bs-2025-guide-wegleitung p. 39). packages/rules-bs computes nothing without the answer.
  - id: main_upkeep
    key: bs.main_upkeep
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - {
            key: profile.child_support,
            in: [i_receive, none_i_earn_more, none_other_earns_more, none_unsure],
          }
    explain:
      en: 'With shared custody, Basel-Stadt gives the deduction for single parents (line 765), the lower tariff and the higher wealth allowance only to the parent who mainly bears the children’s upkeep.'
      fr: 'En garde partagée, Bâle-Ville n’accorde la déduction pour familles monoparentales (ligne 765), le barème plus bas et le montant exonéré de fortune plus élevé qu’au parent qui assume principalement l’entretien des enfants.'
      de: 'Bei geteilter Obhut gibt Basel-Stadt den Abzug für alleinerziehende Personen (Ziffer 765), den tieferen Tarif und den höheren Freibetrag auf dem Vermögen nur dem Elternteil, der zur Hauptsache für den Unterhalt der Kinder aufkommt.'
      it: 'Con la custodia alternata, Basilea Città concede la deduzione per genitori soli (riga 765), la tariffa più bassa e la quota esente di sostanza più alta solo al genitore che provvede principalmente al mantenimento dei figli.'
    learnMore:
      url: 'https://www.gesetzessammlung.bs.ch/api/de/versions/6658/pdf_file#page=11'
      label:
        en: 'Basel-Stadt tax ordinance (Steuerverordnung), § 42, in German'
        fr: 'Ordonnance fiscale de Bâle-Ville (Steuerverordnung), § 42, en allemand'
        de: 'Steuerverordnung, § 42'
        it: 'Ordinanza fiscale di Basilea Città (Steuerverordnung), § 42, in tedesco'
    text:
      en: 'Did you mainly bear the children’s upkeep in 2026?'
      fr: 'Avez-vous assumé l’essentiel de l’entretien des enfants en 2026 ?'
      de: 'Bist du 2026 zur Hauptsache für den Unterhalt der Kinder aufgekommen?'
      it: 'Nel 2026 hai provveduto principalmente al mantenimento dei figli?'
    help:
      en: 'With your own income and wealth, counting the child support you receive as yours.'
      fr: 'Avec vos propres revenus et votre fortune, en comptant comme vôtre la contribution d’entretien que vous recevez.'
      de: 'Mit deinem eigenen Einkommen und Vermögen, die Unterhaltsbeiträge, die du erhältst, eingerechnet.'
      it: 'Con il tuo reddito e la tua sostanza, contando come tuoi i contributi di mantenimento che ricevi.'
    chip:
      {
        en: 'Main upkeep',
        fr: 'Entretien principal',
        de: 'Hauptunterhalt',
        it: 'Mantenimento principale',
      }

  # Line 892, Freibetrag für minderjährige Kinder: a wealth allowance per minor child
  # (bs-na-law-stg § 49 al. 1 lit. c, p. 20; bs-2025-guide-wegleitung p. 43). Page 1, section 2 of
  # the 2025 return lists minors by year of birth (2008 to 2025). Asked per child.
  - id: child_minor
    key: bs.child_minor
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Basel-Stadt exempts part of your wealth for each minor child you mainly provide for (Freibetrag für minderjährige Kinder, line 892).'
      fr: 'Bâle-Ville exonère une partie de votre fortune pour chaque enfant mineur à votre charge principale (Freibetrag für minderjährige Kinder, ligne 892).'
      de: 'Basel-Stadt stellt für jedes minderjährige Kind, für das du hauptsächlich sorgst, einen Teil deines Vermögens steuerfrei (Freibetrag für minderjährige Kinder, Ziffer 892).'
      it: 'Basilea Città esenta una parte della tua sostanza per ogni figlio minorenne al cui mantenimento provvedi principalmente (Freibetrag für minderjährige Kinder, riga 892).'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=43'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 43: wealth allowances, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 43 : montants exonérés de fortune, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 43: Steuerfreie Beträge'
        it: 'Guida fiscale di Basilea Città 2025, p. 43: quote esenti di sostanza, in tedesco'
    text:
      en: 'Was child {n} under 18 on 31 December 2026?'
      fr: 'L’enfant {n} avait-il moins de 18 ans au 31 décembre 2026 ?'
      de: 'War Kind {n} am 31. Dezember 2026 unter 18?'
      it: 'Il 31 dicembre 2026 il figlio {n} aveva meno di 18 anni?'
    help:
      en: 'Born in 2009 or later. Number your children the same way in every answer, for example from the eldest.'
      fr: 'Né en 2009 ou après. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Jahrgang 2009 oder jünger. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'Anno di nascita 2009 o successivo. Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'

  # Line 670, Abzug für fremdbetreute Kinder, and form F (bs-2025-guide-wegleitung p. 36;
  # bs-2025-form-kzf-krankheit-zuwendung-betreuung p. 2): children under 14, each up to a limit.
  - use: childcare
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=36'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 36: childcare, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 36 : frais de garde, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 36: Abzug für fremdbetreute Kinder'
        it: 'Guida fiscale di Basilea Città 2025, p. 36: custodia dei figli, in tedesco'
    help:
      en: 'A crèche (Tagesheim), day parents (Tagesmutter) or another person looking after your children under 14 while you work or study. On form F: Kinderbetreuungskosten.'
      fr: 'Une crèche (Tagesheim), une maman de jour (Tagesmutter) ou une autre personne qui garde vos enfants de moins de 14 ans pendant que vous travaillez ou étudiez. Sur le formulaire F : Kinderbetreuungskosten (frais de garde).'
      de: 'Ein Tagesheim, eine Tagesmutter oder eine andere Person, die deine Kinder unter 14 betreut, während du arbeitest oder in Ausbildung bist. Auf dem Formular F: Kinderbetreuungskosten.'
      it: 'Un asilo nido (Tagesheim), una famiglia diurna (Tagesmutter) o un’altra persona che si occupa dei tuoi figli sotto i 14 anni mentre lavori o studi. Sul modulo F: Kinderbetreuungskosten.'

  # Form F asks the childcare paid per child, and the limit is per child
  # (bs-2025-form-kzf-krankheit-zuwendung-betreuung p. 2; bs-2025-guide-wegleitung p. 36). With
  # several children, how the invoices' total splits can decide the deduction: asked per child.
  - id: child_care
    key: bs.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Form F asks the childcare paid for each child, and the Basel-Stadt limit is per child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'Le formulaire F demande les frais de garde payés pour chaque enfant (Kinderbetreuungskosten), et la limite de Bâle-Ville est par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Das Formular F fragt die Kinderbetreuungskosten für jedes Kind, und der Basler Höchstbetrag gilt pro Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
      it: 'Il modulo F chiede le spese di custodia pagate per ogni figlio, e il limite di Basilea Città vale per ogni figlio: la ripartizione tra i tuoi figli può cambiare la deduzione. Le tue fatture danno il totale.'
    learnMore:
      url: 'https://media.bs.ch/original_file/b40d5308954ad20f3d8b2e099f1eabbabe2046f8/15030-fw-np-ste-25-02-krankheitskosten-zuwendungen-kinderbet.pdf#page=2'
      label:
        en: 'Form F, childcare costs (Kinderbetreuungskosten), in German'
        fr: 'Formulaire F, frais de garde (Kinderbetreuungskosten), en allemand'
        de: 'Formular F, Kinderbetreuungskosten'
        it: 'Modulo F, spese di custodia dei figli (Kinderbetreuungskosten), in tedesco'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Kinderbetreuungskosten war für Kind {n}?'
      it: 'Quanto delle spese di custodia che hai pagato nel 2026 era per il figlio {n}?'
    help:
      en: 'In CHF, after any contributions you received, 0 if child {n} had none. Number your children the same way in every answer, for example from the eldest.'
      fr: 'En CHF, après les contributions reçues, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, nach Abzug erhaltener Beiträge, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'In CHF, dopo aver tolto gli eventuali contributi ricevuti, 0 se il figlio {n} non ne ha avute. Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'

  # The commune of 31 December: Basel, Riehen or Bettingen (bs-2025-guide-wegleitung p. 8,
  # Wohnsitzwechsel, a move between them as one from another canton; p. 9, Steuerberechnung: in Basel
  # the canton levies the whole tax, in Riehen and Bettingen half of it and the commune its own tax;
  # the rates of 2026 in bs-2026-communal-ansaetze-abzuege p. 1).
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year. In the city of Basel the canton levies the whole tax and there is no communal tax; in Riehen and Bettingen the canton levies part of it and the commune its own tax (Gemeindesteuer), at its own rate (Steuerfuss).'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année. En ville de Bâle, le canton prélève tout l’impôt et il n’y a pas d’impôt communal ; à Riehen et Bettingen, le canton en prélève une part et la commune son propre impôt (Gemeindesteuer), à son propre taux (Steuerfuss).'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr. In der Stadt Basel erhebt der Kanton die ganze Steuer und es gibt keine Gemeindesteuer; in Riehen und Bettingen erhebt der Kanton einen Teil und die Gemeinde ihre eigene Gemeindesteuer, zu ihrem eigenen Steuerfuss.'
      it: 'Il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Nella Città di Basilea il Cantone riscuote tutta l’imposta e non c’è un’imposta comunale; a Riehen e a Bettingen il Cantone ne riscuote una parte e il Comune la propria imposta (Gemeindesteuer), con il proprio moltiplicatore (Steuerfuss).'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=9'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 9: how the tax is computed, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 9 : calcul de l’impôt, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 9: Steuerberechnung'
        it: 'Guida fiscale di Basilea Città 2025, p. 9: calcolo dell’imposta, in tedesco'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
      it: 'In quale Comune abitavi il 31 dicembre 2026?'
    help:
      en: 'Basel, Riehen or Bettingen.'
      fr: 'Bâle (Basel), Riehen ou Bettingen.'
      de: 'Basel, Riehen oder Bettingen.'
      it: 'Basilea (Basel), Riehen o Bettingen.'

  # bs-2025-guide-wegleitung p. 8 (Wohnsitzwechsel): from another canton, Basel-Stadt taxes the whole
  # year; from abroad, or leaving Switzerland, a return for part of the year (not covered by
  # rules-bs: docs/sources/bs/NOTES.md, Open points for the rules).
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move between Basel, Riehen and Bettingen changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Basel-Stadt taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement entre Bâle, Riehen et Bettingen ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Bâle-Ville vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug zwischen Basel, Riehen und Bettingen ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Basel-Stadt besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
      it: 'Un trasloco tra Basilea, Riehen e Bettingen non cambia niente: il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Neanche un arrivo da un altro Cantone cambia qualcosa: Basilea Città ti tassa per tutto l’anno, come se avessi abitato qui da gennaio. Un arrivo dall’estero, o una partenza dalla Svizzera, significa che qui le imposte riguardano solo una parte dell’anno.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=8'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 8: moving, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 8 : changement de domicile, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 8: Wohnsitzwechsel'
        it: 'Guida fiscale di Basilea Città 2025, p. 8: cambiamento di domicilio, in tedesco'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
      it: 'Hai traslocato nel 2026?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein', it: 'No' } }
      - value: within_basel
        label:
          {
            en: 'Yes, within the canton of Basel-Stadt',
            fr: 'Oui, dans le canton de Bâle-Ville',
            de: 'Ja, innerhalb des Kantons Basel-Stadt',
            it: 'Sì, all’interno del Cantone di Basilea Città',
          }
        chip:
          {
            en: 'Moved in Basel-Stadt',
            fr: 'Déménagé à Bâle-Ville',
            de: 'Umzug im Kanton',
            it: 'Trasloco a Basilea Città',
          }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
            it: 'Sì, da un altro Cantone',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
            it: 'Arrivo da un altro Cantone',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
            it: 'Sì, sono arrivato o arrivata dall’estero',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
            it: 'Un arrivo dall’estero durante l’anno (Zuzug aus dem Ausland)',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
            it: 'Ho lasciato la Svizzera, o la sto lasciando',
          }
        notSupported:
          {
            en: 'Leaving Switzerland (Wegzug ins Ausland)',
            fr: 'Un départ de Suisse (Wegzug ins Ausland)',
            de: 'Ein Wegzug ins Ausland',
            it: 'Una partenza dalla Svizzera (Wegzug ins Ausland)',
          }

  # Church tax (Kirchensteuer): the recognised churches and religious communities levy it on their
  # members (bs-na-law-stg § 2a, p. 1). Its rates are in no document of the library: Taxpresso says
  # it is not in the calculation for a member (packages/rules-bs, NOTE.church), nothing for others.
  - id: church
    key: bs.church
    type: yesno
    perPerson: true
    explain:
      en: 'The recognised churches and religious communities levy a church tax (Kirchensteuer) on their members. Its rates are not in the documents Taxpresso has, so it is not in the calculation: Taxpresso tells a member so.'
      fr: 'Les Églises et communautés religieuses reconnues prélèvent un impôt ecclésiastique (Kirchensteuer) auprès de leurs membres. Ses taux ne figurent pas dans les documents dont dispose Taxpresso, il n’est donc pas dans le calcul : Taxpresso le signale à un membre.'
      de: 'Die anerkannten Kirchen und Religionsgemeinschaften erheben von ihren Mitgliedern eine Kirchensteuer. Die Sätze dieser Steuer stehen in keinem Dokument, das Taxpresso hat, sie ist also nicht in der Berechnung: Taxpresso sagt das einem Mitglied.'
      it: 'Le Chiese e le comunità religiose riconosciute riscuotono un’imposta di culto (Kirchensteuer) dai loro membri. Le sue aliquote non sono nei documenti di cui dispone Taxpresso, quindi non è nel calcolo: Taxpresso lo segnala a chi ne è membro.'
    learnMore:
      url: 'https://www.gesetzessammlung.bs.ch/api/de/versions/6745/pdf_file_with_annexes#page=1'
      label:
        en: 'Basel-Stadt tax law (Steuergesetz), § 2a: church tax, in German'
        fr: 'Loi fiscale de Bâle-Ville (Steuergesetz), § 2a : impôt ecclésiastique, en allemand'
        de: 'Steuergesetz, § 2a: Kirchensteuer'
        it: 'Legge tributaria di Basilea Città (Steuergesetz), § 2a: imposta di culto, in tedesco'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of a recognised church or religious community?'
        fr: 'Au 31 décembre 2026, étiez-vous membre d’une Église ou communauté religieuse reconnue ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer anerkannten Kirche oder Religionsgemeinschaft?'
        it: 'Il 31 dicembre 2026 eri membro di una Chiesa o di una comunità religiosa riconosciuta?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of a recognised church or religious community?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre d’une Église ou communauté religieuse reconnue ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer anerkannten Kirche oder Religionsgemeinschaft?'
        it: 'Il 31 dicembre 2026 il tuo coniuge o partner era membro di una Chiesa o di una comunità religiosa riconosciuta?'
    help:
      en: 'Such as the Reformed, Roman Catholic or Christ Catholic church, or the Israelite community.'
      fr: 'Par exemple l’Église réformée, catholique romaine ou catholique chrétienne, ou la communauté israélite.'
      de: 'Etwa die evangelisch-reformierte, die römisch-katholische oder die christkatholische Kirche oder die Israelitische Gemeinde.'
      it: 'Per esempio la Chiesa riformata, cattolica romana o cattolica cristiana, o la comunità israelitica.'
    chip:
      {
        en: 'Church member',
        fr: 'Membre d’une Église',
        de: 'Kirchenmitglied',
        it: 'Membro di una Chiesa',
      }

