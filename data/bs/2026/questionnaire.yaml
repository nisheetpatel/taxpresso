  # Basel-Stadt's cantonal deduction for insurance premiums is a flat amount whatever was paid
  # (bs-2025-guide-wegleitung p. 35); the federal one is what was paid, up to a limit: the
  # attestation counts for the federal tax.
  - use: health_premiums
    explain:
      en: 'Your health insurer’s yearly statement of premiums paid, basic and supplementary. Basel-Stadt gives a flat amount for the cantonal tax whatever you paid; the federal tax counts what you paid, up to a limit.'
      fr: 'Le relevé annuel des primes payées de votre assureur maladie, de base et complémentaires. Bâle-Ville accorde un forfait pour l’impôt cantonal quel que soit le montant payé ; l’impôt fédéral compte ce que vous avez payé, jusqu’à une limite.'
      de: 'Die jährliche Prämienbescheinigung deiner Krankenkasse, Grund- und Zusatzversicherung. Basel-Stadt gibt bei der Kantonssteuer eine Pauschale, egal was du bezahlt hast; die Bundessteuer zählt, was du bezahlt hast, bis zu einem Höchstbetrag.'
      it: 'L’attestazione annuale dei premi pagati della tua cassa malati, per l’assicurazione di base e le complementari. Basilea Città concede un importo forfettario per l’imposta cantonale, qualunque sia l’importo pagato; l’imposta federale conta quanto hai pagato, fino a un limite.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=35'
      label:
