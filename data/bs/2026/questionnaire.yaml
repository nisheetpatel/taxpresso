      de: 'Jeder gibt dir einen Lohnausweis.'
      it: 'Ognuno ti dà un certificato di salario (Lohnausweis).'

  # Form B: "Beschäftigungsgrad / Pensum in Prozent" for each person (bs-2025-form-b-berufskosten
  # p. 1 and 2); the canton's flat amount for professional costs is cut in proportion at a low work
  # rate (bs-2025-guide-wegleitung p. 30, 500/520). packages/rules-bs computes nothing without it
  # when the actual costs are lower than the flat amount.
  - id: work_rate
    key: bs.work_rate
    type: number
    perPerson: true
    min: 1
    max: 100
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Basel-Stadt deducts a flat amount for professional costs (Pauschalabzug für Berufskosten) unless your actual costs are higher. For part-time work at a low work rate, the flat amount is cut in proportion.'
      fr: 'Bâle-Ville déduit un forfait pour frais professionnels (Pauschalabzug für Berufskosten), sauf si vos frais effectifs sont plus élevés. Pour un temps partiel à un taux bas, le forfait est réduit en proportion.'
      de: 'Basel-Stadt zieht einen Pauschalabzug für Berufskosten ab, ausser deine tatsächlichen Kosten sind höher. Bei Teilzeit mit tiefem Beschäftigungsgrad wird die Pauschale anteilig gekürzt.'
      it: 'Basilea Città deduce un importo forfettario per le spese professionali (Pauschalabzug für Berufskosten), a meno che le tue spese effettive siano più alte. Per un lavoro a tempo parziale con un grado di occupazione basso, il forfait viene ridotto in proporzione.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=30'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 30: professional costs, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 30 : frais professionnels, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Berufskosten'
        it: 'Guida fiscale di Basilea Città 2025, p. 30: spese professionali, in tedesco'
    text:
      p1:
        en: 'At what work rate did you work in 2026, in percent of full time?'
        fr: 'À quel taux d’activité avez-vous travaillé en 2026, en pour-cent d’un plein temps ?'
        de: 'Zu welchem Beschäftigungsgrad hast du 2026 gearbeitet, in Prozent einer Vollzeitstelle?'
        it: 'Con quale grado di occupazione hai lavorato nel 2026, in percentuale di un tempo pieno?'
      p2:
        en: 'At what work rate did your spouse or partner work in 2026, in percent of full time?'
        fr: 'À quel taux d’activité votre conjoint ou partenaire a-t-il travaillé en 2026, en pour-cent d’un plein temps ?'
        de: 'Zu welchem Beschäftigungsgrad hat dein Partner oder deine Partnerin 2026 gearbeitet, in Prozent einer Vollzeitstelle?'
        it: 'Con quale grado di occupazione ha lavorato il tuo coniuge o partner nel 2026, in percentuale di un tempo pieno?'
    help:
      en: 'A whole number, 100 for full time. With several jobs, add them up, at most 100. On form B: Beschäftigungsgrad / Pensum in Prozent.'
      fr: 'Un nombre entier, 100 pour un plein temps. Avec plusieurs emplois, additionnez-les, au plus 100. Sur le formulaire B : Beschäftigungsgrad / Pensum in Prozent (taux d’activité).'
      de: 'Eine ganze Zahl, 100 für Vollzeit. Bei mehreren Stellen zusammenzählen, höchstens 100. Auf dem Formular B: Beschäftigungsgrad / Pensum in Prozent.'
      it: 'Un numero intero, 100 per un tempo pieno. Con più impieghi, sommali, al massimo 100. Sul modulo B: Beschäftigungsgrad / Pensum in Prozent.'

