  # Line 680, Beiträge an politische Parteien, and form Z (bs-2025-guide-wegleitung p. 36;
  # bs-2025-form-kzf-krankheit-zuwendung-betreuung p. 2): one limit for the whole return, for the
  # cantonal tax and for the federal tax.
  - id: party
    key: bs.party
    type: money
    when: { key: profile.payments, includes: political_party }
    explain:
      en: 'Membership fees, mandate levies and donations to political parties (Beiträge an politische Parteien) are deducted up to a limit for the whole return, for the cantonal and for the federal tax.'
      fr: 'Les cotisations, contributions de mandat et dons aux partis politiques (Beiträge an politische Parteien) sont déduits jusqu’à une limite pour toute la déclaration, pour l’impôt cantonal et pour l’impôt fédéral.'
      de: 'Mitgliederbeiträge, Mandatsabgaben, Parteisteuern und Zuwendungen an politische Parteien werden bis zu einem Höchstbetrag pro Steuererklärung abgezogen, bei der Kantons- und bei der Bundessteuer.'
      it: 'Le quote sociali, i contributi legati a un mandato e le donazioni ai partiti politici (Beiträge an politische Parteien) si deducono fino a un limite per tutta la dichiarazione, per l’imposta cantonale e per quella federale.'
    learnMore:
      url: 'https://media.bs.ch/original_file/909f72222b7511334f4dc4d1b9aeb74a9f5cc54c/15500-fw-np-ste-25-05-wegleitung-bf-1.pdf#page=36'
      label:
        en: 'Basel-Stadt tax guide 2025, p. 36: political parties, in German'
        fr: 'Guide fiscal de Bâle-Ville 2025, p. 36 : partis politiques, en allemand'
        de: 'Wegleitung zur Steuererklärung 2025, S. 36: Beiträge an politische Parteien'
        it: 'Guida fiscale di Basilea Città 2025, p. 36: partiti politici, in tedesco'
    text:
      en: 'How much did you pay to political parties in 2026, in membership fees and donations?'
      fr: 'Combien avez-vous versé à des partis politiques en 2026, en cotisations et en dons ?'
      de: 'Wie viel hast du 2026 an politische Parteien bezahlt, als Beiträge und Zuwendungen?'
      it: 'Quanto hai versato a partiti politici nel 2026, tra quote sociali e donazioni?'
    help:
      en: 'In CHF, together for your household, 0 if none. On form Z: Beiträge an politische Parteien.'
      fr: 'En CHF, pour votre ménage ensemble, 0 si rien. Sur le formulaire Z : Beiträge an politische Parteien.'
      de: 'In CHF, für deinen Haushalt zusammen, 0, wenn nichts. Auf dem Formular Z: Beiträge an politische Parteien.'
      it: 'In CHF, per tutta la tua economia domestica, 0 se niente. Sul modulo Z: Beiträge an politische Parteien.'

