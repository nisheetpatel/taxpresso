  # From 2026 the pensioners' deduction of the state tax has one table for AHV pensions (770) and
  # one for IV pensions (771), because of the 13th AHV pension (bl-2026-steuererklaerung-form p. 3;
  # bl-2026-wegleitung p. 39 and 40; bl-2026-guide-informationen-neuerungen p. 1).
  - id: pension_kind
    key: bl.pension_kind
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: pension }
    explain:
      en: 'Basel-Landschaft has a deduction for pensioners with a modest income. From 2026 it differs for an old-age pension (AHV-Rente, line 770) and a disability pension (IV-Rente, line 771).'
      fr: 'Bâle-Campagne a une déduction pour les rentiers aux revenus modestes. Dès 2026, elle diffère pour une rente de vieillesse (AHV-Rente, ligne 770) et une rente d’invalidité (IV-Rente, ligne 771).'
      de: 'Basel-Landschaft hat einen Abzug für Rentnerinnen und Rentner mit bescheidenem Einkommen. Ab 2026 ist er für eine Altersrente (AHV-Rente, Ziffer 770) und eine Invalidenrente (IV-Rente, Ziffer 771) verschieden.'
      it: 'Basilea Campagna prevede una deduzione per chi riceve una rendita e ha un reddito modesto. Dal 2026 è diversa per una rendita di vecchiaia (AHV-Rente, riga 770) e una rendita d’invalidità (IV-Rente, riga 771).'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=39'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 39: deduction for AHV pensioners'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 39 : Déduction pour rentiers AVS'
        de: 'Wegleitung zur Steuererklärung 2026, S. 39: Abzug für AHV-Rentnerinnen und -Rentner'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 39: deduzione per chi riceve una rendita AVS'
    text:
      p1:
        en: 'Is your first-pillar pension an old-age pension (AHV) or a disability pension (IV)?'
        fr: 'Votre rente du 1er pilier est-elle une rente de vieillesse (AVS, AHV) ou d’invalidité (AI, IV) ?'
        de: 'Ist deine Rente der 1. Säule eine Altersrente (AHV) oder eine Invalidenrente (IV)?'
        it: 'La tua rendita del 1° pilastro è una rendita di vecchiaia (AVS, AHV) o d’invalidità (AI, IV)?'
      p2:
        en: 'Is your spouse or partner’s first-pillar pension an old-age pension (AHV) or a disability pension (IV)?'
        fr: 'La rente du 1er pilier de votre conjoint ou partenaire est-elle une rente de vieillesse (AVS, AHV) ou d’invalidité (AI, IV) ?'
        de: 'Ist die Rente der 1. Säule deines Partners oder deiner Partnerin eine Altersrente (AHV) oder eine Invalidenrente (IV)?'
        it: 'La rendita del 1° pilastro del tuo coniuge o partner è una rendita di vecchiaia (AVS, AHV) o d’invalidità (AI, IV)?'
    help:
      en: 'The pension statement of the compensation office (Ausgleichskasse) says which.'
      fr: 'L’attestation de rente de la caisse de compensation (Ausgleichskasse) l’indique.'
      de: 'Die Rentenbescheinigung der Ausgleichskasse zeigt es.'
      it: 'Lo indica l’attestazione di rendita della cassa di compensazione (Ausgleichskasse).'
    options:
      - value: ahv
        label:
          {
            en: 'An old-age pension (AHV-Rente)',
            fr: 'Une rente de vieillesse (AHV-Rente)',
            de: 'Eine Altersrente (AHV-Rente)',
            it: 'Una rendita di vecchiaia (AHV-Rente)',
          }
        chip: { en: 'AHV pension', fr: 'Rente AVS', de: 'AHV-Rente', it: 'Rendita AVS' }
      - value: iv
