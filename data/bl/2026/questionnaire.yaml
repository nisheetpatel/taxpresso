            fr: 'Un départ de Suisse (Wegzug ins Ausland)',
            de: 'Ein Wegzug ins Ausland',
            it: 'Una partenza dalla Svizzera (Wegzug ins Ausland)',
          }

  # Church tax (Kirchensteuer): the canton's table gives the parishes' rates for 2026, the Roman
  # Catholic church in percent of the state tax, the Evangelical Reformed and the Christ Catholic
  # churches in percent of the taxable income and wealth (bl-2026-communal-steuerfuesse, footnotes 2
  # and 3). Opt-in: Taxpresso adds it only for a member; packages/rules-bl computes the Roman
  # Catholic church tax and says plainly when it can't compute the others.
  - id: church
    key: bl.church
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Roman Catholic, Evangelical Reformed or Christ Catholic church pay church tax (Kirchensteuer) at their parish’s rate. Taxpresso adds it only for a member.'
      fr: 'Les membres de l’Église catholique romaine, évangélique réformée ou catholique chrétienne paient l’impôt ecclésiastique (Kirchensteuer) au taux de leur paroisse. Taxpresso ne l’ajoute que pour un membre.'
      de: 'Mitglieder der römisch-katholischen, der evangelisch-reformierten oder der christkatholischen Kirche zahlen Kirchensteuer zum Satz ihrer Kirchgemeinde. Taxpresso rechnet sie nur für Mitglieder dazu.'
      it: 'I membri della Chiesa cattolica romana, evangelica riformata o cattolica cristiana pagano l’imposta di culto (Kirchensteuer) all’aliquota della loro parrocchia. Taxpresso la aggiunge solo per chi ne è membro.'
    learnMore:
      url: 'https://statistik.bl.ch/web_portal/18_4'
      label:
        en: 'Communal and church tax rates 2022 to 2026 (statistik.bl.ch)'
        fr: 'Coefficients communaux et taux des impôts ecclésiastiques 2022 à 2026 (statistik.bl.ch)'
        de: 'Steuerfüsse und Steuersätze der Einwohner- und Kirchgemeinden 2022 bis 2026 (statistik.bl.ch)'
        it: 'Moltiplicatori comunali e aliquote dell’imposta di culto dal 2022 al 2026 (statistik.bl.ch)'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these churches?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces Églises ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026 eri membro di una di queste Chiese?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these churches?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces Églises ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026 il tuo coniuge o partner era membro di una di queste Chiese?'
    help:
      en: 'Another religion, or none, pays no church tax.'
      fr: 'Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique.'
      de: 'Eine andere Religion oder keine zahlt keine Kirchensteuer.'
      it: 'Con un’altra religione, o senza religione, non si paga l’imposta di culto.'
    options:
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
            it: 'Cattolica romana (römisch-katholisch)',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch', it: 'Chiesa cattolica' }
      - value: reformed
        label:
          {
            en: 'Evangelical Reformed (evangelisch-reformiert)',
            fr: 'Évangélique réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
            it: 'Evangelica riformata (evangelisch-reformiert)',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert', it: 'Chiesa riformata' }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique chrétienne (christkatholisch)',
            de: 'Christkatholisch',
            it: 'Cattolica cristiana (christkatholisch)',
          }
        chip:
          {
            en: 'Christ Catholic',
            fr: 'Catholique chrétien(ne)',
            de: 'Christkatholisch',
            it: 'Chiesa cattolica cristiana',
          }
      - value: none
        label:
          {
            en: 'None of these',
            fr: 'Aucune de ces Églises',
            de: 'Keine davon',
            it: 'Nessuna di queste',
          }

