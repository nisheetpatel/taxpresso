  # Basel-Landschaft counts the kilometres only for one of its reasons: no public transport, the car
  # used at work at the employer's request, illness or frailty, a stop more than 1.5 km away, or
  # more than 2 1/2 hours a day by public transport (bl-2026-wegleitung p. 25); otherwise what public
  # transport would have cost.
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. The kilometres count only if you had a reason: no public transport for the trip, the car needed at work at your employer’s request, a health reason, a stop more than 1.5 km from your home or workplace, or over two and a half hours a day by public transport.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent que si vous aviez une raison : pas de transport public pour ce trajet, la voiture nécessaire au travail à la demande de l’employeur, une raison de santé, un arrêt à plus de 1,5 km de votre domicile ou de votre lieu de travail, ou plus de deux heures et demie par jour en transports publics.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur mit einem Grund: kein öffentliches Verkehrsmittel für diesen Weg, das Auto während der Arbeitszeit auf Verlangen der Arbeitgeberfirma, ein gesundheitlicher Grund, eine Haltestelle mehr als 1,5 km von Wohn- oder Arbeitsort, oder mehr als zweieinhalb Stunden pro Tag mit dem öffentlichen Verkehr.'
      it: 'Chi guida deduce quanto sarebbero costati i trasporti pubblici, per entrambe le imposte. I chilometri contano solo se avevi un motivo: nessun trasporto pubblico per quel tragitto, l’auto necessaria al lavoro su richiesta del datore di lavoro, un motivo di salute, una fermata a più di 1,5 km da casa o dal luogo di lavoro, o più di due ore e mezza al giorno con i trasporti pubblici.'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=25'
