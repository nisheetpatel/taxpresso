  # Meals away from home (510/515, Mehrkosten für auswärtige Verpflegung), for both taxes:
  # bl-2026-wegleitung p. 27.
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work costs more than at home (Mehrkosten für auswärtige Verpflegung). A fixed amount per day counts for both taxes, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison (Mehrkosten für auswärtige Verpflegung). Un montant fixe par jour compte pour les deux impôts, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen wegen der Arbeit kostet mehr als zu Hause (Mehrkosten für auswärtige Verpflegung). Für beide Steuern zählt ein fester Betrag pro Tag, bis zu einem jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
      it: 'Pranzare fuori casa per lavoro costa più che a casa (Mehrkosten für auswärtige Verpflegung). Un importo fisso al giorno conta per entrambe le imposte, fino a un limite annuo, e la metà se il tuo datore di lavoro paga una parte dei tuoi pasti (casella G del certificato di salario).'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=27'
