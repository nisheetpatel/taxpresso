# Basel-Landschaft questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data,
# not code: packages/questionnaire reads it, and every key and value must exist in Basel-Landschaft's
# keys (packages/rules-bl, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Basel-Landschaft return (bl-2026-steuererklaerung-form, p. 1 to 4), with Basel-Landschaft's
# own explanations and official pages. The questions only Basel-Landschaft asks are written out
# here, as packages/rules-bl reads them (BaselLandCantonal): who mainly bears the upkeep of children
# in shared custody without child support, whether each child has taxable income of its own (the
# form's column "stb. Einkommen vorhanden?"), the childcare paid for each child (the limit is per
# child), the commune and the move, each adult's church, and each pensioner's kind of pension (AHV
# or IV, 770 and 771 from 2026).
#
# Wording and documents follow the Basel-Landschaft guide for 2026 (bl-2026-wegleitung, the edition
# of 20 March 2026); "p." is the page of the PDF file, as in the links, and the guide prints the
# same page numbers. The return and the guide are in German: the questions give the German term
# next to the gloss.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place:
  { en: 'Basel-Landschaft', fr: 'Bâle-Campagne', de: 'Basel-Landschaft', it: 'Basilea Campagna' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du', it: 'Tu' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
      it: 'Il tuo coniuge o partner',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner', it: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}', it: 'Figlio {n}' }

# E-Tax BL is the canton's online return, at etax.bl.ch (docs/sources/bl/NOTES.md, Filing channels;
# bl-na-efiling-verordnung-331-21 § 1). No document of the library says it is free, so the text
# doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. E-Tax BL, the canton’s online return (etax.bl.ch), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. E-Tax BL, la déclaration en ligne du canton (etax.bl.ch), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. E-Tax BL, die Online-Steuererklärung des Kantons (etax.bl.ch), oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Possono farlo E-Tax BL, la dichiarazione online del Cantone (etax.bl.ch), o una fiduciaria.'

questions:
  - use: canton

  # bl-2026-wegleitung p. 3 (registered partners are taxed as married couples; marriage, divorce
  # and separation in the year).
  - use: civil_status
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=3'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 3: marriage, partnership, separation'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 3 : Mariage, partenariat, séparation'
        de: 'Wegleitung zur Steuererklärung 2026, S. 3: Heirat, Partnerschaft, Trennung'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 3: matrimonio, unione domestica, separazione'
    help:
      en: 'A registered partnership files like a married couple, on one return.'
      fr: 'Un partenariat enregistré déclare comme un couple marié, sur une seule déclaration.'
      de: 'Eine eingetragene Partnerschaft füllt wie ein Ehepaar eine gemeinsame Steuererklärung aus.'
      it: 'Un’unione domestica registrata compila una sola dichiarazione, come una coppia sposata.'

  # bl-2026-wegleitung p. 37 (750, Abzug für Kinder: minors, or children in training or unable to
  # work, in your parental care); page 1 of the return lists them (bl-2026-steuererklaerung-form
  # p. 1).
  - use: children
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=37'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 37: children'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 37 : Enfants'
        de: 'Wegleitung zur Steuererklärung 2026, S. 37: Abzug für Kinder'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 37: figli'
    help:
      en: 'Minors, and children in training whose upkeep you mainly bear. On page 1 of the return: Minderjährige oder in beruflicher Ausbildung stehende Kinder.'
      fr: 'Les mineurs, et les enfants en formation dont vous assumez l’essentiel de l’entretien. En page 1 de la déclaration : Minderjährige oder in beruflicher Ausbildung stehende Kinder (enfants mineurs ou en formation).'
      de: 'Minderjährige und Kinder in Ausbildung, deren Unterhalt du zur Hauptsache bestreitest. Auf Seite 1 der Steuererklärung: Minderjährige oder in beruflicher Ausbildung stehende Kinder.'
      it: 'I figli minorenni e i figli in formazione al cui mantenimento provvedi principalmente. A pagina 1 della dichiarazione: Minderjährige oder in beruflicher Ausbildung stehende Kinder.'

  # bl-2026-wegleitung p. 37 (the child reduction needs a common household); the return asks "In
  # Ihrem Haushalt lebend?" for each child (bl-2026-steuererklaerung-form p. 1).
  - use: children_custody
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=37'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 37: children'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 37 : Enfants'
        de: 'Wegleitung zur Steuererklärung 2026, S. 37: Abzug für Kinder'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 37: figli'
    help:
      en: 'On page 1 of the return, for each child: In Ihrem Haushalt lebend? (living in your household).'
      fr: 'En page 1 de la déclaration, pour chaque enfant : In Ihrem Haushalt lebend? (vivant dans votre ménage).'
      de: 'Auf Seite 1 der Steuererklärung, für jedes Kind: In Ihrem Haushalt lebend?'
      it: 'A pagina 1 della dichiarazione, per ogni figlio: In Ihrem Haushalt lebend? (vive nella tua economia domestica).'

  # Parents taxed apart with joint custody: for the federal tax, half the child deduction each
  # without child support, the parental scale to the one who earns more (bl-2026-wegleitung p. 37;
  # ch-na-circulaire-30-epoux-famille p. 24); for the state tax, the children count for the parent
  # who receives child support or, without it, mainly bears their upkeep (bl-na-steuerbuch p. 211 to
  # 213, 34 Nr. 1, Ziffer 5 and 7).
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it counts them; without child support, the state tax counts them for the parent who mainly bears their upkeep, and the federal tax gives each parent half the child deduction and the parental scale (Elterntarif), a lower rate, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit les compte ; sans contribution, l’impôt cantonal les compte pour le parent qui assume l’essentiel de leur entretien, et l’impôt fédéral donne à chacun la moitié de la déduction pour enfant et le barème parental (Elterntarif), un taux plus bas, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, zählt die Kinder; ohne Unterhaltsbeiträge zählt die Staatssteuer sie für den Elternteil, der ihren Unterhalt zur Hauptsache bestreitet, und die Bundessteuer gibt jedem den halben Kinderabzug und den Elterntarif, einen tieferen Satz, dem, der mehr verdient.'
      it: 'Con la custodia alternata, sono i contributi di mantenimento a decidere chi conta i figli. Il genitore che li riceve li conta; senza contributi di mantenimento, l’imposta cantonale li conta per il genitore che provvede principalmente al loro mantenimento, e l’imposta federale dà a ogni genitore metà della deduzione per i figli, e la tariffa per i genitori (Elterntarif), un’aliquota più bassa, a chi guadagna di più.'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=37'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 37: children of parents taxed apart'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 37 : Enfants de parents taxés séparément'
        de: 'Wegleitung zur Steuererklärung 2026, S. 37: Kinder getrennt besteuerter Eltern'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 37: figli di genitori tassati separatamente'
    help:
      en: 'Child support (Unterhaltsbeiträge, Alimente) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge, Alimente) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge (Alimente) sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'
      it: 'I contributi di mantenimento (Unterhaltsbeiträge, Alimente) sono un importo regolare per i figli, fissato da una sentenza o da una convenzione. Guadagnare di più significa avere un reddito netto più alto.'

  # StG § 34 Abs. 4 (bl-na-steuergesetz-331 p. 28): the child counts for the parent who mainly bears
  # its upkeep; the canton's practice gives it, without child support, to the parent with the
  # higher income (bl-na-steuerbuch p. 212 and 213, 34 Nr. 1, Ziffer 7). packages/rules-bl asks
  # rather than guess (NOTE.mainUpkeep).
  - id: main_upkeep
    key: bl.main_upkeep
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'With shared custody and no child support, Basel-Landschaft counts the children for the parent who mainly bears their upkeep (Unterhalt zur Hauptsache): that parent gets the child reduction (Kinderabzug), the lower rate of Vollsplitting and the higher tax-free wealth. In practice, it is the parent with the higher income.'
      fr: 'En garde partagée sans contribution d’entretien, Bâle-Campagne compte les enfants pour le parent qui assume l’essentiel de leur entretien (Unterhalt zur Hauptsache) : ce parent a la réduction pour enfant (Kinderabzug), le taux plus bas du Vollsplitting et la fortune exonérée plus élevée. En pratique, c’est le parent au revenu le plus élevé.'
      de: 'Bei geteilter Obhut ohne Unterhaltsbeiträge zählt Basel-Landschaft die Kinder für den Elternteil, der ihren Unterhalt zur Hauptsache bestreitet: Er erhält den Kinderabzug, den tieferen Satz des Vollsplittings und den höheren steuerfreien Betrag auf dem Vermögen. In der Praxis ist es der Elternteil mit dem höheren Einkommen.'
      it: 'Con la custodia alternata e senza contributi di mantenimento, Basilea Campagna conta i figli per il genitore che provvede principalmente al loro mantenimento (Unterhalt zur Hauptsache): questo genitore riceve la riduzione per i figli (Kinderabzug), l’aliquota più bassa del Vollsplitting e la quota di sostanza esente più alta. In pratica, è il genitore con il reddito più alto.'
    learnMore:
      url: 'https://kanton.baselland.ch/finanz-und-kirchendirektion/steuerverwaltung-steuerbuch/downloads-1/steuerbuch_bl_band1.pdf#page=211'
      label:
        en: 'Basel-Landschaft tax handbook (Steuerbuch), p. 211: children of parents taxed apart'
        fr: 'Manuel fiscal de Bâle-Campagne (Steuerbuch), p. 211 : Enfants de parents taxés séparément'
        de: 'Baselbieter Steuerbuch, S. 211: Kinder getrennt besteuerter Eltern'
        it: 'Manuale fiscale di Basilea Campagna (Steuerbuch), p. 211: figli di genitori tassati separatamente'
    text:
      en: 'In 2026, did you mainly bear the children’s upkeep (Unterhalt zur Hauptsache)?'
      fr: 'En 2026, assumiez-vous l’essentiel de l’entretien des enfants (Unterhalt zur Hauptsache) ?'
      de: 'Hast du 2026 den Unterhalt der Kinder zur Hauptsache bestritten?'
      it: 'Nel 2026 hai provveduto principalmente al mantenimento dei figli (Unterhalt zur Hauptsache)?'
    help:
      en: 'Page 1 of the return lists the children whose upkeep you mainly bear. Not sure? Your last assessment shows whether you got the child reduction.'
      fr: 'La page 1 de la déclaration liste les enfants dont vous assumez l’essentiel de l’entretien. Un doute ? Votre dernière taxation indique si vous avez eu la réduction pour enfant.'
      de: 'Seite 1 der Steuererklärung listet die Kinder, deren Unterhalt du zur Hauptsache bestreitest. Unsicher? Deine letzte Veranlagung zeigt, ob du den Kinderabzug erhalten hast.'
      it: 'A pagina 1 della dichiarazione sono elencati i figli al cui mantenimento provvedi principalmente. Hai un dubbio? La tua ultima decisione di tassazione mostra se hai ricevuto la riduzione per i figli.'
    chip:
      {
        en: 'Bears the upkeep',
        fr: 'Assume l’entretien',
        de: 'Bestreitet den Unterhalt',
        it: 'Provvede al mantenimento',
      }

  # The 2026 return asks for each child: "stb. Einkommen vorhanden?" (bl-2026-steuererklaerung-form
  # p. 1). The child reduction falls away when the child's own income is above the tax-free amount
  # (bl-na-steuergesetz-331 § 34 Abs. 4, p. 28; bl-2026-wegleitung p. 37).
  - id: child_income
    key: bl.child_income
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Basel-Landschaft takes an amount off your income tax for each child (Kinderabzug vom Steuerbetrag), unless the child’s own taxable income, an apprentice’s wage for example, is above the tax-free amount (steuerfreier Betrag) of the state tax.'
      fr: 'Bâle-Campagne déduit un montant de votre impôt sur le revenu pour chaque enfant (Kinderabzug vom Steuerbetrag), sauf si le revenu imposable propre de l’enfant, un salaire d’apprenti par exemple, dépasse le montant exonéré (steuerfreier Betrag) de l’impôt cantonal.'
      de: 'Basel-Landschaft zieht für jedes Kind einen Betrag von deiner Einkommenssteuer ab (Kinderabzug vom Steuerbetrag), ausser das eigene steuerbare Einkommen des Kindes, zum Beispiel ein Lehrlingslohn, liegt über dem steuerfreien Betrag der Staatssteuer.'
      it: 'Basilea Campagna toglie un importo dalla tua imposta sul reddito per ogni figlio (Kinderabzug vom Steuerbetrag), a meno che il reddito imponibile del figlio stesso, per esempio un salario da apprendista, superi l’importo esente (steuerfreier Betrag) dell’imposta cantonale.'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=37'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 37: children'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 37 : Enfants'
        de: 'Wegleitung zur Steuererklärung 2026, S. 37: Abzug für Kinder'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 37: figli'
    text:
      en: 'In 2026, did child {n} have taxable income of their own above the tax-free amount (steuerfreier Betrag)?'
      fr: 'En 2026, l’enfant {n} avait-il un revenu imposable propre au-dessus du montant exonéré (steuerfreier Betrag) ?'
      de: 'Hatte Kind {n} 2026 ein eigenes steuerbares Einkommen über dem steuerfreien Betrag?'
      it: 'Nel 2026 il figlio {n} aveva un reddito imponibile proprio superiore all’importo esente (steuerfreier Betrag)?'
    help:
      en: 'Most children have none. On page 1 of the return, for child {n}: stb. Einkommen vorhanden? Number your children the same way in every answer, for example from the oldest.'
      fr: 'La plupart des enfants n’en ont pas. En page 1 de la déclaration, pour l’enfant {n} : stb. Einkommen vorhanden? (revenu imposable ?). Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Die meisten Kinder haben keines. Auf Seite 1 der Steuererklärung, für Kind {n}: stb. Einkommen vorhanden? Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'La maggior parte dei figli non ne ha. A pagina 1 della dichiarazione, per il figlio {n}: stb. Einkommen vorhanden? Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'

  # bl-2026-wegleitung p. 32 (640, Abzug für Kinderbetreuung durch Drittpersonen: children under 14
  # living with you, while you work; meals don't count; subsidies come off first).
  - use: childcare
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=32'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 32: childcare'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 32 : Frais de garde'
        de: 'Wegleitung zur Steuererklärung 2026, S. 32: Kinderbetreuung durch Drittpersonen'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 32: custodia dei figli'
    help:
      en: 'A crèche (KiTa), day care or a nanny, for a child under 14, while you work or train. Meals don’t count, and any subsidy comes off the invoice first. On the return: 640, Kinderbetreuung durch Dritte.'
      fr: 'Une crèche (KiTa), une garderie ou une nourrice, pour un enfant de moins de 14 ans, pendant que vous travaillez ou êtes en formation. Les repas ne comptent pas, et une subvention se déduit d’abord de la facture. Sur la déclaration : 640, Kinderbetreuung durch Dritte (garde par des tiers).'
      de: 'Eine KiTa, ein Hort oder eine Nanny, für ein Kind unter 14, während du arbeitest oder in Ausbildung bist. Mahlzeiten zählen nicht, und Subventionen gehen zuerst von der Rechnung ab. Auf der Steuererklärung: 640, Kinderbetreuung durch Dritte.'
      it: 'Un asilo nido (KiTa), un centro extrascolastico o una tata, per un figlio sotto i 14 anni, mentre lavori o sei in formazione. I pasti non contano, e gli eventuali sussidi vanno prima tolti dalla fattura. Nella dichiarazione: 640, Kinderbetreuung durch Dritte.'

  # The limit is per child (bl-na-steuergesetz-331 § 29 Abs. 1 lit. c, p. 23; bl-2026-wegleitung
  # p. 32), and the return asks for each child whether it is looked after by others
  # (bl-2026-steuererklaerung-form p. 1). With several children, how the invoices' total splits can
  # decide the deduction: asked per child.
  - id: child_care
    key: bl.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Basel-Landschaft’s limit on childcare is per child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'La limite de Bâle-Campagne pour les frais de garde est par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Der Höchstbetrag für die Kinderbetreuung gilt in Basel-Landschaft pro Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
      it: 'In Basilea Campagna il limite per la custodia dei figli vale per ogni figlio: la ripartizione tra i tuoi figli può cambiare la deduzione. Le tue fatture danno il totale.'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=32'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 32: childcare'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 32 : Frais de garde'
        de: 'Wegleitung zur Steuererklärung 2026, S. 32: Kinderbetreuung durch Drittpersonen'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 32: custodia dei figli'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Kosten der Kinderbetreuung war für Kind {n}?'
      it: 'Quanto delle spese di custodia che hai pagato nel 2026 era per il figlio {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'In CHF, 0 se il figlio {n} non ne ha avute. Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'

  # The commune of 31 December taxes the whole year; a move inside the canton does not split the
  # communal tax (bl-2026-wegleitung p. 3). The list is Basel-Landschaft's 86 communes of 2026 by
  # name (packages/rules-bl, from bl-2026-communal-steuerfuesse; the table has no BFS numbers). Each
  # commune levies its tax in percent of the state tax (StG § 18bis and § 19 Abs. 2,
  # bl-na-steuergesetz-331 p. 11).
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year. Each commune sets its own Steuerfuss, a percentage of the state tax (Staatssteuer).'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année. Chaque commune fixe son propre coefficient (Steuerfuss), un pourcentage de l’impôt cantonal (Staatssteuer).'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr. Jede Gemeinde legt ihren eigenen Steuerfuss fest, einen Prozentsatz der Staatssteuer.'
      it: 'Il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Ogni Comune fissa il proprio moltiplicatore d’imposta (Steuerfuss), una percentuale dell’imposta cantonale (Staatssteuer).'
    learnMore:
      url: 'https://statistik.bl.ch/web_portal/18_4'
      label:
        en: 'Communal and church tax rates 2022 to 2026 (statistik.bl.ch)'
        fr: 'Coefficients communaux et taux des impôts ecclésiastiques 2022 à 2026 (statistik.bl.ch)'
        de: 'Steuerfüsse und Steuersätze der Einwohner- und Kirchgemeinden 2022 bis 2026 (statistik.bl.ch)'
        it: 'Moltiplicatori comunali e aliquote dell’imposta di culto dal 2022 al 2026 (statistik.bl.ch)'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
      it: 'In quale Comune abitavi il 31 dicembre 2026?'
    help:
      en: 'The official name, such as Liestal, Allschwil or Münchenstein.'
      fr: 'Le nom officiel, par exemple Liestal, Allschwil ou Münchenstein.'
      de: 'Der offizielle Name, zum Beispiel Liestal, Allschwil oder Münchenstein.'
      it: 'Il nome ufficiale, per esempio Liestal, Allschwil o Münchenstein.'

  # Who files in Basel-Landschaft: everyone living in the canton on 31 December; arriving from
  # another canton, the whole year is declared here (bl-2026-wegleitung p. 3 and 4). Arriving from
  # abroad or leaving Switzerland means a return for part of the year (p. 4 and 5, unterjährige
  # Steuerpflicht): not covered by rules-bl.
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Basel-Landschaft taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Bâle-Campagne vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Basel-Landschaft besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
      it: 'Un trasloco all’interno del Cantone non cambia niente: il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Neanche un arrivo da un altro Cantone cambia qualcosa: Basilea Campagna ti tassa per tutto l’anno, come se avessi abitato qui da gennaio. Un arrivo dall’estero, o una partenza dalla Svizzera, significa che qui le imposte riguardano solo una parte dell’anno.'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=3'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 3: who files a return'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 3 : Obligation de déclarer'
        de: 'Wegleitung zur Steuererklärung 2026, S. 3: Wer hat eine Steuererklärung einzureichen?'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 3: chi deve presentare la dichiarazione'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
      it: 'Hai traslocato nel 2026?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein', it: 'No' } }
      - value: within_bl
        label:
          {
            en: 'Yes, within Basel-Landschaft',
            fr: 'Oui, dans le canton de Bâle-Campagne',
            de: 'Ja, innerhalb des Kantons Basel-Landschaft',
            it: 'Sì, all’interno di Basilea Campagna',
          }
        chip:
          {
            en: 'Moved in the canton',
            fr: 'Déménagé dans le canton',
            de: 'Umzug im Kanton',
            it: 'Trasloco nel Cantone',
          }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
            it: 'Sì, da un altro Cantone',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
            it: 'Arrivo da un altro Cantone',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
            it: 'Sì, sono arrivato o arrivata dall’estero',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
            it: 'Un arrivo dall’estero durante l’anno (Zuzug aus dem Ausland)',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
            it: 'Ho lasciato la Svizzera, o la sto lasciando',
          }
        notSupported:
