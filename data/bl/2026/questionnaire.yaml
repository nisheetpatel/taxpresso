  # Travel to work (500/505, Fahrtkosten zwischen Wohn- und Arbeitsstätte) for both taxes, each up to
  # its own yearly limit: bl-2026-wegleitung p. 25 and 26; ch-2026-ifd-instructions-personnes-
  # physiques p. 6. No "over 2 hours a day" choice: only Geneva's meal rule needs it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrtkosten), for the state and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrtkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrtkosten abgezogen, bei der Staats- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto per andare al lavoro si deduce come spese di trasporto (Fahrtkosten), per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo. Il mezzo che usi decide come vengono contate.'
    learnMore:
      url: 'https://bl-api.webcloud7.ch/politik-und-behorden/direktionen/finanz-und-kirchendirektion/steuerverwaltung/onlineformulare-merkblaetter-formulare-wegleitungen/unselbstaendigerwerbende-2026/wegleitung-zur-steuererklaerung-2026_int_2_w_2026_260320.pdf#page=25'
      label:
        en: 'Basel-Landschaft tax guide 2026, p. 25: travel to work'
        fr: 'Guide fiscal de Bâle-Campagne 2026, p. 25 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2026, S. 25: Fahrtkosten'
        it: 'Guida fiscale di Basilea Campagna 2026, p. 25: tragitto casa-lavoro'
    help:
      en: 'Choose how you went on most work days. On the return: 500, Fahrtkosten zwischen Wohn- und Arbeitsstätte.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur la déclaration : 500, Fahrtkosten zwischen Wohn- und Arbeitsstätte (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf der Steuererklärung: 500, Fahrtkosten zwischen Wohn- und Arbeitsstätte.'
      it: 'Scegli come ci andavi nella maggior parte dei giorni di lavoro. Nella dichiarazione: 500, Fahrtkosten zwischen Wohn- und Arbeitsstätte.'
    options:
      - value: public_transport
        label:
