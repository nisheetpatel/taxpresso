        it: 'Guida fiscale di Argovia 2025, p. 22: trasporto con l’automobile'
    help:
      en: 'Leave out holidays, sick days and days worked from home (Homeoffice).'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail (Homeoffice).'
      de: 'Ohne Ferien, Krankheitstage und Tage im Homeoffice.'
      it: 'Escludi le vacanze, i giorni di malattia e i giorni di lavoro da casa (Homeoffice).'

  # Meals away from home (10.2, Mehrkosten der auswärtigen Verpflegung), for both taxes:
  # ag-2025-guide-wegleitung p. 22 and 23.
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work costs more than at home (Mehrkosten der auswärtigen Verpflegung). A fixed amount per day counts for both taxes, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison (Mehrkosten der auswärtigen Verpflegung). Un montant fixe par jour compte pour les deux impôts, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen wegen der Arbeit kostet mehr als zu Hause (Mehrkosten der auswärtigen Verpflegung). Für beide Steuern zählt ein fester Betrag pro Tag, bis zu einem jährlichen Höchstbetrag, die Hälfte davon, wenn deine Arbeitgeberfirma einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
      it: 'Il pranzo fuori casa a causa del lavoro costa più che a casa (Mehrkosten der auswärtigen Verpflegung). Un importo fisso al giorno conta per entrambe le imposte, fino a un limite annuo, la metà quando il datore di lavoro paga una parte dei tuoi pasti (casella G del tuo certificato di salario).'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=23'
      label:
        en: 'Aargau tax guide 2025, p. 23: meals'
        fr: 'Guide fiscal argovien 2025, p. 23 : Frais de repas'
        de: 'Wegleitung zur Steuererklärung 2025, S. 23: Mehrkosten der auswärtigen Verpflegung'
        it: 'Guida fiscale di Argovia 2025, p. 23: pasti'

