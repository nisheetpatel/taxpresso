  # In some communes a further parish (Zusatzkirche) of the Reformed or the Roman Catholic church
  # levies another church tax rate in part of the commune (ag-2026-communal-steuerfuesse p. 9; the
  # list doesn't say which streets belong to it). Asked only there, and only of a member of a church
  # with a further parish in the commune; each option is offered only in its own commune and, for a
  # further parish, to a member of its church. Generated once from packages/rules-ag
  # (parishOptions(2026)); a test keeps this list and the condition equal to it.
  - id: parish
    key: ag.parish
    group: detail
    type: choice
    when:
      any:
        - all:
            - {
                key: profile.commune,
                in:
                  [
                    'aarau',
                    'bottstein',
                    'brugg-ag',
                    'fisibach',
                    'leuggern',
                    'mettauertal',
                    'schinznach',
                    'untersiggenthal',
                    'villmergen',
                  ],
              }
            - { key: ag.church, in: [reformed], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['baden', 'zurzach'] }
            - { key: ag.church, in: [catholic, reformed], anyPerson: true }
        - all:
            - {
                key: profile.commune,
                in:
                  [
                    'boswil',
                    'bremgarten-ag',
                    'kaisten',
                    'kallern',
                    'laufenburg',
                    'oftringen',
                    'sins',
                  ],
              }
            - { key: ag.church, in: [catholic], anyPerson: true }
    explain:
      en: 'In part of your commune, a further parish of your church (Zusatzkirche) levies another church tax rate. Choose the parish you belonged to on 31 December. The names are those of the canton’s list.'
      fr: 'Dans une partie de votre commune, une paroisse supplémentaire de votre Église (Zusatzkirche) prélève un autre taux d’impôt ecclésiastique. Choisissez la paroisse à laquelle vous apparteniez au 31 décembre. Les noms sont ceux de la liste du canton.'
      de: 'In einem Teil deiner Gemeinde erhebt eine Zusatzkirche deiner Kirche einen anderen Kirchensteuerfuss. Wähl die Kirchgemeinde, zu der du am 31. Dezember gehört hast. Die Namen sind die der Liste des Kantons.'
      it: 'In una parte del tuo Comune, un’altra parrocchia della tua chiesa (Zusatzkirche) applica un altro moltiplicatore dell’imposta di culto. Scegli la parrocchia a cui appartenevi il 31 dicembre. I nomi sono quelli dell’elenco del Cantone.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuerberechnung-tarife-natuerliche-personen/gemeinde-und-kirchensteuerf-sse-2026-v5.pdf#page=9'
