  # Aargau deducts a flat amount for insurance premiums whatever was paid (ag-2025-guide-wegleitung
  # p. 27, 14) and eTAX AARGAU asks for no premium attestation (ag-2025-efiling-belege-online); the
  # federal tax counts what was paid, up to its own maximum (p. 42; LIFD art. 33 al. 1 let. g), and
  # Taxpresso's federal estimate rests on the attestation.
  - use: health_premiums
    explain:
      en: 'Aargau deducts a flat amount for insurance premiums, whatever you paid. The federal tax counts what you paid, up to its own limit: Taxpresso needs your insurer’s yearly statement for it. One family statement can cover several people.'
      fr: 'Argovie déduit un forfait pour les primes d’assurance, quel que soit le montant payé. L’impôt fédéral compte ce que vous avez payé, jusqu’à sa propre limite : Taxpresso a besoin du relevé annuel de votre assureur pour lui. Un relevé familial peut couvrir plusieurs personnes.'
      de: 'Aargau zieht für Versicherungsprämien einen Pauschalbetrag ab, egal wie viel du bezahlt hast. Die Bundessteuer zählt, was du bezahlt hast, bis zu ihrem eigenen Höchstbetrag: Taxpresso braucht dafür die Jahresbescheinigung deiner Krankenkasse. Eine Familienbescheinigung kann mehrere Personen abdecken.'
      it: 'Argovia deduce un importo forfettario per i premi assicurativi, qualunque cosa tu abbia pagato. L’imposta federale conta quello che hai pagato, fino al proprio limite: per questo Taxpresso ha bisogno dell’attestazione annuale della tua assicurazione. Un’attestazione di famiglia può coprire più persone.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=27'
      label:
        en: 'Aargau tax guide 2025, p. 27: insurance premiums'
        fr: 'Guide fiscal argovien 2025, p. 27 : Primes d’assurances'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Versicherungsprämien und Zinsen von Sparkapitalien'
        it: 'Guida fiscale di Argovia 2025, p. 27: premi assicurativi'
    reason:
      {
        en: 'For the federal tax: your insurer’s annual attestation.',
        fr: 'Pour l’impôt fédéral : l’attestation annuelle de votre assureur.',
        de: 'Für die Bundessteuer: die Jahresbescheinigung deiner Krankenkasse.',
        it: 'Per l’imposta federale: l’attestazione annuale della tua assicurazione.',
      }
    source: 'ag-2025-guide-wegleitung p. 27, p. 42'

