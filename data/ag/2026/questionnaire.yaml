  # People taxed at source (Quellensteuer) file an ordinary return only when they must or ask for it
  # by 31 March of the next year (nachträgliche ordentliche Veranlagung, NOV):
  # ag-na-source-tax-quellensteuerpflichtige-personen. Not covered by rules-ag.
  - use: taxed_at_source
    yesNotSupported:
