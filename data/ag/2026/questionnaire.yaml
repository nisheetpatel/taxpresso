    help:
      en: 'A voluntary payment on top of the usual contributions. Count only a buy-in your salary certificate doesn’t show. On the return: 13.1, Einkäufe Säule 2.'
      fr: 'Un versement volontaire en plus des cotisations habituelles. Ne comptez qu’un rachat que votre certificat de salaire n’indique pas. Sur la déclaration : 13.1, Einkäufe Säule 2 (rachats au 2e pilier).'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen. Zähl nur einen Einkauf, den dein Lohnausweis nicht zeigt. Auf der Steuererklärung: 13.1, Einkäufe Säule 2.'
      it: 'Un versamento volontario oltre ai contributi abituali. Conta solo un riscatto che il tuo certificato di salario non mostra. Nella dichiarazione: 13.1, Einkäufe Säule 2.'

  # Travel to work (10.1, Fahrtkosten zwischen Wohn- und Arbeitsstätte) for both taxes, each up to its
  # own yearly limit: ag-2025-guide-wegleitung p. 22; ch-2026-ifd-instructions-personnes-physiques
  # p. 6. No "over 2 hours a day" choice: only Geneva's meal rule needs it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrtkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrtkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrtkosten abgezogen, bei den Kantons- und Gemeindesteuern und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto per andare al lavoro si deduce come spese di trasporto (Fahrtkosten), per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo. Il mezzo che usi decide come vengono contate.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=22'
      label:
        en: 'Aargau tax guide 2025, p. 22: travel to work'
        fr: 'Guide fiscal argovien 2025, p. 22 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 22: Fahrtkosten zwischen Wohn- und Arbeitsstätte'
        it: 'Guida fiscale di Argovia 2025, p. 22: spese di trasporto per recarsi al lavoro'
    help:
      en: 'Choose how you went on most work days. On the return: 10.1, Fahrtkosten zwischen Wohn- und Arbeitsstätte.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur la déclaration : 10.1, Fahrtkosten zwischen Wohn- und Arbeitsstätte (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf der Steuererklärung: 10.1, Fahrtkosten zwischen Wohn- und Arbeitsstätte.'
      it: 'Scegli come ci sei andato nella maggior parte dei giorni di lavoro. Nella dichiarazione: 10.1, Fahrtkosten zwischen Wohn- und Arbeitsstätte.'
    options:
      - value: public_transport
        label:
          {
            en: 'Public transport',
            fr: 'Transports publics',
            de: 'Öffentlicher Verkehr',
            it: 'Trasporti pubblici',
          }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto', it: 'Automobile' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
            it: 'Motocicletta o scooter con targa bianca',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Motorfahrrad mit gelbem Kontrollschild',
            it: 'Bicicletta, bicicletta elettrica o ciclomotore con targa gialla',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss', it: 'A piedi' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
            it: 'Da casa, quasi tutti i giorni',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice', it: 'Lavora da casa' }

  # ag-2025-guide-wegleitung p. 22 (10.1: public transport, the actual costs, as a rule a season
  # ticket).
  - use: commute_transit_cost
    explain:
      en: 'You deduct the public transport you paid to get to work, for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez les transports publics payés pour aller au travail, pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst den bezahlten öffentlichen Verkehr zur Arbeit ab, bei den Kantons- und Gemeindesteuern und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Deduci i trasporti pubblici che hai pagato per andare al lavoro, per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=22'
      label:
        en: 'Aargau tax guide 2025, p. 22: travel to work'
        fr: 'Guide fiscal argovien 2025, p. 22 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 22: Fahrtkosten zwischen Wohn- und Arbeitsstätte'
        it: 'Guida fiscale di Argovia 2025, p. 22: spese di trasporto per recarsi al lavoro'

  # Aargau counts the kilometres only for one of its reasons: no public transport at the start or the
  # end of work, more than an hour a day saved, the car needed at work at the employer's request and
  # cost, or health (ag-2025-guide-wegleitung p. 22); otherwise what public transport would have
  # cost.
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. The kilometres count only if you had a reason: no public transport for the trip, or none when work starts or ends, more than an hour a day saved by car, the car used all day for work at your employer’s request, or a health reason.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent que si vous aviez une raison : pas de transport public pour ce trajet, ou aucun au début ou à la fin du travail, plus d’une heure gagnée par jour en voiture, la voiture utilisée toute la journée pour le travail à la demande de l’employeur, ou une raison de santé.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur mit einem Grund: kein öffentliches Verkehrsmittel für diesen Weg oder keines bei Arbeitsbeginn oder -ende, mehr als eine Stunde Zeitersparnis pro Tag mit dem Auto, das Auto während der Arbeitszeit ständig auf Verlangen der Arbeitgeberfirma, oder ein gesundheitlicher Grund.'
      it: 'Chi va in automobile deduce quanto sarebbero costati i trasporti pubblici, per entrambe le imposte. I chilometri contano solo se avevi un motivo: nessun trasporto pubblico per il tragitto, o nessuno all’inizio o alla fine del lavoro, più di un’ora al giorno risparmiata in automobile, l’automobile usata tutto il giorno per il lavoro su richiesta del datore di lavoro, o un motivo di salute.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=22'
      label:
        en: 'Aargau tax guide 2025, p. 22: travel by car'
        fr: 'Guide fiscal argovien 2025, p. 22 : Trajets en voiture'
        de: 'Wegleitung zur Steuererklärung 2025, S. 22: Benützung des privaten Autos'
        it: 'Guida fiscale di Argovia 2025, p. 22: trasporto con l’automobile'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
            it: 'Sì, avrei potuto usare i trasporti pubblici',
          }
      - value: 'no'
        label:
          {
            en: 'No, one of those reasons applies',
            fr: 'Non, l’une de ces raisons s’applique',
            de: 'Nein, einer dieser Gründe trifft zu',
            it: 'No, vale uno di questi motivi',
          }

  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab, bei beiden Steuern, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Quel prezzo è quanto deduci per andare al lavoro in automobile, per entrambe le imposte, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=22'
      label:
        en: 'Aargau tax guide 2025, p. 22: travel to work'
        fr: 'Guide fiscal argovien 2025, p. 22 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 22: Fahrtkosten zwischen Wohn- und Arbeitsstätte'
        it: 'Guida fiscale di Argovia 2025, p. 22: spese di trasporto per recarsi al lavoro'

  # ag-2025-guide-wegleitung p. 22 (an amount per km for a car or a motorbike); the ordinance's lower
  # rate for a car beyond a yearly distance (ag-2026-law-steuerverordnung § 13 Abs. 1, p. 4).
  - use: commute_distance
    explain:
      en: 'With one of those reasons, both taxes count a fixed amount per kilometre, there and back once a day, each up to its own yearly limit.'
      fr: 'Avec l’une de ces raisons, les deux impôts comptent un montant fixe par kilomètre, un aller et retour par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Mit einem dieser Gründe zählen beide Steuern einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Con uno di questi motivi, entrambe le imposte contano un importo fisso per chilometro, andata e ritorno una volta al giorno, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=22'
      label:
        en: 'Aargau tax guide 2025, p. 22: travel by car'
        fr: 'Guide fiscal argovien 2025, p. 22 : Trajets en voiture'
        de: 'Wegleitung zur Steuererklärung 2025, S. 22: Benützung des privaten Autos'
        it: 'Guida fiscale di Argovia 2025, p. 22: trasporto con l’automobile'

  - use: commute_drive_days
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=22'
