  # Church tax (Kirchensteuer): the parishes of the Reformed, Roman Catholic and Christ Catholic
  # churches levy their Steuerfuss on the simple tax of their members (ag-na-law-steuergesetz § 154
  # Abs. 1, p. 69; ag-2026-communal-steuerfuesse p. 1, the three church columns; the guide's worked
  # example, ag-2025-guide-wegleitung p. 45). Opt-in: Taxpresso adds it only for a member;
  # packages/rules-ag says plainly when it can't compute it (spouses of different churches).
  - id: church
    key: ag.church
    group: detail
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Reformed, Roman Catholic or Christ Catholic church pay church tax (Kirchensteuer), a percentage of the simple tax (einfache Steuer) set by their parish. Taxpresso adds it only for a member.'
      fr: 'Les membres de l’Église réformée, catholique romaine ou catholique chrétienne paient l’impôt ecclésiastique (Kirchensteuer), un pourcentage de l’impôt simple (einfache Steuer) fixé par leur paroisse. Taxpresso ne l’ajoute que pour un membre.'
      de: 'Mitglieder der reformierten, der römisch-katholischen oder der christkatholischen Kirche zahlen Kirchensteuer, einen Prozentsatz der einfachen Steuer, den ihre Kirchgemeinde festlegt. Taxpresso rechnet sie nur für Mitglieder dazu.'
      it: 'I membri della chiesa riformata, cattolica romana o cattolica cristiana pagano l’imposta di culto (Kirchensteuer), una percentuale dell’imposta semplice (einfache Steuer) fissata dalla loro parrocchia. Taxpresso la aggiunge solo per chi ne è membro.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuerberechnung-tarife-natuerliche-personen/gemeinde-und-kirchensteuerf-sse-2026-v5.pdf#page=1'
      label:
        en: 'Communal and church tax rates 2026 (Gemeinde- und Kirchensteuerfüsse), p. 1'
        fr: 'Coefficients communaux et ecclésiastiques 2026 (Gemeinde- und Kirchensteuerfüsse), p. 1'
        de: 'Verzeichnis der Gemeinde- und Kirchensteuerfüsse 2026, S. 1'
        it: 'Moltiplicatori comunali e di culto 2026 (Gemeinde- und Kirchensteuerfüsse), p. 1'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these churches?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces Églises ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026, eri membro di una di queste chiese?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these churches?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces Églises ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026, il tuo coniuge o partner era membro di una di queste chiese?'
    help:
      en: 'Another religion, or none, pays no church tax.'
      fr: 'Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique.'
      de: 'Eine andere Religion oder keine zahlt keine Kirchensteuer.'
      it: 'Chi ha un’altra religione, o nessuna, non paga l’imposta di culto.'
    options:
      - value: reformed
        label:
          {
            en: 'Reformed (evangelisch-reformiert)',
            fr: 'Réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
            it: 'Riformata (evangelisch-reformiert)',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert', it: 'Riformata' }
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
            it: 'Cattolica romana (römisch-katholisch)',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch', it: 'Cattolica' }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique chrétienne (christkatholisch)',
            de: 'Christkatholisch',
            it: 'Cattolica cristiana (christkatholisch)',
          }
        chip:
          {
            en: 'Christ Catholic',
            fr: 'Catholique chrétien(ne)',
            de: 'Christkatholisch',
            it: 'Cattolica cristiana',
          }
      - value: none
        label:
          {
            en: 'None of these',
            fr: 'Aucune de ces Églises',
            de: 'Keine davon',
            it: 'Nessuna di queste',
