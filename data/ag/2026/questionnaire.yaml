# Aargau questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not
# code: packages/questionnaire reads it, and every key and value must exist in Aargau's keys
# (packages/rules-ag, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Aargau guide's sections, with Aargau's own explanations and official pages. The questions
# only Aargau asks are written out here, as packages/rules-ag reads them (AargauCantonal): who mainly
# bears the upkeep of children in shared custody without child support, each child's age band (the
# child deduction, 19.1), the childcare paid for each child (the limit is per child, 15.0), the
# commune and the move, each adult's church and, where the commune has a further parish of that
# church (Zusatzkirche), the parish.
#
# Wording and documents follow the Aargau guide for 2025 (ag-2025-guide-wegleitung), the latest
# published; the 2026 guide is not published yet (docs/sources/ag/NOTES.md, Gaps): re-check against
# it. "p." is the page of the PDF file, as in the links; the guide prints the same page numbers. The
# guide and eTAX AARGAU are in German only: the questions give the German term next to the gloss.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking. Italian: informal "tu",
# Comune and Cantone capitalized, the German term kept next to its gloss.

taxYear: 2026

place: { en: 'Aargau', fr: 'Argovie', de: 'Aargau', it: 'Argovia' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du', it: 'Tu' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
      it: 'Il tuo coniuge o partner',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner', it: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}', it: 'Figlio {n}' }

# eTAX AARGAU is the canton's online return, a browser application at etax.ag.ch
# (ag-na-efiling-etax-aargau; docs/sources/ag/NOTES.md, Filing channels). No document of the
# library says it is free, so the text doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. eTAX AARGAU, the canton’s online return (etax.ag.ch), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. eTAX AARGAU, la déclaration en ligne du canton (etax.ag.ch), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. eTAX AARGAU, die Online-Steuererklärung des Kantons (etax.ag.ch), oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Può farlo eTAX AARGAU, la dichiarazione online del Cantone (etax.ag.ch), oppure una fiduciaria.'

questions:
  - use: canton

  # ag-2025-guide-wegleitung p. 8 (Heirat, Scheidung oder Trennung, eingetragene Partnerschaft: the
  # civil status on 31 December decides; registered partners file as a married couple).
  - use: civil_status
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=8'
      label:
        en: 'Aargau tax guide 2025, p. 8: marriage, separation, partnership'
        fr: 'Guide fiscal argovien 2025, p. 8 : Mariage, séparation, partenariat'
        de: 'Wegleitung zur Steuererklärung 2025, S. 8: Heirat, Scheidung oder Trennung, eingetragene Partnerschaft'
        it: 'Guida fiscale di Argovia 2025, p. 8: matrimonio, separazione, unione domestica registrata'
    help:
      en: 'A registered partnership files like a married couple, on one return.'
      fr: 'Un partenariat enregistré déclare comme un couple marié, sur une seule déclaration.'
      de: 'Eine eingetragene Partnerschaft füllt wie ein Ehepaar eine gemeinsame Steuererklärung aus.'
      it: 'Un’unione domestica registrata presenta una sola dichiarazione, come una coppia sposata.'

  # ag-2025-guide-wegleitung p. 31 and 32 (19.1, Kinderabzug pro Kind: children under parental
  # authority up to 18, and children of age in education whose upkeep you mainly bear).
  - use: children
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=31'
      label:
        en: 'Aargau tax guide 2025, p. 31: child deduction'
        fr: 'Guide fiscal argovien 2025, p. 31 : Déduction pour enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 31: Kinderabzug pro Kind'
        it: 'Guida fiscale di Argovia 2025, p. 31: deduzione per figli'
    help:
      en: 'Minors, and children of age in education whose upkeep you mainly bear.'
      fr: 'Les mineurs, et les enfants majeurs en formation dont vous assumez l’essentiel de l’entretien.'
      de: 'Minderjährige und volljährige Kinder in Ausbildung, für deren Unterhalt du zur Hauptsache aufkommst.'
      it: 'I figli minorenni e i figli maggiorenni in formazione al cui mantenimento provvedi principalmente.'

  # ag-2025-guide-wegleitung p. 44 (Anhang I, 2: a parent living with a child for whom the child
  # deduction is granted is taxed at the rate for married couples, Tarif B).
  - use: children_custody
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=44'
      label:
        en: 'Aargau tax guide 2025, p. 44: families'
        fr: 'Guide fiscal argovien 2025, p. 44 : Familles'
        de: 'Wegleitung zur Steuererklärung 2025, S. 44: Familienbesteuerung'
        it: 'Guida fiscale di Argovia 2025, p. 44: famiglie'
    help:
      en: 'A parent living with a child gets the lower rate of married couples (Tarif B) for the cantonal tax.'
      fr: 'Un parent qui vit avec un enfant a le taux plus bas des couples mariés (Tarif B) pour l’impôt cantonal.'
      de: 'Wer mit einem Kind zusammenlebt, erhält bei den Kantons- und Gemeindesteuern den tieferen Tarif für Verheiratete (Tarif B).'
      it: 'Per l’imposta cantonale, un genitore che vive con un figlio ottiene l’aliquota più bassa delle coppie sposate (Tarif B).'

  # Parents taxed apart with shared parental authority: for the federal tax, half the child
  # deduction each without child support, the parental scale to the one who earns more
  # (ch-na-circulaire-30-epoux-famille p. 24); for the cantonal tax, the child deduction goes to the
  # parent who mainly bears the child's upkeep, as a rule not to the one who can deduct child
  # support (ag-2025-guide-wegleitung p. 32, 19.1).
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it counts them; without child support, the cantonal tax counts them for the parent who mainly bears their upkeep, and the federal tax gives each parent half the child deduction and the parental scale (Elterntarif), a lower rate, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit les compte ; sans contribution, l’impôt cantonal les compte pour le parent qui assume l’essentiel de leur entretien, et l’impôt fédéral donne à chacun la moitié de la déduction pour enfant et le barème parental (Elterntarif), un taux plus bas, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, zählt die Kinder; ohne Unterhaltsbeiträge zählen die Kantons- und Gemeindesteuern sie für den Elternteil, der überwiegend für ihren Unterhalt aufkommt, und die Bundessteuer gibt jedem den halben Kinderabzug und den Elterntarif, einen tieferen Satz, dem, der mehr verdient.'
      it: 'Con la custodia alternata, sono i contributi di mantenimento a decidere chi conta i figli. Il genitore che li riceve li conta; senza contributi di mantenimento, l’imposta cantonale li conta per il genitore che provvede principalmente al loro mantenimento, e l’imposta federale dà a ogni genitore metà della deduzione per figli e la tariffa per genitori (Elterntarif), un’aliquota più bassa, a quello che guadagna di più.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=32'
      label:
        en: 'Aargau tax guide 2025, p. 32: children of parents taxed apart'
        fr: 'Guide fiscal argovien 2025, p. 32 : Enfants de parents taxés séparément'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Kinder nicht gemeinsam veranlagter Eltern'
        it: 'Guida fiscale di Argovia 2025, p. 32: figli di genitori tassati separatamente'
    help:
      en: 'Child support (Unterhaltsbeiträge, Kinderalimente) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge, Kinderalimente) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge (Kinderalimente) sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'
      it: 'I contributi di mantenimento (Unterhaltsbeiträge, Kinderalimente) sono un importo regolare per i figli, fissato da una sentenza o da una convenzione. Guadagnare di più significa avere un reddito netto più alto.'

  # ag-2025-guide-wegleitung p. 32 (19.1): parents not taxed together who share parental authority:
  # the parent who mainly bears the child's upkeep has the child deduction; with it go Tarif B
  # (p. 44, Anhang I, 2) and the tax-free amount per child on wealth (StG § 54 Abs. 1 lit. c).
  # packages/rules-ag asks rather than guess (NOTE.mainUpkeep).
  - id: main_upkeep
    key: ag.main_upkeep
    group: detail
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'With shared custody and no child support, Aargau gives the child deduction (Kinderabzug) to the parent who mainly bears the children’s upkeep, and with it the lower rate of married couples (Tarif B) and the tax-free amount per child on wealth. The tax office checks that only one parent gets it.'
      fr: 'En garde partagée sans contribution d’entretien, Argovie donne la déduction pour enfants (Kinderabzug) au parent qui assume l’essentiel de l’entretien des enfants, et avec elle le taux plus bas des couples mariés (Tarif B) et le montant exonéré par enfant sur la fortune. L’administration vérifie qu’un seul parent l’obtient.'
      de: 'Bei geteilter Obhut ohne Unterhaltsbeiträge gibt Aargau den Kinderabzug dem Elternteil, der überwiegend für den Unterhalt der Kinder aufkommt, und damit den tieferen Tarif für Verheiratete (Tarif B) und den steuerfreien Betrag pro Kind auf dem Vermögen. Das Steueramt prüft, dass nur ein Elternteil ihn erhält.'
      it: 'Con la custodia alternata e senza contributi di mantenimento, Argovia concede la deduzione per figli (Kinderabzug) al genitore che provvede principalmente al loro mantenimento, e con essa l’aliquota più bassa delle coppie sposate (Tarif B) e l’importo esente da imposta sulla sostanza per ogni figlio. L’ufficio delle imposte verifica che la ottenga un solo genitore.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=32'
      label:
        en: 'Aargau tax guide 2025, p. 32: children of parents taxed apart'
        fr: 'Guide fiscal argovien 2025, p. 32 : Enfants de parents taxés séparément'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Kinder nicht gemeinsam veranlagter Eltern'
        it: 'Guida fiscale di Argovia 2025, p. 32: figli di genitori tassati separatamente'
    text:
      en: 'In 2026, did you mainly bear the children’s upkeep (überwiegend für den Unterhalt aufkommen)?'
      fr: 'En 2026, assumiez-vous l’essentiel de l’entretien des enfants (überwiegend für den Unterhalt aufkommen) ?'
      de: 'Bist du 2026 überwiegend für den Unterhalt der Kinder aufgekommen?'
      it: 'Nel 2026, eri tu a provvedere principalmente al mantenimento dei figli (überwiegend für den Unterhalt aufkommen)?'
    help:
      en: 'Not sure? Your last assessment shows whether you got the child deduction.'
      fr: 'Un doute ? Votre dernière taxation indique si vous avez eu la déduction pour enfants.'
      de: 'Unsicher? Deine letzte Veranlagung zeigt, ob du den Kinderabzug erhalten hast.'
      it: 'Hai un dubbio? La tua ultima decisione di tassazione (Veranlagung) mostra se hai ottenuto la deduzione per figli.'
    chip:
      {
        en: 'Bears the upkeep',
        fr: 'Assume l’entretien',
        de: 'Trägt den Unterhalt',
        it: 'Provvede al mantenimento',
      }

  # The child deduction depends on the child's age at the end of the year: up to 14, up to 18, of
  # age and in education with its upkeep mainly yours (ag-na-law-steuergesetz § 42 Abs. 1 lit. a,
  # p. 27; ag-2025-guide-wegleitung p. 31 and 32, 19.1; the situation on 31 December decides, p. 31,
  # 19.). Under 14 also counts for childcare (p. 27, 15.0).
  - id: child_band
    key: ag.child_band
    group: detail
    type: choice
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Aargau’s child deduction (Kinderabzug) is higher for older children: one amount up to 14, a higher one up to 18, the highest for a child of age in education whose upkeep you mainly bear. Childcare counts only for a child under 14.'
      fr: 'La déduction pour enfants d’Argovie (Kinderabzug) est plus élevée pour les enfants plus âgés : un montant jusqu’à 14 ans, un plus élevé jusqu’à 18 ans, le plus élevé pour un enfant majeur en formation dont vous assumez l’essentiel de l’entretien. Les frais de garde ne comptent que pour un enfant de moins de 14 ans.'
      de: 'Der Kinderabzug ist in Aargau für ältere Kinder höher: ein Betrag bis 14, ein höherer bis 18, der höchste für ein volljähriges Kind in Ausbildung, für dessen Unterhalt du zur Hauptsache aufkommst. Kinderbetreuungskosten zählen nur für ein Kind unter 14.'
      it: 'In Argovia la deduzione per figli (Kinderabzug) è più alta per i figli più grandi: un importo fino ai 14 anni, uno più alto fino ai 18, il più alto per un figlio maggiorenne in formazione al cui mantenimento provvedi principalmente. Le spese di custodia contano solo per un figlio sotto i 14 anni.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=32'
      label:
        en: 'Aargau tax guide 2025, p. 32: child deduction by age'
        fr: 'Guide fiscal argovien 2025, p. 32 : Déduction pour enfants selon l’âge'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Kinderabzug nach Alter'
        it: 'Guida fiscale di Argovia 2025, p. 32: deduzione per figli secondo l’età'
    text:
      en: 'How old was child {n} on 31 December 2026?'
      fr: 'Quel âge avait l’enfant {n} au 31 décembre 2026 ?'
      de: 'Wie alt war Kind {n} am 31. Dezember 2026?'
      it: 'Quanti anni aveva il figlio {n} il 31 dicembre 2026?'
    help:
      en: 'Number your children the same way in every answer, for example from the oldest.'
      fr: 'Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'
    options:
      - value: under14
        label:
          {
            en: 'Under 14 (bis zum vollendeten 14. Altersjahr)',
            fr: 'Moins de 14 ans (bis zum vollendeten 14. Altersjahr)',
            de: 'Bis zum vollendeten 14. Altersjahr',
            it: 'Sotto i 14 anni (bis zum vollendeten 14. Altersjahr)',
          }
        chip: { en: 'Under 14', fr: 'Moins de 14 ans', de: 'Unter 14', it: 'Sotto i 14 anni' }
      - value: under18
        label:
          {
            en: '14 to 17 (bis zum vollendeten 18. Altersjahr)',
            fr: '14 à 17 ans (bis zum vollendeten 18. Altersjahr)',
            de: '14 bis 17 (bis zum vollendeten 18. Altersjahr)',
            it: 'Da 14 a 17 anni (bis zum vollendeten 18. Altersjahr)',
          }
        chip: { en: '14 to 17', fr: '14 à 17 ans', de: '14 bis 17', it: 'Da 14 a 17 anni' }
      - value: adult
        label:
          {
            en: 'Of age and in education (volljährig in Ausbildung)',
            fr: 'Majeur et en formation (volljährig in Ausbildung)',
            de: 'Volljährig und in Ausbildung',
            it: 'Maggiorenne e in formazione (volljährig in Ausbildung)',
          }
        chip:
          {
            en: 'Of age, in education',
            fr: 'Majeur, en formation',
            de: 'Volljährig, in Ausbildung',
            it: 'Maggiorenne, in formazione',
          }

  # ag-2025-guide-wegleitung p. 27 (15.0, Kinderbetreuungskosten: a child under 14 living with you,
  # while you work, train or can't work; subsidies come off first).
  - use: childcare
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=27'
      label:
        en: 'Aargau tax guide 2025, p. 27: childcare'
        fr: 'Guide fiscal argovien 2025, p. 27 : Frais de garde'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Kinderbetreuungskosten'
        it: 'Guida fiscale di Argovia 2025, p. 27: custodia dei figli'
    help:
      en: 'A crèche (Kita), day care or a nanny, for a child under 14 living with you, while you work or train. Any subsidy comes off the invoice first. On the return: 15.0, Kinderbetreuungskosten.'
      fr: 'Une crèche (Kita), une garderie ou une nourrice, pour un enfant de moins de 14 ans qui vit avec vous, pendant que vous travaillez ou êtes en formation. Une subvention se déduit d’abord de la facture. Sur la déclaration : 15.0, Kinderbetreuungskosten (frais de garde).'
      de: 'Eine Kita, ein Hort oder eine Nanny, für ein Kind unter 14, das bei dir lebt, während du arbeitest oder in Ausbildung bist. Unterstützungsbeiträge gehen zuerst von der Rechnung ab. Auf der Steuererklärung: 15.0, Kinderbetreuungskosten.'
      it: 'Un asilo nido (Kita), un centro diurno o una tata, per un figlio sotto i 14 anni che vive con te, mentre lavori o segui una formazione. Eventuali sussidi si tolgono prima dalla fattura. Nella dichiarazione: 15.0, Kinderbetreuungskosten.'

  # The limit is per child (ag-na-law-steuergesetz § 40 Abs. 1 lit. n, p. 26; ag-2025-guide-wegleitung
  # p. 27, 15.0; ag-2026-deductions-kinderbetreuungskosten p. 7, 4.6 and 4.7). With several children,
  # how the invoices' total splits can decide the deduction: asked per child.
  - id: child_care
    key: ag.child_care
    group: deduction
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Aargau’s limit on childcare is per child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'La limite d’Argovie pour les frais de garde est par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Der Höchstbetrag für die Kinderbetreuungskosten gilt in Aargau pro Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
      it: 'In Argovia il limite per le spese di custodia vale per ogni figlio: la ripartizione tra i tuoi figli può cambiare la deduzione. Le tue fatture danno il totale.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/merkblaetter-zu-steuern-natuerliche-personen/kinderbetreuungskosten.pdf#page=7'
      label:
        en: 'Aargau leaflet on childcare costs, p. 7: the limit per child'
        fr: 'Notice argovienne sur les frais de garde, p. 7 : La limite par enfant'
        de: 'Merkblatt Kinderbetreuungskosten, S. 7: Höchstbetrag pro Kind'
        it: 'Promemoria argoviese sulle spese di custodia dei figli, p. 7: il limite per figlio'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Kinderbetreuungskosten war für Kind {n}?'
      it: 'Quanto delle spese di custodia pagate nel 2026 era per il figlio {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'In CHF, 0 se il figlio {n} non ne ha avute. Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'

  # The commune of 31 December taxes the whole year; a move inside the canton does not split the
  # communal tax (ag-2025-guide-wegleitung p. 8, Wohnsitzverlegung; ag-na-law-steuergesetz § 157
  # Abs. 1, p. 70). The list is Aargau's communes of 2026 by name (packages/rules-ag, from
  # ag-2026-communal-steuerfuesse; the list has no BFS numbers). Each commune levies its Steuerfuss
  # in percent of the simple tax (p. 45, Anhang II).
  - id: commune
    key: profile.commune
    group: basics
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year. Each commune sets its own Steuerfuss, a percentage of the simple tax (einfache Steuer), as the canton does.'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année. Chaque commune fixe son propre coefficient (Steuerfuss), un pourcentage de l’impôt simple (einfache Steuer), comme le canton.'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr. Jede Gemeinde legt wie der Kanton ihren eigenen Steuerfuss fest, einen Prozentsatz der einfachen Steuer.'
      it: 'Il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Ogni Comune fissa il proprio moltiplicatore (Steuerfuss), una percentuale dell’imposta semplice (einfache Steuer), come fa il Cantone.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuerberechnung-tarife-natuerliche-personen/gemeinde-und-kirchensteuerf-sse-2026-v5.pdf#page=1'
      label:
        en: 'Communal and church tax rates 2026 (Gemeinde- und Kirchensteuerfüsse), p. 1'
        fr: 'Coefficients communaux et ecclésiastiques 2026 (Gemeinde- und Kirchensteuerfüsse), p. 1'
        de: 'Verzeichnis der Gemeinde- und Kirchensteuerfüsse 2026, S. 1'
        it: 'Moltiplicatori comunali e di culto 2026 (Gemeinde- und Kirchensteuerfüsse), p. 1'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
      it: 'In quale Comune abitavi il 31 dicembre 2026?'
    help:
      en: 'The official name, such as Aarau, Baden or Brugg (AG). In a few communes, a further parish of a church levies another church tax rate: Taxpresso asks for yours later, only if it changes your tax.'
      fr: 'Le nom officiel, par exemple Aarau, Baden ou Brugg (AG). Dans quelques communes, une paroisse supplémentaire d’une Église prélève un autre taux d’impôt ecclésiastique : Taxpresso vous demande la vôtre plus tard, seulement si cela change votre impôt.'
      de: 'Der offizielle Name, zum Beispiel Aarau, Baden oder Brugg (AG). In einigen Gemeinden erhebt eine Zusatzkirche einen anderen Kirchensteuerfuss: Taxpresso fragt später nach deiner, nur wenn sie deine Steuer ändert.'
      it: 'Il nome ufficiale, per esempio Aarau, Baden o Brugg (AG). In alcuni Comuni un’altra parrocchia della stessa chiesa applica un altro moltiplicatore dell’imposta di culto: Taxpresso ti chiede la tua più avanti, solo se cambia la tua imposta.'

  # Who files in Aargau: everyone living in the canton on 31 December (ag-2025-guide-wegleitung p. 7);
  # a move within Switzerland: the canton and the commune of 31 December tax the whole year (p. 8,
  # Wohnsitzverlegung). Arriving from abroad or leaving Switzerland means a return for part of the
  # year (p. 5, unterjährige Steuerpflicht): not covered by rules-ag.
  - id: moved
    key: profile.moved
    group: special
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Aargau taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Argovie vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Aargau besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug ins Ausland heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
      it: 'Un trasloco all’interno del Cantone non cambia niente: il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Nemmeno l’arrivo da un altro Cantone cambia qualcosa: Argovia ti tassa per tutto l’anno, come se avessi abitato qui da gennaio. Arrivare dall’estero, o lasciare la Svizzera, significa che qui sei stato tassato solo per una parte dell’anno.'
    learnMore:
      url: 'https://www.ag.ch/media/kanton-aargau/dfr/dokumente/steuern/natuerliche-personen/steuererklaerung/wegleitung-zur-steuererkl-rung-2025-kanton-aargau.pdf#page=8'
      label:
        en: 'Aargau tax guide 2025, p. 8: moving'
        fr: 'Guide fiscal argovien 2025, p. 8 : Déménagement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 8: Wohnsitzverlegung'
        it: 'Guida fiscale di Argovia 2025, p. 8: trasloco'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
      it: 'Hai traslocato nel 2026?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein', it: 'No' } }
      - value: within_ag
        label:
          {
            en: 'Yes, within Aargau',
            fr: 'Oui, dans le canton d’Argovie',
            de: 'Ja, innerhalb des Kantons Aargau',
            it: 'Sì, all’interno dell’Argovia',
          }
        chip:
          {
            en: 'Moved in the canton',
            fr: 'Déménagé dans le canton',
            de: 'Umzug im Kanton',
            it: 'Trasloco nel Cantone',
          }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
            it: 'Sì, da un altro Cantone',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
            it: 'Arrivo da un altro Cantone',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
            it: 'Sì, sono arrivato o arrivata dall’estero',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland, unterjährige Steuerpflicht)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland, unterjährige Steuerpflicht)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres (unterjährige Steuerpflicht)',
            it: 'L’arrivo dall’estero nel corso dell’anno (Zuzug aus dem Ausland, unterjährige Steuerpflicht)',
          }
      - value: leaving_switzerland
