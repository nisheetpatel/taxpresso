      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=3'
      label:
        en: 'Federal tax instructions 2026, p. 3: pensions and benefits, in French'
        fr: 'Instructions IFD 2026, p. 3 : Revenus des assurances sociales'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 3: Renten und Taggelder, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 3: rendite e indennità, in francese'
    reason:
      {
        en: 'From the unemployment fund or the insurer.',
        fr: 'De la caisse de chômage ou de l’assurance.',
        de: 'Von der Arbeitslosenkasse oder der Versicherung.',
