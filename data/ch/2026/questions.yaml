        it: 'Istruzioni per l’imposta federale 2026, p. 3: titoli e conti, in francese'
    text:
      en: 'With how many banks did you have accounts or securities on 31 December {year}?'
      fr: 'Dans combien de banques aviez-vous des comptes ou des titres au 31 décembre {year} ?'
      de: 'Bei wie vielen Banken hattest du am 31. Dezember {year} Konten oder Wertschriften?'
      it: 'In quante banche avevi conti o titoli al 31 dicembre {year}?'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers (Interactive Brokers, DEGIRO). If a bank offers an e-tax statement, ask for it: it has everything in one document.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers (Interactive Brokers, DEGIRO). Si une banque propose un relevé fiscal électronique, demandez-le : il contient tout en un seul document.'
