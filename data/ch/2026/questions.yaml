# The documents every canton asks for. A canton gives the page of its own guide (learnMore, source).
requirements:
  - id: salary_certificate
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    expects: { kinds: [salary_certificate], countKey: profile.employers }
    label:
      {
        en: 'Salary certificate',
        fr: 'Certificat de salaire',
        de: 'Lohnausweis',
        it: 'Certificato di salario',
      }
    explain:
      en: 'The yearly summary of your salary and deductions that each employer gives you, usually in January or February.'
      fr: 'Le récapitulatif annuel de votre salaire et des retenues que chaque employeur vous remet, en général en janvier ou février.'
      de: 'Die jährliche Übersicht über deinen Lohn und die Abzüge, die dir jeder Arbeitgeber gibt, meistens im Januar oder Februar.'
      it: 'Il riepilogo annuale del tuo salario e delle trattenute che ogni datore di lavoro ti dà, di solito a gennaio o febbraio.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: employment income, in French'
        fr: 'Instructions IFD 2026, p. 1 : Activité lucrative dépendante'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: unselbständige Erwerbstätigkeit, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 1: reddito da attività dipendente, in francese'
    reason:
      {
        en: 'One from each employer.',
        fr: 'Un par employeur.',
        de: 'Einer pro Arbeitgeber.',
        it: 'Uno per ogni datore di lavoro.',
      }
    source: 'ch-2026-ifd-instructions-personnes-physiques p. 1'

  - id: replacement_income
