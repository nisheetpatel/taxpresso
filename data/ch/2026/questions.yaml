      de: 'Nur nötig, wenn du freiwillig zusätzlich in deine Pensionskasse einbezahlt hast. Die Kasse bestätigt es schriftlich. Kein Einkauf? Ändere deine Antwort, dann verschwindet diese Zeile.'
      it: 'Serve solo se hai fatto un versamento volontario in più nella tua cassa pensione. La cassa lo conferma per iscritto. Nessun riscatto? Cambia la tua risposta e questa riga sparisce.'
