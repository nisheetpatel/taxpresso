      label:
        en: 'Federal tax instructions 2026, p. 1: employment income, in French'
        fr: 'Instructions IFD 2026, p. 1 : Activité lucrative dépendante'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: unselbständige Erwerbstätigkeit, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 1: reddito da attività dipendente, in francese'
