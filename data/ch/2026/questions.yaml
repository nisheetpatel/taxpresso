# The questions every canton asks, tax years 2025 and 2026 (SPEC.md section 6; docs/design/cantons.md
# and tax-years.md). Data, not code: packages/questionnaire reads it once per tax year. A canton's
# file (data/<canton>/2026/questionnaire.yaml) takes a question or a document from here with
# `use: <id>`, in its own order, and may replace any of its fields: its own explanation, its
# official page (learnMore), its form's terms. Every key and value must exist in the canton's keys
# (packages/rules-ch keys/ for the shared ones; a test checks).
#
# Before the canton is known, Taxpresso asks these questions only, starting with the canton. Their
# official pages are the federal ones (ch-2026-ifd-instructions-personnes-physiques, Form. 2a 2026,
# in French); each canton gives its own guide instead.
#
# French: write plain spaces before ? ! : ; and the loader makes them non-breaking. German: informal
# "du", Swiss spelling (ss), the official German term next to its gloss. Texts per person (p1, p2)
# where the grammar differs; {n} is replaced by the number.
#
# One file for every year it serves (taxYears): {year} is the tax year being prepared ({prevYear} the
# one before). A citation of one year's document carries `year:` (a source names it in its ids): for
# a tax year, the latest document up to that year is cited, a law or a web page without a year for
# any year, and none rather than a later year's. The federal instructions are 2026's (Form. 2a 2026);
# the 2025 ones are not in the library (docs/sources/ch/NOTES.md: only in a ZIP), so a 2025 question
# shows its canton's own guide, or no official page.

taxYears: [2025, 2026]

# A canton Taxpresso doesn't prepare for the year (its rules, form or questions don't cover it yet):
# what the canton question says when the user chooses it (docs/design/tax-years.md).
notOffered:
  en: '{canton}: Taxpresso can’t prepare a {year} return there yet'
  fr: '{canton} : Taxpresso ne peut pas encore y préparer une déclaration {year}'
  de: '{canton}: Eine Steuererklärung {year} kann Taxpresso dort noch nicht vorbereiten'
  it: '{canton}: Taxpresso non può ancora prepararvi una dichiarazione {year}'

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du', it: 'Tu' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
      it: 'Il tuo coniuge o partner',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner', it: 'Partner' }

notSupported:
  en: 'Taxpresso can’t prepare this part yet. Your canton’s free tax software, or a fiduciary, can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. Le logiciel gratuit de votre canton, ou une fiduciaire, le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. Die kostenlose Steuersoftware deines Kantons oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Possono farlo il software fiscale gratuito del tuo Cantone o una fiduciaria.'

questions:
  # The canton you lived in on 31 December taxes the whole year, also when you moved there from
  # another canton during the year: for the federal tax, ch-na-law-lifd art. 105 al. 1 (p. 58); for
  # the cantonal and communal tax, ge-2025-guide-declaration-pp p. 53 (Arrivée d'un canton suisse)
  # zh-2025-guide-natuerliche-personen p. 5 and 6 (Zuzug aus einem anderen Kanton),
  # be-2025-wegleitung-np-de p. 10 (Seite 1: Wohnsitz am Ende des Jahres), bl-2026-wegleitung
  # p. 3 and 4 (Wer hat eine Steuererklärung einzureichen?; Zuzug aus einem anderen Kanton),
  # vd-2025-guide p. 6 (Début et fin de l'assujettissement: arriving from another canton, the whole
  # year), bs-2025-guide-wegleitung p. 8 (Zuzug aus einem anderen Kanton),
  # zg-2025-guide-wegleitung p. 24 (Bei Zuzug aus einem anderen Kanton ... ist der Kanton Zug
  # für die ganze Steuerperiode zuständig), lu-2025-guide-wegleitung p. 8 (Zuzug in den Kanton
  # Luzern: the tax liability in Lucerne for the whole tax period), sg-2025-guide-wegleitung
  # p. 11 (Zuzug aus einem anderen Kanton: für das ganze Steuerjahr 2025 im Kanton St.Gallen
  # steuerpflichtig), fr-2025-guide-instructions-generales p. 4 (arriving from another canton:
  # taxable for the whole year), ti-2025-guide-istruzioni-pf-pdf p. 10 (Arrivo in Ticino di
  # contribuenti provenienti da altri cantoni: assoggettato per l'intero anno) and
  # ag-2025-guide-wegleitung p. 7 and 8 (Wer füllt eine Steuererklärung aus?; Wohnsitzverlegung).
  - id: canton
    key: profile.canton
    type: choice
    explain:
      en: 'The canton you lived in on 31 December taxes your whole year: cantonal, communal and federal tax. Taxpresso prepares returns for {cantons} so far.'
      fr: 'Le canton où vous habitiez au 31 décembre vous impose pour toute l’année : impôt cantonal, communal et fédéral. Taxpresso prépare pour l’instant les déclarations de ces cantons : {cantons}.'
      de: 'Der Kanton, in dem du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr: Staats-, Gemeinde- und Bundessteuer. Taxpresso bereitet bisher Steuererklärungen für {cantons} vor.'
      it: 'Il Cantone in cui abitavi il 31 dicembre ti tassa per tutto l’anno: imposta cantonale, comunale e federale. Per ora Taxpresso prepara le dichiarazioni di questi Cantoni: {cantons}.'
    learnMore:
      url: 'https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1991/1184_1184_1184/20260101/fr/pdf-a/fedlex-data-admin-ch-eli-cc-1991-1184_1184_1184-20260101-fr-pdf-a.pdf#page=58'
      label:
        en: 'Federal tax law (LIFD), art. 105: the canton at the end of the year, in French'
        fr: 'LIFD, art. 105 : Rattachement personnel'
        de: 'Bundessteuergesetz (DBG, LIFD), Art. 105: der Kanton am Ende des Jahres, auf Französisch'
        it: 'Legge sull’imposta federale diretta (LIFD), art. 105: il Cantone alla fine dell’anno, in francese'
    link:
      url: 'https://github.com/nisheetpatel/taxpresso/issues/1'
      label:
        en: 'Vote for the next canton'
        fr: 'Votez pour le prochain canton'
        de: 'Stimm für den nächsten Kanton ab'
        it: 'Vota il prossimo Cantone'
    text:
      en: 'Where did you live on 31 December {year}?'
      fr: 'Où habitiez-vous au 31 décembre {year} ?'
      de: 'Wo hast du am 31. Dezember {year} gewohnt?'
      it: 'Dove abitavi il 31 dicembre {year}?'
    help:
      en: 'Moved from another canton during {year}? Choose the canton you lived in on 31 December: it taxes the whole year, as if you had lived there since January. Other cantons are coming: vote for yours.'
      fr: 'Vous avez déménagé d’un autre canton en {year} ? Choisissez celui où vous habitiez au 31 décembre : il vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. D’autres cantons arrivent : votez pour le vôtre.'
      de: 'Du bist {year} aus einem anderen Kanton umgezogen? Wähl den Kanton, in dem du am 31. Dezember gewohnt hast: Er besteuert das ganze Jahr, als hättest du seit Januar dort gewohnt. Weitere Kantone folgen: Stimm für deinen ab.'
      it: 'Hai traslocato da un altro Cantone nel {year}? Scegli quello in cui abitavi il 31 dicembre: ti tassa per tutto l’anno, come se ci avessi abitato da gennaio. Altri Cantoni sono in arrivo: vota per il tuo.'
    options:
      - value: GE
        label:
          {
            en: 'Canton of Geneva',
            fr: 'Canton de Genève',
            de: 'Kanton Genf',
            it: 'Cantone di Ginevra',
          }
        chip: { en: 'Geneva', fr: 'Genève', de: 'Genf', it: 'Ginevra' }
      - value: ZH
        label:
          {
            en: 'Canton of Zurich',
            fr: 'Canton de Zurich',
            de: 'Kanton Zürich',
            it: 'Cantone di Zurigo',
          }
        chip: { en: 'Zurich', fr: 'Zurich', de: 'Zürich', it: 'Zurigo' }
      - value: BE
        label:
          { en: 'Canton of Bern', fr: 'Canton de Berne', de: 'Kanton Bern', it: 'Cantone di Berna' }
        chip: { en: 'Bern', fr: 'Berne', de: 'Bern', it: 'Berna' }
      - value: BL
        label:
          {
            en: 'Canton of Basel-Landschaft',
            fr: 'Canton de Bâle-Campagne',
            de: 'Kanton Basel-Landschaft',
            it: 'Cantone di Basilea Campagna',
          }
        chip:
          {
            en: 'Basel-Landschaft',
            fr: 'Bâle-Campagne',
            de: 'Basel-Landschaft',
            it: 'Basilea Campagna',
          }
      - value: VD
        label:
          { en: 'Canton of Vaud', fr: 'Canton de Vaud', de: 'Kanton Waadt', it: 'Cantone di Vaud' }
        chip: { en: 'Vaud', fr: 'Vaud', de: 'Waadt', it: 'Vaud' }
      - value: BS
        label:
          {
            en: 'Canton of Basel-Stadt',
            fr: 'Canton de Bâle-Ville',
            de: 'Kanton Basel-Stadt',
            it: 'Cantone di Basilea Città',
          }
        chip: { en: 'Basel-Stadt', fr: 'Bâle-Ville', de: 'Basel-Stadt', it: 'Basilea Città' }
      - value: ZG
        label:
          { en: 'Canton of Zug', fr: 'Canton de Zoug', de: 'Kanton Zug', it: 'Cantone di Zugo' }
        chip: { en: 'Zug', fr: 'Zoug', de: 'Zug', it: 'Zugo' }
      - value: LU
        label:
          {
            en: 'Canton of Lucerne',
            fr: 'Canton de Lucerne',
            de: 'Kanton Luzern',
            it: 'Cantone di Lucerna',
          }
        chip: { en: 'Lucerne', fr: 'Lucerne', de: 'Luzern', it: 'Lucerna' }
      - value: SG
        label:
          {
            en: 'Canton of St. Gallen',
            fr: 'Canton de Saint-Gall',
            de: 'Kanton St. Gallen',
            it: 'Cantone di San Gallo',
          }
        chip: { en: 'St. Gallen', fr: 'Saint-Gall', de: 'St. Gallen', it: 'San Gallo' }
      - value: FR
        label:
          {
            en: 'Canton of Fribourg',
            fr: 'Canton de Fribourg',
            de: 'Kanton Freiburg',
            it: 'Cantone di Friburgo',
          }
        chip: { en: 'Fribourg', fr: 'Fribourg', de: 'Freiburg', it: 'Friburgo' }
      - value: TI
        label:
          {
            en: 'Canton of Ticino',
            fr: 'Canton du Tessin',
            de: 'Kanton Tessin',
            it: 'Cantone Ticino',
          }
        chip: { en: 'Ticino', fr: 'Tessin', de: 'Tessin', it: 'Ticino' }
      - value: AG
        label:
          {
            en: 'Canton of Aargau',
            fr: 'Canton d’Argovie',
            de: 'Kanton Aargau',
            it: 'Cantone di Argovia',
          }
        chip: { en: 'Aargau', fr: 'Argovie', de: 'Aargau', it: 'Argovia' }
      # The cantons Taxpresso covers are named from the options above ({cantonsOr}, {cantons}:
      # packages/questionnaire, schema.ts), so adding a canton adds its option only.
      - value: other
        label:
          {
            en: 'Another canton',
            fr: 'Un autre canton',
            de: 'Ein anderer Kanton',
            it: 'Un altro Cantone',
          }
        notSupported:
          en: 'A canton other than {cantonsOr}'
          fr: 'Un autre canton que {cantonsOr}'
          de: 'Ein anderer Kanton als {cantonsOr}'
          it: 'Un Cantone diverso da {cantonsOr}'

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (situation on 31 December)
  - id: civil_status
    key: profile.civil_status
    type: choice
    explain:
      en: 'Your situation on 31 December decides whether you file alone or as a couple, on one declaration together.'
      fr: 'Votre situation au 31 décembre décide si vous déclarez seul ou en couple, sur une seule déclaration commune.'
      de: 'Deine Situation am 31. Dezember entscheidet, ob du allein oder als Paar eine gemeinsame Steuererklärung ausfüllst.'
      it: 'La tua situazione al 31 dicembre decide se dichiari individualmente o in coppia, con un’unica dichiarazione comune.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: personal situation, in French'
        fr: 'Instructions IFD 2026, p. 1 : Situation personnelle'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: persönliche Verhältnisse, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 1: situazione personale, in francese'
    text:
      en: 'What was your civil status on 31 December {year}?'
      fr: 'Quel était votre état civil au 31 décembre {year} ?'
      de: 'Was war dein Zivilstand am 31. Dezember {year}?'
      it: 'Qual era il tuo stato civile al 31 dicembre {year}?'
    options:
      - {
          value: single,
          label: { en: 'Single', fr: 'Célibataire', de: 'Ledig', it: 'Celibe o nubile' },
        }
      - {
          value: married,
          label: { en: 'Married', fr: 'Marié(e)', de: 'Verheiratet', it: 'Coniugato o coniugata' },
        }
      - value: registered_partnership
        label:
          {
            en: 'Registered partnership',
            fr: 'Partenariat enregistré',
            de: 'Eingetragene Partnerschaft',
            it: 'Unione domestica registrata',
          }
      - {
          value: separated,
          label: { en: 'Separated', fr: 'Séparé(e)', de: 'Getrennt', it: 'Separato o separata' },
        }
      - {
          value: divorced,
          label:
            { en: 'Divorced', fr: 'Divorcé(e)', de: 'Geschieden', it: 'Divorziato o divorziata' },
        }
      - {
          value: widowed,
          label: { en: 'Widowed', fr: 'Veuf ou veuve', de: 'Verwitwet', it: 'Vedovo o vedova' },
        }

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (Enfants)
  - id: children
    key: profile.children_count
    type: number
    min: 0
    max: 12
    explain:
      en: 'Count the children who live with you or whom you support financially. Unsure about an adult child? Ask Claude.'
      fr: 'Comptez les enfants qui vivent avec vous ou que vous entretenez. Un doute pour un enfant majeur ? Demandez à Claude.'
      de: 'Zähl die Kinder, die bei dir leben oder für deren Unterhalt du aufkommst. Unsicher bei einem volljährigen Kind? Frag Claude.'
      it: 'Conta i figli che vivono con te o che mantieni. Hai un dubbio su un figlio maggiorenne? Chiedi a Claude.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: children, in French'
        fr: 'Instructions IFD 2026, p. 1 : Enfants'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: Kinder, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 1: figli, in francese'
    text:
      en: 'How many children did you support in {year}?'
      fr: 'Combien d’enfants aviez-vous à charge en {year} ?'
      de: 'Für wie viele Kinder bist du {year} aufgekommen?'
      it: 'Quanti figli avevi a carico nel {year}?'
    chip:
      zero: { en: 'No children', fr: 'Pas d’enfants', de: 'Keine Kinder', it: 'Nessun figlio' }
      one: { en: '1 child', fr: '1 enfant', de: '1 Kind', it: '1 figlio' }
      other: { en: '{n} children', fr: '{n} enfants', de: '{n} Kinder', it: '{n} figli' }

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (Enfants)
  - id: children_custody
    key: profile.children_custody
    type: choice
    when: { key: profile.children_count, gt: 0 }
    explain:
      en: 'Who the children mainly live with. Shared custody means they live with each parent about half the time.'
      fr: 'Chez qui les enfants vivent surtout. En garde partagée, ils vivent environ la moitié du temps chez chaque parent.'
      de: 'Bei wem die Kinder hauptsächlich leben. Bei geteilter Obhut leben sie etwa die Hälfte der Zeit bei jedem Elternteil.'
      it: 'Con chi vivono soprattutto i figli. In custodia alternata vivono circa metà del tempo con ciascun genitore.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: children, in French'
        fr: 'Instructions IFD 2026, p. 1 : Enfants'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: Kinder, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 1: figli, in francese'
    text:
      en: 'Where did the children live in {year}?'
      fr: 'Où vivaient les enfants en {year} ?'
      de: 'Wo haben die Kinder {year} gelebt?'
      it: 'Dove vivevano i figli nel {year}?'
    options:
      - value: with_household
        label:
          {
            en: 'With me, or with us',
            fr: 'Avec moi, ou avec nous',
            de: 'Bei mir oder bei uns',
            it: 'Con me, o con noi',
          }
      - value: shared
        label:
          {
            en: 'Shared custody',
            fr: 'En garde partagée',
            de: 'In geteilter Obhut',
            it: 'In custodia alternata',
          }
        chip:
          {
            en: 'Shared custody',
            fr: 'Garde partagée',
            de: 'Geteilte Obhut',
            it: 'Custodia alternata',
          }
      - value: elsewhere
        label:
          {
            en: 'Mostly with the other parent',
            fr: 'Surtout chez l’autre parent',
            de: 'Hauptsächlich beim anderen Elternteil',
            it: 'Soprattutto con l’altro genitore',
          }

  # Parents who share custody without a partner: child support decides who gets the federal
  # parental scale and the child deductions (ch-na-circulaire-30-epoux-famille p. 24, ch. 13.4.2;
  # p. 32 and 33, ch. 14.4 and 14.5); each canton's own rules say what it decides there.
  - id: child_support
    key: profile.child_support
    type: choice
    when:
      all:
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
    explain:
      en: 'With shared custody, only one parent gets the federal parental scale (barème parental), a lower rate: the one who receives child support or, without child support, the one who earns more. Without child support, you each get half the child deductions.'
      fr: 'En garde partagée, un seul parent a droit au barème parental fédéral, un taux plus bas : celui qui reçoit la contribution d’entretien ou, sans contribution, celui qui gagne le plus. Sans contribution d’entretien, chacun a la moitié des déductions pour enfants.'
      de: 'Bei geteilter Obhut erhält nur ein Elternteil den Elterntarif der Bundessteuer, einen tieferen Satz: wer Unterhaltsbeiträge erhält oder, ohne Unterhaltsbeiträge, wer mehr verdient. Ohne Unterhaltsbeiträge erhält jeder die Hälfte der Kinderabzüge.'
      it: 'Con la custodia alternata, solo un genitore ottiene la tariffa per i genitori dell’imposta federale (barème parental), un’aliquota più bassa: chi riceve i contributi di mantenimento o, senza contributi, chi guadagna di più. Senza contributi di mantenimento, ogni genitore ottiene la metà delle deduzioni per i figli.'
    # ch-na-circulaire-30-epoux-famille p. 24
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/2YuHXYYJMbn9/dbst-ks-2010-1-030-d-fr.pdf#page=24'
      label:
        en: 'Federal tax circular 30, p. 24: the parental scale when parents live apart'
        fr: 'Circulaire AFC n° 30, p. 24 : Barème parental des parents séparés'
        de: 'Kreisschreiben ESTV Nr. 30, S. 24: Elterntarif getrennt lebender Eltern, auf Französisch'
        it: 'Circolare federale n. 30, p. 24: la tariffa per i genitori che vivono separati'
    text:
      en: 'In {year}, did you or the other parent pay child support for the children?'
      fr: 'En {year}, vous ou l’autre parent avez-vous versé une contribution d’entretien pour les enfants ?'
      de: 'Hast du oder hat der andere Elternteil {year} Unterhaltsbeiträge für die Kinder bezahlt?'
      it: 'Nel {year} sono stati versati contributi di mantenimento per i figli, da te o dall’altro genitore?'
    help:
      en: 'Child support (contribution d’entretien) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'
      it: 'I contributi di mantenimento (contribution d’entretien) sono un importo regolare per i figli, fissato da una sentenza o da una convenzione. Guadagnare di più significa avere un reddito netto più alto.'
    options:
      - value: i_receive
        label:
          {
            en: 'The other parent paid me child support',
            fr: 'L’autre parent m’a versé une contribution d’entretien',
            de: 'Der andere Elternteil hat mir Unterhaltsbeiträge bezahlt',
            it: 'L’altro genitore mi ha versato contributi di mantenimento',
          }
        chip:
          {
            en: 'Receives child support',
            fr: 'Reçoit une contribution',
            de: 'Erhält Unterhaltsbeiträge',
            it: 'Riceve contributi di mantenimento',
          }
      - value: i_pay
        label:
          {
            en: 'I paid child support to the other parent',
            fr: 'J’ai versé une contribution d’entretien à l’autre parent',
            de: 'Ich habe dem anderen Elternteil Unterhaltsbeiträge bezahlt',
            it: 'Ho versato contributi di mantenimento all’altro genitore',
          }
        chip:
          {
            en: 'Pays child support',
            fr: 'Verse une contribution',
            de: 'Zahlt Unterhaltsbeiträge',
            it: 'Versa contributi di mantenimento',
          }
      - value: none_i_earn_more
        label:
          {
            en: 'No child support, and I earn more than the other parent',
            fr: 'Pas de contribution, et je gagne plus que l’autre parent',
            de: 'Keine Unterhaltsbeiträge, und ich verdiene mehr als der andere Elternteil',
            it: 'Nessun contributo, e guadagno più dell’altro genitore',
          }
      - value: none_other_earns_more
        label:
          {
            en: 'No child support, and the other parent earns more',
            fr: 'Pas de contribution, et l’autre parent gagne plus',
            de: 'Keine Unterhaltsbeiträge, und der andere Elternteil verdient mehr',
            it: 'Nessun contributo, e l’altro genitore guadagna di più',
          }
      - value: none_unsure
        label:
          {
            en: 'No child support, and I don’t know who earns more',
            fr: 'Pas de contribution, et je ne sais pas qui gagne le plus',
            de: 'Keine Unterhaltsbeiträge, und ich weiss nicht, wer mehr verdient',
            it: 'Nessun contributo, e non so chi guadagna di più',
          }

  # ch-2026-ifd-instructions-personnes-physiques p. 8 (frais de garde par des tiers)
  - id: childcare
    key: profile.childcare
    type: choice
    when: { key: profile.children_count, gt: 0 }
    explain:
