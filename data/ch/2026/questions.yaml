    explain:
      en: 'The statement each bank gives for your taxes, with balances on 31 December. Ask for the e-tax statement if your bank offers it. For a broker such as Interactive Brokers or DEGIRO, add its export too (Flex Query XML, or the CSV of the portfolio and of the account statement): Taxpresso reads your securities from it.'
      fr: 'Le relevé fiscal de chaque banque, avec les soldes au 31 décembre. Demandez le relevé fiscal électronique si votre banque le propose. Pour un courtier comme Interactive Brokers ou DEGIRO, ajoutez aussi son export (Flex Query XML, ou le CSV du portefeuille et du relevé de compte) : Taxpresso y lit vos titres.'
      de: 'Der Steuerauszug jeder Bank, mit den Saldi per 31. Dezember. Verlang den eSteuerauszug, wenn deine Bank ihn anbietet. Für einen Broker wie Interactive Brokers oder DEGIRO füg auch seinen Export hinzu (Flex Query XML, oder das CSV des Portfolios und des Kontoauszugs): Taxpresso liest deine Wertschriften daraus.'
      it: 'L’estratto fiscale di ogni banca, con i saldi al 31 dicembre. Chiedi l’estratto fiscale elettronico se la tua banca lo offre. Per un broker come Interactive Brokers o DEGIRO, aggiungi anche il suo export (Flex Query XML, o il CSV del portafoglio e dell’estratto conto): Taxpresso legge da lì i tuoi titoli.'
    learnMore:
