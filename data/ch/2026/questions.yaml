# The questions every canton asks, tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data,
# not code: packages/questionnaire reads it. A canton's file (data/<canton>/2026/questionnaire.yaml)
# takes a question or a document from here with `use: <id>`, in its own order, and may replace any of
# its fields: its own explanation, its official page (learnMore), its form's terms. Every key and
# value must exist in the canton's keys (packages/rules-ch keys/ for the shared ones; a test checks).
#
# Before the canton is known, Taxpresso asks these questions only, starting with the canton. Their
# official pages are the federal ones (ch-2026-ifd-instructions-personnes-physiques, Form. 2a 2026,
# in French); each canton gives its own guide instead.
#
# French: write plain spaces before ? ! : ; and the loader makes them non-breaking. German: informal
# "du", Swiss spelling (ss), the official German term next to its gloss. Texts per person (p1, p2)
# where the grammar differs; {n} is replaced by the number.

taxYear: 2026

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner' }

notSupported:
  en: 'Taxpresso can’t prepare this part yet. Your canton’s free tax software, or a fiduciary, can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. Le logiciel gratuit de votre canton, ou une fiduciaire, le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. Die kostenlose Steuersoftware deines Kantons oder eine Treuhand kann es.'

questions:
  # The canton you lived in on 31 December taxes the whole year, also when you moved there from
  # another canton during the year: for the federal tax, ch-na-law-lifd art. 105 al. 1 (p. 58); for
  # the cantonal and communal tax, ge-2025-guide-declaration-pp p. 53 (Arrivée d'un canton suisse)
  # zh-2025-guide-natuerliche-personen p. 5 and 6 (Zuzug aus einem anderen Kanton),
  # be-2025-wegleitung-np-de p. 10 (Seite 1: Wohnsitz am Ende des Jahres), bl-2026-wegleitung
  # p. 3 and 4 (Wer hat eine Steuererklärung einzureichen?; Zuzug aus einem anderen Kanton),
  # vd-2025-guide p. 6 (Début et fin de l'assujettissement: arriving from another canton, the whole
  # year), bs-2025-guide-wegleitung p. 8 (Zuzug aus einem anderen Kanton),
  # zg-2025-guide-wegleitung p. 24 (Bei Zuzug aus einem anderen Kanton ... ist der Kanton Zug
  # für die ganze Steuerperiode zuständig), lu-2025-guide-wegleitung p. 8 (Zuzug in den Kanton
  # Luzern: the tax liability in Lucerne for the whole tax period), sg-2025-guide-wegleitung
  # p. 11 (Zuzug aus einem anderen Kanton: für das ganze Steuerjahr 2025 im Kanton St.Gallen
  # steuerpflichtig), fr-2025-guide-instructions-generales p. 4 (arriving from another canton:
  # taxable for the whole year) and ag-2025-guide-wegleitung p. 7 and 8 (Wer füllt eine
  # Steuererklärung aus?; Wohnsitzverlegung).
  - id: canton
    key: profile.canton
    type: choice
    explain:
      en: 'The canton you lived in on 31 December taxes your whole year: cantonal, communal and federal tax. Taxpresso prepares returns for {cantons} so far.'
      fr: 'Le canton où vous habitiez au 31 décembre vous impose pour toute l’année : impôt cantonal, communal et fédéral. Taxpresso prépare pour l’instant les déclarations de ces cantons : {cantons}.'
      de: 'Der Kanton, in dem du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr: Staats-, Gemeinde- und Bundessteuer. Taxpresso bereitet bisher Steuererklärungen für {cantons} vor.'
    learnMore:
      url: 'https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1991/1184_1184_1184/20260101/fr/pdf-a/fedlex-data-admin-ch-eli-cc-1991-1184_1184_1184-20260101-fr-pdf-a.pdf#page=58'
      label:
        en: 'Federal tax law (LIFD), art. 105: the canton at the end of the year, in French'
        fr: 'LIFD, art. 105 : Rattachement personnel'
        de: 'Bundessteuergesetz (DBG, LIFD), Art. 105: der Kanton am Ende des Jahres, auf Französisch'
    link:
      url: 'https://github.com/nisheetpatel/taxpresso/issues/1'
      label:
        en: 'Vote for the next canton'
        fr: 'Votez pour le prochain canton'
        de: 'Stimm für den nächsten Kanton ab'
    text:
      en: 'Where did you live on 31 December 2026?'
      fr: 'Où habitiez-vous au 31 décembre 2026 ?'
      de: 'Wo hast du am 31. Dezember 2026 gewohnt?'
    help:
      en: 'Moved from another canton during 2026? Choose the canton you lived in on 31 December: it taxes the whole year, as if you had lived there since January. Other cantons are coming: vote for yours.'
      fr: 'Vous avez déménagé d’un autre canton en 2026 ? Choisissez celui où vous habitiez au 31 décembre : il vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. D’autres cantons arrivent : votez pour le vôtre.'
      de: 'Du bist 2026 aus einem anderen Kanton umgezogen? Wähl den Kanton, in dem du am 31. Dezember gewohnt hast: Er besteuert das ganze Jahr, als hättest du seit Januar dort gewohnt. Weitere Kantone folgen: Stimm für deinen ab.'
    options:
      - value: GE
        label: { en: 'Canton of Geneva', fr: 'Canton de Genève', de: 'Kanton Genf' }
        chip: { en: 'Geneva', fr: 'Genève', de: 'Genf' }
      - value: ZH
        label: { en: 'Canton of Zurich', fr: 'Canton de Zurich', de: 'Kanton Zürich' }
        chip: { en: 'Zurich', fr: 'Zurich', de: 'Zürich' }
      - value: BE
        label: { en: 'Canton of Bern', fr: 'Canton de Berne', de: 'Kanton Bern' }
        chip: { en: 'Bern', fr: 'Berne', de: 'Bern' }
      - value: BL
        label:
          {
            en: 'Canton of Basel-Landschaft',
            fr: 'Canton de Bâle-Campagne',
            de: 'Kanton Basel-Landschaft',
          }
        chip: { en: 'Basel-Landschaft', fr: 'Bâle-Campagne', de: 'Basel-Landschaft' }
      - value: VD
        label: { en: 'Canton of Vaud', fr: 'Canton de Vaud', de: 'Kanton Waadt' }
        chip: { en: 'Vaud', fr: 'Vaud', de: 'Waadt' }
      - value: BS
        label: { en: 'Canton of Basel-Stadt', fr: 'Canton de Bâle-Ville', de: 'Kanton Basel-Stadt' }
        chip: { en: 'Basel-Stadt', fr: 'Bâle-Ville', de: 'Basel-Stadt' }
      - value: ZG
        label: { en: 'Canton of Zug', fr: 'Canton de Zoug', de: 'Kanton Zug' }
        chip: { en: 'Zug', fr: 'Zoug', de: 'Zug' }
      - value: LU
        label: { en: 'Canton of Lucerne', fr: 'Canton de Lucerne', de: 'Kanton Luzern' }
        chip: { en: 'Lucerne', fr: 'Lucerne', de: 'Luzern' }
      - value: SG
        label: { en: 'Canton of St. Gallen', fr: 'Canton de Saint-Gall', de: 'Kanton St. Gallen' }
        chip: { en: 'St. Gallen', fr: 'Saint-Gall', de: 'St. Gallen' }
      - value: FR
        label: { en: 'Canton of Fribourg', fr: 'Canton de Fribourg', de: 'Kanton Freiburg' }
        chip: { en: 'Fribourg', fr: 'Fribourg', de: 'Freiburg' }
      - value: AG
        label: { en: 'Canton of Aargau', fr: 'Canton d’Argovie', de: 'Kanton Aargau' }
        chip: { en: 'Aargau', fr: 'Argovie', de: 'Aargau' }
      # The cantons Taxpresso covers are named from the options above ({cantonsOr}, {cantons}:
      # packages/questionnaire, schema.ts), so adding a canton adds its option only.
      - value: other
        label: { en: 'Another canton', fr: 'Un autre canton', de: 'Ein anderer Kanton' }
        notSupported:
          en: 'A canton other than {cantonsOr}'
          fr: 'Un autre canton que {cantonsOr}'
          de: 'Ein anderer Kanton als {cantonsOr}'

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (situation on 31 December)
  - id: civil_status
    key: profile.civil_status
    type: choice
    explain:
      en: 'Your situation on 31 December decides whether you file alone or as a couple, on one declaration together.'
      fr: 'Votre situation au 31 décembre décide si vous déclarez seul ou en couple, sur une seule déclaration commune.'
      de: 'Deine Situation am 31. Dezember entscheidet, ob du allein oder als Paar eine gemeinsame Steuererklärung ausfüllst.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: personal situation, in French'
        fr: 'Instructions IFD 2026, p. 1 : Situation personnelle'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: persönliche Verhältnisse, auf Französisch'
    text:
      en: 'What was your civil status on 31 December 2026?'
      fr: 'Quel était votre état civil au 31 décembre 2026 ?'
      de: 'Was war dein Zivilstand am 31. Dezember 2026?'
    options:
      - { value: single, label: { en: 'Single', fr: 'Célibataire', de: 'Ledig' } }
      - { value: married, label: { en: 'Married', fr: 'Marié(e)', de: 'Verheiratet' } }
      - value: registered_partnership
        label:
          {
            en: 'Registered partnership',
            fr: 'Partenariat enregistré',
            de: 'Eingetragene Partnerschaft',
          }
      - { value: separated, label: { en: 'Separated', fr: 'Séparé(e)', de: 'Getrennt' } }
      - { value: divorced, label: { en: 'Divorced', fr: 'Divorcé(e)', de: 'Geschieden' } }
      - { value: widowed, label: { en: 'Widowed', fr: 'Veuf ou veuve', de: 'Verwitwet' } }

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (Enfants)
  - id: children
    key: profile.children_count
    type: number
    min: 0
    max: 12
    explain:
      en: 'Count the children who live with you or whom you support financially. Unsure about an adult child? Ask Claude.'
      fr: 'Comptez les enfants qui vivent avec vous ou que vous entretenez. Un doute pour un enfant majeur ? Demandez à Claude.'
      de: 'Zähl die Kinder, die bei dir leben oder für deren Unterhalt du aufkommst. Unsicher bei einem volljährigen Kind? Frag Claude.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: children, in French'
        fr: 'Instructions IFD 2026, p. 1 : Enfants'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: Kinder, auf Französisch'
    text:
      en: 'How many children did you support in 2026?'
      fr: 'Combien d’enfants aviez-vous à charge en 2026 ?'
      de: 'Für wie viele Kinder bist du 2026 aufgekommen?'
    chip:
      zero: { en: 'No children', fr: 'Pas d’enfants', de: 'Keine Kinder' }
      one: { en: '1 child', fr: '1 enfant', de: '1 Kind' }
      other: { en: '{n} children', fr: '{n} enfants', de: '{n} Kinder' }

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (Enfants)
  - id: children_custody
    key: profile.children_custody
    type: choice
    when: { key: profile.children_count, gt: 0 }
    explain:
      en: 'Who the children mainly live with. Shared custody means they live with each parent about half the time.'
      fr: 'Chez qui les enfants vivent surtout. En garde partagée, ils vivent environ la moitié du temps chez chaque parent.'
      de: 'Bei wem die Kinder hauptsächlich leben. Bei geteilter Obhut leben sie etwa die Hälfte der Zeit bei jedem Elternteil.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: children, in French'
        fr: 'Instructions IFD 2026, p. 1 : Enfants'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: Kinder, auf Französisch'
    text:
      en: 'Where did the children live in 2026?'
      fr: 'Où vivaient les enfants en 2026 ?'
      de: 'Wo haben die Kinder 2026 gelebt?'
    options:
      - value: with_household
        label:
          { en: 'With me, or with us', fr: 'Avec moi, ou avec nous', de: 'Bei mir oder bei uns' }
      - value: shared
        label: { en: 'Shared custody', fr: 'En garde partagée', de: 'In geteilter Obhut' }
        chip: { en: 'Shared custody', fr: 'Garde partagée', de: 'Geteilte Obhut' }
      - value: elsewhere
        label:
          {
            en: 'Mostly with the other parent',
            fr: 'Surtout chez l’autre parent',
            de: 'Hauptsächlich beim anderen Elternteil',
          }

  # Parents who share custody without a partner: child support decides who gets the federal
  # parental scale and the child deductions (ch-na-circulaire-30-epoux-famille p. 24, ch. 13.4.2;
  # p. 32 and 33, ch. 14.4 and 14.5); each canton's own rules say what it decides there.
  - id: child_support
    key: profile.child_support
    type: choice
    when:
      all:
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
    explain:
      en: 'With shared custody, only one parent gets the federal parental scale (barème parental), a lower rate: the one who receives child support or, without child support, the one who earns more. Without child support, you each get half the child deductions.'
      fr: 'En garde partagée, un seul parent a droit au barème parental fédéral, un taux plus bas : celui qui reçoit la contribution d’entretien ou, sans contribution, celui qui gagne le plus. Sans contribution d’entretien, chacun a la moitié des déductions pour enfants.'
      de: 'Bei geteilter Obhut erhält nur ein Elternteil den Elterntarif der Bundessteuer, einen tieferen Satz: wer Unterhaltsbeiträge erhält oder, ohne Unterhaltsbeiträge, wer mehr verdient. Ohne Unterhaltsbeiträge erhält jeder die Hälfte der Kinderabzüge.'
    # ch-na-circulaire-30-epoux-famille p. 24
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/2YuHXYYJMbn9/dbst-ks-2010-1-030-d-fr.pdf#page=24'
      label:
        en: 'Federal tax circular 30, p. 24: the parental scale when parents live apart'
        fr: 'Circulaire AFC n° 30, p. 24 : Barème parental des parents séparés'
        de: 'Kreisschreiben ESTV Nr. 30, S. 24: Elterntarif getrennt lebender Eltern, auf Französisch'
    text:
      en: 'In 2026, did you or the other parent pay child support for the children?'
      fr: 'En 2026, vous ou l’autre parent avez-vous versé une contribution d’entretien pour les enfants ?'
      de: 'Hast du oder hat der andere Elternteil 2026 Unterhaltsbeiträge für die Kinder bezahlt?'
    help:
      en: 'Child support (contribution d’entretien) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'
    options:
      - value: i_receive
        label:
          {
            en: 'The other parent paid me child support',
            fr: 'L’autre parent m’a versé une contribution d’entretien',
            de: 'Der andere Elternteil hat mir Unterhaltsbeiträge bezahlt',
          }
        chip:
          {
            en: 'Receives child support',
            fr: 'Reçoit une contribution',
            de: 'Erhält Unterhaltsbeiträge',
          }
      - value: i_pay
        label:
          {
            en: 'I paid child support to the other parent',
            fr: 'J’ai versé une contribution d’entretien à l’autre parent',
            de: 'Ich habe dem anderen Elternteil Unterhaltsbeiträge bezahlt',
          }
        chip:
          { en: 'Pays child support', fr: 'Verse une contribution', de: 'Zahlt Unterhaltsbeiträge' }
      - value: none_i_earn_more
        label:
          {
            en: 'No child support, and I earn more than the other parent',
            fr: 'Pas de contribution, et je gagne plus que l’autre parent',
            de: 'Keine Unterhaltsbeiträge, und ich verdiene mehr als der andere Elternteil',
          }
      - value: none_other_earns_more
        label:
          {
            en: 'No child support, and the other parent earns more',
            fr: 'Pas de contribution, et l’autre parent gagne plus',
            de: 'Keine Unterhaltsbeiträge, und der andere Elternteil verdient mehr',
          }
      - value: none_unsure
        label:
          {
            en: 'No child support, and I don’t know who earns more',
            fr: 'Pas de contribution, et je ne sais pas qui gagne le plus',
            de: 'Keine Unterhaltsbeiträge, und ich weiss nicht, wer mehr verdient',
          }

  # ch-2026-ifd-instructions-personnes-physiques p. 8 (frais de garde par des tiers)
  - id: childcare
    key: profile.childcare
    type: choice
    when: { key: profile.children_count, gt: 0 }
    explain:
      en: 'What you paid so someone looks after your children while you work: crèche, day care, after-school care or a nanny.'
      fr: 'Ce que vous avez payé pour faire garder vos enfants pendant que vous travaillez : crèche, garderie, parascolaire ou nourrice.'
      de: 'Was du bezahlt hast, damit jemand deine Kinder betreut, während du arbeitest: Kita, Hort, Tagesstruktur oder Nanny.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=8'
      label:
        en: 'Federal tax instructions 2026, p. 8: childcare costs, in French'
        fr: 'Instructions IFD 2026, p. 8 : Frais de garde par des tiers'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 8: Kinderbetreuungskosten, auf Französisch'
    text:
      en: 'Did you pay for childcare in 2026?'
      fr: 'Avez-vous payé des frais de garde en 2026 ?'
      de: 'Hast du 2026 für Kinderbetreuung bezahlt?'
    help:
      en: 'Crèche, day care, after-school care or a nanny.'
      fr: 'Crèche, garderie, parascolaire ou nourrice.'
      de: 'Kita, Hort, Tagesstruktur oder Nanny.'
    options:
      - value: creche_or_daycare
        label:
          {
            en: 'Yes, a crèche or day care',
            fr: 'Oui, une crèche ou une garderie',
            de: 'Ja, eine Kita oder einen Hort',
          }
        chip: { en: 'Crèche', fr: 'Crèche', de: 'Kita' }
      - value: nanny
        label: { en: 'Yes, a nanny', fr: 'Oui, une nourrice', de: 'Ja, eine Nanny' }
        chip: { en: 'Nanny', fr: 'Nourrice', de: 'Nanny' }
      - value: none
        label:
          { en: 'No childcare costs', fr: 'Pas de frais de garde', de: 'Keine Betreuungskosten' }

  # ch-2026-ifd-instructions-personnes-physiques p. 3 (chiffre 3)
  - id: income_sources
    key: profile.income_sources
    type: multi
    perPerson: true
    explain:
      en: 'Benefits: money paid by unemployment, sickness or accident insurance. Pension: a regular payment from AVS, AI or a pension fund.'
      fr: 'Indemnités : l’argent versé par l’assurance chômage, maladie ou accident. Rente : un versement régulier de l’AVS, de l’AI ou d’une caisse de pension.'
      de: 'Taggelder: Geld von der Arbeitslosen-, Kranken- oder Unfallversicherung. Rente: eine regelmässige Zahlung der AHV, der IV oder einer Pensionskasse.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=3'
      label:
        en: 'Federal tax instructions 2026, p. 3: pensions and benefits, in French'
        fr: 'Instructions IFD 2026, p. 3 : Revenus des assurances sociales'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 3: Renten und Taggelder, auf Französisch'
    text:
      p1:
        en: 'What income did you have in 2026?'
        fr: 'Quels revenus avez-vous eus en 2026 ?'
        de: 'Welche Einkünfte hattest du 2026?'
      p2:
        en: 'What income did your spouse or partner have in 2026?'
        fr: 'Quels revenus votre conjoint ou partenaire a-t-il eus en 2026 ?'
        de: 'Welche Einkünfte hatte dein Partner oder deine Partnerin 2026?'
    help:
      en: 'Choose all that apply. Interest and dividends come later, with your bank documents.'
      fr: 'Choisissez tout ce qui s’applique. Les intérêts et dividendes viennent plus tard, avec vos documents bancaires.'
      de: 'Wähl alles, was zutrifft. Zinsen und Dividenden kommen später, mit deinen Bankunterlagen.'
    none: { en: 'None of these', fr: 'Aucun de ceux-là', de: 'Nichts davon' }
    options:
      - { value: salary, label: { en: 'A salary', fr: 'Un salaire', de: 'Ein Lohn' } }
      - value: replacement_income
        label:
          en: 'Unemployment, sickness or accident benefits'
          fr: 'Des indemnités (chômage, maladie, accident)'
          de: 'Taggelder (Arbeitslosigkeit, Krankheit, Unfall)'
        chip: { en: 'Benefits', fr: 'Indemnités', de: 'Taggelder' }
      - value: pension
        label:
          {
            en: 'A pension (AVS, AI or pension fund)',
            fr: 'Une rente (AVS, AI ou caisse de pension)',
            de: 'Eine Rente (AHV, IV oder Pensionskasse)',
          }
        chip: { en: 'Pension', fr: 'Rente', de: 'Rente' }
      - value: alimony
        label:
          {
            en: 'Alimony or child support received',
            fr: 'Une pension alimentaire reçue',
            de: 'Erhaltene Unterhaltsbeiträge',
          }
        chip: { en: 'Receives alimony', fr: 'Reçoit une pension', de: 'Erhält Unterhalt' }
      - value: self_employment
        label:
          {
            en: 'Income from self-employment',
            fr: 'Un revenu d’activité indépendante',
            de: 'Einkommen aus selbständiger Erwerbstätigkeit',
          }
        notSupported:
          {
            en: 'Self-employment',
            fr: 'L’activité indépendante',
            de: 'Die selbständige Erwerbstätigkeit',
          }

  # ch-2026-ifd-instructions-personnes-physiques p. 1 (chiffre 1er: one certificate per employer)
  - id: employers
    key: profile.employers
    type: number
    perPerson: true
    min: 1
    max: 9
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Count every employer you worked for during the year, even briefly. Each one gives you a salary certificate.'
      fr: 'Comptez tous les employeurs de l’année, même pour peu de temps. Chacun vous remet un certificat de salaire.'
      de: 'Zähl alle Arbeitgeber des Jahres, auch für kurze Zeit. Jeder gibt dir einen Lohnausweis.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=1'
      label:
        en: 'Federal tax instructions 2026, p. 1: employment income, in French'
        fr: 'Instructions IFD 2026, p. 1 : Activité lucrative dépendante'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 1: unselbständige Erwerbstätigkeit, auf Französisch'
    text:
      p1:
        en: 'How many employers paid you a salary in 2026?'
        fr: 'Combien d’employeurs vous ont versé un salaire en 2026 ?'
        de: 'Wie viele Arbeitgeber haben dir 2026 einen Lohn bezahlt?'
      p2:
        en: 'How many employers paid your spouse or partner a salary in 2026?'
        fr: 'Combien d’employeurs ont versé un salaire à votre conjoint ou partenaire en 2026 ?'
        de: 'Wie viele Arbeitgeber haben deinem Partner oder deiner Partnerin 2026 einen Lohn bezahlt?'
    help:
      en: 'Each one gives you a salary certificate (certificat de salaire).'
      fr: 'Chacun vous remet un certificat de salaire.'
      de: 'Jeder gibt dir einen Lohnausweis.'
    chip:
      one: { en: '1 employer', fr: '1 employeur', de: '1 Arbeitgeber' }
      other: { en: '{n} employers', fr: '{n} employeurs', de: '{n} Arbeitgeber' }

  # ch-na-is-faq-circulaire-45 (tax at source on employment income)
  - id: taxed_at_source
    key: profile.taxed_at_source
    type: yesno
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Your employer took tax off your salary before paying you. Common with a B or L permit. Your salary certificate shows it.'
      fr: 'Votre employeur a retenu l’impôt sur votre salaire avant de vous le verser. Fréquent avec un permis B ou L. Votre certificat de salaire l’indique.'
      de: 'Dein Arbeitgeber hat die Steuer vom Lohn abgezogen, bevor er ihn dir bezahlt hat. Häufig mit einer Bewilligung B oder L. Dein Lohnausweis zeigt es.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/estv/fr/dokumente/dbst/kreisschreiben/dbst-ks-2022-1-045-d-faq-fr.pdf.download.pdf/dbst-ks-2022-1-045-d-faq-fr.pdf'
      label:
        en: 'Tax at source on employment income: federal questions and answers, in French'
        fr: 'Imposition à la source du revenu de l’activité lucrative : questions et réponses (AFC)'
        de: 'Quellensteuer auf dem Erwerbseinkommen: Fragen und Antworten der ESTV, auf Französisch'
    text:
      p1:
        en: 'Was your salary taxed at source in 2026?'
        fr: 'Votre salaire était-il imposé à la source en 2026 ?'
        de: 'Wurde dein Lohn 2026 an der Quelle besteuert?'
      p2:
        en: 'Was your spouse or partner’s salary taxed at source in 2026?'
        fr: 'Le salaire de votre conjoint ou partenaire était-il imposé à la source en 2026 ?'
        de: 'Wurde der Lohn deines Partners oder deiner Partnerin 2026 an der Quelle besteuert?'
    help:
      en: 'If so, it shows on the salary certificate.'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire.'
      de: 'Wenn ja, steht es auf dem Lohnausweis.'
    chip: { en: 'Taxed at source', fr: 'Imposé à la source', de: 'Quellenbesteuert' }

  # ch-2026-ifd-instructions-personnes-physiques p. 7 (chiffre 13)
  - id: pillar3a
    key: profile.pillar3a
    type: yesno
    perPerson: true
    when:
      { key: profile.income_sources, includesAny: [salary, replacement_income, self_employment] }
    explain:
      en: 'Pillar 3a (3e pilier A) is a retirement account at a bank or insurer. What you pay in during the year lowers your taxable income, up to a yearly limit.'
      fr: 'Le 3e pilier A est un compte de prévoyance dans une banque ou une assurance. Ce que vous y versez dans l’année diminue votre revenu imposable, jusqu’à une limite annuelle.'
      de: 'Die Säule 3a ist ein Vorsorgekonto bei einer Bank oder Versicherung. Was du im Jahr einzahlst, senkt dein steuerbares Einkommen, bis zu einem jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=7'
      label:
        en: 'Federal tax instructions 2026, p. 7: pillar 3a, in French'
        fr: 'Instructions IFD 2026, p. 7 : Pilier 3a'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 7: Säule 3a, auf Französisch'
    text:
      p1:
        en: 'Did you pay into a pillar 3a account in 2026?'
        fr: 'Avez-vous versé des cotisations au 3e pilier A en 2026 ?'
        de: 'Hast du 2026 in die Säule 3a einbezahlt?'
      p2:
        en: 'Did your spouse or partner pay into a pillar 3a account in 2026?'
        fr: 'Votre conjoint ou partenaire a-t-il versé des cotisations au 3e pilier A en 2026 ?'
        de: 'Hat dein Partner oder deine Partnerin 2026 in die Säule 3a einbezahlt?'
    help:
      en: 'Your bank or insurer sends an attestation.'
      fr: 'Votre banque ou votre assurance vous envoie une attestation.'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung.'
    chip: { en: 'Pays into 3a', fr: 'Cotise au 3e pilier A', de: 'Zahlt in die Säule 3a' }

  # ch-2026-ifd-instructions-personnes-physiques p. 8 (chiffre 15)
  - id: lpp_buyin
    key: profile.lpp_buyin
    type: yesno
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Your pension fund at work (2nd pillar, LPP) takes contributions from your salary every month. A buy-in (rachat) is an extra payment you chose to make on top. Most people never make one.'
      fr: 'Votre caisse de pension (2e pilier, LPP) prélève des cotisations sur votre salaire chaque mois. Un rachat est un versement supplémentaire que vous avez choisi de faire en plus. La plupart des gens n’en font jamais.'
      de: 'Deine Pensionskasse (2. Säule, BVG) zieht jeden Monat Beiträge vom Lohn ab. Ein Einkauf ist eine zusätzliche Zahlung, die du freiwillig obendrauf leistest. Die meisten Leute machen nie einen.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=8'
      label:
        en: 'Federal tax instructions 2026, p. 8: other deductions, in French'
        fr: 'Instructions IFD 2026, p. 8 : Autres déductions'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 8: weitere Abzüge, auf Französisch'
    text:
      p1:
        en: 'Did you buy into your pension fund (2nd pillar) in 2026?'
        fr: 'Avez-vous fait un rachat dans votre caisse de pension (2e pilier) en 2026 ?'
        de: 'Hast du dich 2026 in deine Pensionskasse (2. Säule) eingekauft?'
      p2:
        en: 'Did your spouse or partner buy into their pension fund (2nd pillar) in 2026?'
        fr: 'Votre conjoint ou partenaire a-t-il fait un rachat dans sa caisse de pension (2e pilier) en 2026 ?'
        de: 'Hat sich dein Partner oder deine Partnerin 2026 in die Pensionskasse (2. Säule) eingekauft?'
    help:
      en: 'A voluntary payment on top of the usual contributions.'
      fr: 'Un versement volontaire en plus des cotisations habituelles.'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen.'
    chip: { en: 'Pension fund buy-in', fr: 'Rachat 2e pilier', de: 'Einkauf 2. Säule' }

  # Travel to work (frais de déplacement): ch-2026-ifd-instructions-personnes-physiques p. 6
  # (chiffre 10, federal rules by means of transport).
  - id: commute
    key: profile.commute
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Getting to work can be deducted as travel costs (frais de déplacement). How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg kann als Fahrkosten abgezogen werden. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
    text:
      p1:
        en: 'How did you mostly get to work in 2026?'
        fr: 'Comment vous rendiez-vous surtout au travail en 2026 ?'
        de: 'Wie bist du 2026 meistens zur Arbeit gekommen?'
      p2:
        en: 'How did your spouse or partner mostly get to work in 2026?'
        fr: 'Comment votre conjoint ou partenaire se rendait-il surtout au travail en 2026 ?'
        de: 'Wie ist dein Partner oder deine Partnerin 2026 meistens zur Arbeit gekommen?'
    help:
      en: 'Choose how you went on most work days.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail.'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist.'
    options:
      - value: public_transport
        label: { en: 'Public transport', fr: 'Transports publics', de: 'Öffentlicher Verkehr' }
      - value: public_transport_long
        label:
          {
            en: 'Public transport, over 2 hours a day there and back',
            fr: 'Transports publics, plus de 2 heures par jour aller et retour',
            de: 'Öffentlicher Verkehr, über 2 Stunden pro Tag hin und zurück',
          }
        chip: { en: 'Long trip to work', fr: 'Long trajet', de: 'Langer Arbeitsweg' }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Mofa mit gelbem Kontrollschild',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice' }

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_transit_cost
    key: commute.transit_cost
    type: money
    perPerson: true
    when: { key: profile.commute, in: [public_transport, public_transport_long] }
    explain:
      en: 'You deduct what you actually paid to get to work, up to a yearly limit.'
      fr: 'Vous déduisez ce que vous avez réellement payé pour aller au travail, jusqu’à une limite annuelle.'
      de: 'Du ziehst ab, was du für den Arbeitsweg tatsächlich bezahlt hast, bis zu einem jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
    text:
      p1:
        en: 'How much did you pay in 2026 for public transport to get to work?'
        fr: 'Combien avez-vous payé en 2026 de transports publics pour aller au travail ?'
        de: 'Wie viel hast du 2026 für den öffentlichen Verkehr zur Arbeit bezahlt?'
      p2:
        en: 'How much did your spouse or partner pay in 2026 for public transport to get to work?'
        fr: 'Combien votre conjoint ou partenaire a-t-il payé en 2026 de transports publics pour aller au travail ?'
        de: 'Wie viel hat dein Partner oder deine Partnerin 2026 für den öffentlichen Verkehr zur Arbeit bezahlt?'
    help:
      en: 'Your yearly pass, or your monthly passes and tickets added up, in CHF. Leave out what your employer paid back.'
      fr: 'Votre abonnement annuel, ou vos abonnements mensuels et billets additionnés, en CHF. Sans ce que votre employeur vous a remboursé.'
      de: 'Dein Jahresabo, oder deine Monatsabos und Billette zusammengezählt, in CHF. Ohne das, was dir dein Arbeitgeber zurückbezahlt hat.'

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_transit_usable
    key: commute.transit_usable
    type: choice
    perPerson: true
    when: { key: profile.commute, in: [car, motorbike] }
    explain:
      en: 'For the federal tax, a driver deducts what public transport would have cost. Only when you can’t use it (no line nearby, a disability, working hours with no service) do the kilometres count.'
      fr: 'Pour l’impôt fédéral, un conducteur déduit ce qu’auraient coûté les transports publics. Ce n’est que si vous ne pouvez pas les utiliser (pas de ligne à proximité, un handicap, des horaires sans desserte) que les kilomètres comptent.'
      de: 'Bei der Bundessteuer zieht man als Autofahrerin oder Autofahrer ab, was der öffentliche Verkehr gekostet hätte. Nur wenn du ihn nicht nutzen kannst (keine Linie in der Nähe, eine Behinderung, Arbeitszeiten ohne Verbindung), zählen die Kilometer.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
    text:
      p1:
        en: 'Could you have made that trip by public transport?'
        fr: 'Auriez-vous pu faire ce trajet en transports publics ?'
        de: 'Hättest du diesen Weg mit dem öffentlichen Verkehr machen können?'
      p2:
        en: 'Could your spouse or partner have made that trip by public transport?'
        fr: 'Votre conjoint ou partenaire aurait-il pu faire ce trajet en transports publics ?'
        de: 'Hätte dein Partner oder deine Partnerin diesen Weg mit dem öffentlichen Verkehr machen können?'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, in 2 hours a day or less, there and back',
            fr: 'Oui, en 2 heures par jour ou moins, aller et retour',
            de: 'Ja, in 2 Stunden pro Tag oder weniger, hin und zurück',
          }
      - value: yes_long
        label:
          {
            en: 'Yes, but it takes over 2 hours a day, there and back',
            fr: 'Oui, mais il faut plus de 2 heures par jour, aller et retour',
            de: 'Ja, aber es dauert über 2 Stunden pro Tag, hin und zurück',
          }
      - value: 'no'
        label:
          {
            en: 'No, there is no public transport I can use',
            fr: 'Non, aucun transport public que je puisse utiliser',
            de: 'Nein, es gibt keinen öffentlichen Verkehr, den ich nutzen kann',
          }

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_transit_equivalent
    key: commute.transit_equivalent
    type: money
    perPerson: true
    when: { key: commute.transit_usable, in: ['yes', yes_long] }
    explain:
      en: 'That price is what the federal tax lets you deduct for driving to work, up to a yearly limit.'
      fr: 'C’est ce prix que l’impôt fédéral vous laisse déduire pour le trajet en véhicule, jusqu’à une limite annuelle.'
      de: 'Diesen Preis darfst du bei der Bundessteuer für die Fahrt zur Arbeit abziehen, bis zu einem jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
    text:
      p1:
        en: 'What would a public transport pass for that trip have cost for 2026?'
        fr: 'Combien aurait coûté un abonnement de transports publics pour ce trajet en 2026 ?'
        de: 'Was hätte ein Abo des öffentlichen Verkehrs für diesen Weg 2026 gekostet?'
      p2:
        en: 'What would a public transport pass for your spouse or partner’s trip have cost for 2026?'
        fr: 'Combien aurait coûté un abonnement de transports publics pour le trajet de votre conjoint ou partenaire en 2026 ?'
        de: 'Was hätte ein Abo des öffentlichen Verkehrs für den Weg deines Partners oder deiner Partnerin 2026 gekostet?'
    help:
      en: 'The cheapest pass covering the trip, for the months worked, in CHF.'
      fr: 'L’abonnement le moins cher couvrant le trajet, pour les mois travaillés, en CHF.'
      de: 'Das günstigste Abo für diesen Weg, für die gearbeiteten Monate, in CHF.'

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_distance
    key: commute.distance_km
    type: number
    perPerson: true
    min: 1
    max: 300
    when: { key: commute.transit_usable, in: ['no'] }
    explain:
      en: 'Without public transport you can use, the federal tax counts a fixed amount per kilometre, there and back once a day, up to a yearly limit.'
      fr: 'Sans transport public utilisable, l’impôt fédéral compte un montant fixe par kilomètre, un aller et retour par jour, jusqu’à une limite annuelle.'
      de: 'Ohne nutzbaren öffentlichen Verkehr zählt die Bundessteuer einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, bis zu einem jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
    text:
      p1:
        en: 'How many kilometres is it from your home to your workplace, one way?'
        fr: 'Combien de kilomètres y a-t-il de votre domicile à votre lieu de travail, aller simple ?'
        de: 'Wie viele Kilometer sind es von deinem Zuhause zum Arbeitsort, einfach?'
      p2:
        en: 'How many kilometres is it from your spouse or partner’s home to their workplace, one way?'
        fr: 'Combien de kilomètres y a-t-il du domicile de votre conjoint ou partenaire à son lieu de travail, aller simple ?'
        de: 'Wie viele Kilometer sind es vom Zuhause deines Partners oder deiner Partnerin zum Arbeitsort, einfach?'
    help:
      en: 'Round to the nearest kilometre.'
      fr: 'Arrondi au kilomètre.'
      de: 'Auf den Kilometer gerundet.'

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_drive_days
    key: commute.drive_days
    type: number
    perPerson: true
    min: 1
    max: 366
    when: { key: commute.transit_usable, in: ['no'] }
    explain:
      en: 'The kilometres count for each day you drove to work, once there and back.'
      fr: 'Les kilomètres comptent pour chaque jour de trajet au travail, un aller et retour.'
      de: 'Die Kilometer zählen für jeden Tag, an dem du zur Arbeit gefahren bist, einmal hin und zurück.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
    text:
      p1:
        en: 'On how many days did you drive to work in 2026?'
        fr: 'Combien de jours avez-vous pris votre véhicule pour aller au travail en 2026 ?'
        de: 'An wie vielen Tagen bist du 2026 mit dem Fahrzeug zur Arbeit gefahren?'
      p2:
        en: 'On how many days did your spouse or partner drive to work in 2026?'
        fr: 'Combien de jours votre conjoint ou partenaire a-t-il pris son véhicule pour aller au travail en 2026 ?'
        de: 'An wie vielen Tagen ist dein Partner oder deine Partnerin 2026 mit dem Fahrzeug zur Arbeit gefahren?'
    help:
      en: 'Leave out holidays, sick days and days worked from home.'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail.'
      de: 'Ohne Ferien, Krankheitstage und Tage im Homeoffice.'

  # Lunches away from home (frais de repas): per day up to a yearly limit, half with box G of the
  # salary certificate; none when the meal costs 10 francs or less, none on days worked from home
  # (ch-2026-ifd-instructions-personnes-physiques p. 6).
  - id: meal_days
    key: meals.days
    type: number
    perPerson: true
    min: 0
    max: 366
    when:
      {
        key: profile.commute,
        in: [public_transport, public_transport_long, car, motorbike, bike, walk],
      }
    explain:
      en: 'Lunch away from home because of work costs more than at home. A fixed amount per day counts, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison. Un montant fixe par jour compte, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen wegen der Arbeit kostet mehr als zu Hause. Es zählt ein fester Betrag pro Tag, bis zu einem jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: meals, in French'
        fr: 'Instructions IFD 2026, p. 6 : Frais de repas'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Verpflegung, auf Französisch'
    text:
      p1:
        en: 'On how many work days in 2026 did you have lunch away from home?'
        fr: 'Combien de jours de travail en 2026 avez-vous pris votre repas de midi hors de chez vous ?'
        de: 'An wie vielen Arbeitstagen 2026 hast du auswärts zu Mittag gegessen?'
      p2:
        en: 'On how many work days in 2026 did your spouse or partner have lunch away from home?'
        fr: 'Combien de jours de travail en 2026 votre conjoint ou partenaire a-t-il pris son repas de midi hors de chez lui ?'
        de: 'An wie vielen Arbeitstagen 2026 hat dein Partner oder deine Partnerin auswärts zu Mittag gegessen?'
    help:
      en: 'Count the days your lunch cost you more than 10 francs; 0 if you usually ate at home.'
      fr: 'Comptez les jours où votre repas vous a coûté plus de 10 francs ; 0 si vous mangiez en général à la maison.'
      de: 'Zähl die Tage, an denen dich das Mittagessen mehr als 10 Franken gekostet hat; 0, wenn du meistens zu Hause gegessen hast.'

  # ch-2026-ifd-instructions-personnes-physiques p. 3 (chiffre 4: securities and accounts)
  - id: banks
    key: profile.banks
    type: number
    min: 0
    max: 20
    explain:
      en: 'Every bank where you had an account, savings or investments on 31 December, including your children’s accounts.'
      fr: 'Toutes les banques où vous aviez un compte, de l’épargne ou des placements au 31 décembre, y compris les comptes de vos enfants.'
      de: 'Alle Banken, bei denen du am 31. Dezember ein Konto, Ersparnisse oder Anlagen hattest, auch die Konten deiner Kinder.'
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=3'
      label:
        en: 'Federal tax instructions 2026, p. 3: securities and accounts, in French'
        fr: 'Instructions IFD 2026, p. 3 : Rendement des titres'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 3: Wertschriften und Guthaben, auf Französisch'
    text:
      en: 'With how many banks did you have accounts or securities on 31 December 2026?'
