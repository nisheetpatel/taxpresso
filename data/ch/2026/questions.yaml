    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Your pension fund at work (2nd pillar, LPP) takes contributions from your salary every month. A buy-in (rachat) is an extra payment you chose to make on top. Most people never make one.'
      fr: 'Votre caisse de pension (2e pilier, LPP) prélève des cotisations sur votre salaire chaque mois. Un rachat est un versement supplémentaire que vous avez choisi de faire en plus. La plupart des gens n’en font jamais.'
      de: 'Deine Pensionskasse (2. Säule, BVG) zieht jeden Monat Beiträge vom Lohn ab. Ein Einkauf ist eine zusätzliche Zahlung, die du freiwillig obendrauf leistest. Die meisten Leute machen nie einen.'
      it: 'La tua cassa pensione (2° pilastro, LPP) trattiene ogni mese dei contributi dal tuo salario. Un riscatto (rachat) è un versamento in più che hai scelto di fare. La maggior parte delle persone non ne fa mai.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=8'
      label:
        en: 'Federal tax instructions 2026, p. 8: other deductions, in French'
        fr: 'Instructions IFD 2026, p. 8 : Autres déductions'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 8: weitere Abzüge, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 8: altre deduzioni, in francese'
    text:
      p1:
        en: 'Did you buy into your pension fund (2nd pillar) in {year}?'
        fr: 'Avez-vous fait un rachat dans votre caisse de pension (2e pilier) en {year} ?'
        de: 'Hast du dich {year} in deine Pensionskasse (2. Säule) eingekauft?'
        it: 'Nel {year} hai fatto un riscatto nella tua cassa pensione (2° pilastro)?'
      p2:
        en: 'Did your spouse or partner buy into their pension fund (2nd pillar) in {year}?'
        fr: 'Votre conjoint ou partenaire a-t-il fait un rachat dans sa caisse de pension (2e pilier) en {year} ?'
        de: 'Hat sich dein Partner oder deine Partnerin {year} in die Pensionskasse (2. Säule) eingekauft?'
        it: 'Nel {year} il tuo coniuge o partner ha fatto un riscatto nella sua cassa pensione (2° pilastro)?'
    help:
      en: 'A voluntary payment on top of the usual contributions.'
      fr: 'Un versement volontaire en plus des cotisations habituelles.'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen.'
      it: 'Un versamento volontario in più rispetto ai contributi abituali.'
    chip:
      {
        en: 'Pension fund buy-in',
        fr: 'Rachat 2e pilier',
        de: 'Einkauf 2. Säule',
        it: 'Riscatto 2° pilastro',
      }

  # Travel to work (frais de déplacement): ch-2026-ifd-instructions-personnes-physiques p. 6
  # (chiffre 10, federal rules by means of transport).
  - id: commute
    key: profile.commute
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Getting to work can be deducted as travel costs (frais de déplacement). How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg kann als Fahrkosten abgezogen werden. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto casa-lavoro si può dedurre come spese di trasporto (frais de déplacement). Il mezzo che usi decide come vengono calcolate.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: spese di trasporto'
    text:
      p1:
        en: 'How did you mostly get to work in {year}?'
        fr: 'Comment vous rendiez-vous surtout au travail en {year} ?'
        de: 'Wie bist du {year} meistens zur Arbeit gekommen?'
        it: 'Come andavi di solito al lavoro nel {year}?'
      p2:
        en: 'How did your spouse or partner mostly get to work in {year}?'
        fr: 'Comment votre conjoint ou partenaire se rendait-il surtout au travail en {year} ?'
        de: 'Wie ist dein Partner oder deine Partnerin {year} meistens zur Arbeit gekommen?'
        it: 'Come andava di solito al lavoro il tuo coniuge o partner nel {year}?'
    help:
      en: 'Choose how you went on most work days.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail.'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist.'
      it: 'Scegli come ci andavi nella maggior parte dei giorni di lavoro.'
    options:
      - value: public_transport
        label:
          {
            en: 'Public transport',
            fr: 'Transports publics',
            de: 'Öffentlicher Verkehr',
            it: 'Trasporti pubblici',
          }
      - value: public_transport_long
        label:
          {
            en: 'Public transport, over 2 hours a day there and back',
            fr: 'Transports publics, plus de 2 heures par jour aller et retour',
            de: 'Öffentlicher Verkehr, über 2 Stunden pro Tag hin und zurück',
            it: 'Trasporti pubblici, più di 2 ore al giorno andata e ritorno',
          }
        chip:
          {
            en: 'Long trip to work',
            fr: 'Long trajet',
            de: 'Langer Arbeitsweg',
            it: 'Tragitto lungo',
          }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto', it: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
            it: 'Moto o scooter con targa bianca',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Mofa mit gelbem Kontrollschild',
            it: 'Bici, e-bike o ciclomotore con targa gialla',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss', it: 'A piedi' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
            it: 'Da casa, quasi tutti i giorni',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice', it: 'Telelavoro' }

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_transit_cost
    key: commute.transit_cost
    type: money
    perPerson: true
    when: { key: profile.commute, in: [public_transport, public_transport_long] }
    explain:
      en: 'You deduct what you actually paid to get to work, up to a yearly limit.'
      fr: 'Vous déduisez ce que vous avez réellement payé pour aller au travail, jusqu’à une limite annuelle.'
      de: 'Du ziehst ab, was du für den Arbeitsweg tatsächlich bezahlt hast, bis zu einem jährlichen Höchstbetrag.'
      it: 'Deduci quello che hai effettivamente pagato per andare al lavoro, fino a un limite annuo.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: spese di trasporto'
    text:
      p1:
        en: 'How much did you pay in {year} for public transport to get to work?'
        fr: 'Combien avez-vous payé en {year} de transports publics pour aller au travail ?'
        de: 'Wie viel hast du {year} für den öffentlichen Verkehr zur Arbeit bezahlt?'
        it: 'Quanto hai speso nel {year} in trasporti pubblici per andare al lavoro?'
      p2:
        en: 'How much did your spouse or partner pay in {year} for public transport to get to work?'
        fr: 'Combien votre conjoint ou partenaire a-t-il payé en {year} de transports publics pour aller au travail ?'
        de: 'Wie viel hat dein Partner oder deine Partnerin {year} für den öffentlichen Verkehr zur Arbeit bezahlt?'
        it: 'Quanto ha speso il tuo coniuge o partner nel {year} in trasporti pubblici per andare al lavoro?'
    help:
      en: 'Your yearly pass, or your monthly passes and tickets added up, in CHF. Leave out what your employer paid back.'
      fr: 'Votre abonnement annuel, ou vos abonnements mensuels et billets additionnés, en CHF. Sans ce que votre employeur vous a remboursé.'
      de: 'Dein Jahresabo, oder deine Monatsabos und Billette zusammengezählt, in CHF. Ohne das, was dir dein Arbeitgeber zurückbezahlt hat.'
      it: 'Il tuo abbonamento annuale, o i tuoi abbonamenti mensili e biglietti sommati, in CHF. Togli quello che ti ha rimborsato il datore di lavoro.'

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_transit_usable
    key: commute.transit_usable
    type: choice
    perPerson: true
    when: { key: profile.commute, in: [car, motorbike] }
    explain:
      en: 'For the federal tax, a driver deducts what public transport would have cost. Only when you can’t use it (no line nearby, a disability, working hours with no service) do the kilometres count.'
      fr: 'Pour l’impôt fédéral, un conducteur déduit ce qu’auraient coûté les transports publics. Ce n’est que si vous ne pouvez pas les utiliser (pas de ligne à proximité, un handicap, des horaires sans desserte) que les kilomètres comptent.'
      de: 'Bei der Bundessteuer zieht man als Autofahrerin oder Autofahrer ab, was der öffentliche Verkehr gekostet hätte. Nur wenn du ihn nicht nutzen kannst (keine Linie in der Nähe, eine Behinderung, Arbeitszeiten ohne Verbindung), zählen die Kilometer.'
      it: 'Per l’imposta federale, chi va al lavoro con un veicolo deduce quanto sarebbero costati i trasporti pubblici. I chilometri contano solo se non puoi usarli (nessuna linea vicina, una disabilità, orari di lavoro senza collegamenti).'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: spese di trasporto'
    text:
      p1:
        en: 'Could you have made that trip by public transport?'
        fr: 'Auriez-vous pu faire ce trajet en transports publics ?'
        de: 'Hättest du diesen Weg mit dem öffentlichen Verkehr machen können?'
        it: 'Avresti potuto fare quel tragitto con i trasporti pubblici?'
      p2:
        en: 'Could your spouse or partner have made that trip by public transport?'
        fr: 'Votre conjoint ou partenaire aurait-il pu faire ce trajet en transports publics ?'
        de: 'Hätte dein Partner oder deine Partnerin diesen Weg mit dem öffentlichen Verkehr machen können?'
        it: 'Il tuo coniuge o partner avrebbe potuto fare quel tragitto con i trasporti pubblici?'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, in 2 hours a day or less, there and back',
            fr: 'Oui, en 2 heures par jour ou moins, aller et retour',
            de: 'Ja, in 2 Stunden pro Tag oder weniger, hin und zurück',
            it: 'Sì, in 2 ore al giorno o meno, andata e ritorno',
          }
      - value: yes_long
        label:
          {
            en: 'Yes, but it takes over 2 hours a day, there and back',
            fr: 'Oui, mais il faut plus de 2 heures par jour, aller et retour',
            de: 'Ja, aber es dauert über 2 Stunden pro Tag, hin und zurück',
            it: 'Sì, ma ci vogliono più di 2 ore al giorno, andata e ritorno',
          }
      - value: 'no'
        label:
          {
            en: 'No, there is no public transport I can use',
            fr: 'Non, aucun transport public que je puisse utiliser',
            de: 'Nein, es gibt keinen öffentlichen Verkehr, den ich nutzen kann',
            it: 'No, non ci sono trasporti pubblici che posso usare',
          }

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_transit_equivalent
    key: commute.transit_equivalent
    type: money
    perPerson: true
    when: { key: commute.transit_usable, in: ['yes', yes_long] }
    explain:
      en: 'That price is what the federal tax lets you deduct for driving to work, up to a yearly limit.'
      fr: 'C’est ce prix que l’impôt fédéral vous laisse déduire pour le trajet en véhicule, jusqu’à une limite annuelle.'
      de: 'Diesen Preis darfst du bei der Bundessteuer für die Fahrt zur Arbeit abziehen, bis zu einem jährlichen Höchstbetrag.'
      it: 'Per l’imposta federale puoi dedurre questo prezzo per il tragitto in veicolo, fino a un limite annuo.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: spese di trasporto'
    text:
      p1:
        en: 'What would a public transport pass for that trip have cost for {year}?'
        fr: 'Combien aurait coûté un abonnement de transports publics pour ce trajet en {year} ?'
        de: 'Was hätte ein Abo des öffentlichen Verkehrs für diesen Weg {year} gekostet?'
        it: 'Quanto sarebbe costato nel {year} un abbonamento dei trasporti pubblici per quel tragitto?'
      p2:
        en: 'What would a public transport pass for your spouse or partner’s trip have cost for {year}?'
        fr: 'Combien aurait coûté un abonnement de transports publics pour le trajet de votre conjoint ou partenaire en {year} ?'
        de: 'Was hätte ein Abo des öffentlichen Verkehrs für den Weg deines Partners oder deiner Partnerin {year} gekostet?'
        it: 'Quanto sarebbe costato nel {year} un abbonamento dei trasporti pubblici per il tragitto del tuo coniuge o partner?'
    help:
      en: 'The cheapest pass covering the trip, for the months worked, in CHF.'
      fr: 'L’abonnement le moins cher couvrant le trajet, pour les mois travaillés, en CHF.'
      de: 'Das günstigste Abo für diesen Weg, für die gearbeiteten Monate, in CHF.'
      it: 'L’abbonamento più economico per quel tragitto, per i mesi lavorati, in CHF.'

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_distance
    key: commute.distance_km
    type: number
    perPerson: true
    min: 1
    max: 300
    when: { key: commute.transit_usable, in: ['no'] }
    explain:
      en: 'Without public transport you can use, the federal tax counts a fixed amount per kilometre, there and back once a day, up to a yearly limit.'
      fr: 'Sans transport public utilisable, l’impôt fédéral compte un montant fixe par kilomètre, un aller et retour par jour, jusqu’à une limite annuelle.'
      de: 'Ohne nutzbaren öffentlichen Verkehr zählt die Bundessteuer einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, bis zu einem jährlichen Höchstbetrag.'
      it: 'Senza trasporti pubblici che puoi usare, l’imposta federale conta un importo fisso per chilometro, un’andata e ritorno al giorno, fino a un limite annuo.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: spese di trasporto'
    text:
      p1:
        en: 'How many kilometres is it from your home to your workplace, one way?'
        fr: 'Combien de kilomètres y a-t-il de votre domicile à votre lieu de travail, aller simple ?'
        de: 'Wie viele Kilometer sind es von deinem Zuhause zum Arbeitsort, einfach?'
        it: 'Quanti chilometri ci sono da casa tua al posto di lavoro, solo andata?'
      p2:
        en: 'How many kilometres is it from your spouse or partner’s home to their workplace, one way?'
        fr: 'Combien de kilomètres y a-t-il du domicile de votre conjoint ou partenaire à son lieu de travail, aller simple ?'
        de: 'Wie viele Kilometer sind es vom Zuhause deines Partners oder deiner Partnerin zum Arbeitsort, einfach?'
        it: 'Quanti chilometri ci sono da casa del tuo coniuge o partner al suo posto di lavoro, solo andata?'
    help:
      en: 'Round to the nearest kilometre.'
      fr: 'Arrondi au kilomètre.'
      de: 'Auf den Kilometer gerundet.'
      it: 'Arrotonda al chilometro.'

  # ch-2026-ifd-instructions-personnes-physiques p. 6
  - id: commute_drive_days
    key: commute.drive_days
    type: number
    perPerson: true
    min: 1
    max: 366
    when: { key: commute.transit_usable, in: ['no'] }
    explain:
      en: 'The kilometres count for each day you drove to work, once there and back.'
      fr: 'Les kilomètres comptent pour chaque jour de trajet au travail, un aller et retour.'
      de: 'Die Kilometer zählen für jeden Tag, an dem du zur Arbeit gefahren bist, einmal hin und zurück.'
      it: 'I chilometri contano per ogni giorno in cui hai fatto il tragitto in veicolo, un’andata e ritorno.'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Fahrkosten, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: spese di trasporto'
    text:
      p1:
        en: 'On how many days did you drive to work in {year}?'
        fr: 'Combien de jours avez-vous pris votre véhicule pour aller au travail en {year} ?'
        de: 'An wie vielen Tagen bist du {year} mit dem Fahrzeug zur Arbeit gefahren?'
        it: 'In quanti giorni del {year} hai usato il veicolo per andare al lavoro?'
      p2:
        en: 'On how many days did your spouse or partner drive to work in {year}?'
        fr: 'Combien de jours votre conjoint ou partenaire a-t-il pris son véhicule pour aller au travail en {year} ?'
        de: 'An wie vielen Tagen ist dein Partner oder deine Partnerin {year} mit dem Fahrzeug zur Arbeit gefahren?'
        it: 'In quanti giorni del {year} il tuo coniuge o partner ha usato il veicolo per andare al lavoro?'
    help:
      en: 'Leave out holidays, sick days and days worked from home.'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail.'
      de: 'Ohne Ferien, Krankheitstage und Tage im Homeoffice.'
      it: 'Escludi vacanze, giorni di malattia e giorni di telelavoro.'

  # Lunches away from home (frais de repas): per day up to a yearly limit, half with box G of the
  # salary certificate; none when the meal costs 10 francs or less, none on days worked from home
  # (ch-2026-ifd-instructions-personnes-physiques p. 6).
  - id: meal_days
    key: meals.days
    type: number
    perPerson: true
    min: 0
    max: 366
    when:
      {
        key: profile.commute,
        in: [public_transport, public_transport_long, car, motorbike, bike, walk],
      }
    explain:
      en: 'Lunch away from home because of work costs more than at home. A fixed amount per day counts, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison. Un montant fixe par jour compte, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen wegen der Arbeit kostet mehr als zu Hause. Es zählt ein fester Betrag pro Tag, bis zu einem jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
      it: 'Pranzare fuori casa per lavoro costa più che a casa. Conta un importo fisso al giorno, fino a un limite annuo, la metà se il tuo datore di lavoro paga una parte dei tuoi pasti (casella G del certificato di salario).'
    learnMore:
      year: 2026
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: meals, in French'
        fr: 'Instructions IFD 2026, p. 6 : Frais de repas'
        de: 'Wegleitung direkte Bundessteuer 2026, S. 6: Verpflegung, auf Französisch'
        it: 'Istruzioni per l’imposta federale 2026, p. 6: pasti, in francese'
    text:
      p1:
        en: 'On how many work days in {year} did you have lunch away from home?'
        fr: 'Combien de jours de travail en {year} avez-vous pris votre repas de midi hors de chez vous ?'
        de: 'An wie vielen Arbeitstagen {year} hast du auswärts zu Mittag gegessen?'
        it: 'In quanti giorni di lavoro del {year} hai pranzato fuori casa?'
      p2:
        en: 'On how many work days in {year} did your spouse or partner have lunch away from home?'
        fr: 'Combien de jours de travail en {year} votre conjoint ou partenaire a-t-il pris son repas de midi hors de chez lui ?'
        de: 'An wie vielen Arbeitstagen {year} hat dein Partner oder deine Partnerin auswärts zu Mittag gegessen?'
        it: 'In quanti giorni di lavoro del {year} il tuo coniuge o partner ha pranzato fuori casa?'
    # The 10 francs: ch-2026-ifd-instructions-personnes-physiques p. 6, so for 2026 only.
    help:
      year: 2026
      en: 'Count the days your lunch cost you more than 10 francs; 0 if you usually ate at home.'
      fr: 'Comptez les jours où votre repas vous a coûté plus de 10 francs ; 0 si vous mangiez en général à la maison.'
      de: 'Zähl die Tage, an denen dich das Mittagessen mehr als 10 Franken gekostet hat; 0, wenn du meistens zu Hause gegessen hast.'
      it: 'Conta i giorni in cui il pranzo ti è costato più di 10 franchi; 0 se di solito mangiavi a casa.'

  # ch-2026-ifd-instructions-personnes-physiques p. 3 (chiffre 4: securities and accounts)
  - id: banks
    key: profile.banks
    type: number
    min: 0
    max: 20
    explain:
      en: 'Every bank where you had an account, savings or investments on 31 December, including your children’s accounts.'
      fr: 'Toutes les banques où vous aviez un compte, de l’épargne ou des placements au 31 décembre, y compris les comptes de vos enfants.'
      de: 'Alle Banken, bei denen du am 31. Dezember ein Konto, Ersparnisse oder Anlagen hattest, auch die Konten deiner Kinder.'
      it: 'Tutte le banche in cui avevi un conto, risparmi o investimenti al 31 dicembre, compresi i conti dei tuoi figli.'
