          }
        notSupported:
          {
            en: 'Real estate (immeubles, annex 07)',
            fr: 'Les immeubles (annexe 07)',
            de: 'Liegenschaften (immeubles, Anhang 07)',
            it: 'Gli immobili (immeubles, allegato 07)',
          }
      - value: inheritance_or_gift
        label:
          {
            en: 'I received an inheritance or a large gift',
            fr: 'J’ai reçu un héritage ou une donation importante',
            de: 'Ich habe eine Erbschaft oder eine grosse Schenkung erhalten',
            it: 'Ho ricevuto un’eredità o una donazione importante',
          }
        notSupported:
          {
            en: 'An inheritance or a gift (succession, donation)',
            fr: 'Un héritage ou une donation',
            de: 'Eine Erbschaft oder Schenkung (succession, donation)',
            it: 'Un’eredità o una donazione (succession, donation)',
