      en: 'Receipts from the charities or political parties you gave to. In Vaud, donations to charities (dons, code 720) and payments to political parties (code 620) are separate lines.'
      fr: 'Les reçus des associations ou des partis politiques à qui vous avez donné. À Vaud, les dons à des institutions d’utilité publique (code 720) et les versements aux partis politiques (code 620) sont des lignes séparées.'
