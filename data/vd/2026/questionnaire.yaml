      it: 'Le ricevute degli enti di pubblica utilità o dei partiti politici a cui hai fatto delle donazioni. A Vaud, le donazioni a enti di pubblica utilità (dons, codice 720) e i versamenti ai partiti politici (codice 620) sono righe separate.'
