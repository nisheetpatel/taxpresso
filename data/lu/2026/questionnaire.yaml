# Lucerne questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not
# code: packages/questionnaire reads it, and every key and value must exist in Lucerne's keys
# (packages/rules-lu, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Lucerne return (lu-2025-guide-wegleitung p. 13 to 19, the sample return: page 1 the people
# and the children, then the income, the deductions and the wealth), with Lucerne's own explanations
# and official pages. The questions only Lucerne asks are written out here, as packages/rules-lu reads
# them (LucerneCantonal): whether the family tariff is yours in shared custody without child
# support, for each child whether they live with you, were under 14 at the end of the year and stay
# away from home for their education, the childcare paid for each child (the limit is per child),
# the commune by name from the 79 and the move, and each adult's and each child's confession (the
# church tax).
#
# Wording and documents follow the Lucerne guide for 2025 (lu-2025-guide-wegleitung): the regular
# 2026 guide is not published yet (docs/sources/lu/NOTES.md, Gaps), so the questions say "2026" and
# link the 2025 guide, whose Ziffern the return keeps until it appears. "p." is the page of the PDF
# file, as in the links, and the guide prints the same page numbers. The return and the guide are in
# German: the questions give the German term next to the gloss.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'Lucerne', fr: 'Lucerne', de: 'Luzern' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}' }

# eSteuern.LU is the canton's online return, in the browser, with your own eSteuern account and the
# PersID and Zugangscode eFiling printed on your return (docs/sources/lu/NOTES.md, Filing channels;
# lu-2025-efiling-merkblatt-esteuern). No document of the library says it is free, so the text
# doesn't.
notSupported:
  en: 'Taxpresso can’t prepare this part yet. eSteuern.LU, the canton’s online return (esteuern.lu.ch), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. eSteuern.LU, la déclaration en ligne du canton (esteuern.lu.ch), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. eSteuern.LU, die Online-Steuererklärung des Kantons (esteuern.lu.ch), oder eine Treuhand kann es.'

questions:
  - use: canton

  # lu-2025-guide-wegleitung p. 7 (Heirat, Scheidung oder Trennung: the situation at the end of the
  # year) and p. 20 (Person 1 and Person 2 for couples taxed together, registered partners too).
  - use: civil_status
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=7'
      label:
        en: 'Lucerne tax guide 2025, p. 7: marriage, divorce or separation'
        fr: 'Guide fiscal de Lucerne 2025, p. 7 : Mariage, divorce ou séparation'
        de: 'Wegleitung zur Steuererklärung 2025, S. 7: Heirat, Scheidung oder Trennung'
    help:
      en: 'A registered partnership files like a married couple, on one return.'
      fr: 'Un partenariat enregistré déclare comme un couple marié, sur une seule déclaration.'
      de: 'Eine eingetragene Partnerschaft füllt wie ein Ehepaar eine gemeinsame Steuererklärung aus.'

  # lu-2025-guide-wegleitung p. 34 (350, Kinderabzug: minors, and children in school or vocational
  # training whose upkeep you bear); page 1 of the return lists them (Ziffer 3).
  - use: children
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=34'
      label:
        en: 'Lucerne tax guide 2025, p. 34: child deductions'
        fr: 'Guide fiscal de Lucerne 2025, p. 34 : Déductions pour enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 34: Kinderabzüge'
    help:
      en: 'Minors, and older children in school or training whose upkeep you bear. On page 1 of the return, Ziffer 3: Minderjährige oder in Ausbildung stehende Kinder.'
      fr: 'Les mineurs, et les enfants plus âgés en formation dont vous assumez l’entretien. En page 1 de la déclaration, Ziffer 3 : Minderjährige oder in Ausbildung stehende Kinder (enfants mineurs ou en formation).'
      de: 'Minderjährige und ältere Kinder in Ausbildung, deren Unterhalt du bestreitest. Auf Seite 1 der Steuererklärung, Ziffer 3: Minderjährige oder in Ausbildung stehende Kinder.'

  # lu-2025-guide-wegleitung p. 20 (Ziffer 3: each child, whether in your household, whether the
  # other parent pays child support; the tariff with joint parental authority).
  - use: children_custody
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=20'
      label:
        en: 'Lucerne tax guide 2025, p. 20: personal details and children'
        fr: 'Guide fiscal de Lucerne 2025, p. 20 : Situation personnelle et enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Personalien und Familienverhältnisse'
    help:
      en: 'Parents taxed apart attach the custody and child support agreement (Sorgerechts- und Unterhaltsvereinbarung) to their return.'
      fr: 'Les parents taxés séparément joignent à leur déclaration la convention sur l’autorité parentale et l’entretien (Sorgerechts- und Unterhaltsvereinbarung).'
      de: 'Getrennt besteuerte Eltern legen der Steuererklärung die Sorgerechts- und Unterhaltsvereinbarung bei.'

  # Parents taxed apart with joint parental authority: the parent who receives child support counts
  # the children; without it, each has half the child deduction (StG § 42 Abs. 2,
  # lu-2026-law-steuergesetz p. 24); for the federal tax, the parental scale to the one who earns
  # more (ch-na-circulaire-30-epoux-famille p. 24).
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it counts them; without child support, each parent has half the child deductions (Kinderabzug), and the federal tax gives the parental scale (Elterntarif), a lower rate, to the one who earns more.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit les compte ; sans contribution, chaque parent a la moitié des déductions pour enfants (Kinderabzug), et l’impôt fédéral donne le barème parental (Elterntarif), un taux plus bas, à celui qui gagne le plus.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, zählt die Kinder; ohne Unterhaltsbeiträge hat jeder Elternteil die Hälfte der Kinderabzüge, und die Bundessteuer gibt den Elterntarif, einen tieferen Satz, dem, der mehr verdient.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=20'
      label:
        en: 'Lucerne tax guide 2025, p. 20: personal details and children'
        fr: 'Guide fiscal de Lucerne 2025, p. 20 : Situation personnelle et enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Personalien und Familienverhältnisse'
    help:
      en: 'Child support (Unterhaltsbeiträge, Alimente) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge, Alimente) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge (Alimente) sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'

  # Without child support, the family tariff (Familientarif, StG § 57 Abs. 2,
  # lu-2026-law-steuergesetz p. 30) goes to the parent who cares for the children longer, or, at equal
  # time, earns more; living with the other parent, to the one who bears more of their costs
  # (lu-2025-guide-wegleitung p. 20). packages/rules-lu asks rather than guess (NOTE.familyTariff).
  - id: family_tariff
    key: lu.family_tariff
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.child_support, in: [none_i_earn_more, none_other_earns_more, none_unsure] }
    explain:
      en: 'With shared custody and no child support, Lucerne gives the family tariff (Familientarif), a lower rate, to one parent only: the one who cares for the children longer or, at equal time, earns more; when the children live with the other parent, the one who bears more of their costs.'
      fr: 'En garde partagée sans contribution d’entretien, Lucerne n’accorde le barème des familles (Familientarif), un taux plus bas, qu’à un seul parent : celui qui s’occupe le plus longtemps des enfants ou, à temps égal, gagne le plus ; quand les enfants vivent chez l’autre parent, celui qui assume la plus grande part de leurs frais.'
      de: 'Bei geteilter Obhut ohne Unterhaltsbeiträge gibt Luzern den Familientarif, einen tieferen Satz, nur einem Elternteil: dem, der die Kinder länger betreut oder, bei gleicher Zeit, mehr verdient; leben die Kinder beim anderen Elternteil, dem, der mehr an ihre Kosten beiträgt.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=20'
      label:
        en: 'Lucerne tax guide 2025, p. 20: the tariff with joint parental authority'
        fr: 'Guide fiscal de Lucerne 2025, p. 20 : Le barème en cas d’autorité parentale conjointe'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Tarif bei gemeinsamer elterlicher Sorge'
    text:
      en: 'In 2026, did the family tariff go to you rather than to the other parent?'
      fr: 'En 2026, le barème des familles vous revenait-il plutôt qu’à l’autre parent ?'
      de: 'Stand der Familientarif 2026 dir zu und nicht dem anderen Elternteil?'
    help:
      en: 'Who looked after the children more of the time, as agreed or decided. Not sure? Your last assessment (Veranlagung) shows which tariff you got.'
      fr: 'Qui s’occupait le plus des enfants, selon l’accord ou la décision. Un doute ? Votre dernière taxation (Veranlagung) indique quel barème vous avez eu.'
      de: 'Wer sich die meiste Zeit um die Kinder gekümmert hat, wie vereinbart oder entschieden. Unsicher? Deine letzte Veranlagung zeigt, welchen Tarif du erhalten hast.'
    chip: { en: 'Family tariff', fr: 'Barème des familles', de: 'Familientarif' }

  # Page 1 of the return asks for each child "In Ihrem Haushalt?" (lu-2025-guide-wegleitung p. 20,
  # Ziffer 3): the family tariff of a single parent, own care (353) and childcare (360) go with the
  # children who live with you (StG § 42 Abs. 1 lit. b and § 57 Abs. 2, lu-2026-law-steuergesetz
  # p. 24 and 30).
  - id: child_lives_with_you
    key: lu.child_lives_with_you
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Page 1 of the return asks for each child whether they live in your household: the family tariff of a single parent, the deduction for your own care and the childcare deduction go with the children who live with you.'
      fr: 'La page 1 de la déclaration demande pour chaque enfant s’il vit dans votre ménage : le barème des familles d’un parent seul, la déduction pour la garde par les parents et celle des frais de garde suivent les enfants qui vivent avec vous.'
      de: 'Seite 1 der Steuererklärung fragt für jedes Kind, ob es im Haushalt lebt: Der Familientarif eines alleinstehenden Elternteils, der Eigenbetreuungsabzug und der Fremdbetreuungsabzug gelten für die Kinder, die bei dir leben.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=20'
      label:
        en: 'Lucerne tax guide 2025, p. 20: personal details and children'
        fr: 'Guide fiscal de Lucerne 2025, p. 20 : Situation personnelle et enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Personalien und Familienverhältnisse'
    text:
      en: 'Did child {n} live in your household at the end of 2026?'
      fr: 'L’enfant {n} vivait-il dans votre ménage à la fin de 2026 ?'
      de: 'Hat Kind {n} Ende 2026 in deinem Haushalt gelebt?'
    help:
      en: 'In shared custody, yes if the child lives with you at least half the time. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En garde partagée, oui si l’enfant vit chez vous au moins la moitié du temps. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Bei geteilter Obhut ja, wenn das Kind mindestens die Hälfte der Zeit bei dir lebt. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # lu-2025-guide-wegleitung p. 34 (353, Abzug für Eigenbetreuung: each child under 14 living with
  # you, born in 2012 or later for 2025; 360, Fremdbetreuungskosten up to 14); StG § 42 Abs. 1
  # lit. b (lu-2026-law-steuergesetz p. 24).
  - id: child_under14
    key: lu.child_under14
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: lu.child_lives_with_you, is: true }
    explain:
      en: 'Lucerne gives a deduction for your own care of each child under 14 living with you (Abzug für Eigenbetreuung), and childcare by others counts for them too (Fremdbetreuungskosten).'
      fr: 'Lucerne accorde une déduction pour la garde par les parents de chaque enfant de moins de 14 ans vivant avec vous (Abzug für Eigenbetreuung), et les frais de garde par des tiers comptent aussi pour eux (Fremdbetreuungskosten).'
      de: 'Luzern gewährt für jedes Kind unter 14, das bei dir lebt, einen Abzug für Eigenbetreuung, und die Fremdbetreuungskosten zählen ebenfalls für diese Kinder.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=34'
      label:
        en: 'Lucerne tax guide 2025, p. 34: own care and childcare'
        fr: 'Guide fiscal de Lucerne 2025, p. 34 : Garde par les parents et par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 34: Eigenbetreuung und Fremdbetreuungskosten'
    text:
      en: 'Was child {n} still under 14 at the end of 2026?'
      fr: 'L’enfant {n} avait-il encore moins de 14 ans à la fin de 2026 ?'
      de: 'War Kind {n} Ende 2026 noch nicht 14 Jahre alt?'
    help:
      en: 'Yes for a child born in 2013 or later.'
      fr: 'Oui pour un enfant né en 2013 ou après.'
      de: 'Ja für ein Kind mit Jahrgang 2013 oder jünger.'

  # lu-2025-guide-wegleitung p. 34 (352: a child in school or vocational training who stays away
  # from home for it all the time has the higher child deduction); StG § 42 Abs. 1 lit. a
  # (lu-2026-law-steuergesetz p. 24). Not asked for a child under 14 living with you.
  - id: child_away
    key: lu.child_away
    type: yesno
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - any:
            - { key: lu.child_lives_with_you, is: false }
            - { key: lu.child_under14, is: false }
    explain:
      en: 'A child in school or vocational training who has to stay away from home for it all the time (ständiger Aufenthalt am auswärtigen Ausbildungsort) gives a higher child deduction.'
      fr: 'Un enfant en formation scolaire ou professionnelle qui doit pour cela séjourner en permanence hors du domicile (ständiger Aufenthalt am auswärtigen Ausbildungsort) donne droit à une déduction pour enfant plus élevée.'
      de: 'Ein Kind in schulischer oder beruflicher Ausbildung, das dafür ständig am auswärtigen Ausbildungsort wohnt, gibt einen höheren Kinderabzug.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=34'
      label:
        en: 'Lucerne tax guide 2025, p. 34: child deductions'
        fr: 'Guide fiscal de Lucerne 2025, p. 34 : Déductions pour enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 34: Kinderabzüge'
    text:
      en: 'In 2026, did child {n} stay away from home all the time for school or training?'
      fr: 'En 2026, l’enfant {n} séjournait-il en permanence hors du domicile pour sa formation ?'
      de: 'Hat Kind {n} 2026 wegen der Ausbildung ständig auswärts gewohnt?'
    help:
      en: 'For example a room near a university or an apprenticeship far from home, because of the training itself. Coming home at weekends is fine.'
      fr: 'Par exemple une chambre près d’une université ou un apprentissage loin du domicile, en raison de la formation elle-même. Rentrer le week-end ne change rien.'
      de: 'Zum Beispiel ein Zimmer nahe der Universität oder eine Lehre weit weg von zu Hause, wegen der Ausbildung selbst. Am Wochenende heimkommen ändert nichts.'

  # lu-2025-guide-wegleitung p. 34 (360, Fremdbetreuungskosten: for each child under 14, costs due
  # to work, training or an inability to work; form U/F).
  - use: childcare
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=34'
      label:
        en: 'Lucerne tax guide 2025, p. 34: childcare by others'
        fr: 'Guide fiscal de Lucerne 2025, p. 34 : Frais de garde par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 34: Fremdbetreuungskosten'
    help:
      en: 'A crèche (Kita), day care or a nanny, for a child under 14, while you work or train. On the return: 360, Fremdbetreuungskosten (form U/F).'
      fr: 'Une crèche (Kita), une garderie ou une nourrice, pour un enfant de moins de 14 ans, pendant que vous travaillez ou êtes en formation. Sur la déclaration : 360, Fremdbetreuungskosten (formulaire U/F, frais de garde par des tiers).'
      de: 'Eine Kita, ein Hort oder eine Nanny, für ein Kind unter 14, während du arbeitest oder in Ausbildung bist. Auf der Steuererklärung: 360, Fremdbetreuungskosten (Formular U/F).'

  # The limit is per child (StG § 42 Abs. 1 lit. b, lu-2026-law-steuergesetz p. 24): with several
  # children, how the invoices' total splits can decide the deduction, so it is asked per child
  # (form U/F lists each child, lu-2025-guide-wegleitung p. 34).
  - id: child_care
    key: lu.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Lucerne’s limit on childcare is per child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'La limite de Lucerne pour les frais de garde est par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Der Höchstbetrag für die Fremdbetreuung gilt in Luzern pro Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=34'
      label:
        en: 'Lucerne tax guide 2025, p. 34: childcare by others'
        fr: 'Guide fiscal de Lucerne 2025, p. 34 : Frais de garde par des tiers'
        de: 'Wegleitung zur Steuererklärung 2025, S. 34: Fremdbetreuungskosten'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Fremdbetreuungskosten war für Kind {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'

  # The commune of the end of the year taxes the whole year, and so does its parish (StG § 237
  # Abs. 1, lu-2026-law-steuergesetz p. 95). The list is Lucerne's 79 communes by name
  # (packages/rules-lu, from lu-2026-communal-steuereinheiten; the table has no BFS numbers). Each
  # levies its units of the tax per unit (StG § 2 and § 236, p. 1 and 95).
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year, and so does its parish. Each commune sets how many units (Einheiten) of the tax per unit (Steuer je Einheit) it levies, as the state does.'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année, de même que sa paroisse. Chaque commune fixe le nombre d’unités (Einheiten) de l’impôt par unité (Steuer je Einheit) qu’elle prélève, comme l’État.'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr, ebenso ihre Kirchgemeinde. Jede Gemeinde legt fest, wie viele Einheiten der Steuer je Einheit sie erhebt, wie der Staat.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Publikationen/2026/Steuereinheiten_2026_NP.pdf'
      label:
        en: 'Tax units of the state, the communes and the parishes, 2026'
        fr: 'Unités d’impôt de l’État, des communes et des paroisses, 2026 (Steuereinheiten)'
        de: 'Steuereinheiten 2026, Staat / Einwohner- und Kirchgemeinde'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
    help:
      en: 'The official name, such as Luzern, Kriens or Escholzmatt-Marbach.'
      fr: 'Le nom officiel, par exemple Luzern, Kriens ou Escholzmatt-Marbach.'
      de: 'Der offizielle Name, zum Beispiel Luzern, Kriens oder Escholzmatt-Marbach.'

  # Who files in Lucerne: arriving from another canton, Lucerne taxes the whole year
  # (lu-2025-guide-wegleitung p. 8, Zuzug in den Kanton Luzern); leaving for another canton, the new
  # canton does; arriving from or leaving for abroad means part of the year only (p. 7 and 8): not
  # covered by rules-lu.
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Lucerne taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Lucerne vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Luzern besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=8'
      label:
        en: 'Lucerne tax guide 2025, p. 8: arriving during the year'
        fr: 'Guide fiscal de Lucerne 2025, p. 8 : Arrivée en cours d’année'
        de: 'Wegleitung zur Steuererklärung 2025, S. 8: Beginn der Steuerpflicht'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein' } }
      - value: within_lu
        label:
          {
            en: 'Yes, within the canton of Lucerne',
            fr: 'Oui, dans le canton de Lucerne',
            de: 'Ja, innerhalb des Kantons Luzern',
          }
        chip: { en: 'Moved in the canton', fr: 'Déménagé dans le canton', de: 'Umzug im Kanton' }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
          }
        notSupported:
          {
            en: 'Leaving Switzerland (Wegzug ins Ausland)',
            fr: 'Un départ de Suisse (Wegzug ins Ausland)',
            de: 'Ein Wegzug ins Ausland',
          }

  # Church tax (Kirchensteuer): only members of a recognised church pay it, at their parish's units
  # (StG § 240 Abs. 1, lu-2026-law-steuergesetz p. 96; lu-2026-communal-steuereinheiten). The return
  # asks each taxpayer's confession (Konfession, page 1, Ziffer 2). Opt-in: Taxpresso adds it only for
  # members.
  - id: church
    key: lu.church
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Roman Catholic, Evangelical Reformed or Christ Catholic church pay church tax (Kirchensteuer) at their parish’s units. When a family’s members belong to different churches, the law shares it among them. Taxpresso adds it only for members.'
      fr: 'Les membres de l’Église catholique romaine, évangélique réformée ou catholique-chrétienne paient l’impôt ecclésiastique (Kirchensteuer) selon les unités de leur paroisse. Quand les membres d’une famille appartiennent à des Églises différentes, la loi le partage entre elles. Taxpresso ne l’ajoute que pour les membres.'
      de: 'Mitglieder der römisch-katholischen, der evangelisch-reformierten oder der christkatholischen Kirche zahlen Kirchensteuer nach den Einheiten ihrer Kirchgemeinde. Gehören die Mitglieder einer Familie verschiedenen Konfessionen an, teilt das Gesetz sie auf. Taxpresso rechnet sie nur für Mitglieder dazu.'
    learnMore:
      url: 'https://srl.lu.ch/api/de/versions/4667/pdf_file#page=96'
      label:
        en: 'Lucerne tax law (Steuergesetz), § 240, p. 96: the church tax'
        fr: 'Loi fiscale de Lucerne (Steuergesetz), § 240, p. 96 : Impôt ecclésiastique'
        de: 'Steuergesetz, § 240, S. 96: Kirchensteuer'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these churches?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces Églises ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these churches?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces Églises ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
    help:
      en: 'Another religion, or none, pays no church tax.'
      fr: 'Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique.'
      de: 'Eine andere Religion oder keine zahlt keine Kirchensteuer.'
    options:
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch' }
      - value: reformed
        label:
          {
            en: 'Evangelical Reformed (evangelisch-reformiert)',
            fr: 'Évangélique réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert' }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique-chrétienne (christkatholisch)',
            de: 'Christkatholisch',
          }
        chip: { en: 'Christ Catholic', fr: 'Catholique-chrétien(ne)', de: 'Christkatholisch' }
      - value: none
        label: { en: 'None of these', fr: 'Aucune de ces Églises', de: 'Keine davon' }

  # The return asks each child's confession too (page 1, Ziffer 3), and when a family's members
  # belong to different confessions the church tax is shared in proportion of each one's members
  # (StG § 240 Abs. 2, lu-2026-law-steuergesetz p. 96). Asked for the children the household counts:
  # not when the other parent counts them (child support paid).
  - id: child_church
    key: lu.child_church
    type: choice
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - any:
            - { key: profile.children_custody, in: [with_household] }
            - { key: profile.civil_status, in: [married, registered_partnership] }
            - key: profile.child_support
              in: [i_receive, none_i_earn_more, none_other_earns_more, none_unsure]
    explain:
      en: 'The return asks each child’s confession too: when a family’s members belong to different churches, or not all to one, the law shares the church tax among the churches in proportion of their members (StG § 240 Abs. 2).'
      fr: 'La déclaration demande aussi la confession de chaque enfant : quand les membres d’une famille appartiennent à des Églises différentes, ou pas tous à une Église, la loi partage l’impôt ecclésiastique entre les Églises en proportion de leurs membres (StG § 240 al. 2).'
      de: 'Die Steuererklärung fragt auch die Konfession jedes Kindes: Gehören die Mitglieder einer Familie verschiedenen Konfessionen an, oder nicht alle einer Kirche, teilt das Gesetz die Kirchensteuer im Verhältnis ihrer Mitglieder auf die Kirchen auf (StG § 240 Abs. 2).'
    learnMore:
      url: 'https://srl.lu.ch/api/de/versions/4667/pdf_file#page=96'
      label:
        en: 'Lucerne tax law (Steuergesetz), § 240, p. 96: the church tax'
        fr: 'Loi fiscale de Lucerne (Steuergesetz), § 240, p. 96 : Impôt ecclésiastique'
        de: 'Steuergesetz, § 240, S. 96: Kirchensteuer'
    text:
      en: 'On 31 December 2026, was child {n} a member of one of these churches?'
      fr: 'Au 31 décembre 2026, l’enfant {n} était-il membre de l’une de ces Églises ?'
      de: 'War Kind {n} am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
    help:
      en: 'As on page 1 of the return (Konfession). Number your children the same way in every answer, for example from the oldest.'
      fr: 'Comme en page 1 de la déclaration (Konfession). Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Wie auf Seite 1 der Steuererklärung (Konfession). Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
    options:
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
          }
      - value: reformed
        label:
          {
            en: 'Evangelical Reformed (evangelisch-reformiert)',
            fr: 'Évangélique réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
          }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique-chrétienne (christkatholisch)',
            de: 'Christkatholisch',
          }
      - value: none
        label: { en: 'None of these', fr: 'Aucune de ces Églises', de: 'Keine davon' }

  # lu-2025-guide-wegleitung p. 21 (100/101, the net salary of the salary certificate) to p. 23
