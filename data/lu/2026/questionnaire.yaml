  # lu-2025-guide-wegleitung p. 21 (100/101: the net salary of each salary certificate).
  - use: employers
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=21'
      label:
        en: 'Lucerne tax guide 2025, p. 21: salaried work'
        fr: 'Guide fiscal de Lucerne 2025, p. 21 : Activité salariée'
        de: 'Wegleitung zur Steuererklärung 2025, S. 21: Einkünfte aus unselbständiger Erwerbstätigkeit'
    help:
      en: 'Each one gives you a salary certificate (Lohnausweis).'
      fr: 'Chacun vous remet un certificat de salaire (Lohnausweis).'
      de: 'Jeder gibt dir einen Lohnausweis.'

  # People taxed at source (Quellensteuer) file an ordinary return only above the thresholds of the
  # Merkblatt, or when they ask for it by 31 March of the next year (nachträgliche ordentliche
  # Veranlagung, NOV): lu-2025-source-tax-merkblatt-nov p. 1. Not covered by rules-lu.
  - use: taxed_at_source
    yesNotSupported:
      en: 'Tax at source in Lucerne (Quellensteuer) and the ordinary assessment that follows it (nachträgliche ordentliche Veranlagung, NOV)'
      fr: 'L’impôt à la source à Lucerne (Quellensteuer) et la taxation ordinaire ultérieure qui suit (nachträgliche ordentliche Veranlagung, NOV)'
      de: 'Die Quellensteuer im Kanton Luzern und die nachträgliche ordentliche Veranlagung (NOV)'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Publikationen/2025/930498_Merkblatt_2025_Nachtrgliche_ordentliche_Veranlagung_NOV.pdf#page=1'
      label:
        en: 'Lucerne leaflet 2025, p. 1: ordinary assessment after tax at source (NOV)'
        fr: 'Notice lucernoise 2025, p. 1 : Taxation ordinaire ultérieure (NOV)'
        de: 'Merkblatt 2025, S. 1: Nachträgliche ordentliche Veranlagung (NOV)'
    help:
      en: 'If so, it shows on the salary certificate (Lohnausweis, Ziffer 12).'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire (Lohnausweis, Ziffer 12).'
      de: 'Wenn ja, steht es auf dem Lohnausweis (Ziffer 12).'

  # lu-2025-guide-wegleitung p. 30 (260/261: only with the attestations).
  - use: pillar3a
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=30'
      label:
        en: 'Lucerne tax guide 2025, p. 30: pillar 3a'
        fr: 'Guide fiscal de Lucerne 2025, p. 30 : Pilier 3a'
        de: 'Wegleitung zur Steuererklärung 2025, S. 30: Säule 3a'
    help:
      en: 'Your bank or insurer sends an attestation (Bescheinigung): attach it to your return. On the return: 260, Beiträge an anerkannte Formen der gebundenen Selbstvorsorge.'
      fr: 'Votre banque ou votre assurance vous envoie une attestation (Bescheinigung) : joignez-la à votre déclaration. Sur la déclaration : 260, Beiträge an anerkannte Formen der gebundenen Selbstvorsorge (cotisations au 3e pilier A).'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung: Leg sie der Steuererklärung bei. Auf der Steuererklärung: 260, Beiträge an anerkannte Formen der gebundenen Selbstvorsorge.'

  # lu-2025-guide-wegleitung p. 31 (280/282: only what the salary certificate doesn't already show;
  # attach the fund's attestation and the pension certificate).
  - use: lpp_buyin
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=31'
      label:
        en: 'Lucerne tax guide 2025, p. 31: pension fund buy-ins'
        fr: 'Guide fiscal de Lucerne 2025, p. 31 : Rachats au 2e pilier'
        de: 'Wegleitung zur Steuererklärung 2025, S. 31: Beiträge an die 2. Säule'
    help:
      en: 'A voluntary payment on top of the usual contributions. Count only a buy-in your salary certificate doesn’t show. On the return: 280, Beiträge an 2. Säule, davon Einkauf.'
      fr: 'Un versement volontaire en plus des cotisations habituelles. Ne comptez qu’un rachat que votre certificat de salaire n’indique pas. Sur la déclaration : 280, Beiträge an 2. Säule, davon Einkauf (rachats au 2e pilier).'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen. Zähl nur einen Einkauf, den dein Lohnausweis nicht zeigt. Auf der Steuererklärung: 280, Beiträge an 2. Säule, davon Einkauf.'

  # Travel to work (form B, 202 to 208t: Fahrkosten zwischen Wohn- und Arbeitsstätte), for the
  # cantonal and the federal tax, each up to its own yearly limit (lu-2025-guide-wegleitung p. 27 and
  # p. 54; ch-2026-ifd-instructions-personnes-physiques p. 6). No "over 2 hours a day" choice: only
  # Geneva's meal rule needs it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten abgezogen, bei der Staats- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: travel to work'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Fahrkosten zwischen Wohn- und Arbeitsstätte'
    help:
      en: 'Choose how you went on most work days. On form B (Berufsauslagen): Fahrkosten zwischen Wohn- und Arbeitsstätte.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire B (Berufsauslagen, frais professionnels) : Fahrkosten zwischen Wohn- und Arbeitsstätte (frais de déplacement).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf dem Formular B (Berufsauslagen): Fahrkosten zwischen Wohn- und Arbeitsstätte.'
    options:
      - value: public_transport
        label: { en: 'Public transport', fr: 'Transports publics', de: 'Öffentlicher Verkehr' }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Motorfahrrad mit gelbem Kontrollschild',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice' }

  # lu-2025-guide-wegleitung p. 27 (202/203: public transport passes, park and ride, the cost).
  - use: commute_transit_cost
    explain:
      en: 'You deduct the public transport you paid to get to work, for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez les transports publics payés pour aller au travail, pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst den bezahlten öffentlichen Verkehr zur Arbeit ab, bei der Staats- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: travel to work'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Fahrkosten zwischen Wohn- und Arbeitsstätte'

  # A private vehicle needs a reason (form B, lu-2025-guide-wegleitung p. 16 and 27): no public
  # transport, over an hour saved a day, the vehicle needed at work at the employer's request, or
  # illness or infirmity. Otherwise what public transport would have cost.
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. The kilometres count only if you had a reason: no public transport for the trip, over an hour saved each day, the vehicle needed at work at your employer’s request, or illness or infirmity.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Les kilomètres ne comptent que si vous aviez une raison : pas de transport public pour ce trajet, plus d’une heure gagnée par jour, le véhicule nécessaire au travail à la demande de l’employeur, ou une maladie ou une infirmité.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Die Kilometer zählen nur mit einem Grund: kein öffentliches Verkehrsmittel für diesen Weg, über eine Stunde Zeitersparnis pro Tag, das Fahrzeug auf Verlangen des Arbeitgebers für die Arbeit nötig, oder Krankheit oder Gebrechlichkeit.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: travel to work'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Fahrkosten zwischen Wohn- und Arbeitsstätte'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
          }
      - value: 'no'
        label:
          {
            en: 'No, one of those reasons applies',
            fr: 'Non, l’une de ces raisons s’applique',
            de: 'Nein, einer dieser Gründe trifft zu',
          }

  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab, bei beiden Steuern, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: travel to work'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Fahrkosten zwischen Wohn- und Arbeitsstätte'

  # lu-2025-guide-wegleitung p. 27 (208/209: cars and motorbikes per km; 220 working days a year
  # as a rule, form B p. 16).
  - use: commute_distance
    explain:
      en: 'With one of those reasons, both taxes count a fixed amount per kilometre, there and back once a day, each up to its own yearly limit.'
      fr: 'Avec l’une de ces raisons, les deux impôts comptent un montant fixe par kilomètre, un aller et retour par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Mit einem dieser Gründe zählen beide Steuern einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: travel by car'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Trajets en voiture'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Privatfahrzeug'

  - use: commute_drive_days
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: travel by car'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Trajets en voiture'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Privatfahrzeug'
    help:
      en: 'The days you actually worked there; a full year of work is usually 220 days. Leave out holidays, sick days and days worked from home (Homeoffice).'
      fr: 'Les jours effectivement travaillés sur place ; une année entière de travail compte en général 220 jours. Sans les vacances, les jours de maladie et les jours de télétravail (Homeoffice).'
      de: 'Die effektiven Arbeitstage am Arbeitsort; bei ganzjähriger Erwerbstätigkeit in der Regel 220. Ohne Ferien, Krankheitstage und Tage im Homeoffice.'

  # Meals away from home (form B, 212 to 215: Mehrkosten der Verpflegung), for both taxes:
  # lu-2025-guide-wegleitung p. 27.
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work costs more than at home (Mehrkosten der Verpflegung). A fixed amount per day counts for both taxes, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison (Mehrkosten der Verpflegung). Un montant fixe par jour compte pour les deux impôts, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen wegen der Arbeit kostet mehr als zu Hause (Mehrkosten der Verpflegung). Für beide Steuern zählt ein fester Betrag pro Tag, bis zu einem jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=27'
      label:
        en: 'Lucerne tax guide 2025, p. 27: meals'
        fr: 'Guide fiscal de Lucerne 2025, p. 27 : Frais de repas'
        de: 'Wegleitung zur Steuererklärung 2025, S. 27: Mehrkosten der Verpflegung'

  # lu-2025-guide-wegleitung p. 38 (Wertschriften- und Guthabenverzeichnis: 150 and 400).
  - use: banks
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=38'
      label:
        en: 'Lucerne tax guide 2025, p. 38: securities and accounts'
        fr: 'Guide fiscal de Lucerne 2025, p. 38 : Titres et avoirs'
        de: 'Wegleitung zur Steuererklärung 2025, S. 38: Wertschriften- und Guthabenverzeichnis'
    help:
      en: 'Count PostFinance too, your minor children’s accounts, and online or foreign brokers. On the return: Wertschriften- und Guthabenverzeichnis (WV).'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants mineurs et les courtiers en ligne ou étrangers. Sur la déclaration : Wertschriften- und Guthabenverzeichnis (WV, état des titres et avoirs).'
      de: 'Zähl auch PostFinance, die Konten deiner minderjährigen Kinder und Online- oder ausländische Broker. Auf der Steuererklärung: Wertschriften- und Guthabenverzeichnis (WV).'

  # lu-2025-guide-wegleitung p. 41 (Kryptowährungen: in the securities list, at their value on 31
  # December).
  - use: crypto
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=41'
      label:
        en: 'Lucerne tax guide 2025, p. 41: cryptocurrencies'
        fr: 'Guide fiscal de Lucerne 2025, p. 41 : Cryptomonnaies'
        de: 'Wegleitung zur Steuererklärung 2025, S. 41: Kryptowährungen'

  # lu-2025-guide-wegleitung p. 32 (320, Krankheits-, Unfall- und behinderungsbedingte Kosten; 324,
  # Freiwillige Zuwendungen), p. 33 (325, politische Parteien), p. 29 (252) and p. 30 (254, 255).
  - use: payments
    learnMore:
      url: 'https://steuern.lu.ch/-/media/Steuern/Dokumente/Steuerformulare/2025/Wegleitung930109LU2025HADEFneu.pdf#page=32'
      label:
        en: 'Lucerne tax guide 2025, p. 32: medical costs and donations'
        fr: 'Guide fiscal de Lucerne 2025, p. 32 : Frais de maladie et dons'
        de: 'Wegleitung zur Steuererklärung 2025, S. 32: Zusätzliche Abzüge'

