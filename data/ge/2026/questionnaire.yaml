  # Self-employment (ge-2025-guide-independants p. 6 and 25): the accounts, signed, or simple
  # records; and the AVS compensation fund's statement of the contributions paid in the year, with
  # each final decision for an earlier year.
  - id: business_accounts
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    expects: { kinds: [business_accounts] }
    label:
      en: 'Business accounts (bilan et compte de résultat)'
      fr: 'Comptes commerciaux (bilan et compte de résultat)'
      de: 'Geschäftsabschluss (bilan et compte de résultat)'
      it: 'Conti commerciali (bilan et compte de résultat)'
    explain:
      en: 'Your signed accounts for the business year closed in {year}: balance sheet and profit and loss account. Without full accounts (under 500,000 francs of turnover), your records of income and expenses, of what the business owns and owes, and of what you took out or put in privately. Your own AVS contributions are not among the charges: they are declared apart (32.10, 32.11).'
      fr: 'Vos comptes annuels signés de l’exercice clos en {year} : bilan et compte de résultat. Sans comptabilité complète (moins de 500 000 francs de chiffre d’affaires), vos relevés des recettes et des dépenses, de l’état des actifs et passifs et des prélèvements et apports privés. Vos propres cotisations AVS ne font pas partie des charges : elles se déclarent à part (32.10, 32.11).'
      de: 'Dein unterschriebener Jahresabschluss des {year} abgeschlossenen Geschäftsjahrs: Bilanz und Erfolgsrechnung. Ohne vollständige Buchhaltung (unter 500 000 Franken Umsatz) deine Aufzeichnungen über Einnahmen und Ausgaben, Aktiven und Passiven sowie Privatbezüge und -einlagen. Deine eigenen AHV-Beiträge gehören nicht zum Aufwand: Sie werden separat deklariert (32.10, 32.11).'
      it: 'I tuoi conti annuali firmati dell’esercizio chiuso nel {year}: bilancio e conto economico. Senza una contabilità completa (meno di 500 000 franchi di cifra d’affari), le tue registrazioni di ricavi e spese, di attivi e passivi e dei prelevamenti e apporti privati. I tuoi contributi AVS non fanno parte dei costi: si dichiarano a parte (32.10, 32.11).'
