  - use: lpp_buyin
    explain:
      en: 'Only needed if you made an extra, voluntary payment into your pension fund. The fund confirms it on form 21EDP. No buy-in? Change your answer and this goes away.'
      fr: 'Seulement si vous avez fait un versement volontaire supplémentaire dans votre caisse de pension. La caisse le confirme sur le formulaire 21EDP. Pas de rachat ? Modifiez votre réponse et cette ligne disparaît.'
    # ge-2025-guide-declaration-pp p. 18
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=18'
      label:
        en: 'Geneva tax guide 2025, p. 18: contributions and buy-ins'
        fr: 'Guide fiscal 2025, p. 18 : Déductions des cotisations et des rachats'
    reason:
      {
        en: 'Form 21EDP from your pension fund.',
        fr: 'Formulaire 21EDP de votre caisse de pension.',
      }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10'

  - use: health_premiums
    # ge-2025-guide-declaration-pp p. 29
