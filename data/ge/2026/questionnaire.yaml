  # Self-employment (ge-2025-guide-independants p. 6 and 25): the accounts, signed, or simple
  # records; and the AVS compensation fund's statement of the contributions paid in the year, with
  # each final decision for an earlier year.
  - id: business_accounts
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    expects: { kinds: [business_accounts] }
    label:
      en: 'Business accounts (bilan et compte de résultat)'
      fr: 'Comptes commerciaux (bilan et compte de résultat)'
      de: 'Geschäftsabschluss (bilan et compte de résultat)'
    explain:
      en: 'Your signed accounts for the business year closed in 2026: balance sheet and profit and loss account. Without full accounts (under 500,000 francs of turnover), your records of income and expenses, of what the business owns and owes, and of what you took out or put in privately.'
      fr: 'Vos comptes annuels signés de l’exercice clos en 2026 : bilan et compte de résultat. Sans comptabilité complète (moins de 500 000 francs de chiffre d’affaires), vos relevés des recettes et des dépenses, de l’état des actifs et passifs et des prélèvements et apports privés.'
      de: 'Dein unterschriebener Jahresabschluss des 2026 abgeschlossenen Geschäftsjahrs: Bilanz und Erfolgsrechnung. Ohne vollständige Buchhaltung (unter 500 000 Franken Umsatz) deine Aufzeichnungen über Einnahmen und Ausgaben, Aktiven und Passiven sowie Privatbezüge und -einlagen.'
    # ge-2025-guide-independants p. 25
    learnMore:
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=25'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 25: documents to attach'
        fr: 'Guide 2025 des indépendants, p. 25 : Documents à joindre à votre déclaration'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 25: beizulegende Unterlagen, auf Französisch'
    reason:
      en: 'Signed accounts, or your records of income and expenses.'
      fr: 'Comptes annuels signés, ou relevé des recettes et des dépenses.'
      de: 'Unterschriebener Abschluss oder Aufzeichnungen der Einnahmen und Ausgaben.'
    source: 'ge-2025-guide-independants p. 6, p. 25'

