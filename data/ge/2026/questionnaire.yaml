        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 16: perdite non ancora compensate, in francese'
    text:
      p1:
        en: 'Do you have business losses from the seven years before {year} not deducted yet?'
        fr: 'Avez-vous des pertes commerciales des sept années avant {year} pas encore déduites ?'
        de: 'Hast du Geschäftsverluste aus den sieben Jahren vor {year}, die noch nicht abgezogen sind?'
        it: 'Hai perdite commerciali dei sette anni prima del {year} non ancora dedotte?'
      p2:
        en: 'Does your spouse or partner have business losses from the seven years before {year} not deducted yet?'
        fr: 'Votre conjoint ou partenaire a-t-il des pertes commerciales des sept années avant {year} pas encore déduites ?'
        de: 'Hat dein Partner oder deine Partnerin Geschäftsverluste aus den sieben Jahren vor {year}, die noch nicht abgezogen sind?'
        it: 'Il tuo coniuge o partner ha perdite commerciali dei sette anni prima del {year} non ancora dedotte?'
