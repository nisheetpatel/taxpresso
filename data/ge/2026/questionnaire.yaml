# Questionnaire for tax year 2026 (SPEC.md section 6). Data, not code: packages/questionnaire reads
# it, and every key and value must exist in packages/rules-ge/src/2026/keys.ts (a test checks).
# Every question changes what we ask for or compute; otherwise it doesn't belong here.
#
# Wording and documents follow the Geneva guide for 2025, the latest published:
# ge-2025-guide-declaration-pp p. 8 (documents to gather) and p. 10 (attachments).
# Re-check everything against the 2026 guide when it is published (January 2027).
#
# French: write plain spaces before ? ! : ; and the loader makes them non-breaking.
# Texts per person (p1, p2) where the grammar differs; {n} is replaced by the number.

taxYear: 2026

people:
  p1: { en: 'You', fr: 'Vous' }
  p2: { en: 'Your spouse or partner', fr: 'Votre conjoint ou partenaire' }
  p2Chip: { en: 'Partner', fr: 'Conjoint' }

notSupported:
  en: 'Taxpresso can’t prepare this part yet. GeTax, the canton’s free software, or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. GeTax, le logiciel gratuit du canton, ou une fiduciaire le peuvent.'

questions:
  - id: civil_status
    key: profile.civil_status
    type: choice
    explain:
      en: 'Your situation on 31 December decides whether you file alone or as a couple, on one declaration together.'
      fr: 'Votre situation au 31 décembre décide si vous déclarez seul ou en couple, sur une seule déclaration commune.'
    # ge-2025-guide-declaration-pp p. 53
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=53'
      label:
        en: 'Geneva tax guide 2025, p. 53: changes of situation'
        fr: 'Guide fiscal 2025, p. 53 : Changements de situation'
    text:
      en: 'What was your civil status on 31 December 2026?'
      fr: 'Quel était votre état civil au 31 décembre 2026 ?'
    help:
      en: 'On the official form: état civil.'
      fr: 'Sur le formulaire officiel : état civil.'
    options:
      - { value: single, label: { en: 'Single', fr: 'Célibataire' } }
      - { value: married, label: { en: 'Married', fr: 'Marié(e)' } }
      - value: registered_partnership
        label: { en: 'Registered partnership', fr: 'Partenariat enregistré' }
      - { value: separated, label: { en: 'Separated', fr: 'Séparé(e)' } }
      - { value: divorced, label: { en: 'Divorced', fr: 'Divorcé(e)' } }
      - { value: widowed, label: { en: 'Widowed', fr: 'Veuf ou veuve' } }

  - id: children
    key: profile.children_count
    type: number
    min: 0
    max: 12
    explain:
      en: 'Count the children who live with you or whom you support financially. Unsure about an adult child? Ask Claude.'
      fr: 'Comptez les enfants qui vivent avec vous ou que vous entretenez. Un doute pour un enfant majeur ? Demandez à Claude.'
    # ge-2025-guide-declaration-pp p. 46
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=46'
      label:
        en: 'Geneva tax guide 2025, p. 46: children you support'
        fr: 'Guide fiscal 2025, p. 46 : Enfant(s) à charge'
    text:
      en: 'How many children did you support in 2026?'
      fr: 'Combien d’enfants aviez-vous à charge en 2026 ?'
    help:
      en: 'On the official form: enfants à charge.'
      fr: 'Sur le formulaire officiel : enfants à charge.'
    chip:
      zero: { en: 'No children', fr: 'Pas d’enfants' }
      one: { en: '1 child', fr: '1 enfant' }
      other: { en: '{n} children', fr: '{n} enfants' }

  - id: children_custody
    key: profile.children_custody
    type: choice
    when: { key: profile.children_count, gt: 0 }
    explain:
      en: 'Who the children mainly live with. Shared custody means they live with each parent about half the time.'
      fr: 'Chez qui les enfants vivent surtout. En garde partagée, ils vivent environ la moitié du temps chez chaque parent.'
    # ge-2025-guide-declaration-pp p. 45
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=45'
      label:
        en: 'Geneva tax guide 2025, p. 45: family, scale and splitting'
        fr: 'Guide fiscal 2025, p. 45 : Barème et splitting'
    text:
      en: 'Where did the children live in 2026?'
      fr: 'Où vivaient les enfants en 2026 ?'
    options:
      - value: with_household
        label: { en: 'With me, or with us', fr: 'Avec moi, ou avec nous' }
      - value: shared
        label: { en: 'Shared custody', fr: 'En garde partagée' }
        chip: { en: 'Shared custody', fr: 'Garde partagée' }
      - value: elsewhere
        label: { en: 'Mostly with the other parent', fr: 'Surtout chez l’autre parent' }

  # Parents who share custody without a partner: child support decides who gets the federal
  # parental scale and the child deductions (ch-na-circulaire-30-epoux-famille p. 24, ch. 13.4.2;
  # p. 32 and 33, ch. 14.4 and 14.5), and the Geneva family charge and splitting
  # (ge-2025-guide-declaration-pp p. 45 and 46).
  - id: child_support
    key: profile.child_support
    type: choice
    when:
      all:
        - { key: profile.children_custody, in: [shared] }
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
    explain:
      en: 'With shared custody, only one parent gets the federal parental scale (barème parental), a lower rate: the one who receives child support or, without child support, the one who earns more. Without child support, you each get half the child deductions.'
      fr: 'En garde partagée, un seul parent a droit au barème parental fédéral, un taux plus bas : celui qui reçoit la contribution d’entretien ou, sans contribution, celui qui gagne le plus. Sans contribution d’entretien, chacun a la moitié des déductions pour enfants.'
    # ch-na-circulaire-30-epoux-famille p. 24
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/2YuHXYYJMbn9/dbst-ks-2010-1-030-d-fr.pdf#page=24'
      label:
        en: 'Federal tax circular 30, p. 24: the parental scale when parents live apart'
        fr: 'Circulaire AFC n° 30, p. 24 : Barème parental des parents séparés'
    text:
      en: 'In 2026, did you or the other parent pay child support for the children?'
      fr: 'En 2026, vous ou l’autre parent avez-vous versé une contribution d’entretien pour les enfants ?'
    help:
      en: 'Child support (contribution d’entretien) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
    options:
      - value: i_receive
        label:
          {
            en: 'The other parent paid me child support',
            fr: 'L’autre parent m’a versé une contribution d’entretien',
          }
        chip: { en: 'Receives child support', fr: 'Reçoit une contribution' }
      - value: i_pay
        label:
          {
            en: 'I paid child support to the other parent',
            fr: 'J’ai versé une contribution d’entretien à l’autre parent',
          }
        chip: { en: 'Pays child support', fr: 'Verse une contribution' }
      - value: none_i_earn_more
        label:
          {
            en: 'No child support, and I earn more than the other parent',
            fr: 'Pas de contribution, et je gagne plus que l’autre parent',
          }
      - value: none_other_earns_more
        label:
          {
            en: 'No child support, and the other parent earns more',
            fr: 'Pas de contribution, et l’autre parent gagne plus',
          }
      - value: none_unsure
        label:
          {
            en: 'No child support, and I don’t know who earns more',
            fr: 'Pas de contribution, et je ne sais pas qui gagne le plus',
          }

  - id: childcare
    key: profile.childcare
    type: choice
    when: { key: profile.children_count, gt: 0 }
    explain:
      en: 'What you paid so someone looks after your children while you work: crèche, day care, after-school care or a nanny.'
      fr: 'Ce que vous avez payé pour faire garder vos enfants pendant que vous travaillez : crèche, garderie, parascolaire ou nourrice.'
    # ge-2025-guide-declaration-pp p. 30
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=30'
      label:
        en: 'Geneva tax guide 2025, p. 30: childcare costs'
        fr: 'Guide fiscal 2025, p. 30 : Frais de garde des enfants'
    text:
      en: 'Did you pay for childcare in 2026?'
      fr: 'Avez-vous payé des frais de garde en 2026 ?'
    help:
      en: 'Crèche, day care, after-school care or a nanny. On the official form: frais de garde.'
      fr: 'Crèche, garderie, parascolaire ou nourrice. Sur le formulaire officiel : frais de garde.'
    options:
      - value: creche_or_daycare
        label: { en: 'Yes, a crèche or day care', fr: 'Oui, une crèche ou une garderie' }
        chip: { en: 'Crèche', fr: 'Crèche' }
      - value: nanny
        label: { en: 'Yes, a nanny', fr: 'Oui, une nourrice' }
        chip: { en: 'Nanny', fr: 'Nourrice' }
      - value: none
        label: { en: 'No childcare costs', fr: 'Pas de frais de garde' }

  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The municipality where you lived on 31 December. Each commune adds its own share of tax (centimes additionnels).'
      fr: 'La commune où vous habitiez au 31 décembre. Chaque commune ajoute sa propre part d’impôt (centimes additionnels).'
    # ge-2025-taux-donnees-fiscales
    learnMore:
      url: 'https://www.ge.ch/taux-donnees-fiscales'
      label:
        en: 'Tax rates and data, with the communal centimes (ge.ch)'
        fr: 'Taux et données fiscales, dont les centimes additionnels (ge.ch)'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
    help:
      en: 'On the official form: commune de domicile.'
      fr: 'Sur le formulaire officiel : commune de domicile.'

  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within Geneva changes little. Arriving from abroad means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton change peu de choses. Arriver de l’étranger signifie que vous n’étiez imposé ici qu’une partie de l’année.'
    # ge-2025-guide-declaration-pp p. 53
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=53'
      label:
        en: 'Geneva tax guide 2025, p. 53: changes of situation, arriving in Geneva'
        fr: 'Guide fiscal 2025, p. 53 : Changements de situation'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non' } }
      - value: within_geneva
        label: { en: 'Yes, within the canton of Geneva', fr: 'Oui, dans le canton de Genève' }
        chip: { en: 'Moved in Geneva', fr: 'Déménagé à Genève' }
      - value: from_abroad
        label: { en: 'Yes, I arrived from abroad', fr: 'Oui, je suis arrivé(e) de l’étranger' }
        chip: { en: 'Arrived in 2026', fr: 'Arrivé(e) en 2026' }
      - value: from_other_canton
        label: { en: 'Yes, from another canton', fr: 'Oui, depuis un autre canton' }
        notSupported:
          { en: 'Moving from another canton', fr: 'Un déménagement depuis un autre canton' }
      - value: leaving_switzerland
        label:
          { en: 'I left, or I’m leaving, Switzerland', fr: 'J’ai quitté ou je quitte la Suisse' }
        notSupported: { en: 'Leaving Switzerland', fr: 'Un départ de Suisse' }

  - id: income_sources
    key: profile.income_sources
    type: multi
    perPerson: true
    explain:
      en: 'Benefits: money paid by unemployment, sickness or accident insurance. Pension: a regular payment from AVS, AI or a pension fund.'
      fr: 'Indemnités : l’argent versé par l’assurance chômage, maladie ou accident. Rente : un versement régulier de l’AVS, de l’AI ou d’une caisse de pension.'
    # ge-2025-guide-declaration-pp p. 25
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=25'
      label:
        en: 'Geneva tax guide 2025, p. 25: pensions and other benefits'
        fr: 'Guide fiscal 2025, p. 25 : Rentes, pensions et autres prestations'
    text:
      p1:
        en: 'What income did you have in 2026?'
        fr: 'Quels revenus avez-vous eus en 2026 ?'
      p2:
        en: 'What income did your spouse or partner have in 2026?'
        fr: 'Quels revenus votre conjoint ou partenaire a-t-il eus en 2026 ?'
    help:
      en: 'Choose all that apply. Interest and dividends come later, with your bank documents.'
      fr: 'Choisissez tout ce qui s’applique. Les intérêts et dividendes viennent plus tard, avec vos documents bancaires.'
    none: { en: 'None of these', fr: 'Aucun de ceux-là' }
    options:
      - { value: salary, label: { en: 'A salary', fr: 'Un salaire' } }
      - value: replacement_income
        label:
          en: 'Unemployment, sickness or accident benefits'
          fr: 'Des indemnités (chômage, maladie, accident)'
        chip: { en: 'Benefits', fr: 'Indemnités' }
      - value: pension
        label:
          {
            en: 'A pension (AVS, AI or pension fund)',
            fr: 'Une rente (AVS, AI ou caisse de pension)',
          }
        chip: { en: 'Pension', fr: 'Rente' }
      - value: alimony
        label: { en: 'Alimony or child support received', fr: 'Une pension alimentaire reçue' }
        chip: { en: 'Receives alimony', fr: 'Reçoit une pension' }
      - value: self_employment
        label: { en: 'Income from self-employment', fr: 'Un revenu d’activité indépendante' }
        notSupported: { en: 'Self-employment (annexe B)', fr: 'L’activité indépendante (annexe B)' }

  - id: employers
    key: profile.employers
    type: number
    perPerson: true
    min: 1
    max: 9
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Count every employer you worked for during the year, even briefly. Each one gives you a salary certificate.'
      fr: 'Comptez tous les employeurs de l’année, même pour peu de temps. Chacun vous remet un certificat de salaire.'
    # ge-2025-guide-declaration-pp p. 17
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=17'
      label:
        en: 'Geneva tax guide 2025, p. 17: employment income'
        fr: 'Guide fiscal 2025, p. 17 : Activité dépendante'
    text:
      p1:
        en: 'How many employers paid you a salary in 2026?'
        fr: 'Combien d’employeurs vous ont versé un salaire en 2026 ?'
      p2:
        en: 'How many employers paid your spouse or partner a salary in 2026?'
        fr: 'Combien d’employeurs ont versé un salaire à votre conjoint ou partenaire en 2026 ?'
    help:
      en: 'Each one gives you a salary certificate (certificat de salaire).'
      fr: 'Chacun vous remet un certificat de salaire.'
    chip:
      one: { en: '1 employer', fr: '1 employeur' }
      other: { en: '{n} employers', fr: '{n} employeurs' }

  - id: taxed_at_source
    key: profile.taxed_at_source
    type: yesno
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Your employer took tax off your salary before paying you. Common with a B or L permit. Your salary certificate shows it.'
      fr: 'Votre employeur a retenu l’impôt sur votre salaire avant de vous le verser. Fréquent avec un permis B ou L. Votre certificat de salaire l’indique.'
    # ge-2025-dris-tou-page
    learnMore:
      url: 'https://www.ge.ch/demande-rectification-taxation-ordinaire-ulterieure'
      label:
        en: 'Tax at source: correction or TOU (ge.ch)'
        fr: 'Demande de rectification ou taxation ordinaire ultérieure (ge.ch)'
    text:
      p1:
        en: 'Was your salary taxed at source in 2026?'
        fr: 'Votre salaire était-il imposé à la source en 2026 ?'
      p2:
        en: 'Was your spouse or partner’s salary taxed at source in 2026?'
        fr: 'Le salaire de votre conjoint ou partenaire était-il imposé à la source en 2026 ?'
    help:
      en: 'If so, it shows on the salary certificate. On the official form: impôt à la source.'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire.'
    chip: { en: 'Taxed at source', fr: 'Imposé à la source' }

  - id: tou
    key: profile.tou
    type: choice
    perPerson: true
    when: { key: profile.taxed_at_source, is: true }
    explain:
      en: 'TOU (taxation ordinaire ultérieure): instead of the tax taken from your salary being final, you file a normal declaration and can claim deductions. Once you ask for it, you can’t go back.'
      fr: 'TOU (taxation ordinaire ultérieure) : au lieu que l’impôt retenu sur votre salaire soit définitif, vous remplissez une déclaration normale et pouvez faire valoir des déductions. Une fois demandée, on ne peut plus revenir en arrière.'
    # ge-2025-guide-declaration-pp p. 52
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=52'
      label:
        en: 'Geneva tax guide 2025, p. 52: TOU for people taxed at source'
        fr: 'Guide fiscal 2025, p. 52 : La TOU pour les contribuables imposés à la source'
    text:
      p1:
        en: 'Are you taxed ordinarily instead (TOU), or thinking about it?'
        fr: 'Êtes-vous en taxation ordinaire ultérieure (TOU), ou y songez-vous ?'
      p2:
        en: 'Is your spouse or partner taxed ordinarily instead (TOU), or thinking about it?'
        fr: 'Votre conjoint ou partenaire est-il en taxation ordinaire ultérieure (TOU), ou y songe-t-il ?'
    help:
      en: 'Taxpresso will show you both cases, with their amounts, before you decide.'
      fr: 'Taxpresso vous montrera les deux cas, avec leurs montants, avant que vous décidiez.'
    options:
      - value: already
        label: { en: 'Yes, already', fr: 'Oui, déjà' }
        chip: { en: 'TOU', fr: 'TOU' }
      - value: considering
        label: { en: 'I’m thinking about it', fr: 'J’y songe' }
        chip: { en: 'Considering TOU', fr: 'Envisage la TOU' }
      - { value: 'no', label: { en: 'No', fr: 'Non' } }

  - id: pillar3a
    key: profile.pillar3a
    type: yesno
    perPerson: true
    when:
      { key: profile.income_sources, includesAny: [salary, replacement_income, self_employment] }
    explain:
      en: 'Pillar 3a (3e pilier A) is a retirement account at a bank or insurer. What you pay in during the year lowers your taxable income, up to a yearly limit.'
      fr: 'Le 3e pilier A est un compte de prévoyance dans une banque ou une assurance. Ce que vous y versez dans l’année diminue votre revenu imposable, jusqu’à une limite annuelle.'
    # ge-2025-guide-declaration-pp p. 18
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=18'
      label:
        en: 'Geneva tax guide 2025, p. 18: contributions and buy-ins'
        fr: 'Guide fiscal 2025, p. 18 : Déductions des cotisations et des rachats'
    text:
      p1:
        en: 'Did you pay into a pillar 3a account in 2026?'
        fr: 'Avez-vous versé des cotisations au 3e pilier A en 2026 ?'
      p2:
        en: 'Did your spouse or partner pay into a pillar 3a account in 2026?'
        fr: 'Votre conjoint ou partenaire a-t-il versé des cotisations au 3e pilier A en 2026 ?'
    help:
      en: 'Your bank or insurer sends an attestation. On the official form: 3e pilier A.'
      fr: 'Votre banque ou votre assurance vous envoie une attestation.'
    chip: { en: 'Pays into 3a', fr: 'Cotise au 3e pilier A' }

  - id: lpp_buyin
    key: profile.lpp_buyin
    type: yesno
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Your pension fund at work (2nd pillar, LPP) takes contributions from your salary every month. A buy-in (rachat) is an extra payment you chose to make on top. Most people never make one.'
      fr: 'Votre caisse de pension (2e pilier, LPP) prélève des cotisations sur votre salaire chaque mois. Un rachat est un versement supplémentaire que vous avez choisi de faire en plus. La plupart des gens n’en font jamais.'
    # ge-2025-guide-declaration-pp p. 18
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=18'
      label:
        en: 'Geneva tax guide 2025, p. 18: contributions and buy-ins'
        fr: 'Guide fiscal 2025, p. 18 : Déductions des cotisations et des rachats'
    text:
      p1:
        en: 'Did you buy into your pension fund (2nd pillar) in 2026?'
        fr: 'Avez-vous fait un rachat dans votre caisse de pension (2e pilier) en 2026 ?'
      p2:
        en: 'Did your spouse or partner buy into their pension fund (2nd pillar) in 2026?'
        fr: 'Votre conjoint ou partenaire a-t-il fait un rachat dans sa caisse de pension (2e pilier) en 2026 ?'
    help:
      en: 'A voluntary payment on top of the usual contributions. On the official form: rachat 2e pilier.'
      fr: 'Un versement volontaire en plus des cotisations habituelles.'
    chip: { en: 'Pension fund buy-in', fr: 'Rachat 2e pilier' }

  - id: commute
    key: profile.commute
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    explain:
      en: 'Getting to work can be deducted as travel costs (frais de déplacement). How you get there decides how they are counted. A trip by public transport of over 2 hours a day, there and back, also lets your lunches count for the Geneva tax.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement. Votre moyen de transport décide comment ils sont comptés. Un trajet en transports publics de plus de 2 heures par jour, aller et retour, permet aussi de déduire vos repas pour l’impôt genevois.'
    # ch-2026-ifd-instructions-personnes-physiques p. 6 (federal rules by means of transport);
    # ge-2025-guide-declaration-pp p. 19 (Geneva: meals only over 2 hours a day by public transport).
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
    text:
      p1:
        en: 'How did you mostly get to work in 2026?'
        fr: 'Comment vous rendiez-vous surtout au travail en 2026 ?'
      p2:
        en: 'How did your spouse or partner mostly get to work in 2026?'
        fr: 'Comment votre conjoint ou partenaire se rendait-il surtout au travail en 2026 ?'
    help:
      en: 'Choose how you went on most work days. On the official form: frais de déplacement.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire officiel : frais de déplacement.'
    options:
      - { value: public_transport, label: { en: 'Public transport', fr: 'Transports publics' } }
      - value: public_transport_long
        label:
          {
            en: 'Public transport, over 2 hours a day there and back',
            fr: 'Transports publics, plus de 2 heures par jour aller et retour',
          }
        chip: { en: 'Long trip to work', fr: 'Long trajet' }
      - { value: car, label: { en: 'Car', fr: 'Voiture' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied' } }
      - value: mostly_home
        label: { en: 'From home, almost every day', fr: 'Depuis chez moi, presque tous les jours' }
        chip: { en: 'Works from home', fr: 'Télétravail' }

  - id: commute_transit_cost
    key: commute.transit_cost
    type: money
    perPerson: true
    when: { key: profile.commute, in: [public_transport, public_transport_long] }
    explain:
      en: 'For the federal tax you deduct what you actually paid to get to work, up to a yearly limit. The Geneva tax has a much lower limit.'
      fr: 'Pour l’impôt fédéral, vous déduisez ce que vous avez réellement payé pour aller au travail, jusqu’à une limite annuelle. L’impôt genevois a une limite bien plus basse.'
    # ch-2026-ifd-instructions-personnes-physiques p. 6; ge-2025-guide-declaration-pp p. 22
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
    text:
      p1:
        en: 'How much did you pay in 2026 for public transport to get to work?'
        fr: 'Combien avez-vous payé en 2026 de transports publics pour aller au travail ?'
      p2:
        en: 'How much did your spouse or partner pay in 2026 for public transport to get to work?'
        fr: 'Combien votre conjoint ou partenaire a-t-il payé en 2026 de transports publics pour aller au travail ?'
    help:
      en: 'Your yearly pass, or your monthly passes and tickets added up, in CHF. Leave out what your employer paid back.'
      fr: 'Votre abonnement annuel, ou vos abonnements mensuels et billets additionnés, en CHF. Sans ce que votre employeur vous a remboursé.'

  - id: commute_transit_usable
    key: commute.transit_usable
    type: choice
    perPerson: true
    when: { key: profile.commute, in: [car, motorbike] }
    explain:
      en: 'For the federal tax, a driver deducts what public transport would have cost. Only when you can’t use it (no line nearby, a disability, working hours with no service) do the kilometres count.'
      fr: 'Pour l’impôt fédéral, un conducteur déduit ce qu’auraient coûté les transports publics. Ce n’est que si vous ne pouvez pas les utiliser (pas de ligne à proximité, un handicap, des horaires sans desserte) que les kilomètres comptent.'
    # ch-2026-ifd-instructions-personnes-physiques p. 6; ge-2025-guide-declaration-pp p. 19
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
    text:
      p1:
        en: 'Could you have made that trip by public transport?'
        fr: 'Auriez-vous pu faire ce trajet en transports publics ?'
      p2:
        en: 'Could your spouse or partner have made that trip by public transport?'
        fr: 'Votre conjoint ou partenaire aurait-il pu faire ce trajet en transports publics ?'
    help:
      en: 'Over 2 hours a day there and back by public transport also lets your lunches count for the Geneva tax.'
      fr: 'Plus de 2 heures par jour aller et retour en transports publics permet aussi de déduire vos repas pour l’impôt genevois.'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, in 2 hours a day or less, there and back',
            fr: 'Oui, en 2 heures par jour ou moins, aller et retour',
          }
      - value: yes_long
        label:
          {
            en: 'Yes, but it takes over 2 hours a day, there and back',
            fr: 'Oui, mais il faut plus de 2 heures par jour, aller et retour',
          }
      - value: 'no'
        label:
          {
            en: 'No, there is no public transport I can use',
            fr: 'Non, aucun transport public que je puisse utiliser',
          }

  - id: commute_transit_equivalent
    key: commute.transit_equivalent
    type: money
    perPerson: true
    when: { key: commute.transit_usable, in: ['yes', yes_long] }
    explain:
      en: 'That price is what the federal tax lets you deduct for driving to work, up to a yearly limit.'
      fr: 'C’est ce prix que l’impôt fédéral vous laisse déduire pour le trajet en véhicule, jusqu’à une limite annuelle.'
    # ch-2026-ifd-instructions-personnes-physiques p. 6; ge-2025-guide-declaration-pp p. 20
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
    text:
      p1:
        en: 'What would a public transport pass for that trip have cost for 2026?'
        fr: 'Combien aurait coûté un abonnement de transports publics pour ce trajet en 2026 ?'
      p2:
        en: 'What would a public transport pass for your spouse or partner’s trip have cost for 2026?'
        fr: 'Combien aurait coûté un abonnement de transports publics pour le trajet de votre conjoint ou partenaire en 2026 ?'
    help:
      en: 'The cheapest pass covering the trip, for the months worked, in CHF.'
      fr: 'L’abonnement le moins cher couvrant le trajet, pour les mois travaillés, en CHF.'

  - id: commute_distance
    key: commute.distance_km
    type: number
    perPerson: true
    min: 1
    max: 300
    when: { key: commute.transit_usable, in: ['no'] }
    explain:
      en: 'Without public transport you can use, the federal tax counts a fixed amount per kilometre, there and back once a day, up to a yearly limit.'
      fr: 'Sans transport public utilisable, l’impôt fédéral compte un montant fixe par kilomètre, un aller et retour par jour, jusqu’à une limite annuelle.'
    # ch-2026-ifd-instructions-personnes-physiques p. 6
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
    text:
      p1:
        en: 'How many kilometres is it from your home to your workplace, one way?'
        fr: 'Combien de kilomètres y a-t-il de votre domicile à votre lieu de travail, aller simple ?'
      p2:
        en: 'How many kilometres is it from your spouse or partner’s home to their workplace, one way?'
        fr: 'Combien de kilomètres y a-t-il du domicile de votre conjoint ou partenaire à son lieu de travail, aller simple ?'
    help:
      en: 'Round to the nearest kilometre.'
      fr: 'Arrondi au kilomètre.'

  - id: commute_drive_days
    key: commute.drive_days
    type: number
    perPerson: true
    min: 1
    max: 366
    when: { key: commute.transit_usable, in: ['no'] }
    explain:
      en: 'The kilometres count for each day you drove to work, once there and back.'
      fr: 'Les kilomètres comptent pour chaque jour de trajet au travail, un aller et retour.'
    # ch-2026-ifd-instructions-personnes-physiques p. 6
    learnMore:
      url: 'https://www.estv.admin.ch/dam/fr/sd-web/oQ0wWcDmCJTS/2a-2026-fr.pdf#page=6'
      label:
        en: 'Federal tax instructions 2026, p. 6: travel costs'
        fr: 'Instructions IFD 2026, p. 6 : Frais de déplacement'
    text:
      p1:
        en: 'On how many days did you drive to work in 2026?'
        fr: 'Combien de jours avez-vous pris votre véhicule pour aller au travail en 2026 ?'
      p2:
        en: 'On how many days did your spouse or partner drive to work in 2026?'
        fr: 'Combien de jours votre conjoint ou partenaire a-t-il pris son véhicule pour aller au travail en 2026 ?'
    help:
      en: 'Leave out holidays, sick days and days worked from home.'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail.'

  # Lunches away from home (frais de repas): federal, per day up to a yearly limit, half with box G;
  # Geneva, only over 2 hours a day by public transport (ge-2025-guide-declaration-pp p. 19). No
  # deduction when the meal costs 10 francs or less (ch-2026-ifd-instructions-personnes-physiques
  # p. 6); none on days worked from home (guide p. 20).
  - id: meal_days
    key: meals.days
    type: number
    perPerson: true
    min: 0
    max: 366
    when:
      {
        key: profile.commute,
        in: [public_transport, public_transport_long, car, motorbike, bike, walk],
      }
    explain:
      en: 'Lunch away from home because of work costs more than at home. The federal tax counts a fixed amount per day, up to a yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate). The Geneva tax counts it only when your trip by public transport takes over 2 hours a day.'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison. L’impôt fédéral compte un montant fixe par jour, jusqu’à une limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire). L’impôt genevois ne le compte que si votre trajet en transports publics dépasse 2 heures par jour.'
    # ge-2025-guide-declaration-pp p. 19
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=19'
      label:
        en: 'Geneva tax guide 2025, p. 19: meals'
        fr: 'Guide fiscal 2025, p. 19 : Frais de repas'
    text:
      p1:
        en: 'On how many work days in 2026 did you have lunch away from home?'
        fr: 'Combien de jours de travail en 2026 avez-vous pris votre repas de midi hors de chez vous ?'
      p2:
        en: 'On how many work days in 2026 did your spouse or partner have lunch away from home?'
        fr: 'Combien de jours de travail en 2026 votre conjoint ou partenaire a-t-il pris son repas de midi hors de chez lui ?'
    help:
      en: 'Count the days your lunch cost you more than 10 francs; 0 if you usually ate at home. On the official form: frais de repas.'
      fr: 'Comptez les jours où votre repas vous a coûté plus de 10 francs ; 0 si vous mangiez en général à la maison. Sur le formulaire officiel : frais de repas.'

  - id: banks
    key: profile.banks
    type: number
    min: 0
    max: 20
    explain:
      en: 'Every bank where you had an account, savings or investments on 31 December, including your children’s accounts.'
      fr: 'Toutes les banques où vous aviez un compte, de l’épargne ou des placements au 31 décembre, y compris les comptes de vos enfants.'
    # ge-na-other-e-releve-fiscal
    learnMore:
      url: 'https://www.ge.ch/node/13593'
      label:
        en: 'The e-tax statement (e-relevé fiscal) on ge.ch'
        fr: 'Déclarez vos titres avec le e-relevé fiscal (ge.ch)'
    text:
      en: 'With how many banks did you have accounts or securities on 31 December 2026?'
      fr: 'Dans combien de banques aviez-vous des comptes ou des titres au 31 décembre 2026 ?'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers (Interactive Brokers, DEGIRO). If a bank offers an e-tax statement (e-relevé fiscal), ask for it: it has everything in one document.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers (Interactive Brokers, DEGIRO). Si une banque propose un e-relevé fiscal, demandez-le : il contient tout en un seul document.'
    chip:
      one: { en: '1 bank', fr: '1 banque' }
      other: { en: '{n} banks', fr: '{n} banques' }

  - id: crypto
    key: profile.crypto
    type: yesno
    explain:
      en: 'Coins or tokens you owned on 31 December count as part of your wealth (fortune), like money in a bank.'
      fr: 'Les cryptos que vous déteniez au 31 décembre font partie de votre fortune, comme l’argent à la banque.'
    # ge-2025-guide-declaration-pp p. 40
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=40'
      label:
        en: 'Geneva tax guide 2025, p. 40: bank accounts, with crypto'
        fr: 'Guide fiscal 2025, p. 40 : Comptes bancaires et postaux'
    text:
      en: 'Did you hold cryptocurrencies on 31 December 2026?'
      fr: 'Déteniez-vous des crypto-monnaies au 31 décembre 2026 ?'
    chip: { en: 'Crypto', fr: 'Crypto' }

  - id: payments
    key: profile.payments
    type: multi
    explain:
      en: 'Each of these can lower your tax if you keep the proof.'
      fr: 'Chacun de ces frais peut diminuer votre impôt si vous en gardez la preuve.'
    # ge-2025-guide-declaration-pp p. 11
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=11'
      label:
        en: 'Geneva tax guide 2025, p. 11: the main deductions'
        fr: 'Guide fiscal 2025, p. 11 : Principales déductions'
    text:
      en: 'Which of these did you pay in 2026?'
      fr: 'Lesquels de ces frais avez-vous payés en 2026 ?'
    help:
      en: 'Choose all that apply.'
      fr: 'Choisissez tout ce qui s’applique.'
    none: { en: 'None of these', fr: 'Aucun' }
    options:
      - value: medical_costs
        label:
          {
            en: 'Medical or dental costs that insurance didn’t cover',
            fr: 'Des frais médicaux ou dentaires non remboursés',
          }
        chip: { en: 'Medical costs', fr: 'Frais médicaux' }
      - value: donations
        label:
          {
            en: 'Donations to charities or political parties in Switzerland',
            fr: 'Des dons à des associations ou des partis politiques en Suisse',
          }
        chip: { en: 'Donations', fr: 'Dons' }
      - value: loan_interest
        label:
          {
            en: 'Interest on a loan, such as a consumer or car loan',
            fr: 'Des intérêts d’emprunt, par exemple un crédit ou un prêt auto',
          }
        chip: { en: 'Loan interest', fr: 'Intérêts d’emprunt' }
      - value: alimony_paid
        label: { en: 'Alimony or child support', fr: 'Une pension alimentaire' }
        chip: { en: 'Pays alimony', fr: 'Verse une pension' }

  - id: special
    key: profile.special
    type: multi
    explain:
      en: 'These situations need checks that Taxpresso can’t do yet. Better to know now than in March.'
      fr: 'Ces situations demandent des vérifications que Taxpresso ne sait pas encore faire. Mieux vaut le savoir maintenant qu’en mars.'
    # ge-2025-getax-software
    learnMore:
      url: 'https://www.ge.ch/getax/telecharger-installer-getax-particuliers'
      label:
        en: 'GeTax, the canton’s free software (ge.ch)'
        fr: 'GeTax, le logiciel gratuit du canton (ge.ch)'
    text:
      en: 'Do any of these apply to you in 2026?'
      fr: 'Une de ces situations vous concerne-t-elle en 2026 ?'
    none: { en: 'None of these', fr: 'Aucune' }
    options:
      - value: real_estate
        label:
          {
            en: 'I own real estate, in Switzerland or abroad',
            fr: 'Je suis propriétaire d’un bien immobilier, en Suisse ou à l’étranger',
          }
        notSupported: { en: 'Real estate (annexe D)', fr: 'Les immeubles (annexe D)' }
      - value: inheritance_or_gift
        label:
          {
            en: 'I received an inheritance or a large gift',
            fr: 'J’ai reçu un héritage ou une donation importante',
          }
        notSupported: { en: 'An inheritance or a gift', fr: 'Un héritage ou une donation' }
      - value: foreign_income
        label:
          {
            en: 'I had income from abroad (salary, pension, rent)',
            fr: 'J’ai eu des revenus de l’étranger (salaire, rente, loyer)',
          }
        notSupported: { en: 'Income from abroad', fr: 'Des revenus de l’étranger' }
      - value: pension_capital
        label:
          {
            en: 'I withdrew pension capital (2nd or 3rd pillar)',
            fr: 'J’ai retiré un capital de prévoyance (2e ou 3e pilier)',
          }
        notSupported:
          { en: 'A pension capital withdrawal', fr: 'Un retrait de capital de prévoyance' }

# What the "still missing" list asks for. Labels use the guide's words (p. 8 and p. 10).
requirements:
  - id: salary_certificate
    perPerson: true
    when: { key: profile.income_sources, includes: salary }
    expects: { kinds: [salary_certificate], countKey: profile.employers }
    label: { en: 'Salary certificate', fr: 'Certificat de salaire' }
    explain:
      en: 'The yearly summary of your salary and deductions that each employer gives you, usually in January or February.'
      fr: 'Le récapitulatif annuel de votre salaire et des retenues que chaque employeur vous remet, en général en janvier ou février.'
    # ge-2025-guide-declaration-pp p. 17
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=17'
      label:
        en: 'Geneva tax guide 2025, p. 17: employment income'
        fr: 'Guide fiscal 2025, p. 17 : Activité dépendante'
    reason: { en: 'One from each employer.', fr: 'Un par employeur.' }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10'

  - id: replacement_income
    perPerson: true
    when: { key: profile.income_sources, includes: replacement_income }
    expects: { kinds: [replacement_income_certificate] }
    label: { en: 'Benefits attestation', fr: 'Attestation d’indemnités' }
    explain:
      en: 'A yearly attestation from the unemployment fund or the insurer that paid you benefits.'
      fr: 'Une attestation annuelle de la caisse de chômage ou de l’assurance qui vous a versé des indemnités.'
    # ge-2025-guide-declaration-pp p. 10
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=10'
      label:
        en: 'Geneva tax guide 2025, p. 10: supporting documents'
        fr: 'Guide fiscal 2025, p. 10 : Les justificatifs'
    reason:
      {
        en: 'From the unemployment fund or the insurer.',
        fr: 'De la caisse de chômage ou de l’assurance.',
      }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10'

  - id: pension
    perPerson: true
    when: { key: profile.income_sources, includes: pension }
    expects: { kinds: [pension_certificate] }
    label: { en: 'Pension certificate', fr: 'Certificat de rente' }
    explain:
      en: 'A yearly statement from AVS, AI or your pension fund showing the pension paid to you.'
      fr: 'Un relevé annuel de l’AVS, de l’AI ou de votre caisse de pension indiquant la rente versée.'
    # ge-2025-guide-declaration-pp p. 25
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=25'
      label:
        en: 'Geneva tax guide 2025, p. 25: pensions and other benefits'
        fr: 'Guide fiscal 2025, p. 25 : Rentes, pensions et autres prestations'
    reason:
      { en: 'From AVS/AI or the pension fund.', fr: 'De l’AVS/AI ou de la caisse de pension.' }
    source: 'ge-2025-guide-declaration-pp p. 8'

  - id: pillar3a
    perPerson: true
    when: { key: profile.pillar3a, is: true }
    expects: { kinds: [pillar3a_attestation] }
    label: { en: 'Pillar 3a attestation', fr: 'Attestation 3e pilier A' }
    explain:
      en: 'A yearly attestation from your bank or insurer showing what you paid into your 3a account. It usually arrives in January.'
      fr: 'Une attestation annuelle de votre banque ou assurance indiquant ce que vous avez versé sur votre 3e pilier A. Elle arrive en général en janvier.'
    # ge-2025-guide-declaration-pp p. 18
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=18'
      label:
        en: 'Geneva tax guide 2025, p. 18: contributions and buy-ins'
        fr: 'Guide fiscal 2025, p. 18 : Déductions des cotisations et des rachats'
    reason: { en: 'From your bank or insurer.', fr: 'De votre banque ou de votre assurance.' }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10'

  - id: lpp_buyin
    perPerson: true
    when: { key: profile.lpp_buyin, is: true }
    expects: { kinds: [lpp_buyin] }
    label: { en: 'Pension fund buy-in attestation', fr: 'Attestation de rachat 2e pilier' }
    explain:
      en: 'Only needed if you made an extra, voluntary payment into your pension fund. The fund confirms it on form 21EDP. No buy-in? Change your answer and this goes away.'
      fr: 'Seulement si vous avez fait un versement volontaire supplémentaire dans votre caisse de pension. La caisse le confirme sur le formulaire 21EDP. Pas de rachat ? Modifiez votre réponse et cette ligne disparaît.'
    # ge-2025-guide-declaration-pp p. 18
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=18'
      label:
        en: 'Geneva tax guide 2025, p. 18: contributions and buy-ins'
        fr: 'Guide fiscal 2025, p. 18 : Déductions des cotisations et des rachats'
    reason:
      {
        en: 'Form 21EDP from your pension fund.',
        fr: 'Formulaire 21EDP de votre caisse de pension.',
      }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10'

  - id: health_premiums
    perPerson: true
    expects: { kinds: [health_premiums] }
    label: { en: 'Health insurance premiums', fr: 'Primes d’assurance-maladie' }
    explain:
      en: 'Your health insurer’s yearly statement of premiums paid, basic and supplementary. One family statement can cover several people.'
      fr: 'Le relevé annuel des primes payées, de base et complémentaires, envoyé par votre assureur. Un relevé familial peut couvrir plusieurs personnes.'
    # ge-2025-guide-declaration-pp p. 29
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=29'
      label:
        en: 'Geneva tax guide 2025, p. 29: health and accident insurance'
        fr: 'Guide fiscal 2025, p. 29 : Assurances maladie et accidents'
    reason:
      {
        en: 'Your insurer’s annual attestation, basic and supplementary.',
        fr: 'L’attestation annuelle de votre assureur, de base et complémentaire.',
      }
    source: 'ge-2025-guide-declaration-pp p. 8'

  # Securities held abroad belong in the état des titres too (p. 38). A broker's export gives the
  # positions and income Taxpresso reads into it (SPEC.md 5.7); the attachments the guide asks
  # for stay the statements (relevés fiscaux, p. 10 and p. 43).
  - id: banks
    when: { key: profile.banks, gt: 0 }
    expects:
      { kinds: [ech0196_statement, bank_attestation, broker_export], countKey: profile.banks }
    label: { en: 'Bank statements on 31 December', fr: 'Relevés bancaires au 31 décembre' }
    explain:
      en: 'The statement each bank gives for your taxes, with balances on 31 December. Ask for the e-tax statement (e-relevé fiscal) if your bank offers it. For a broker such as Interactive Brokers or DEGIRO, add its export too (Flex Query XML, or the CSV of the portfolio and of the account statement): Taxpresso reads your securities from it.'
      fr: 'Le relevé fiscal de chaque banque, avec les soldes au 31 décembre. Demandez le e-relevé fiscal si votre banque le propose. Pour un courtier comme Interactive Brokers ou DEGIRO, ajoutez aussi son export (Flex Query XML, ou le CSV du portefeuille et du relevé de compte) : Taxpresso y lit vos titres.'
    # ge-na-other-e-releve-fiscal
    learnMore:
      url: 'https://www.ge.ch/node/13593'
      label:
        en: 'The e-tax statement (e-relevé fiscal) on ge.ch'
        fr: 'Déclarez vos titres avec le e-relevé fiscal (ge.ch)'
    reason:
      {
        en: 'One per bank, ideally the e-tax statement (e-relevé fiscal).',
        fr: 'Un par banque, idéalement le e-relevé fiscal.',
      }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10, p. 38, p. 43'

  - id: crypto
    when: { key: profile.crypto, is: true }
    expects: { kinds: [crypto_statement] }
    label: { en: 'Crypto holdings on 31 December', fr: 'Crypto-monnaies au 31 décembre' }
    explain:
      en: 'A statement from each exchange or wallet showing what you held on 31 December.'
      fr: 'Un relevé de chaque plateforme ou portefeuille indiquant ce que vous déteniez au 31 décembre.'
    # ge-2025-guide-declaration-pp p. 40
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=40'
      label:
        en: 'Geneva tax guide 2025, p. 40: bank accounts, with crypto'
        fr: 'Guide fiscal 2025, p. 40 : Comptes bancaires et postaux'
    reason:
      {
        en: 'A statement from each exchange or wallet.',
