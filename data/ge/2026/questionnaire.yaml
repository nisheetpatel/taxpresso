  # Securities held abroad belong in the état des titres too (p. 38). A broker's export gives the
  # positions and income Taxpresso reads into it (SPEC.md 5.7); the attachments the guide asks
  # for stay the statements (relevés fiscaux, p. 10 and p. 43).
  - use: banks
    explain:
      en: 'The statement each bank gives for your taxes, with balances on 31 December. Ask for the e-tax statement (e-relevé fiscal) if your bank offers it. For a broker such as Interactive Brokers or DEGIRO, add its export too (Flex Query XML, or the CSV of the portfolio and of the account statement): Taxpresso reads your securities from it.'
      fr: 'Le relevé fiscal de chaque banque, avec les soldes au 31 décembre. Demandez le e-relevé fiscal si votre banque le propose. Pour un courtier comme Interactive Brokers ou DEGIRO, ajoutez aussi son export (Flex Query XML, ou le CSV du portefeuille et du relevé de compte) : Taxpresso y lit vos titres.'
      it: 'L’estratto fiscale di ogni banca, con i saldi al 31 dicembre. Chiedi l’estratto fiscale elettronico (e-relevé fiscal) se la tua banca lo offre. Per un broker come Interactive Brokers o DEGIRO, aggiungi anche il suo export (Flex Query XML, o il CSV del portafoglio e dell’estratto conto): Taxpresso legge da lì i tuoi titoli.'
    # ge-na-other-e-releve-fiscal
    learnMore:
      url: 'https://www.ge.ch/node/13593'
      label:
        en: 'The e-tax statement (e-relevé fiscal) on ge.ch'
        fr: 'Déclarez vos titres avec le e-relevé fiscal (ge.ch)'
        it: 'L’estratto fiscale elettronico (e-relevé fiscal) su ge.ch'
    reason:
      {
        en: 'One per bank, ideally the e-tax statement (e-relevé fiscal).',
        fr: 'Un par banque, idéalement le e-relevé fiscal.',
        it: 'Uno per banca, idealmente l’estratto fiscale elettronico (e-relevé fiscal).',
      }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10, p. 38, p. 43'

