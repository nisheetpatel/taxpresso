    when: { key: profile.business_losses, is: true }
    explain:
      en: 'The same losses for the federal tax, as your last assessment shows them. Often the same amount as for the Geneva tax.'
      fr: 'Les mêmes pertes pour l’impôt fédéral, telles que votre dernier avis de taxation les indique. Souvent le même montant que pour l’impôt cantonal.'
      de: 'Dieselben Verluste für die Bundessteuer, wie sie deine letzte Veranlagung zeigt. Oft derselbe Betrag wie für die Kantonssteuer.'
      it: 'Le stesse perdite per l’imposta federale, come le indica la tua ultima tassazione. Spesso lo stesso importo che per l’imposta cantonale.'
    # ch-2026-ifd-instructions-personnes-physiques p. 3 (Pertes) for 2026,
