  # Self-employment (ge-2025-guide-independants p. 6 and 25): the accounts, signed, or simple
  # records; and the AVS compensation fund's statement of the contributions paid in the year, with
  # each final decision for an earlier year.
  - id: business_accounts
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    expects: { kinds: [business_accounts] }
    label:
      en: 'Business accounts (bilan et compte de résultat)'
      fr: 'Comptes commerciaux (bilan et compte de résultat)'
      de: 'Geschäftsabschluss (bilan et compte de résultat)'
      it: 'Conti commerciali (bilan et compte de résultat)'
    explain:
      en: 'Your signed accounts for the business year closed in {year}: balance sheet and profit and loss account. Without full accounts (under 500,000 francs of turnover), your records of income and expenses, of what the business owns and owes, and of what you took out or put in privately. Your own AVS contributions are not among the charges: they are declared apart (32.10, 32.11).'
      fr: 'Vos comptes annuels signés de l’exercice clos en {year} : bilan et compte de résultat. Sans comptabilité complète (moins de 500 000 francs de chiffre d’affaires), vos relevés des recettes et des dépenses, de l’état des actifs et passifs et des prélèvements et apports privés. Vos propres cotisations AVS ne font pas partie des charges : elles se déclarent à part (32.10, 32.11).'
      de: 'Dein unterschriebener Jahresabschluss des {year} abgeschlossenen Geschäftsjahrs: Bilanz und Erfolgsrechnung. Ohne vollständige Buchhaltung (unter 500 000 Franken Umsatz) deine Aufzeichnungen über Einnahmen und Ausgaben, Aktiven und Passiven sowie Privatbezüge und -einlagen. Deine eigenen AHV-Beiträge gehören nicht zum Aufwand: Sie werden separat deklariert (32.10, 32.11).'
      it: 'I tuoi conti annuali firmati dell’esercizio chiuso nel {year}: bilancio e conto economico. Senza una contabilità completa (meno di 500 000 franchi di cifra d’affari), le tue registrazioni di ricavi e spese, di attivi e passivi e dei prelevamenti e apporti privati. I tuoi contributi AVS non fanno parte dei costi: si dichiarano a parte (32.10, 32.11).'
    # ge-2025-guide-independants p. 25
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=25'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 25: documents to attach'
        fr: 'Guide 2025 des indépendants, p. 25 : Documents à joindre à votre déclaration'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 25: beizulegende Unterlagen, auf Französisch'
        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 25: documenti da allegare, in francese'
    reason:
      en: 'Signed accounts, or your records of income and expenses.'
      fr: 'Comptes annuels signés, ou relevé des recettes et des dépenses.'
      de: 'Unterschriebener Abschluss oder Aufzeichnungen der Einnahmen und Ausgaben.'
      it: 'Conti annuali firmati, o registrazioni di ricavi e spese.'
    source: 'ge-2025-guide-independants p. 6, p. 25'

  - id: avs_contributions
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    expects: { kinds: [avs_contributions] }
    label:
      en: 'AVS contributions statement'
      fr: 'Relevé des cotisations AVS'
      de: 'AHV-Beitragsabrechnung'
      it: 'Conteggio dei contributi AVS'
    explain:
      en: 'From your AVS compensation fund (caisse de compensation): the contributions you paid in {year} for your business year, and each final decision received in {year} for an earlier year.'
      fr: 'De votre caisse de compensation AVS : les cotisations payées en {year} pour votre exercice, et chaque décision définitive reçue en {year} pour une année antérieure.'
      de: 'Von deiner AHV-Ausgleichskasse (caisse de compensation): die {year} bezahlten Beiträge für dein Geschäftsjahr und jede {year} erhaltene definitive Verfügung für ein früheres Jahr.'
      it: 'Dalla tua cassa di compensazione AVS (caisse de compensation): i contributi pagati nel {year} per il tuo esercizio, e ogni decisione definitiva ricevuta nel {year} per un anno precedente.'
    # ge-2025-guide-independants p. 22 and 25
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=22'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 22: your AVS contributions'
        fr: 'Guide 2025 des indépendants, p. 22 : Les déductions sociales'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 22: deine AHV-Beiträge, auf Französisch'
        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 22: i tuoi contributi AVS, in francese'
    reason:
      en: 'From your AVS compensation fund.'
      fr: 'De votre caisse de compensation AVS.'
      de: 'Von deiner AHV-Ausgleichskasse.'
      it: 'Dalla tua cassa di compensazione AVS.'
    source: 'ge-2025-guide-independants p. 22, p. 25'

  # The institution that paid a lump sum reports it to the tax office and sends you a copy
  # (ch-na-law-lifd art. 129 al. 1 let. b and al. 2, p. 69); the federal instructions ask you to
  # attach it (ch-2026-ifd-instructions-personnes-physiques p. 9). Rubric 98.12: guide p. 13.
  - id: lpp_capital
    perPerson: true
    when: { key: profile.pension_capital, includes: pillar2 }
    expects: { kinds: [lpp_capital_attestation] }
    label:
      {
        en: 'Pension capital attestation, 2nd pillar',
        fr: 'Attestation de prestation en capital du 2e pilier',
        de: 'Bescheinigung Kapitalleistung 2. Säule',
        it: 'Attestazione di prestazione in capitale, 2° pilastro',
      }
    explain:
      en: 'The statement your pension fund or vested benefits institution sends when it pays a lump sum: the amount, the date and the reason. Paid by two institutions? Add both.'
      fr: 'Le décompte que votre caisse de pension ou votre institution de libre passage envoie quand elle verse un capital : le montant, la date et le motif. Versé par deux institutions ? Ajoutez les deux.'
      de: 'Die Abrechnung, die deine Pensionskasse oder Freizügigkeitseinrichtung schickt, wenn sie Kapital auszahlt: Betrag, Datum und Grund. Von zwei Einrichtungen bezahlt? Füg beide hinzu.'
      it: 'Il conteggio che la tua cassa pensione o il tuo istituto di libero passaggio invia quando versa un capitale: l’importo, la data e il motivo. Versato da due istituti? Aggiungili entrambi.'
    # ge-2025-guide-declaration-pp p. 13
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=13'
      label:
        en: 'Geneva tax guide 2025, p. 13: pension capital (98.12)'
        fr: 'Guide fiscal 2025, p. 13 : Prestations en capital du 2e et 3e pilier A'
        it: 'Guida fiscale di Ginevra 2025, p. 13: prestazioni in capitale (98.12)'
    reason:
      {
        en: 'From your pension fund or vested benefits institution.',
        fr: 'De votre caisse de pension ou institution de libre passage.',
        de: 'Von deiner Pensionskasse oder Freizügigkeitseinrichtung.',
        it: 'Dalla tua cassa pensione o dal tuo istituto di libero passaggio.',
      }
    # For 2025, the 2025 guide (the 2025 federal instructions are not in the library).
    source:
      - 'ch-na-law-lifd art. 129 al. 1 let. b and al. 2 (p. 69); ge-2025-guide-declaration-pp p. 13'
      - 'ch-na-law-lifd art. 129 al. 1 let. b and al. 2 (p. 69); ch-2026-ifd-instructions-personnes-physiques p. 9; ge-2025-guide-declaration-pp p. 13'

  - id: pillar3a_capital
    perPerson: true
    when: { key: profile.pension_capital, includes: pillar3a }
    expects: { kinds: [pillar3a_capital_attestation] }
    label:
      {
        en: 'Pension capital attestation, pillar 3a',
        fr: 'Attestation de prestation en capital du 3e pilier A',
        de: 'Bescheinigung Kapitalleistung Säule 3a',
        it: 'Attestazione di prestazione in capitale, pilastro 3a',
      }
    explain:
      en: 'The statement your bank or insurer sends when it pays out a pillar 3a account: the amount, the date and the reason. Several 3a accounts? Add each one.'
      fr: 'Le décompte que votre banque ou votre assurance envoie quand elle verse un compte du 3e pilier A : le montant, la date et le motif. Plusieurs comptes 3a ? Ajoutez chacun.'
      de: 'Die Abrechnung, die deine Bank oder Versicherung schickt, wenn sie ein Säule-3a-Konto auszahlt: Betrag, Datum und Grund. Mehrere 3a-Konten? Füg jedes hinzu.'
      it: 'Il conteggio che la tua banca o la tua assicurazione invia quando versa un conto del pilastro 3a: l’importo, la data e il motivo. Più conti 3a? Aggiungili tutti.'
    # ge-2025-guide-declaration-pp p. 13
