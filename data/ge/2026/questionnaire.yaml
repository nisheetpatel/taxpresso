  # A home or land abroad. Its value: the tax value set by the country, with its tax office's
  # attestation; where the country sets none, the purchase price, with a copy of the deed
  # (ge-na-valeur-fiscale-page). Its rental value (a home used by the household): in France the taxe
  # d'habitation or taxes foncières notice; elsewhere the country's attestation, where it sets one;
  # otherwise 4.5 % of the value, nothing to add (ge-na-revenu-immobilier-page). Its rents (let):
  # a management account (compte de gestion), the same page.
  - id: abroad_value
    when:
      all:
        - { key: profile.special, includes: property_abroad }
        - { key: profile.abroad_property, in: [own_use, let, land] }
    expects: { kinds: [foreign_property_tax_notice, foreign_property_deed] }
    label:
      en: 'Property abroad: the country’s tax value, or the deed of purchase'
      fr: 'Immeuble à l’étranger : attestation de valeur fiscale ou acte d’acquisition'
      de: 'Liegenschaft im Ausland: Steuerwert des Landes oder Kaufvertrag'
      it: 'Immobile all’estero: valore fiscale del Paese o atto d’acquisto'
    explain:
      en: 'If the country sets a tax value for property, its tax office’s attestation (attestation de valeur fiscale). If it sets none, the deed of purchase (acte d’acquisition): the purchase price is the value. Taxpresso converts it into francs at the official rate of 31 December.'
      fr: 'Si le pays fixe une valeur fiscale aux immeubles, l’attestation de son administration fiscale (attestation de valeur fiscale). S’il n’en fixe pas, l’acte d’acquisition : le prix d’achat est la valeur. Taxpresso la convertit en francs au cours officiel du 31 décembre.'
      de: 'Wenn das Land einen Steuerwert für Liegenschaften festlegt, die Bescheinigung seiner Steuerbehörde (attestation de valeur fiscale). Wenn nicht, der Kaufvertrag (acte d’acquisition): Der Kaufpreis ist der Wert. Taxpresso rechnet ihn zum offiziellen Kurs vom 31. Dezember in Franken um.'
      it: 'Se il Paese fissa un valore fiscale per gli immobili, l’attestazione della sua amministrazione fiscale (attestation de valeur fiscale). Se non lo fissa, l’atto d’acquisto (acte d’acquisition): il prezzo d’acquisto è il valore. Taxpresso lo converte in franchi al cambio ufficiale del 31 dicembre.'
    # ge-na-valeur-fiscale-page
    learnMore:
      url: 'https://www.ge.ch/impot-proprietaires-immobiliers/valeur-fiscale-impot-fortune'
      label:
        en: 'The tax value of a property abroad (ge.ch), in French'
        fr: 'La valeur fiscale, bien situé à l’étranger (ge.ch)'
        de: 'Der Steuerwert einer Liegenschaft im Ausland (ge.ch), auf Französisch'
        it: 'Il valore fiscale di un immobile all’estero (ge.ch), in francese'
    reason:
      en: 'From the country’s tax office, or your deed.'
      fr: 'De l’administration fiscale du pays, ou votre acte d’acquisition.'
      de: 'Von der Steuerbehörde des Landes oder dein Kaufvertrag.'
      it: 'Dall’amministrazione fiscale del Paese, o il tuo atto d’acquisto.'
    source: 'ge-na-valeur-fiscale-page (Votre bien est situé à l’étranger); ge-2025-guide-declaration-pp p. 32 and 33'

  - id: abroad_rental_value_france
    when:
      all:
        - { key: profile.special, includes: property_abroad }
        - { key: profile.abroad_property, in: [own_use] }
        - { key: profile.abroad_property_country, in: [france] }
    expects: { kinds: [foreign_property_tax_notice] }
    label:
      en: 'Home in France: taxe d’habitation or taxes foncières notice'
      fr: 'Logement en France : avis de taxe d’habitation ou de taxes foncières'
      de: 'Wohnung in Frankreich: Bescheid der taxe d’habitation oder der taxes foncières'
      it: 'Abitazione in Francia: avviso della taxe d’habitation o delle taxes foncières'
    explain:
      en: 'For a second home, the taxe d’habitation notice shows its rental value as “Base d’imposition (valeur locative brute)”. Without it, the taxes foncières notice: Taxpresso takes the “Base” line in the “Commune” column, times 2.'
      fr: 'Pour une résidence secondaire, l’avis de taxe d’habitation indique sa valeur locative sous « Base d’imposition (valeur locative brute) ». Sinon, l’avis de taxes foncières : Taxpresso prend la ligne « Base » de la colonne « Commune », multipliée par 2.'
      de: 'Für eine Zweitwohnung zeigt der Bescheid der taxe d’habitation den Eigenmietwert unter «Base d’imposition (valeur locative brute)». Sonst der Bescheid der taxes foncières: Taxpresso nimmt die Zeile «Base» in der Spalte «Commune», mal 2.'
      it: 'Per una seconda casa, l’avviso della taxe d’habitation indica il valore locativo alla voce «Base d’imposition (valeur locative brute)». Altrimenti l’avviso delle taxes foncières: Taxpresso prende la riga «Base» della colonna «Commune», moltiplicata per 2.'
    # ge-na-revenu-immobilier-page
    learnMore:
      url: 'https://www.ge.ch/impot-proprietaires-immobiliers/revenu-immobilier-impot-revenu'
      label:
        en: 'The rental value of a home in France (ge.ch), in French'
        fr: 'La valeur locative, bien situé en France (ge.ch)'
        de: 'Der Eigenmietwert einer Wohnung in Frankreich (ge.ch), auf Französisch'
        it: 'Il valore locativo di un’abitazione in Francia (ge.ch), in francese'
    reason:
      en: 'From the French tax office.'
      fr: 'De l’administration fiscale française.'
      de: 'Von der französischen Steuerverwaltung.'
      it: 'Dall’amministrazione fiscale francese.'
    source: 'ge-na-revenu-immobilier-page (Bien situé en France)'

  - id: abroad_rental_value
    optional: true
    when:
      all:
        - { key: profile.special, includes: property_abroad }
        - { key: profile.abroad_property, in: [own_use] }
        - {
            key: profile.abroad_property_country,
            in: [italy, spain, portugal, germany, united_kingdom, united_states, other],
          }
    expects: { kinds: [foreign_property_tax_notice] }
    label:
      en: 'Home abroad: the country’s rental value, if it sets one'
      fr: 'Logement à l’étranger : attestation de valeur locative, si le pays en fixe une'
      de: 'Wohnung im Ausland: Eigenmietwert des Landes, falls es einen festlegt'
      it: 'Abitazione all’estero: valore locativo del Paese, se ne fissa uno'
    explain:
      en: 'If the country sets a rental value like Switzerland’s, its attestation from the country’s tax office. If it sets none, nothing to add: the rental value is 4.5 % of the tax value, with no upkeep costs deducted.'
      fr: 'Si le pays fixe une valeur locative comme celle de la Suisse, son attestation par l’autorité du pays. S’il n’en fixe pas, rien à ajouter : la valeur locative est de 4,5 % de la valeur fiscale, sans déduction de frais d’entretien.'
      de: 'Wenn das Land einen Eigenmietwert wie die Schweiz festlegt, dessen Bescheinigung der Behörde des Landes. Wenn nicht, nichts beizulegen: Der Eigenmietwert beträgt 4,5 % des Steuerwerts, ohne Abzug von Unterhaltskosten.'
      it: 'Se il Paese fissa un valore locativo come quello svizzero, la sua attestazione dell’autorità del Paese. Se non lo fissa, nulla da aggiungere: il valore locativo è il 4,5 % del valore fiscale, senza deduzione delle spese di manutenzione.'
    # ge-na-revenu-immobilier-page
    learnMore:
      url: 'https://www.ge.ch/impot-proprietaires-immobiliers/revenu-immobilier-impot-revenu'
      label:
