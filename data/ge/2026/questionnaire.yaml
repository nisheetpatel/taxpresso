      de: 'Die {year} eingenommenen Mieten und die bezahlten Unterhalts-, Versicherungs- und Verwaltungskosten, von dir oder deiner Verwaltung. Schuldzinsen gehören zum Kreditauszug; Steuern zählen nicht.'
      it: 'Gli affitti incassati nel {year} e le spese di manutenzione, assicurazione e gestione pagate, da te o dal tuo amministratore. Gli interessi del prestito vanno con l’estratto del prestito; le imposte non contano.'
