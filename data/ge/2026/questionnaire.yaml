  # The institution that paid a lump sum reports it to the tax office and sends you a copy
  # (ch-na-law-lifd art. 129 al. 1 let. b and al. 2, p. 69); the federal instructions ask you to
  # attach it (ch-2026-ifd-instructions-personnes-physiques p. 9). Rubric 98.12: guide p. 13.
  - id: lpp_capital
    perPerson: true
    when: { key: profile.pension_capital, includes: pillar2 }
    expects: { kinds: [lpp_capital_attestation] }
    label:
      {
        en: 'Pension capital attestation, 2nd pillar',
        fr: 'Attestation de prestation en capital du 2e pilier',
        de: 'Bescheinigung Kapitalleistung 2. Säule',
      }
    explain:
      en: 'The statement your pension fund or vested benefits institution sends when it pays a lump sum: the amount, the date and the reason. Paid by two institutions? Add both.'
      fr: 'Le décompte que votre caisse de pension ou votre institution de libre passage envoie quand elle verse un capital : le montant, la date et le motif. Versé par deux institutions ? Ajoutez les deux.'
      de: 'Die Abrechnung, die deine Pensionskasse oder Freizügigkeitseinrichtung schickt, wenn sie Kapital auszahlt: Betrag, Datum und Grund. Von zwei Einrichtungen bezahlt? Füg beide hinzu.'
    # ge-2025-guide-declaration-pp p. 13
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=13'
      label:
        en: 'Geneva tax guide 2025, p. 13: pension capital (98.12)'
        fr: 'Guide fiscal 2025, p. 13 : Prestations en capital du 2e et 3e pilier A'
    reason:
      {
        en: 'From your pension fund or vested benefits institution.',
        fr: 'De votre caisse de pension ou institution de libre passage.',
        de: 'Von deiner Pensionskasse oder Freizügigkeitseinrichtung.',
      }
    source: 'ch-na-law-lifd art. 129 al. 1 let. b and al. 2 (p. 69); ch-2026-ifd-instructions-personnes-physiques p. 9; ge-2025-guide-declaration-pp p. 13'

  - id: pillar3a_capital
    perPerson: true
    when: { key: profile.pension_capital, includes: pillar3a }
    expects: { kinds: [pillar3a_capital_attestation] }
    label:
      {
        en: 'Pension capital attestation, pillar 3a',
        fr: 'Attestation de prestation en capital du 3e pilier A',
        de: 'Bescheinigung Kapitalleistung Säule 3a',
      }
    explain:
      en: 'The statement your bank or insurer sends when it pays out a pillar 3a account: the amount, the date and the reason. Several 3a accounts? Add each one.'
      fr: 'Le décompte que votre banque ou votre assurance envoie quand elle verse un compte du 3e pilier A : le montant, la date et le motif. Plusieurs comptes 3a ? Ajoutez chacun.'
      de: 'Die Abrechnung, die deine Bank oder Versicherung schickt, wenn sie ein Säule-3a-Konto auszahlt: Betrag, Datum und Grund. Mehrere 3a-Konten? Füg jedes hinzu.'
    # ge-2025-guide-declaration-pp p. 13
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=13'
      label:
        en: 'Geneva tax guide 2025, p. 13: pension capital (98.12)'
        fr: 'Guide fiscal 2025, p. 13 : Prestations en capital du 2e et 3e pilier A'
    reason:
      {
        en: 'From your bank or insurer.',
        fr: 'De votre banque ou de votre assurance.',
        de: 'Von deiner Bank oder Versicherung.',
      }
    source: 'ch-na-law-lifd art. 129 al. 1 let. b and al. 2 (p. 69); ch-2026-ifd-instructions-personnes-physiques p. 9; ge-2025-guide-declaration-pp p. 13'

  - id: prior_declaration
    optional: true
    expects: { kinds: [prior_declaration] }
    label: { en: 'Last year’s declaration', fr: 'Déclaration de l’an dernier' }
    explain:
      en: 'Last year’s declaration or tax assessment, if you have it. It helps fill in your situation faster.'
      fr: 'La déclaration ou l’avis de taxation de l’an dernier, si vous l’avez. Cela aide à remplir votre situation plus vite.'
    # ge-na-efiling-espace-fiscal
    learnMore:
      url: 'https://www.ge.ch/espace-fiscal-e-demarches/gerer-mes-declarations-impot'
      label:
        en: 'Your past returns in e-démarches (ge.ch)'
        fr: 'Gérer mes déclarations d’impôt (ge.ch)'
    reason:
      { en: 'If you have it: it speeds things up.', fr: 'Si vous l’avez : cela va plus vite.' }
