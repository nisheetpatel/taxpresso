      label:
        en: 'Geneva tax guide 2025, p. 30: childcare costs'
        fr: 'Guide fiscal 2025, p. 30 : Frais de garde des enfants'
    source: 'ge-2025-guide-declaration-pp p. 8'

  - use: medical
    explain:
      en: 'Your insurer’s statement of costs it didn’t reimburse (décompte LAMal), plus invoices you never sent to the insurer.'
      fr: 'Le décompte LAMal des frais non remboursés par votre assureur, plus les factures que vous ne lui avez pas envoyées.'
    # ge-2025-guide-declaration-pp p. 14
    learnMore:
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=14'
      label:
        en: 'Geneva tax guide 2025, p. 14: medical costs'
        fr: 'Guide fiscal 2025, p. 14 : Déductions des frais médicaux'
    reason:
      {
        en: 'Your insurer’s statement of costs it didn’t cover (décompte LAMal).',
        fr: 'Le décompte LAMal des frais restés à votre charge.',
      }
    source: 'ge-2025-guide-declaration-pp p. 8, p. 10'

  - use: donations
    # ge-2025-guide-declaration-pp p. 15
    learnMore:
