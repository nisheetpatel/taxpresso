# Questionnaire for tax years 2025 and 2026 (SPEC.md section 6; docs/design/tax-years.md). Data, not
# code: packages/questionnaire reads it once per tax year, and every key and value must exist in
# packages/rules-ge/src/2026/keys.ts (a test checks).
# Every question changes what we ask for or compute; otherwise it doesn't belong here.
#
# The questions every canton asks are written once (data/ch/2026/questions.yaml): this file takes
# each one with `use: <id>`, in Geneva's order, and gives Geneva's own fields over it (its guide's
# page, its form's French terms). The questions only Geneva asks are written out here.
#
# Wording and documents follow the Geneva guide for 2025, the latest published:
# ge-2025-guide-declaration-pp p. 8 (documents to gather) and p. 10 (attachments).
# Re-check everything against the 2026 guide when it is published (January 2027).
#
# One file for both years: {year} is the tax year being prepared, and each citation of the guide
# carries its year (2025), so it is cited for 2025 and, until the 2026 guide is out, for 2026. A
# question that cites the 2026 federal instructions cites the 2025 guide's page for 2025 instead
# (the 2025 federal instructions are not in the library). Adding a year means adding its citations
# here, next to these, each with its `year` (docs/design/tax-years.md, section 6).
#
# French: write plain spaces before ? ! : ; and the loader makes them non-breaking.
# Texts per person (p1, p2) where the grammar differs; {n} is replaced by the number.

taxYears: [2025, 2026]

place: { en: 'Geneva', fr: 'Genève', de: 'Genf', it: 'Ginevra' }

# The people (you, your spouse or partner) are the shared ones (data/ch/2026/questions.yaml).
notSupported:
  en: 'Taxpresso can’t prepare this part yet. GeTax, the canton’s free software, or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. GeTax, le logiciel gratuit du canton, ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. GeTax, die kostenlose Software des Kantons, oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Possono farlo GeTax, il software gratuito del Cantone, o una fiduciaria.'

questions:
  # Where you lived on 31 December: the questions every canton shares (data/ch/2026/questions.yaml).
  - use: canton

  - use: civil_status
    # ge-2025-guide-declaration-pp p. 53
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=53'
      label:
        en: 'Geneva tax guide 2025, p. 53: changes of situation'
        fr: 'Guide fiscal 2025, p. 53 : Changements de situation'
        it: 'Guida fiscale di Ginevra 2025, p. 53: cambiamenti di situazione'
    help:
      en: 'On the official form: état civil.'
      fr: 'Sur le formulaire officiel : état civil.'
      it: 'Sul modulo ufficiale: état civil.'

  - use: children
    # ge-2025-guide-declaration-pp p. 46
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=46'
      label:
        en: 'Geneva tax guide 2025, p. 46: children you support'
        fr: 'Guide fiscal 2025, p. 46 : Enfant(s) à charge'
        it: 'Guida fiscale di Ginevra 2025, p. 46: figli a carico'
    help:
      en: 'On the official form: enfants à charge.'
      fr: 'Sur le formulaire officiel : enfants à charge.'
      it: 'Sul modulo ufficiale: enfants à charge.'

  - use: children_custody
    # ge-2025-guide-declaration-pp p. 45
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=45'
      label:
        en: 'Geneva tax guide 2025, p. 45: family, scale and splitting'
        fr: 'Guide fiscal 2025, p. 45 : Barème et splitting'
        it: 'Guida fiscale di Ginevra 2025, p. 45: famiglia, tariffa e splitting'

  # Parents who share custody without a partner: child support decides who gets the federal
  # parental scale and the child deductions (ch-na-circulaire-30-epoux-famille p. 24, ch. 13.4.2;
  # p. 32 and 33, ch. 14.4 and 14.5), and the Geneva family charge and splitting
  # (ge-2025-guide-declaration-pp p. 45 and 46).
  - use: child_support

  - use: childcare
    # ge-2025-guide-declaration-pp p. 30
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=30'
      label:
        en: 'Geneva tax guide 2025, p. 30: childcare costs'
        fr: 'Guide fiscal 2025, p. 30 : Frais de garde des enfants'
        it: 'Guida fiscale di Ginevra 2025, p. 30: spese di custodia dei figli'
    help:
      en: 'Crèche, day care, after-school care or a nanny. On the official form: frais de garde.'
      fr: 'Crèche, garderie, parascolaire ou nourrice. Sur le formulaire officiel : frais de garde.'
      it: 'Asilo nido, doposcuola o tata. Sul modulo ufficiale: frais de garde.'

  # The childcare maximum is per child, for both taxes (ge-2025-guide-declaration-pp p. 30: "pour
  # chaque enfant ... jusqu'à concurrence de", 26'320 for 59.10 and 25'800 for 59.12;
  # ch-2026-ifd-instructions-personnes-physiques p. 8, ch-2025-ifd-instructions-personnes-physiques
  # p. 8: "25 800 fr. par enfant"). Invoices for the household (childcare.costs) above the smaller
  # maximum, 25'800 in 2025 and 2026 (2,580,000 centimes), with several children: how they split
  # decides the deduction, so it is asked per child, and only then (packages/rules-ge, the engine's
  # NOTE.childcareSplit; a test keeps this amount equal to the engine's).
  - id: child_care
    key: ge.child_care
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
        - { key: childcare.costs, gt: 2580000 }
    explain:
      en: 'Your childcare invoices come to more than one child’s maximum, and the maximum is per child, so how they split between your children changes the deduction. Until Taxpresso knows it, the tax is not computed.'
      fr: 'Vos factures de frais de garde dépassent le maximum d’un enfant, et le maximum est par enfant : leur répartition entre vos enfants change la déduction. Tant que Taxpresso ne la connaît pas, l’impôt n’est pas calculé.'
      de: 'Deine Rechnungen für die Kinderbetreuung übersteigen den Höchstbetrag für ein Kind, und der Höchstbetrag gilt pro Kind: Die Aufteilung auf deine Kinder ändert den Abzug. Solange Taxpresso sie nicht kennt, wird die Steuer nicht berechnet.'
      it: 'Le tue fatture per la custodia dei figli superano il massimo per un figlio, e il massimo vale per ogni figlio: la ripartizione tra i tuoi figli cambia la deduzione. Finché Taxpresso non la conosce, l’imposta non è calcolata.'
    # ge-2025-guide-declaration-pp p. 30
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=30'
      label:
        en: 'Geneva tax guide 2025, p. 30: childcare costs'
        fr: 'Guide fiscal 2025, p. 30 : Frais de garde des enfants'
        de: 'Genfer Wegleitung 2025, S. 30: Kinderbetreuungskosten, auf Französisch'
        it: 'Guida fiscale di Ginevra 2025, p. 30: spese di custodia dei figli'
    text:
      en: 'How much of the childcare you paid in {year} was for child {n}?'
      fr: 'Combien des frais de garde payés en {year} étaient pour l’enfant {n} ?'
      de: 'Wie viel der {year} bezahlten Kinderbetreuungskosten war für Kind {n}?'
      it: 'Quanto delle spese di custodia che hai pagato nel {year} era per il figlio {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the eldest. On the official form: frais de garde, per child.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune. Sur le formulaire officiel : frais de garde, par enfant.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an. Auf dem offiziellen Formular: frais de garde, pro Kind.'
      it: 'In CHF, 0 se il figlio {n} non ne ha avute. Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande. Sul modulo ufficiale: frais de garde, per figlio.'

  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The municipality where you lived on 31 December. Each commune adds its own share of tax (centimes additionnels).'
      fr: 'La commune où vous habitiez au 31 décembre. Chaque commune ajoute sa propre part d’impôt (centimes additionnels).'
      it: 'Il Comune in cui abitavi il 31 dicembre. Ogni Comune aggiunge la propria parte di imposta (centimes additionnels).'
    # ge-2025-taux-donnees-fiscales
    learnMore:
      url: 'https://www.ge.ch/taux-donnees-fiscales'
      label:
        en: 'Tax rates and data, with the communal centimes (ge.ch)'
        fr: 'Taux et données fiscales, dont les centimes additionnels (ge.ch)'
        it: 'Aliquote e dati fiscali, con i centesimi addizionali comunali (ge.ch)'
    text:
      en: 'Which commune did you live in on 31 December {year}?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre {year} ?'
      it: 'In quale Comune abitavi il 31 dicembre {year}?'
    help:
      en: 'On the official form: commune de domicile.'
      fr: 'Sur le formulaire officiel : commune de domicile.'
      it: 'Sul modulo ufficiale: commune de domicile.'

  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within Geneva changes little. Arriving from another canton changes nothing either: Geneva taxes your whole year, as if you had lived here since January. Arriving from abroad means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton change peu de choses. Arriver d’un autre canton non plus : Genève vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      it: 'Un trasloco all’interno del Cantone di Ginevra cambia poco. Neanche un arrivo da un altro Cantone cambia qualcosa: Ginevra ti tassa per tutto l’anno, come se ci avessi abitato da gennaio. Con un arrivo dall’estero, invece, Ginevra ti tassa solo per una parte dell’anno.'
    # ge-2025-guide-declaration-pp p. 53
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=53'
      label:
        en: 'Geneva tax guide 2025, p. 53: changes of situation, arriving in Geneva'
        fr: 'Guide fiscal 2025, p. 53 : Changements de situation'
        it: 'Guida fiscale di Ginevra 2025, p. 53: cambiamenti di situazione, arrivo a Ginevra'
    text:
      en: 'Did you move in {year}?'
      fr: 'Avez-vous déménagé en {year} ?'
      it: 'Hai traslocato nel {year}?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', it: 'No' } }
      - value: within_geneva
        label:
          {
            en: 'Yes, within the canton of Geneva',
            fr: 'Oui, dans le canton de Genève',
            it: 'Sì, all’interno del Cantone di Ginevra',
          }
        chip: { en: 'Moved in Geneva', fr: 'Déménagé à Genève', it: 'Trasloco a Ginevra' }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            it: 'Sì, sono arrivato o arrivata dall’estero',
          }
        chip: { en: 'Arrived in {year}', fr: 'Arrivé(e) en {year}', it: 'Arrivo nel {year}' }
      # Geneva taxes the whole year of someone who arrived from another canton (guide p. 53,
      # Arrivée d'un canton suisse): the return is the same as for a full year here.
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            it: 'Sì, da un altro Cantone',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            it: 'Arrivo da un altro Cantone',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            it: 'Ho lasciato o sto lasciando la Svizzera',
          }
        notSupported:
          {
            en: 'Leaving Switzerland',
            fr: 'Un départ de Suisse',
            it: 'Una partenza dalla Svizzera',
          }

  - use: income_sources
    # ge-2025-guide-declaration-pp p. 25
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=25'
      label:
        en: 'Geneva tax guide 2025, p. 25: pensions and other benefits'
        fr: 'Guide fiscal 2025, p. 25 : Rentes, pensions et autres prestations'
        it: 'Guida fiscale di Ginevra 2025, p. 25: rendite e altre prestazioni'
    options:
      - { value: salary, label: { en: 'A salary', fr: 'Un salaire', it: 'Un salario' } }
      - value: replacement_income
        label:
          en: 'Unemployment, sickness or accident benefits'
          fr: 'Des indemnités (chômage, maladie, accident)'
          it: 'Indennità di disoccupazione, malattia o infortunio'
        chip: { en: 'Benefits', fr: 'Indemnités', it: 'Indennità' }
      - value: pension
        label:
          {
            en: 'A pension (AVS, AI or pension fund)',
            fr: 'Une rente (AVS, AI ou caisse de pension)',
            it: 'Una rendita (AVS, AI o cassa pensione)',
          }
        chip: { en: 'Pension', fr: 'Rente', it: 'Rendita' }
      - value: alimony
        label:
          {
            en: 'Alimony or child support received',
            fr: 'Une pension alimentaire reçue',
            it: 'Alimenti o contributi di mantenimento ricevuti',
          }
        chip: { en: 'Receives alimony', fr: 'Reçoit une pension', it: 'Riceve alimenti' }
      # The simple case is prepared (SPEC.md section 1): the questions below say what else isn't.
      - value: self_employment
        label:
          {
            en: 'Income from self-employment',
            fr: 'Un revenu d’activité indépendante',
            it: 'Reddito da attività lucrativa indipendente',
          }
        chip: { en: 'Self-employed', fr: 'Indépendant(e)', it: 'Indipendente' }

  - use: employers
    # ge-2025-guide-declaration-pp p. 17
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/41995/annexe/file/573038#page=17'
      label:
        en: 'Geneva tax guide 2025, p. 17: employment income'
        fr: 'Guide fiscal 2025, p. 17 : Activité dépendante'
        it: 'Guida fiscale di Ginevra 2025, p. 17: reddito da attività dipendente'

  # Swiss, a C permit or another permit: who is taxed at source follows from it and the income
  # (ge-na-law-lisp art. 1 and 2; ge-<year>-source-directives p. 6, ch. 1.1.1 and 1.1.2, the same
  # page in 2025 and 2026). Taxpresso never asks whether someone is taxed at source when the law
  # settles it.
  - use: residence
    learnMore:
      - year: 2026
        url: 'https://www.ge.ch/document/42009/annexe/file/580297#page=6'
        label:
          en: 'Directives on tax at source 2026, p. 6: who is taxed at source'
          fr: 'Directives sur l’imposition à la source 2026, p. 6 : Assujettissement'
          de: 'Weisungen zur Quellensteuer 2026, S. 6: wer an der Quelle besteuert wird, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2026, p. 6: chi paga l’imposta alla fonte, in francese'
      - year: 2025
        url: 'https://www.ge.ch/document/38036/annexe/file/374849#page=6'
        label:
          en: 'Directives on tax at source 2025, p. 6: who is taxed at source'
          fr: 'Directives sur l’imposition à la source 2025, p. 6 : Assujettissement'
          de: 'Weisungen zur Quellensteuer 2025, S. 6: wer an der Quelle besteuert wird, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2025, p. 6: chi paga l’imposta alla fonte, in francese'

  # A salary paid directly by an employer abroad is taxed ordinarily, not at source, unless a Swiss
  # branch, the Swiss company of a secondment or a Swiss hirer pays it in the end (ge-na-law-risp
  # art. 5; ge-<year>-source-directives p. 6, ch. 1.1.2). Asked of a salaried person without a C
  # permit only.
  - id: employer_in_switzerland
    key: profile.employer_in_switzerland
    type: yesno
    perPerson: true
    when:
      all:
        - { key: profile.residence, in: [permit_other] }
        - { key: profile.income_sources, includes: salary }
    explain:
      en: 'An employer in Switzerland takes the tax from your salary at source. A salary paid directly from abroad is taxed through a normal declaration instead.'
      fr: 'Un employeur en Suisse retient l’impôt à la source sur votre salaire. Un salaire versé directement depuis l’étranger est imposé par une déclaration normale.'
      de: 'Ein Arbeitgeber in der Schweiz zieht die Steuer an der Quelle vom Lohn ab. Ein Lohn, der direkt aus dem Ausland bezahlt wird, wird über eine normale Steuererklärung besteuert.'
      it: 'Un datore di lavoro in Svizzera trattiene l’imposta alla fonte dal tuo salario. Un salario versato direttamente dall’estero è tassato con una dichiarazione normale.'
    learnMore:
      - year: 2026
        url: 'https://www.ge.ch/document/42009/annexe/file/580297#page=6'
        label:
          en: 'Directives on tax at source 2026, p. 6: who is taxed at source'
          fr: 'Directives sur l’imposition à la source 2026, p. 6 : Assujettissement'
          de: 'Weisungen zur Quellensteuer 2026, S. 6: wer an der Quelle besteuert wird, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2026, p. 6: chi paga l’imposta alla fonte, in francese'
      - year: 2025
        url: 'https://www.ge.ch/document/38036/annexe/file/374849#page=6'
        label:
          en: 'Directives on tax at source 2025, p. 6: who is taxed at source'
          fr: 'Directives sur l’imposition à la source 2025, p. 6 : Assujettissement'
          de: 'Weisungen zur Quellensteuer 2025, S. 6: wer an der Quelle besteuert wird, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2025, p. 6: chi paga l’imposta alla fonte, in francese'
    text:
      p1:
        en: 'In {year}, did an employer in Switzerland pay your salary?'
        fr: 'En {year}, votre salaire était-il versé par un employeur en Suisse ?'
        de: 'Hat dir {year} ein Arbeitgeber in der Schweiz den Lohn bezahlt?'
        it: 'Nel {year} il tuo salario era versato da un datore di lavoro in Svizzera?'
      p2:
        en: 'In {year}, did an employer in Switzerland pay your spouse or partner’s salary?'
        fr: 'En {year}, le salaire de votre conjoint ou partenaire était-il versé par un employeur en Suisse ?'
        de: 'Hat deinem Partner oder deiner Partnerin {year} ein Arbeitgeber in der Schweiz den Lohn bezahlt?'
        it: 'Nel {year} il salario del tuo coniuge o partner era versato da un datore di lavoro in Svizzera?'
    help:
      en: 'Yes if at least one employer is in Switzerland, or if a Swiss branch or the Swiss company you work for pays your salary in the end. No if only an employer abroad paid you directly.'
      fr: 'Oui si au moins un employeur est en Suisse, ou si une succursale suisse ou l’entreprise suisse pour laquelle vous travaillez paie finalement votre salaire. Non si seul un employeur à l’étranger vous a payé directement.'
      de: 'Ja, wenn mindestens ein Arbeitgeber in der Schweiz ist oder eine Schweizer Niederlassung oder die Schweizer Firma, für die du arbeitest, deinen Lohn letztlich bezahlt. Nein, wenn dich nur ein Arbeitgeber im Ausland direkt bezahlt hat.'
      it: 'Sì se almeno un datore di lavoro è in Svizzera, o se una succursale svizzera o l’azienda svizzera per cui lavori paga alla fine il tuo salario. No se ti ha pagato direttamente solo un datore di lavoro all’estero.'

  # Taxed at source, worked out with Geneva's own law: LISP art. 1 (foreign workers without a C
  # permit; not spouses of a Swiss or a C permit holder), LISP art. 2 al. 2 and RISP art. 3 (the
  # benefits that replace pay: unemployment, sickness, accident, invalidity, maternity), RISP art.
  # 5 (a salary paid from abroad). Asked only where they don't settle it: a legitimation card, a
  # pension as the only income, a salary paid directly from abroad (data/ch/2026/questions.yaml).
  - use: taxed_at_source
    derive:
      - when: { key: profile.residence, in: [swiss, permit_c], anyPerson: true }
        value: false
        because:
          en: 'Swiss citizens and C permit holders are not taxed at source, and neither is someone married to one of them.'
          fr: 'Les Suisses et les titulaires d’un permis C ne sont pas imposés à la source, ni la personne mariée avec l’un d’eux.'
          de: 'Schweizerinnen und Schweizer und Personen mit Ausweis C werden nicht an der Quelle besteuert, und auch nicht, wer mit einer von ihnen verheiratet ist.'
          it: 'I cittadini svizzeri e i titolari di un permesso C non pagano l’imposta alla fonte, e nemmeno chi è sposato con uno di loro.'
        source: 'ge-na-law-lisp art. 1 al. 1 and 2; ch-na-law-lifd p. 49 (art. 83 al. 1 and 2)'
      - when:
          all:
            - { key: profile.residence, in: [permit_other] }
            - any:
                - { key: profile.income_sources, includes: replacement_income }
                - { key: profile.employer_in_switzerland, is: true }
        value: true
        because:
          en: 'Without a C permit, tax is taken at source from a salary and from the benefits that replace it (unemployment, sickness, accident, maternity).'
          fr: 'Sans permis C, l’impôt est retenu à la source sur le salaire et sur les indemnités qui le remplacent (chômage, maladie, accident, maternité).'
          de: 'Ohne Ausweis C wird die Steuer an der Quelle abgezogen, vom Lohn und von den Taggeldern, die ihn ersetzen (Arbeitslosigkeit, Krankheit, Unfall, Mutterschaft).'
          it: 'Senza permesso C, l’imposta è trattenuta alla fonte sul salario e sulle indennità che lo sostituiscono (disoccupazione, malattia, infortunio, maternità).'
        source: 'ge-na-law-lisp art. 1 al. 1, art. 2 al. 2 let. a and b; ge-na-law-risp art. 3 and 5'
    # ge-2025-dris-tou-page
    learnMore:
      url: 'https://www.ge.ch/demande-rectification-taxation-ordinaire-ulterieure'
      label:
        en: 'Tax at source: correction or TOU (ge.ch)'
        fr: 'Demande de rectification ou taxation ordinaire ultérieure (ge.ch)'
        de: 'Quellensteuer: Berichtigung oder TOU (ge.ch), auf Französisch'
        it: 'Imposta alla fonte: rettifica o TOU (ge.ch)'
    help:
      en: 'Your salary certificate (box 12), payslips, or benefit and pension statements show it. On the official form: impôt à la source.'
      fr: 'Votre certificat de salaire (chiffre 12), vos fiches de salaire, ou vos attestations d’indemnités et de rente l’indiquent.'
      de: 'Dein Lohnausweis (Ziffer 12), deine Lohnabrechnungen oder deine Taggeld- und Rentenbescheinigungen zeigen es. Auf dem offiziellen Formular: impôt à la source.'
      it: 'Lo indicano il tuo certificato di salario (cifra 12), le tue buste paga o le attestazioni di indennità e di rendita. Sul modulo ufficiale: impôt à la source.'

  # TOU already in place is a fact, not a choice: once taxed ordinarily after source tax, a person
  # stays so every year while taxed at source, the spouse included, and the tax office sends the
  # declaration each year (ge-na-law-lisp art. 4 al. 5, art. 5 al. 5; ge-<year>-source-directives
  # p. 51 and 52 in 2026, p. 50 and 51 in 2025). Whether to ask for TOU is decided on the TOU card,
  # with the comparison, only when it is a choice.
  - id: tou
    key: profile.tou
    type: choice
    perPerson: true
    when: { key: profile.taxed_at_source, is: true }
    explain:
      en: 'Once the tax office has taxed you ordinarily after tax at source (TOU, taxation ordinaire ultérieure), it does so every year while you are taxed at source: it sends you a tax declaration each year, and the tax taken at source counts towards the tax.'
      fr: 'Une fois que l’administration fiscale vous a taxé ordinairement après l’impôt à la source (TOU, taxation ordinaire ultérieure), elle le fait chaque année tant que vous êtes imposé à la source : elle vous envoie une déclaration d’impôt chaque année, et l’impôt retenu à la source est imputé.'
      de: 'Hat dich die Steuerverwaltung einmal nach der Quellensteuer ordentlich veranlagt (TOU, taxation ordinaire ultérieure), tut sie es jedes Jahr, solange du an der Quelle besteuert wirst: Sie schickt dir jedes Jahr eine Steuererklärung, und die abgezogene Quellensteuer wird angerechnet.'
      it: 'Una volta che l’amministrazione fiscale ti ha tassato in via ordinaria dopo l’imposta alla fonte (TOU, taxation ordinaire ultérieure), lo fa ogni anno finché paghi l’imposta alla fonte: ti manda una dichiarazione d’imposta ogni anno, e l’imposta trattenuta alla fonte viene computata.'
    learnMore:
      - year: 2026
        url: 'https://www.ge.ch/document/42009/annexe/file/580297#page=51'
        label:
          en: 'Directives on tax at source 2026, p. 51: compulsory TOU'
          fr: 'Directives sur l’imposition à la source 2026, p. 51 : TOU obligatoire'
          de: 'Weisungen zur Quellensteuer 2026, S. 51: obligatorische TOU, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2026, p. 51: TOU obbligatoria, in francese'
      - year: 2025
        url: 'https://www.ge.ch/document/38036/annexe/file/374849#page=50'
        label:
          en: 'Directives on tax at source 2025, p. 50: compulsory TOU'
          fr: 'Directives sur l’imposition à la source 2025, p. 50 : TOU obligatoire'
          de: 'Weisungen zur Quellensteuer 2025, S. 50: obligatorische TOU, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2025, p. 50: TOU obbligatoria, in francese'
    text:
      p1:
        en: 'Before {year}, did the tax office already tax you ordinarily (TOU) and send you a tax declaration to fill in?'
        fr: 'Avant {year}, l’administration fiscale vous a-t-elle déjà taxé ordinairement (TOU) en vous envoyant une déclaration d’impôt à remplir ?'
        de: 'Hat dich die Steuerverwaltung vor {year} schon ordentlich veranlagt (TOU) und dir eine Steuererklärung zum Ausfüllen geschickt?'
        it: 'Prima del {year}, l’amministrazione fiscale ti ha già tassato in via ordinaria (TOU) mandandoti una dichiarazione d’imposta da compilare?'
      p2:
        en: 'Before {year}, did the tax office already tax your spouse or partner ordinarily (TOU) and send them a tax declaration to fill in?'
        fr: 'Avant {year}, l’administration fiscale a-t-elle déjà taxé ordinairement (TOU) votre conjoint ou partenaire en lui envoyant une déclaration d’impôt à remplir ?'
        de: 'Hat die Steuerverwaltung deinen Partner oder deine Partnerin vor {year} schon ordentlich veranlagt (TOU) und eine Steuererklärung zum Ausfüllen geschickt?'
        it: 'Prima del {year}, l’amministrazione fiscale ha già tassato in via ordinaria (TOU) il tuo coniuge o partner mandandogli una dichiarazione d’imposta da compilare?'
    help:
      en: 'If you never asked for it and never received a tax declaration, answer no. Whether to ask for it now, Taxpresso shows you with the amounts.'
      fr: 'Si vous ne l’avez jamais demandée et n’avez jamais reçu de déclaration d’impôt, répondez non. S’il vaut la peine de la demander maintenant, Taxpresso vous le montre avec les montants.'
      de: 'Wenn du sie nie beantragt und nie eine Steuererklärung erhalten hast, antworte nein. Ob es sich lohnt, sie jetzt zu beantragen, zeigt dir Taxpresso mit den Beträgen.'
      it: 'Se non l’hai mai chiesta e non hai mai ricevuto una dichiarazione d’imposta, rispondi no. Se conviene chiederla ora, Taxpresso te lo mostra con gli importi.'
    options:
      - value: already
        label:
          {
            en: 'Yes, already in TOU',
            fr: 'Oui, déjà en TOU',
            de: 'Ja, schon in der TOU',
            it: 'Sì, già in TOU',
          }
        chip: { en: 'TOU', fr: 'TOU', de: 'TOU', it: 'TOU' }
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein', it: 'No' } }

  # The barème a single parent's employer takes the tax at: the single-parent rate (H) for children
  # in main custody, the single person's (A0) when the parents live together without being married
  # (ge-<year>-source-directives ch. 5.2.1.4 and 5.5.1: 2026 p. 26 and 30, 2025 p. 25 and 29).
  # Asked only of a single parent taxed at source whose children live with them: Taxpresso uses it to
  # estimate the tax taken at source when no salary certificate shows it.
  - id: lives_with_other_parent
    key: profile.lives_with_other_parent
    type: yesno
    when:
      all:
        - { key: profile.civil_status, in: [single, separated, divorced, widowed] }
        - { key: profile.children_custody, in: [with_household] }
        - { key: profile.taxed_at_source, is: true, anyPerson: true }
    explain:
      en: 'It decides the rate your employer takes tax at: the rate for a single parent (barème H), or the rate for a single person (barème A0) when you live with the children’s other parent. Taxpresso uses it to estimate the tax taken from your salary.'
      fr: 'Cela décide du barème que votre employeur applique : celui des familles monoparentales (barème H), ou celui des personnes seules (barème A0) si vous vivez avec l’autre parent des enfants. Taxpresso s’en sert pour estimer l’impôt retenu sur votre salaire.'
      de: 'Davon hängt der Tarif ab, zu dem dein Arbeitgeber die Steuer abzieht: der für Alleinerziehende (barème H) oder der für Alleinstehende (barème A0), wenn du mit dem anderen Elternteil der Kinder zusammenlebst. Taxpresso schätzt damit die vom Lohn abgezogene Steuer.'
      it: 'Decide la tariffa con cui il tuo datore di lavoro trattiene l’imposta: quella per le famiglie monoparentali (barème H), o quella per le persone sole (barème A0) se vivi con l’altro genitore dei figli. Taxpresso la usa per stimare l’imposta trattenuta sul tuo salario.'
    learnMore:
      - year: 2026
        url: 'https://www.ge.ch/document/42009/annexe/file/580297#page=30'
        label:
          en: 'Directives on tax at source 2026, p. 30: unmarried parents living together'
          fr: 'Directives sur l’imposition à la source 2026, p. 30 : Concubins avec enfant(s) à charge'
          de: 'Weisungen zur Quellensteuer 2026, S. 30: unverheiratete Eltern, die zusammenleben, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2026, p. 30: genitori conviventi non sposati, in francese'
      - year: 2025
        url: 'https://www.ge.ch/document/38036/annexe/file/374849#page=29'
        label:
          en: 'Directives on tax at source 2025, p. 29: unmarried parents living together'
          fr: 'Directives sur l’imposition à la source 2025, p. 29 : Concubins avec enfant(s) à charge'
          de: 'Weisungen zur Quellensteuer 2025, S. 29: unverheiratete Eltern, die zusammenleben, auf Französisch'
          it: 'Direttive sull’imposta alla fonte 2025, p. 29: genitori conviventi non sposati, in francese'
    text:
      en: 'In {year}, did you live with the children’s other parent, as a couple without being married?'
      fr: 'En {year}, viviez-vous en couple avec l’autre parent des enfants, sans être mariés ?'
      de: 'Hast du {year} mit dem anderen Elternteil der Kinder als Paar zusammengelebt, ohne verheiratet zu sein?'
      it: 'Nel {year} vivevi in coppia con l’altro genitore dei figli, senza essere sposati?'
    help:
      en: 'Living with a new partner who isn’t the children’s parent counts as no.'
      fr: 'Vivre avec un nouveau partenaire qui n’est pas le parent des enfants compte comme non.'
      de: 'Mit einem neuen Partner zusammenzuleben, der nicht Elternteil der Kinder ist, zählt als nein.'
      it: 'Vivere con un nuovo partner che non è genitore dei figli conta come no.'
    chip:
      {
        en: 'Lives with the other parent',
        fr: 'Vit avec l’autre parent',
        de: 'Lebt mit dem anderen Elternteil',
        it: 'Vive con l’altro genitore',
      }

  # Self-employment, the simple case (SPEC.md section 1, decided 14 October 2026): a sole proprietor
  # (raison individuelle) with one business in their commune of residence, whose result comes from
  # their accounts or simple records. Everything else is not supported yet, said plainly (fail
  # closed). Wording from the guide for the self-employed (ge-2025-guide-independants) and the form
  # (ge-2025-declaration-specimen p. 7 to 10, annexe B).
  - id: business_form
    key: profile.business_form
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    explain:
      en: 'A sole proprietorship (raison individuelle) is a business you run in your own name, alone. A partnership (société simple, en nom collectif or en commandite) has two partners or more.'
      fr: 'Une raison individuelle est une activité que vous exploitez en votre propre nom, seul. Une société de personnes (société simple, en nom collectif ou en commandite) a deux associés ou plus.'
      de: 'Eine Einzelfirma (raison individuelle) führst du allein in deinem eigenen Namen. Eine Personengesellschaft (einfache Gesellschaft, Kollektiv- oder Kommanditgesellschaft) hat zwei oder mehr Teilhaber.'
      it: 'Una ditta individuale (raison individuelle) è un’attività che gestisci da solo, a tuo nome. Una società di persone (société simple, en nom collectif o en commandite) ha due o più soci.'
    # ge-2025-guide-independants p. 3
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=3'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 3: who is self-employed'
        fr: 'Guide 2025 des indépendants, p. 3 : Dispositions générales'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 3: wer selbständig ist, auf Französisch'
        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 3: chi è indipendente, in francese'
    text:
      p1:
        en: 'How do you run your business?'
        fr: 'Sous quelle forme exercez-vous votre activité indépendante ?'
        de: 'In welcher Form führst du dein Geschäft?'
        it: 'In che forma gestisci la tua attività?'
      p2:
        en: 'How does your spouse or partner run their business?'
        fr: 'Sous quelle forme votre conjoint ou partenaire exerce-t-il son activité indépendante ?'
        de: 'In welcher Form führt dein Partner oder deine Partnerin das Geschäft?'
        it: 'In che forma il tuo coniuge o partner gestisce la sua attività?'
    help:
      en: 'On the official form: nature juridique (annexe B1).'
      fr: 'Sur le formulaire officiel : nature juridique (annexe B1).'
      de: 'Auf dem offiziellen Formular: nature juridique (Anhang B1).'
      it: 'Sul modulo ufficiale: nature juridique (allegato B1).'
    options:
      - value: sole_proprietor
        label:
          en: 'In my own name, alone (raison individuelle)'
          fr: 'En mon nom, seul(e) (raison individuelle)'
          de: 'In meinem Namen, allein (Einzelfirma, raison individuelle)'
          it: 'A mio nome, da solo (ditta individuale, raison individuelle)'
        chip: { en: 'Self-employed', fr: 'Indépendant(e)', de: 'Selbständig', it: 'Indipendente' }
      - value: partnership
        label:
          en: 'With partners (société simple, en nom collectif or en commandite)'
          fr: 'Avec des associés (société simple, en nom collectif ou en commandite)'
          de: 'Mit Teilhabern (einfache Gesellschaft, Kollektiv- oder Kommanditgesellschaft)'
          it: 'Con soci (société simple, en nom collectif o en commandite)'
        notSupported:
          en: 'A partnership (société de personnes)'
          fr: 'Une société de personnes'
          de: 'Eine Personengesellschaft (société de personnes)'
          it: 'Una società di persone (société de personnes)'

  - id: business_year
    key: profile.business_year
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    explain:
      en: 'Your income from the business is the result of the accounts closed in {year} (exercice comptable). They can end on another date than 31 December.'
      fr: 'Le revenu de votre activité est le résultat des comptes clôturés en {year} (exercice comptable). Ils peuvent se terminer à une autre date que le 31 décembre.'
      de: 'Dein Einkommen aus dem Geschäft ist das Ergebnis des {year} abgeschlossenen Geschäftsjahrs (exercice comptable). Es kann an einem anderen Datum als am 31. Dezember enden.'
      it: 'Il reddito della tua attività è il risultato dell’esercizio chiuso nel {year} (exercice comptable). Può finire in un’altra data che il 31 dicembre.'
    # ge-2025-guide-independants p. 8 and 9
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=9'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 9: the business year'
        fr: 'Guide 2025 des indépendants, p. 9 : Évaluation dans le temps'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 9: das Geschäftsjahr, auf Französisch'
        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 9: l’esercizio, in francese'
    text:
      p1:
        en: 'Which accounts of your business close in {year}?'
        fr: 'Quels comptes de votre activité sont clôturés en {year} ?'
        de: 'Welcher Abschluss deines Geschäfts fällt ins Jahr {year}?'
        it: 'Quali conti della tua attività si chiudono nel {year}?'
      p2:
        en: 'Which accounts of your spouse or partner’s business close in {year}?'
        fr: 'Quels comptes de l’activité de votre conjoint ou partenaire sont clôturés en {year} ?'
        de: 'Welcher Abschluss des Geschäfts deines Partners oder deiner Partnerin fällt ins Jahr {year}?'
        it: 'Quali conti dell’attività del tuo coniuge o partner si chiudono nel {year}?'
    help:
      en: 'On the official form: exercice comptable, début / fin de l’activité (annexe B1).'
      fr: 'Sur le formulaire officiel : exercice comptable, début / fin de l’activité indépendante (annexe B1).'
      de: 'Auf dem offiziellen Formular: exercice comptable, début / fin de l’activité (Anhang B1).'
      it: 'Sul modulo ufficiale: exercice comptable, début / fin de l’activité (allegato B1).'
    options:
      - value: calendar
        label:
          en: 'One business year, 1 January to 31 December {year}'
          fr: 'Un exercice du 1er janvier au 31 décembre {year}'
          de: 'Ein Geschäftsjahr vom 1. Januar bis 31. Dezember {year}'
          it: 'Un esercizio dal 1° gennaio al 31 dicembre {year}'
      - value: other_closing
        label:
          en: 'One business year of 12 months, closing on another date in {year}'
          fr: 'Un exercice de 12 mois, clôturé à une autre date en {year}'
          de: 'Ein Geschäftsjahr von 12 Monaten, an einem anderen Datum {year} abgeschlossen'
          it: 'Un esercizio di 12 mesi, chiuso in un’altra data nel {year}'
      - value: started
        label:
          en: 'I started in {year} and my first accounts close in {year}'
          fr: 'J’ai commencé en {year} et mes premiers comptes sont clôturés en {year}'
          de: 'Ich habe {year} angefangen, und mein erster Abschluss ist {year}'
          it: 'Ho iniziato nel {year} e i miei primi conti si chiudono nel {year}'
        chip:
          {
            en: 'Started in {year}',
            fr: 'Début en {year}',
            de: 'Beginn {year}',
            it: 'Inizio nel {year}',
          }
      - value: no_closing
        label:
          en: 'I started in {year} and my first accounts close next year'
          fr: 'J’ai commencé en {year} et mes premiers comptes seront clôturés l’an prochain'
          de: 'Ich habe {year} angefangen, und mein erster Abschluss ist nächstes Jahr'
          it: 'Ho iniziato nel {year} e i miei primi conti si chiudono l’anno prossimo'
        notSupported:
          en: 'A first business year that closes next year'
          fr: 'Un premier exercice clôturé l’année suivante'
          de: 'Ein erstes Geschäftsjahr, das im Folgejahr abschliesst'
          it: 'Un primo esercizio che si chiude l’anno seguente'
      - value: two_closings
        label:
          en: 'Two business years close in {year}'
          fr: 'Deux exercices sont clôturés en {year}'
          de: 'Zwei Geschäftsjahre schliessen {year} ab'
          it: 'Due esercizi si chiudono nel {year}'
        notSupported:
          en: 'Two business years closing in the same year'
          fr: 'Deux exercices clôturés la même année'
          de: 'Zwei Geschäftsjahre im selben Jahr'
          it: 'Due esercizi chiusi nello stesso anno'
      - value: stopped
        label:
          en: 'I stopped my business in {year}'
          fr: 'J’ai cessé mon activité indépendante en {year}'
          de: 'Ich habe mein Geschäft {year} aufgegeben'
          it: 'Ho cessato la mia attività nel {year}'
        notSupported:
          en: 'Stopping a business (cessation, liquidation gains)'
          fr: 'La cessation d’une activité (bénéfice de liquidation)'
          de: 'Die Aufgabe eines Geschäfts (Liquidationsgewinn)'
          it: 'La cessazione di un’attività (utile di liquidazione)'

  - id: business_place
    key: profile.business_place
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    explain:
      en: 'Where the business is decides which communes share your communal tax. Taxpresso prepares a business in your commune of residence.'
      fr: 'Le lieu de l’activité décide quelles communes se partagent votre impôt communal. Taxpresso prépare une activité exercée dans votre commune de domicile.'
      de: 'Der Ort des Geschäfts entscheidet, welche Gemeinden sich deine Gemeindesteuer teilen. Taxpresso bereitet ein Geschäft in deiner Wohngemeinde vor.'
      it: 'Il luogo dell’attività decide quali Comuni si dividono la tua imposta comunale. Taxpresso prepara un’attività nel tuo Comune di domicilio.'
    # ge-2025-guide-independants p. 11 (code commune)
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=11'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 11: the commune of the business'
        fr: 'Guide 2025 des indépendants, p. 11 : Code commune'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 11: die Gemeinde des Geschäfts, auf Französisch'
        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 11: il Comune dell’attività, in francese'
    text:
      p1:
        en: 'Where is your business?'
        fr: 'Où exercez-vous votre activité indépendante ?'
        de: 'Wo ist dein Geschäft?'
        it: 'Dove eserciti la tua attività?'
      p2:
        en: 'Where is your spouse or partner’s business?'
        fr: 'Où votre conjoint ou partenaire exerce-t-il son activité indépendante ?'
        de: 'Wo ist das Geschäft deines Partners oder deiner Partnerin?'
        it: 'Dove esercita la sua attività il tuo coniuge o partner?'
    help:
      en: 'On the official form: adresse principale de l’activité, code commune (annexe B1).'
      fr: 'Sur le formulaire officiel : adresse principale de l’activité, code commune (annexe B1).'
      de: 'Auf dem offiziellen Formular: adresse principale de l’activité, code commune (Anhang B1).'
      it: 'Sul modulo ufficiale: adresse principale de l’activité, code commune (allegato B1).'
    options:
      - value: home_commune
        label:
          en: 'In my commune of residence, or from home'
          fr: 'Dans ma commune de domicile, ou chez moi'
          de: 'In meiner Wohngemeinde oder von zu Hause aus'
          it: 'Nel mio Comune di domicilio, o da casa'
      - value: other_commune
        label:
          en: 'In another Geneva commune'
          fr: 'Dans une autre commune genevoise'
          de: 'In einer anderen Genfer Gemeinde'
          it: 'In un altro Comune ginevrino'
        notSupported:
          en: 'A business in another commune than your home (répartition intercommunale)'
          fr: 'Une activité dans une autre commune que celle du domicile (répartition intercommunale)'
          de: 'Ein Geschäft in einer anderen Gemeinde als der Wohngemeinde (répartition intercommunale)'
          it: 'Un’attività in un altro Comune che quello di domicilio (répartition intercommunale)'
      - value: outside_geneva
        label:
          en: 'Outside the canton of Geneva'
          fr: 'Hors du canton de Genève'
          de: 'Ausserhalb des Kantons Genf'
          it: 'Fuori dal Cantone di Ginevra'
        notSupported:
          en: 'A business outside Geneva'
          fr: 'Une activité hors du canton de Genève'
          de: 'Ein Geschäft ausserhalb von Genf'
          it: 'Un’attività fuori da Ginevra'

  - id: business_method
    key: profile.business_method
    type: choice
    perPerson: true
    when: { key: profile.income_sources, includes: self_employment }
    explain:
      en: 'With the invoicing method, income and costs count when invoiced. With the cash method (encaissement-décaissement), when the money comes in or goes out; your own AVS contributions then count when paid. Over 500,000 francs of turnover, the invoicing method is required.'
      fr: 'Avec la méthode de la facturation, recettes et charges comptent quand elles sont facturées. Avec la méthode de l’encaissement-décaissement, quand l’argent entre ou sort ; vos cotisations AVS comptent alors quand vous les payez. Au-delà de 500 000 francs de chiffre d’affaires, la méthode de la facturation est obligatoire.'
      de: 'Bei der Fakturierungsmethode zählen Einnahmen und Ausgaben, wenn sie verrechnet werden. Bei der Ist-Methode (encaissement-décaissement), wenn das Geld eingeht oder abfliesst; deine AHV-Beiträge zählen dann, wenn du sie bezahlst. Ab 500 000 Franken Umsatz ist die Fakturierungsmethode Pflicht.'
      it: 'Con il metodo della fatturazione, ricavi e costi contano quando sono fatturati. Con il metodo dell’incasso (encaissement-décaissement), quando il denaro entra o esce; i tuoi contributi AVS contano allora quando li paghi. Oltre 500 000 franchi di cifra d’affari, il metodo della fatturazione è obbligatorio.'
    # ge-2025-guide-independants p. 8 and 22
    learnMore:
      year: 2025
      url: 'https://www.ge.ch/document/44809/annexe/file/751631#page=8'
      label:
        en: 'Geneva guide for the self-employed 2025, p. 8: accounting methods'
        fr: 'Guide 2025 des indépendants, p. 8 : Méthodes comptables'
        de: 'Genfer Wegleitung für Selbständige 2025, S. 8: Buchführungsmethoden, auf Französisch'
        it: 'Guida di Ginevra 2025 per gli indipendenti, p. 8: metodi contabili, in francese'
    text:
      p1:
        en: 'How do your accounts count income and costs?'
        fr: 'Quelle méthode de comptabilisation utilisez-vous ?'
        de: 'Nach welcher Methode verbuchst du Einnahmen und Ausgaben?'
        it: 'Con quale metodo registri ricavi e costi?'
      p2:
        en: 'How do your spouse or partner’s accounts count income and costs?'
        fr: 'Quelle méthode de comptabilisation votre conjoint ou partenaire utilise-t-il ?'
        de: 'Nach welcher Methode verbucht dein Partner oder deine Partnerin Einnahmen und Ausgaben?'
        it: 'Con quale metodo il tuo coniuge o partner registra ricavi e costi?'
    help:
      en: 'On the official form: méthode de comptabilisation (annexe B1).'
      fr: 'Sur le formulaire officiel : méthode de comptabilisation (annexe B1).'
      de: 'Auf dem offiziellen Formular: méthode de comptabilisation (Anhang B1).'
      it: 'Sul modulo ufficiale: méthode de comptabilisation (allegato B1).'
    options:
      - value: invoice
        label:
