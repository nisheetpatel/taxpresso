        fr: 'Formulaire zurichois des frais professionnels 2026 (Berufsauslagen)'
        de: 'Formular Berufsauslagen 2026'
        it: 'Modulo di Zurigo per le spese professionali 2026 (Berufsauslagen)'
    help:
      en: 'Leave out holidays, sick days and days worked from home. The form counts at most 240 days, as a rule.'
      fr: 'Sans les vacances, les jours de maladie et les jours de télétravail. Le formulaire compte au plus 240 jours, en règle générale.'
      de: 'Ohne Ferien, Krankheitstage und Tage im Homeoffice. Das Formular zählt in der Regel höchstens 240 Tage.'
      it: 'Escludi le vacanze, i giorni di malattia e quelli di telelavoro. Di regola, il modulo conta al massimo 240 giorni.'

  # Meals away from home (Mehrkosten der Verpflegung), for both taxes: zh-2025-guide-natuerliche-
  # personen p. 13; zh-2026-deductions-berufsauslagen-631-33 p. 2 (Ziff. I.2).
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work costs more than at home (Mehrkosten der Verpflegung). A fixed amount per day counts for both taxes, each up to its own yearly limit, half of it when your employer pays part of your meals (box G of your salary certificate).'
      fr: 'Manger à l’extérieur à cause du travail coûte plus cher qu’à la maison (Mehrkosten der Verpflegung). Un montant fixe par jour compte pour les deux impôts, chacun jusqu’à sa propre limite annuelle, la moitié quand votre employeur paie une partie de vos repas (case G du certificat de salaire).'
      de: 'Auswärts essen wegen der Arbeit kostet mehr als zu Hause (Mehrkosten der Verpflegung). Für beide Steuern zählt ein fester Betrag pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag, die Hälfte davon, wenn dein Arbeitgeber einen Teil deiner Mahlzeiten bezahlt (Feld G des Lohnausweises).'
      it: 'Pranzare fuori casa per lavoro costa più che a casa (Mehrkosten der Verpflegung). Per entrambe le imposte conta un importo fisso al giorno, ognuna fino al proprio limite annuo, la metà se il tuo datore di lavoro paga una parte dei tuoi pasti (casella G del certificato di salario).'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=13'
      label:
        en: 'Zurich tax guide 2025, p. 13: meals'
        fr: 'Guide fiscal zurichois 2025, p. 13 : Frais de repas'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Mehrkosten der Verpflegung'
        it: 'Guida fiscale di Zurigo 2025, p. 13: pasti'

  # zh-2025-guide-natuerliche-personen p. 24 (Wertschriften- und Guthabenverzeichnis, eSteuerauszug)
  - use: banks
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=24'
      label:
        en: 'Zurich tax guide 2025, p. 24: securities and accounts'
        fr: 'Guide fiscal zurichois 2025, p. 24 : Titres et avoirs'
        de: 'Wegleitung zur Steuererklärung 2025, S. 24: Wertschriften und Guthaben'
        it: 'Guida fiscale di Zurigo 2025, p. 24: titoli e conti'
    help:
      en: 'Count PostFinance too, your children’s accounts, and online or foreign brokers (Interactive Brokers, DEGIRO). If a bank offers an e-tax statement (eSteuerauszug), ask for it: it has everything in one document. On the form: Wertschriften- und Guthabenverzeichnis.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants et les courtiers en ligne ou étrangers (Interactive Brokers, DEGIRO). Si une banque propose un relevé fiscal électronique (eSteuerauszug), demandez-le : il contient tout en un seul document. Sur le formulaire : Wertschriften- und Guthabenverzeichnis.'
      de: 'Zähl auch PostFinance, die Konten deiner Kinder und Online- oder ausländische Broker (Interactive Brokers, DEGIRO). Bietet eine Bank einen eSteuerauszug an, verlang ihn: Er enthält alles in einem Dokument. Auf dem Formular: Wertschriften- und Guthabenverzeichnis.'
      it: 'Conta anche PostFinance, i conti dei tuoi figli e i broker online o esteri (Interactive Brokers, DEGIRO). Se una banca offre un estratto fiscale elettronico (eSteuerauszug), chiedilo: contiene tutto in un solo documento. Sul modulo: Wertschriften- und Guthabenverzeichnis.'

