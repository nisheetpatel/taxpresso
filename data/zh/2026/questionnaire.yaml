# Zurich questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not
# code: packages/questionnaire reads it, and every key and value must exist in Zurich's keys
# (packages/rules-zh, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Zurich return (StA Form. 300, zh-2025-form-steuererklaerung-hauptformular), with Zurich's
# own explanations and official pages. The questions only Zurich asks are written out here: the
# commune (with the parts of the communes that have two multipliers), the move, the church tax.
#
# Wording and documents follow the Zurich guide for 2025, the latest published for a full year
# (zh-2025-guide-natuerliche-personen); its index (p. 2) gives the page of each topic. The full-year
# 2026 guide is not published yet (docs/sources/zh/NOTES.md, Gaps): re-check against it.
#
# German: informal "du", Swiss spelling (ss), the official German term next to its gloss. French:
# write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'Zurich', fr: 'Zurich', de: 'Zürich', it: 'Zurigo' }

notSupported:
  en: 'Taxpresso can’t prepare this part yet. ZHprivateTax, the canton’s free online return, or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. ZHprivateTax, la déclaration en ligne gratuite du canton, ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. ZHprivateTax, die kostenlose Online-Steuererklärung des Kantons, oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Può farlo ZHprivateTax, la dichiarazione online gratuita del Cantone, o una fiduciaria.'

questions:
  - use: canton

