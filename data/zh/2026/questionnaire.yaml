  - use: civil_status
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=4'
      label:
        en: 'Zurich tax guide 2025, p. 4: marriage, partnership, separation'
        fr: 'Guide fiscal zurichois 2025, p. 4 : Mariage, partenariat, séparation'
        de: 'Wegleitung zur Steuererklärung 2025, S. 4: Heirat, Partnerschaft, Trennung'
        it: 'Guida fiscale di Zurigo 2025, p. 4: matrimonio, unione domestica registrata, separazione'
    help:
      en: 'On the form: Zivilstand.'
      fr: 'Sur le formulaire : Zivilstand.'
      de: 'Auf dem Formular: Zivilstand.'
      it: 'Sul modulo: Zivilstand.'

  # zh-2025-guide-natuerliche-personen p. 20 (Kinderabzug, Ziffer 24.1)
  - use: children
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=20'
      label:
        en: 'Zurich tax guide 2025, p. 20: child deduction'
        fr: 'Guide fiscal zurichois 2025, p. 20 : Déduction pour enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Kinderabzug'
        it: 'Guida fiscale di Zurigo 2025, p. 20: deduzione per figli'
    help:
      en: 'On the form: Kinder in Ihrem Haushalt (children in your household).'
      fr: 'Sur le formulaire : Kinder in Ihrem Haushalt (enfants dans votre ménage).'
      de: 'Auf dem Formular: Kinder in Ihrem Haushalt.'
      it: 'Sul modulo: Kinder in Ihrem Haushalt (figli che vivono con te).'

  - use: children_custody
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=20'
      label:
        en: 'Zurich tax guide 2025, p. 20: child deduction'
        fr: 'Guide fiscal zurichois 2025, p. 20 : Déduction pour enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 20: Kinderabzug'
        it: 'Guida fiscale di Zurigo 2025, p. 20: deduzione per figli'

  # Parents who share custody without a partner: child support decides who counts the children and
  # who has the married tariff (Verheiratetentarif), as a rule the parent who mainly supports them
  # (zh-2026-law-steuergesetz-631-1-stand-2026 § 35 Abs. 2 and 2bis, p. 21;
  # zh-2026-tariff-weisung-sozialabzuege p. 7 and 8, Rz 52 to 61); for the federal tax,
  # ch-na-circulaire-30-epoux-famille p. 24.
  - use: child_support
    explain:
      en: 'With shared custody, child support decides who counts the children. The parent who receives it counts them in full; without child support, you each count half, and the married tariff (Verheiratetentarif), a lower rate, goes to the parent who mainly supports the children, as a rule the one who earns more. The federal tax has the same rule for its parental scale.'
      fr: 'En garde partagée, la contribution d’entretien décide qui compte les enfants. Le parent qui la reçoit les compte en entier ; sans contribution, chacun en compte la moitié, et le barème des personnes mariées (Verheiratetentarif), un taux plus bas, revient au parent qui assume l’essentiel de leur entretien, en règle générale celui qui gagne le plus. L’impôt fédéral suit la même règle pour son barème parental.'
      de: 'Bei geteilter Obhut entscheiden die Unterhaltsbeiträge, wer die Kinder zählt. Wer sie erhält, zählt die Kinder ganz; ohne Unterhaltsbeiträge zählt jeder die Hälfte, und den Verheiratetentarif, einen tieferen Satz, erhält der Elternteil, der hauptsächlich für die Kinder aufkommt, in der Regel wer mehr verdient. Die Bundessteuer hat für ihren Elterntarif dieselbe Regel.'
      it: 'Con la custodia alternata, sono i contributi di mantenimento a decidere chi conta i figli. Il genitore che li riceve li conta per intero; senza contributi, ognuno ne conta la metà, e la tariffa per coniugati (Verheiratetentarif), un’aliquota più bassa, va al genitore che provvede principalmente al mantenimento dei figli, di regola quello che guadagna di più. L’imposta federale applica la stessa regola per la sua tariffa per genitori.'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/vertreter/steuerbuch/zstb-nr-34-1/ZStB-Nr-34-1%203.pdf#page=7'
      label:
        en: 'Zurich directive on social deductions and tariffs 2026, p. 7: separated parents'
        fr: 'Directive zurichoise sur les déductions sociales et les barèmes 2026, p. 7 : Parents séparés'
        de: 'Weisung über Sozialabzüge und Steuertarife 2026, S. 7: getrennt lebende Eltern'
        it: 'Direttiva di Zurigo sulle deduzioni sociali e le tariffe 2026, p. 7: genitori separati'
    help:
      en: 'Child support (Unterhaltsbeiträge) is a regular amount for the children, set by a judgment or an agreement. Earning more means a higher net income.'
      fr: 'La contribution d’entretien (Unterhaltsbeiträge) est un montant régulier pour les enfants, fixé par un jugement ou une convention. Gagner plus signifie un revenu net plus élevé.'
      de: 'Unterhaltsbeiträge sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung. Mehr verdienen heisst ein höheres Nettoeinkommen.'
      it: 'I contributi di mantenimento (Unterhaltsbeiträge) sono un importo regolare per i figli, stabilito da una sentenza o da una convenzione. Guadagnare di più significa avere un reddito netto più alto.'

  # zh-2025-guide-natuerliche-personen p. 18 (Abzug für fremdbetreute Kinder, Ziffer 16.6)
  - use: childcare
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=18'
      label:
        en: 'Zurich tax guide 2025, p. 18: childcare costs'
        fr: 'Guide fiscal zurichois 2025, p. 18 : Frais de garde des enfants'
        de: 'Wegleitung zur Steuererklärung 2025, S. 18: fremdbetreute Kinder'
        it: 'Guida fiscale di Zurigo 2025, p. 18: spese di custodia dei figli'
    help:
      en: 'Crèche, day care, after-school care or a nanny. On the form: Abzug für fremdbetreute Kinder.'
      fr: 'Crèche, garderie, parascolaire ou nourrice. Sur le formulaire : Abzug für fremdbetreute Kinder.'
      de: 'Kita, Hort, Tagesstruktur oder Nanny. Auf dem Formular: Abzug für fremdbetreute Kinder.'
      it: 'Asilo nido, struttura diurna, doposcuola o una tata. Sul modulo: Abzug für fremdbetreute Kinder.'

  # The commune of 31 December taxes the whole year (StG § 190, zh-2026-law-steuergesetz-631-1-
  # stand-2026 p. 73). The list is Zurich's 160 communes of 2026 (packages/rules-zh, from
  # zh-na-communal-steuerfuesse-seit-2012 sheet STFUSS2026); a commune whose parts have different
  # multipliers (two school districts) is listed once per part, numbered as in the official table.
  - id: commune
    key: profile.commune
    type: commune
    explain:
      en: 'The commune you lived in on 31 December taxes your whole year. Each commune sets its own multiplier (Steuerfuss), a percentage of the simple cantonal tax. A few communes have two parts with different multipliers, often two school districts.'
      fr: 'La commune où vous habitiez au 31 décembre vous impose pour toute l’année. Chaque commune fixe son propre coefficient (Steuerfuss), un pourcentage de l’impôt cantonal simple. Quelques communes ont deux parties avec des coefficients différents, souvent deux arrondissements scolaires.'
      de: 'Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert dein ganzes Jahr. Jede Gemeinde legt ihren eigenen Steuerfuss fest, einen Prozentsatz der einfachen Staatssteuer. Einige Gemeinden haben zwei Teile mit verschiedenen Steuerfüssen, oft zwei Schulgemeinden.'
      it: 'Il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Ogni Comune fissa il proprio moltiplicatore (Steuerfuss), una percentuale dell’imposta cantonale semplice. Alcuni Comuni hanno due parti con moltiplicatori diversi, spesso due circondari scolastici.'
    learnMore:
      url: 'https://www.zh.ch/de/steuern-finanzen/steuern/steuerstatistiken/aktuelle-gemeinde-steuerfuesse.html'
      label:
        en: 'Current communal multipliers (zh.ch)'
        fr: 'Coefficients communaux actuels (zh.ch)'
        de: 'Aktuelle Gemeindesteuerfüsse (zh.ch)'
        it: 'Moltiplicatori comunali attuali (zh.ch)'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
      it: 'In quale Comune abitavi il 31 dicembre 2026?'
    help:
      en: 'Uster and Turbenthal have two parts (Teil 1 and Teil 2, as the official table numbers them, without naming them): not sure which is yours? Your commune’s tax office (Gemeindesteueramt) knows, and your last tax bill shows the multiplier.'
      fr: 'Uster et Turbenthal ont deux parties (Teil 1 et Teil 2, numérotées ainsi par le tableau officiel, sans nom) : un doute sur la vôtre ? L’office des impôts de votre commune (Gemeindesteueramt) le sait, et votre dernier bordereau indique le coefficient.'
      de: 'Uster und Turbenthal haben zwei Teile (Teil 1 und Teil 2, so nummeriert in der offiziellen Tabelle, ohne Namen): Unsicher, welcher deiner ist? Das Gemeindesteueramt weiss es, und deine letzte Steuerrechnung zeigt den Steuerfuss.'
      it: 'Uster e Turbenthal hanno due parti (Teil 1 e Teil 2, numerate così dalla tabella ufficiale, senza nome): non sai qual è la tua? L’ufficio di tassazione del tuo Comune (Gemeindesteueramt) lo sa, e la tua ultima fattura d’imposta indica il moltiplicatore.'

  # zh-2025-guide-natuerliche-personen p. 5 and 6: arriving from another canton, Zurich taxes the
  # whole year; from abroad, only from the arrival (part-year liability, not covered by rules-zh).
  - id: moved
    key: profile.moved
    type: choice
    explain:
      en: 'A move within the canton changes nothing: the commune you lived in on 31 December taxes the whole year. Arriving from another canton changes nothing either: Zurich taxes your whole year, as if you had lived here since January. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Un déménagement dans le canton ne change rien : la commune où vous habitiez au 31 décembre vous impose pour toute l’année. Arriver d’un autre canton non plus : Zurich vous impose pour toute l’année, comme si vous y aviez vécu depuis janvier. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Umzug innerhalb des Kantons ändert nichts: Die Gemeinde, in der du am 31. Dezember gewohnt hast, besteuert das ganze Jahr. Ein Zuzug aus einem anderen Kanton ändert auch nichts: Zürich besteuert dein ganzes Jahr, als hättest du seit Januar hier gewohnt. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
      it: 'Un trasloco all’interno del Cantone non cambia nulla: il Comune in cui abitavi il 31 dicembre ti tassa per tutto l’anno. Nemmeno arrivare da un altro Cantone cambia qualcosa: Zurigo ti tassa per tutto l’anno, come se avessi abitato qui da gennaio. Arrivare dall’estero, o lasciare la Svizzera, significa che qui hai pagato le imposte solo per una parte dell’anno.'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=5'
      label:
        en: 'Zurich tax guide 2025, p. 5: arriving in Zurich'
        fr: 'Guide fiscal zurichois 2025, p. 5 : Arrivée dans le canton de Zurich'
        de: 'Wegleitung zur Steuererklärung 2025, S. 5: Zuzug in den Kanton Zürich'
        it: 'Guida fiscale di Zurigo 2025, p. 5: arrivo a Zurigo'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
      it: 'Hai traslocato nel 2026?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein', it: 'No' } }
      - value: within_zurich
        label:
          {
            en: 'Yes, within the canton of Zurich',
            fr: 'Oui, dans le canton de Zurich',
            de: 'Ja, innerhalb des Kantons Zürich',
            it: 'Sì, all’interno del Cantone di Zurigo',
          }
        chip:
          {
            en: 'Moved in Zurich',
            fr: 'Déménagé à Zurich',
            de: 'Umzug im Kanton',
            it: 'Trasloco nel Cantone',
          }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
            it: 'Sì, da un altro Cantone',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
            it: 'Arrivo da un altro Cantone',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
            it: 'Sì, dall’estero',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year (Zuzug aus dem Ausland)',
            fr: 'Une arrivée de l’étranger en cours d’année (Zuzug aus dem Ausland)',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
            it: 'L’arrivo dall’estero durante l’anno (Zuzug aus dem Ausland)',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
            it: 'Ho lasciato la Svizzera, o sto per lasciarla',
          }
        notSupported:
          {
            en: 'Leaving Switzerland',
            fr: 'Un départ de Suisse',
            de: 'Ein Wegzug aus der Schweiz',
            it: 'La partenza dalla Svizzera',
          }

  # Church tax (Kirchensteuer): levied by the parishes of the three recognised churches, a
  # percentage of the simple cantonal tax; spouses of two churches each owe half (StG § 201 and
  # § 202, zh-2026-law-steuergesetz-631-1-stand-2026 p. 74). The multipliers per commune:
  # zh-na-communal-steuerfuesse-seit-2012 sheet STFUSS2026 (columns I to M). Opt-in: Taxpresso adds
  # it only for a member.
  - id: church
    key: zh.church
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Reformed, Roman Catholic or Christ Catholic church pay church tax (Kirchensteuer), a percentage of the simple cantonal tax set by their parish. Taxpresso adds it only for a member.'
      fr: 'Les membres de l’Église réformée, catholique romaine ou catholique-chrétienne paient l’impôt ecclésiastique (Kirchensteuer), un pourcentage de l’impôt cantonal simple fixé par leur paroisse. Taxpresso ne l’ajoute que pour un membre.'
      de: 'Mitglieder der reformierten, der römisch-katholischen oder der christkatholischen Kirche zahlen Kirchensteuer, einen Prozentsatz der einfachen Staatssteuer, den ihre Kirchgemeinde festlegt. Taxpresso rechnet sie nur für Mitglieder dazu.'
      it: 'I membri della Chiesa riformata, cattolica romana o cattolica cristiana pagano l’imposta di culto (Kirchensteuer), una percentuale dell’imposta cantonale semplice fissata dalla loro parrocchia. Taxpresso la aggiunge solo per chi ne è membro.'
    learnMore:
      url: 'https://www.notes.zh.ch/appl/zhlex_r.nsf/WebView/A1B72A220CD6E747C1258DC4002A921E/$File/631.1_8.6.97_132.pdf#page=74'
      label:
        en: 'Zurich tax law (Steuergesetz), § 201 and § 202: church tax'
        fr: 'Loi fiscale zurichoise (Steuergesetz), § 201 et § 202 : impôt ecclésiastique'
        de: 'Steuergesetz, § 201 und § 202: Kirchensteuer'
        it: 'Legge tributaria di Zurigo (Steuergesetz), § 201 e § 202: imposta di culto'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these churches?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces Églises ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026 eri membro di una di queste Chiese?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these churches?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces Églises ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026 il tuo coniuge o partner era membro di una di queste Chiese?'
    help:
      en: 'On the form: Konfession. Another religion, or none, pays no church tax.'
      fr: 'Sur le formulaire : Konfession. Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique.'
      de: 'Auf dem Formular: Konfession. Eine andere Religion oder keine zahlt keine Kirchensteuer.'
      it: 'Sul modulo: Konfession. Chi ha un’altra religione, o nessuna, non paga l’imposta di culto.'
    options:
      - value: reformed
        label:
          {
            en: 'Reformed (evangelisch-reformiert)',
            fr: 'Réformée (evangelisch-reformiert)',
            de: 'Evangelisch-reformiert',
            it: 'Riformata (evangelisch-reformiert)',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert', it: 'Chiesa riformata' }
      - value: catholic
        label:
          {
            en: 'Roman Catholic (römisch-katholisch)',
            fr: 'Catholique romaine (römisch-katholisch)',
            de: 'Römisch-katholisch',
            it: 'Cattolica romana (römisch-katholisch)',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch', it: 'Chiesa cattolica' }
      - value: christ_catholic
        label:
          {
            en: 'Christ Catholic (christkatholisch)',
            fr: 'Catholique-chrétienne (christkatholisch)',
            de: 'Christkatholisch',
            it: 'Cattolica cristiana (christkatholisch)',
          }
        chip:
          {
            en: 'Christ Catholic',
            fr: 'Catholique-chrétien(ne)',
            de: 'Christkatholisch',
            it: 'Chiesa cattolica cristiana',
          }
      - value: none
        label:
          {
            en: 'None of these',
            fr: 'Aucune de ces Églises',
            de: 'Keine davon',
            it: 'Nessuna di queste',
          }

  # Wädenswil (293) has two Reformed parishes and Wiesendangen (298) two Catholic ones with
  # different multipliers in 2026, numbered 1 and 2 without names (zh-na-communal-steuerfuesse-
  # seit-2012 sheet STFUSS2026, columns I to L). A test keeps this list equal to rules-zh's table.
  - id: parish
    key: zh.parish
    type: choice
    when:
      any:
        - all:
            - { key: profile.commune, eq: '293' }
            - { key: zh.church, eq: reformed, anyPerson: true }
        - all:
            - { key: profile.commune, eq: '298' }
            - { key: zh.church, eq: catholic, anyPerson: true }
    explain:
      en: 'Your commune has two parishes of your church with different church tax multipliers. The official table numbers them 1 and 2 without naming them.'
      fr: 'Votre commune compte deux paroisses de votre Église avec des coefficients d’impôt ecclésiastique différents. Le tableau officiel les numérote 1 et 2, sans les nommer.'
      de: 'Deine Gemeinde hat zwei Kirchgemeinden deiner Kirche mit verschiedenen Kirchensteuerfüssen. Die offizielle Tabelle nummeriert sie mit 1 und 2, ohne sie zu benennen.'
      it: 'Il tuo Comune ha due parrocchie della tua Chiesa con moltiplicatori diversi per l’imposta di culto. La tabella ufficiale le numera 1 e 2, senza nominarle.'
    learnMore:
      url: 'https://www.zh.ch/de/steuern-finanzen/steuern/steuerstatistiken/aktuelle-gemeinde-steuerfuesse.html'
      label:
        en: 'Current communal multipliers (zh.ch)'
        fr: 'Coefficients communaux actuels (zh.ch)'
        de: 'Aktuelle Gemeindesteuerfüsse (zh.ch)'
        it: 'Moltiplicatori comunali attuali (zh.ch)'
    text:
      en: 'Which parish (Kirchgemeinde) do you belong to?'
      fr: 'À quelle paroisse (Kirchgemeinde) appartenez-vous ?'
      de: 'Zu welcher Kirchgemeinde gehörst du?'
      it: 'A quale parrocchia (Kirchgemeinde) appartieni?'
    help:
      en: 'Not sure? Your parish or your commune’s tax office (Gemeindesteueramt) knows, and your last tax bill shows the multiplier.'
      fr: 'Un doute ? Votre paroisse ou l’office des impôts de votre commune (Gemeindesteueramt) le sait, et votre dernier bordereau indique le coefficient.'
      de: 'Unsicher? Deine Kirchgemeinde oder das Gemeindesteueramt weiss es, und deine letzte Steuerrechnung zeigt den Steuerfuss.'
      it: 'Hai un dubbio? La tua parrocchia o l’ufficio di tassazione del tuo Comune (Gemeindesteueramt) lo sa, e la tua ultima fattura d’imposta indica il moltiplicatore.'
    options:
      - value: '1'
        label:
          {
            en: 'Parish 1 of the official table',
            fr: 'Paroisse 1 du tableau officiel',
