  # Travel to work (Fahrkosten) for both taxes, each up to its own cap: zh-2025-guide-natuerliche-
  # personen p. 13 (Berufsauslagen), zh-2026-deductions-berufsauslagen-631-33 (from 2026);
  # ch-2026-ifd-instructions-personnes-physiques p. 6. Zurich has no rule on the length of the trip
  # by public transport, so its question doesn't ask it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (Fahrkosten), for the cantonal and the federal tax, each up to its own yearly limit. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de déplacement (Fahrkosten), pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten abgezogen, bei der Staats- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto per andare al lavoro si deduce come spese di trasporto (Fahrkosten), per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo. Il mezzo che usi decide come vengono calcolate.'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=13'
      label:
        en: 'Zurich tax guide 2025, p. 13: professional costs'
        fr: 'Guide fiscal zurichois 2025, p. 13 : Frais professionnels'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Berufsauslagen'
        it: 'Guida fiscale di Zurigo 2025, p. 13: spese professionali'
    help:
      en: 'Choose how you went on most work days. On the form: Berufsauslagen, Fahrkosten.'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur le formulaire : Berufsauslagen, Fahrkosten.'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf dem Formular: Berufsauslagen, Fahrkosten.'
      it: 'Scegli come ci andavi nella maggior parte dei giorni lavorativi. Sul modulo: Berufsauslagen, Fahrkosten.'
    options:
      - value: public_transport
        label:
          {
            en: 'Public transport',
            fr: 'Transports publics',
            de: 'Öffentlicher Verkehr',
            it: 'Trasporti pubblici',
          }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto', it: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
            it: 'Moto o scooter con targa bianca',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Mofa mit gelbem Kontrollschild',
            it: 'Bicicletta, e-bike o ciclomotore con targa gialla',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss', it: 'A piedi' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
            it: 'Da casa, quasi tutti i giorni',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice', it: 'Telelavoro' }

  - use: commute_transit_cost
    explain:
      en: 'You deduct the public transport you paid to get to work, for the cantonal and the federal tax, each up to its own yearly limit.'
      fr: 'Vous déduisez les transports publics payés pour aller au travail, pour l’impôt cantonal et pour l’impôt fédéral, chacun jusqu’à sa propre limite annuelle.'
      de: 'Du ziehst den bezahlten öffentlichen Verkehr zur Arbeit ab, bei der Staats- und bei der Bundessteuer, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Deduci i trasporti pubblici che hai pagato per andare al lavoro, per l’imposta cantonale e per quella federale, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=13'
      label:
        en: 'Zurich tax guide 2025, p. 13: travel costs'
        fr: 'Guide fiscal zurichois 2025, p. 13 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Fahrkosten'
        it: 'Guida fiscale di Zurigo 2025, p. 13: spese di trasporto'

  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost, for both taxes. Only when you can’t use it (no line nearby, a disability, working hours with no service) do the kilometres count.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics, pour les deux impôts. Ce n’est que si vous ne pouvez pas les utiliser (pas de ligne à proximité, un handicap, des horaires sans desserte) que les kilomètres comptent.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte, bei beiden Steuern. Nur wenn du ihn nicht nutzen kannst (keine Linie in der Nähe, eine Behinderung, Arbeitszeiten ohne Verbindung), zählen die Kilometer.'
      it: 'Chi va al lavoro con un veicolo deduce quanto sarebbero costati i trasporti pubblici, per entrambe le imposte. I chilometri contano solo se non puoi usarli (nessuna linea vicina, una disabilità, orari di lavoro senza collegamenti).'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=13'
      label:
        en: 'Zurich tax guide 2025, p. 13: travel costs'
        fr: 'Guide fiscal zurichois 2025, p. 13 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Fahrkosten'
        it: 'Guida fiscale di Zurigo 2025, p. 13: spese di trasporto'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
            it: 'Sì, avrei potuto usare i trasporti pubblici',
          }
      - value: 'no'
        label:
          {
            en: 'No, there is no public transport I can use',
            fr: 'Non, aucun transport public que je puisse utiliser',
            de: 'Nein, es gibt keinen öffentlichen Verkehr, den ich nutzen kann',
            it: 'No, non ci sono trasporti pubblici che posso usare',
          }

  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work, for both taxes, each up to its own yearly limit.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule, pour les deux impôts, chacun jusqu’à sa propre limite annuelle.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab, bei beiden Steuern, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Questo prezzo è quanto deduci per andare al lavoro con un veicolo, per entrambe le imposte, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=13'
      label:
        en: 'Zurich tax guide 2025, p. 13: travel costs'
        fr: 'Guide fiscal zurichois 2025, p. 13 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Fahrkosten'
        it: 'Guida fiscale di Zurigo 2025, p. 13: spese di trasporto'

  - use: commute_distance
    explain:
      en: 'Without public transport you can use, both taxes count a fixed amount per kilometre, there and back once a day, each up to its own yearly limit.'
      fr: 'Sans transport public utilisable, les deux impôts comptent un montant fixe par kilomètre, un aller et retour par jour, chacun jusqu’à sa propre limite annuelle.'
      de: 'Ohne nutzbaren öffentlichen Verkehr zählen beide Steuern einen festen Betrag pro Kilometer, einmal hin und zurück pro Tag, jeweils bis zu einem eigenen jährlichen Höchstbetrag.'
      it: 'Senza trasporti pubblici che puoi usare, entrambe le imposte contano un importo fisso per chilometro, andata e ritorno una volta al giorno, ognuna fino al proprio limite annuo.'
    learnMore:
      url: 'https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/steuern-finanzen/steuern/natuerlichepersonen/2025/est-wegleitungen/305_Wegleitung_ZH_2025_HA%20bf%20DEF.pdf#page=13'
      label:
        en: 'Zurich tax guide 2025, p. 13: travel costs'
        fr: 'Guide fiscal zurichois 2025, p. 13 : Frais de déplacement'
        de: 'Wegleitung zur Steuererklärung 2025, S. 13: Fahrkosten'
        it: 'Guida fiscale di Zurigo 2025, p. 13: spese di trasporto'

