# Fribourg questionnaire for tax year 2026 (SPEC.md section 6; docs/design/cantons.md). Data, not
# code: packages/questionnaire reads it, and every key and value must exist in Fribourg's keys
# (packages/rules-fr, src/keys.ts; a test checks).
#
# The questions every canton asks come from data/ch/2026/questions.yaml (`use: <id>`), in the order
# of the Fribourg return as its guide explains it code by code (fr-2025-guide-instructions-generales:
# the personal situation and the children, p. 7; the income of the codes 1.xxx and its costs 2.xxx,
# p. 8 to 14; the other income and the wealth 3.xxx, p. 14 to 23; the deductions 4.xxx, p. 24 to
# 33; the net income, the medical costs and donations, p. 33 to 39), with Fribourg's own
# explanations and official pages. The questions only Fribourg asks are written out here, as
# packages/rules-fr reads them (FribourgCantonal): each child's age band (the health insurance flat
# amount, code 4.110, and childcare under 14, code 4.380) and the childcare paid for each child (the
# limit is per child); the commune by name and whether you lived there all year; each adult's church
# and, where the commune's parishes of that church differ, the parish; the health premium subsidy
# (Fribourg deducts a flat amount per insured person, less the subsidy); the life insurance premiums
# (code 4.120) and the interest on savings (code 4.150). No question asks the health premiums paid,
# nor their attestation: Fribourg's deduction is the flat amount, the federal tax takes it too (p. 48).
#
# Wording and documents follow the Fribourg guide for 2025 (Instructions générales, the latest
# published): the 2026 guide is not published yet (docs/sources/fr/NOTES.md, Gaps). "p." is the page
# of the PDF file, as in the links; the guide prints one less. Tax year 2026's communal coefficients
# are not published either: the questions, documents and values to type work, the tax waits for them
# (packages/rules-fr, NOTE.communes2026).
#
# Fribourg is bilingual: the guide in the library is the French one, so the official terms are its
# French ones, next to the gloss in English and German. German: informal "du", Swiss spelling (ss).
# French: write plain spaces before ? ! : ; and the loader makes them non-breaking.

taxYear: 2026

place: { en: 'Fribourg', fr: 'Fribourg', de: 'Freiburg', it: 'Friburgo' }

people:
  p1: { en: 'You', fr: 'Vous', de: 'Du', it: 'Tu' }
  p2:
    {
      en: 'Your spouse or partner',
      fr: 'Votre conjoint ou partenaire',
      de: 'Dein Partner oder deine Partnerin',
      it: 'Il tuo coniuge o partner',
    }
  p2Chip: { en: 'Partner', fr: 'Conjoint', de: 'Partner', it: 'Partner' }
  child: { en: 'Child {n}', fr: 'Enfant {n}', de: 'Kind {n}', it: 'Figlio {n}' }

# FriTax is the canton's free program, installed on the computer, the only one that files
# electronically (docs/sources/fr/NOTES.md, Filing channels; fr-2025-fritax-accueil).
notSupported:
  en: 'Taxpresso can’t prepare this part yet. FriTax, the canton’s free program (fr.ch/fritax), or a fiduciary can.'
  fr: 'Taxpresso ne peut pas encore préparer cette partie. FriTax, le programme gratuit du canton (fr.ch/fritax), ou une fiduciaire le peuvent.'
  de: 'Diesen Teil kann Taxpresso noch nicht vorbereiten. FriTax, das kostenlose Programm des Kantons (fr.ch/fritax), oder eine Treuhand kann es.'
  it: 'Taxpresso non può ancora preparare questa parte. Può farlo FriTax, il programma gratuito del Cantone (fr.ch/fritax), o una fiduciaria.'

questions:
  - use: canton

  # fr-2025-guide-instructions-generales p. 7 (IV. Situation personnelle: spouses living together,
  # and registered partners, file one return together).
  - use: civil_status
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=7'
      label:
        en: 'Fribourg tax guide 2025, p. 7: personal and family situation'
        fr: 'Instructions générales 2025, p. 7 : Situation personnelle, professionnelle et familiale'
        de: 'Wegleitung Freiburg 2025, S. 7: persönliche und familiäre Verhältnisse, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 7: situazione personale e familiare'
    help:
      en: 'A registered partnership files like a married couple, on one return.'
      fr: 'Un partenariat enregistré déclare comme un couple marié, sur une seule déclaration.'
      de: 'Eine eingetragene Partnerschaft füllt wie ein Ehepaar eine gemeinsame Steuererklärung aus.'
      it: 'Un’unione domestica registrata presenta una sola dichiarazione, come una coppia sposata.'

  # fr-2025-guide-instructions-generales p. 34 and 35 (6.110: children at your charge, minors or in
  # apprenticeship or studies).
  - use: children
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=34'
      label:
        en: 'Fribourg tax guide 2025, p. 34: child deductions'
        fr: 'Instructions générales 2025, p. 34 : Déductions sociales pour enfants'
        de: 'Wegleitung Freiburg 2025, S. 34: Kinderabzüge, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 34: deduzioni per i figli'
    help:
      en: 'Minors, and older children in apprenticeship or studies whose upkeep you bear. On the return: code 6.110, déductions sociales pour enfants.'
      fr: 'Les mineurs, et les enfants plus âgés en apprentissage ou aux études dont vous assumez l’entretien. Sur la déclaration : code 6.110, déductions sociales pour enfants.'
      de: 'Minderjährige und ältere Kinder in Lehre oder Studium, deren Unterhalt du bestreitest. Auf der Steuererklärung: Code 6.110, déductions sociales pour enfants (Kinderabzüge).'
      it: 'I figli minorenni, e quelli più grandi in apprendistato o agli studi che mantieni tu. Nella dichiarazione: codice 6.110, déductions sociales pour enfants.'

  # fr-2025-guide-instructions-generales p. 7 (boxes A*, B* and C*: a child in your household, with
  # the other parent, or alternately).
  - use: children_custody
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=7'
      label:
        en: 'Fribourg tax guide 2025, p. 7: children in your household or alternately'
        fr: 'Instructions générales 2025, p. 7 : Situation personnelle, professionnelle et familiale'
        de: 'Wegleitung Freiburg 2025, S. 7: Kinder im Haushalt oder abwechselnd, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 7: figli nella tua economia domestica o in custodia alternata'
    help:
      en: 'Page 1 of the return ticks box A* for a child in your household, B* for a child living with the other parent, C* for a child living alternately with you and elsewhere.'
      fr: 'La page 1 de la déclaration coche la case A* pour un enfant dans votre ménage, B* pour un enfant chez l’autre parent, C* pour un enfant vivant alternativement chez vous et ailleurs.'
      de: 'Seite 1 der Steuererklärung kreuzt Feld A* für ein Kind in deinem Haushalt an, B* für ein Kind beim anderen Elternteil, C* für ein Kind, das abwechselnd bei dir und anderswo lebt.'
      it: 'A pagina 1 della dichiarazione si crocia la casella A* per un figlio che vive nella tua economia domestica, B* per un figlio che vive con l’altro genitore, C* per un figlio che vive a turno da te e altrove.'

  # Alternating custody (garde alternée): the SCC gives the child to the parent who receives child
  # support, none to the parent who pays it (fr-2024-pis-guide p. 7, question 18;
  # fr-2024-instructions-employeurs-source p. 11 and 12); without child support the documents differ
  # (the law splits the deduction in proportion, LICD art. 36 al. 3; the source-tax documents give
  # the child to the parent with the higher income): packages/rules-fr does not compute it
  # (NOTE.sharedNoSupport), so those answers are said not supported here.
  - use: child_support
    explain:
      en: 'With shared custody (garde alternée), child support decides who counts the children. In Fribourg, the parent who receives child support (contribution d’entretien) counts them; the parent who pays it deducts what was paid instead.'
      fr: 'En garde alternée, la contribution d’entretien décide qui compte les enfants. À Fribourg, le parent qui la reçoit les compte ; le parent qui la verse déduit à la place ce qu’il a versé.'
      de: 'Bei alternierender Obhut (garde alternée) entscheiden die Unterhaltsbeiträge (contribution d’entretien), wer die Kinder zählt. In Freiburg zählt sie der Elternteil, der die Beiträge erhält; wer sie zahlt, zieht stattdessen ab, was er bezahlt hat.'
      it: 'Con la custodia alternata (garde alternée), sono i contributi di mantenimento a decidere chi conta i figli. A Friburgo li conta il genitore che riceve i contributi di mantenimento (contribution d’entretien); il genitore che li versa deduce invece quanto ha versato.'
    learnMore:
      url: 'https://www.fr.ch/document/431746#page=7'
      label:
        en: 'Fribourg, information for people taxed at source, p. 7: alternating custody'
        fr: 'Infos pour les personnes imposées à la source (PIS), p. 7 : garde alternée'
        de: 'Freiburg, Informationen für quellensteuerpflichtige Personen, S. 7: alternierende Obhut, auf Französisch'
        it: 'Friburgo, informazioni per le persone soggette all’imposta alla fonte, p. 7: custodia alternata'
    help:
      en: 'Child support is a regular amount for the children, set by a judgment or an agreement.'
      fr: 'La contribution d’entretien est un montant régulier pour les enfants, fixé par un jugement ou une convention.'
      de: 'Unterhaltsbeiträge sind ein regelmässiger Betrag für die Kinder, festgelegt durch ein Urteil oder eine Vereinbarung.'
      it: 'I contributi di mantenimento sono un importo regolare per i figli, fissato da una sentenza o da una convenzione.'
    options:
      - value: i_receive
        label:
          {
            en: 'The other parent paid me child support',
            fr: 'L’autre parent m’a versé une contribution d’entretien',
            de: 'Der andere Elternteil hat mir Unterhaltsbeiträge bezahlt',
            it: 'L’altro genitore mi ha versato contributi di mantenimento',
          }
        chip:
          {
            en: 'Receives child support',
            fr: 'Reçoit une contribution',
            de: 'Erhält Unterhaltsbeiträge',
            it: 'Riceve contributi di mantenimento',
          }
      - value: i_pay
        label:
          {
            en: 'I paid child support to the other parent',
            fr: 'J’ai versé une contribution d’entretien à l’autre parent',
            de: 'Ich habe dem anderen Elternteil Unterhaltsbeiträge bezahlt',
            it: 'Ho versato contributi di mantenimento all’altro genitore',
          }
        chip:
          {
            en: 'Pays child support',
            fr: 'Verse une contribution',
            de: 'Zahlt Unterhaltsbeiträge',
            it: 'Versa contributi di mantenimento',
          }
      - value: none_i_earn_more
        label:
          {
            en: 'No child support, and I earn more than the other parent',
            fr: 'Pas de contribution, et je gagne plus que l’autre parent',
            de: 'Keine Unterhaltsbeiträge, und ich verdiene mehr als der andere Elternteil',
            it: 'Nessun contributo, e guadagno più dell’altro genitore',
          }
        notSupported:
          &noSupport {
            en: 'Alternating custody without child support (garde alternée sans contribution d’entretien): Fribourg’s documents differ on who counts the children',
            fr: 'La garde alternée sans contribution d’entretien : les documents fribourgeois divergent sur qui compte les enfants',
            de: 'Alternierende Obhut ohne Unterhaltsbeiträge (garde alternée sans contribution d’entretien): Die Freiburger Dokumente widersprechen sich, wer die Kinder zählt',
            it: 'La custodia alternata senza contributi di mantenimento (garde alternée sans contribution d’entretien): i documenti di Friburgo non concordano su chi conta i figli',
          }
      - value: none_other_earns_more
        label:
          {
            en: 'No child support, and the other parent earns more',
            fr: 'Pas de contribution, et l’autre parent gagne plus',
            de: 'Keine Unterhaltsbeiträge, und der andere Elternteil verdient mehr',
            it: 'Nessun contributo, e l’altro genitore guadagna di più',
          }
        notSupported: *noSupport
      - value: none_unsure
        label:
          {
            en: 'No child support, and I don’t know who earns more',
            fr: 'Pas de contribution, et je ne sais pas qui gagne le plus',
            de: 'Keine Unterhaltsbeiträge, und ich weiss nicht, wer mehr verdient',
            it: 'Nessun contributo, e non so chi guadagna di più',
          }
        notSupported: *noSupport

  # The age band of each child at the end of the year (fr-na-deductions-primes-assurance art. 1 al. 1
  # and 2, p. 1 and 2; fr-2025-guide-instructions-generales p. 24, code 4.110): the flat health amount
  # of a child (up to 18), of a young adult in training at your charge (18 to 25), none for an older
  # child (packages/rules-fr, NOTE.adultChild); and childcare counts for a child under 14 (code 4.380,
  # p. 32).
  - id: child_age
    key: fr.child_age
    group: detail
    type: choice
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 0 }
        - { key: profile.children_custody, in: [with_household, shared] }
    explain:
      en: 'Fribourg deducts a flat amount for each insured person’s health and accident insurance (caisse-maladie et accidents, code 4.110), by age: a child up to 18, a young adult in training up to 25. Childcare (frais de garde, code 4.380) counts for a child under 14.'
      fr: 'Fribourg déduit un montant forfaitaire pour l’assurance-maladie et accidents de chaque personne assurée (caisse-maladie et accidents, code 4.110), selon l’âge : un enfant jusqu’à 18 ans, un jeune adulte en formation jusqu’à 25 ans. Les frais de garde (code 4.380) comptent pour un enfant de moins de 14 ans.'
      de: 'Freiburg zieht für die Kranken- und Unfallversicherung jeder versicherten Person einen Pauschalbetrag ab (caisse-maladie et accidents, Code 4.110), nach Alter: ein Kind bis 18, ein junger Erwachsener in Ausbildung bis 25. Die Betreuungskosten (frais de garde, Code 4.380) zählen für ein Kind unter 14.'
      it: 'Friburgo deduce un importo forfettario per l’assicurazione malattia e infortuni di ogni persona assicurata (caisse-maladie et accidents, codice 4.110), secondo l’età: un figlio fino a 18 anni, un giovane adulto in formazione fino a 25. Le spese di custodia (frais de garde, codice 4.380) contano per un figlio sotto i 14 anni.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=24'
      label:
        en: 'Fribourg tax guide 2025, p. 24: health and accident insurance'
        fr: 'Instructions générales 2025, p. 24 : Caisse-maladie et accidents'
        de: 'Wegleitung Freiburg 2025, S. 24: Kranken- und Unfallversicherung, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 24: assicurazione malattia e infortuni'
    text:
      en: 'How old was child {n} at the end of 2026?'
      fr: 'Quel âge avait l’enfant {n} à la fin de 2026 ?'
      de: 'Wie alt war Kind {n} Ende 2026?'
      it: 'Quanti anni aveva il figlio {n} alla fine del 2026?'
    help:
      en: 'Number your children the same way in every answer, for example from the oldest.'
      fr: 'Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'
    options:
      - value: under14
        label: { en: 'Under 14', fr: 'Moins de 14 ans', de: 'Unter 14', it: 'Meno di 14 anni' }
        chip: { en: 'Under 14', fr: 'Moins de 14 ans', de: 'Unter 14', it: 'Meno di 14 anni' }
      - value: minor
        label: { en: '14 to 17', fr: 'De 14 à 17 ans', de: '14 bis 17', it: 'Da 14 a 17 anni' }
        chip: { en: '14 to 17', fr: '14 à 17 ans', de: '14 bis 17', it: 'Da 14 a 17 anni' }
      - value: young
        label:
          {
            en: '18 to 25, in training',
            fr: 'De 18 à 25 ans, en formation',
            de: '18 bis 25, in Ausbildung',
            it: 'Da 18 a 25 anni, in formazione',
          }
        chip: { en: '18 to 25', fr: '18 à 25 ans', de: '18 bis 25', it: 'Da 18 a 25 anni' }
      - value: adult
        label: { en: 'Over 25', fr: 'Plus de 25 ans', de: 'Über 25', it: 'Più di 25 anni' }
        notSupported:
          {
            en: 'A child over 25 at your charge (the flat health amount, code 4.110, has no category for them)',
            fr: 'Un enfant de plus de 25 ans à charge (la déduction forfaitaire d’assurance-maladie, code 4.110, n’a pas de catégorie pour lui)',
            de: 'Ein Kind über 25, für das du aufkommst (der Krankenversicherungspauschalbetrag, Code 4.110, hat keine Kategorie dafür)',
            it: 'Un figlio con più di 25 anni a tuo carico (l’importo forfettario per l’assicurazione malattia, codice 4.110, non ha una categoria per lui)',
          }

  # fr-2025-guide-instructions-generales p. 32 (4.380: childcare by third parties for each child
  # under 14 living with you, while you work, train or can't work).
  - use: childcare
    explain:
      en: 'What you paid so someone else looks after your children under 14 while you work, train or can’t work: a crèche, day care or a day mother (frais de garde des enfants, code 4.380).'
      fr: 'Ce que vous avez payé pour faire garder vos enfants de moins de 14 ans par un tiers pendant que vous travaillez, vous formez ou êtes incapable de travailler : crèche, garderie ou maman de jour (frais de garde des enfants, code 4.380).'
      de: 'Was du bezahlt hast, damit jemand anderes deine Kinder unter 14 betreut, während du arbeitest, in Ausbildung bist oder nicht arbeiten kannst: Kita, Hort oder Tagesmutter (frais de garde des enfants, Code 4.380).'
      it: 'Quello che hai pagato perché qualcun altro custodisca i tuoi figli sotto i 14 anni mentre lavori, segui una formazione o non puoi lavorare: un asilo nido, un centro diurno o una mamma diurna (frais de garde des enfants, codice 4.380).'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=32'
      label:
        en: 'Fribourg tax guide 2025, p. 32: childcare'
        fr: 'Instructions générales 2025, p. 32 : Frais de garde des enfants'
        de: 'Wegleitung Freiburg 2025, S. 32: Kinderbetreuungskosten, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 32: custodia dei figli'
    help:
      en: 'Crèche, day care, after-school care or a day mother. Keep the invoices.'
      fr: 'Crèche, garderie, accueil extrascolaire ou maman de jour. Gardez les factures.'
      de: 'Kita, Hort, Tagesstruktur oder Tagesmutter. Bewahr die Rechnungen auf.'
      it: 'Asilo nido, centro diurno, accoglienza extrascolastica o mamma diurna. Conserva le fatture.'

  # The limit of 4.380 is per child (LICD art. 34 al. 3; fr-2025-guide-instructions-generales p. 32):
  # with several children, how the invoices' total splits can decide the deduction
  # (packages/rules-fr, NOTE.childcareSplit). Asked per child.
  - id: child_care
    key: fr.child_care
    group: deduction
    type: money
    perChild: true
    when:
      all:
        - { key: profile.children_count, gt: 1 }
        - { key: profile.children_custody, in: [with_household, shared] }
        - { key: profile.childcare, in: [creche_or_daycare, nanny] }
    explain:
      en: 'Fribourg’s limit for childcare (frais de garde des enfants, code 4.380) is per child, so the split between your children can change the deduction. Your invoices give the total.'
      fr: 'La limite fribourgeoise des frais de garde (code 4.380) est par enfant : la répartition entre vos enfants peut changer la déduction. Vos factures donnent le total.'
      de: 'Der Freiburger Höchstbetrag für Kinderbetreuung (frais de garde des enfants, Code 4.380) gilt pro Kind: Die Aufteilung auf deine Kinder kann den Abzug ändern. Deine Rechnungen geben das Total.'
      it: 'Il limite di Friburgo per la custodia dei figli (frais de garde des enfants, codice 4.380) vale per ogni figlio: la ripartizione tra i tuoi figli può quindi cambiare la deduzione. Le tue fatture danno il totale.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=32'
      label:
        en: 'Fribourg tax guide 2025, p. 32: childcare'
        fr: 'Instructions générales 2025, p. 32 : Frais de garde des enfants'
        de: 'Wegleitung Freiburg 2025, S. 32: Kinderbetreuungskosten, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 32: custodia dei figli'
    text:
      en: 'How much of the childcare you paid in 2026 was for child {n}?'
      fr: 'Combien des frais de garde payés en 2026 étaient pour l’enfant {n} ?'
      de: 'Wie viel der 2026 bezahlten Betreuungskosten (frais de garde) war für Kind {n}?'
      it: 'Quanto delle spese di custodia pagate nel 2026 era per il figlio {n}?'
    help:
      en: 'In CHF, 0 if child {n} had none. Number your children the same way in every answer, for example from the oldest.'
      fr: 'En CHF, 0 si l’enfant {n} n’en a pas eu. Numérotez vos enfants de la même façon dans chaque réponse, par exemple du plus âgé au plus jeune.'
      de: 'In CHF, 0, wenn Kind {n} keine hatte. Nummerier deine Kinder in jeder Antwort gleich, zum Beispiel vom ältesten an.'
      it: 'In CHF, 0 se il figlio {n} non ne ha avute. Numera i tuoi figli allo stesso modo in ogni risposta, per esempio dal più grande.'

  # The commune taxes with its coefficient, the same on income and wealth, in percent of the cantonal
  # base tax (fr-na-law-lico art. 3 al. 3, art. 4 al. 3, p. 2). The list is Fribourg's 2026 communes
  # by their federal number (packages/rules-fr, communeOptions(2026), from the canton's 2026 parish
  # tables, which give each commune's number). Their 2026 coefficients are not published yet.
  - id: commune
    key: profile.commune
    group: basics
    type: commune
    explain:
      en: 'Each commune sets its own coefficient (coefficient communal), the same on income and wealth, a percentage of the cantonal base tax (impôt cantonal de base).'
      fr: 'Chaque commune fixe son propre coefficient communal, le même sur le revenu et la fortune, un pourcentage de l’impôt cantonal de base.'
      de: 'Jede Gemeinde legt ihren eigenen Steuerfuss (coefficient communal) fest, gleich auf Einkommen und Vermögen, einen Prozentsatz der kantonalen Grundsteuer (impôt cantonal de base).'
      it: 'Ogni Comune fissa il proprio moltiplicatore (coefficient communal), lo stesso sul reddito e sulla sostanza, una percentuale dell’imposta cantonale di base (impôt cantonal de base).'
    learnMore:
      url: 'https://www.fr.ch/impots/personnes-physiques/coefficients-communaux-et-paroisses'
      label:
        en: 'Fribourg: communal and parish tax coefficients'
        fr: 'Coefficients communaux et paroisses'
        de: 'Freiburg: Gemeinde- und Pfarreisteuerfüsse, auf Französisch'
        it: 'Friburgo: moltiplicatori d’imposta dei Comuni e delle parrocchie'
    text:
      en: 'Which commune did you live in on 31 December 2026?'
      fr: 'Dans quelle commune habitiez-vous au 31 décembre 2026 ?'
      de: 'In welcher Gemeinde hast du am 31. Dezember 2026 gewohnt?'
      it: 'In quale Comune abitavi il 31 dicembre 2026?'
    help:
      en: 'The official name, such as Fribourg, Bulle or Düdingen.'
      fr: 'Le nom officiel, par exemple Fribourg, Bulle ou Düdingen.'
      de: 'Der offizielle Name, zum Beispiel Fribourg, Bulle oder Düdingen.'
      it: 'Il nome ufficiale, per esempio Fribourg, Bulle o Düdingen.'

  # Arriving from another canton: Fribourg taxes the whole year (fr-2025-guide-instructions-generales
  # p. 4) and the commune of arrival collects the communal tax for it (fr-na-law-lico art. 9 al. 3,
  # p. 3). A move between Fribourg communes splits the communal tax by the time in each (art. 9 al. 2):
  # not covered by packages/rules-fr (NOTE.wholeYear). Arriving from abroad or leaving Switzerland
  # means part of the year only (p. 4): not covered either.
  - id: moved
    key: profile.moved
    group: special
    type: choice
    explain:
      en: 'Arriving from another canton changes nothing: Fribourg taxes your whole year, and your commune of arrival collects the communal tax for it. A move between Fribourg communes splits the communal tax between them by the time in each. Arriving from abroad, or leaving Switzerland, means you were taxed here for part of the year only.'
      fr: 'Arriver d’un autre canton ne change rien : Fribourg vous impose pour toute l’année, et votre commune d’arrivée perçoit l’impôt communal pour toute l’année. Un déménagement entre communes fribourgeoises répartit l’impôt communal entre elles selon la durée du domicile. Arriver de l’étranger, ou quitter la Suisse, signifie que vous n’étiez imposé ici qu’une partie de l’année.'
      de: 'Ein Zuzug aus einem anderen Kanton ändert nichts: Freiburg besteuert dein ganzes Jahr, und deine Zuzugsgemeinde erhebt die Gemeindesteuer dafür. Ein Umzug zwischen Freiburger Gemeinden teilt die Gemeindesteuer nach der Wohndauer auf. Ein Zuzug aus dem Ausland oder ein Wegzug aus der Schweiz heisst, dass du nur einen Teil des Jahres hier steuerpflichtig warst.'
      it: 'Arrivare da un altro Cantone non cambia niente: Friburgo ti tassa per tutto l’anno, e il tuo Comune d’arrivo riscuote l’imposta comunale per tutto l’anno. Un trasloco tra Comuni friburghesi ripartisce l’imposta comunale tra di loro secondo il tempo passato in ciascuno. Arrivare dall’estero, o lasciare la Svizzera, significa che qui hai pagato le imposte solo per una parte dell’anno.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=4'
      label:
        en: 'Fribourg tax guide 2025, p. 4: moving during the year'
        fr: 'Instructions générales 2025, p. 4 : Déplacement de domicile'
        de: 'Wegleitung Freiburg 2025, S. 4: Wohnsitzwechsel, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 4: trasloco nel corso dell’anno'
    text:
      en: 'Did you move in 2026?'
      fr: 'Avez-vous déménagé en 2026 ?'
      de: 'Bist du 2026 umgezogen?'
      it: 'Hai traslocato nel 2026?'
    options:
      - { value: 'no', label: { en: 'No', fr: 'Non', de: 'Nein', it: 'No' } }
      - value: within_fr
        label:
          {
            en: 'Yes, from another Fribourg commune',
            fr: 'Oui, depuis une autre commune fribourgeoise',
            de: 'Ja, aus einer anderen Freiburger Gemeinde',
            it: 'Sì, da un altro Comune friburghese',
          }
        notSupported:
          {
            en: 'A move between Fribourg communes during the year (the communal tax is shared between them)',
            fr: 'Un déménagement entre communes fribourgeoises en cours d’année (l’impôt communal est réparti entre elles)',
            de: 'Ein Umzug zwischen Freiburger Gemeinden während des Jahres (die Gemeindesteuer wird zwischen ihnen aufgeteilt)',
            it: 'Un trasloco tra Comuni friburghesi nel corso dell’anno (l’imposta comunale viene ripartita tra di loro)',
          }
      - value: from_other_canton
        label:
          {
            en: 'Yes, from another canton',
            fr: 'Oui, depuis un autre canton',
            de: 'Ja, aus einem anderen Kanton',
            it: 'Sì, da un altro Cantone',
          }
        chip:
          {
            en: 'Moved from another canton',
            fr: 'Arrivé(e) d’un autre canton',
            de: 'Zuzug aus einem anderen Kanton',
            it: 'Arrivo da un altro Cantone',
          }
      - value: from_abroad
        label:
          {
            en: 'Yes, I arrived from abroad',
            fr: 'Oui, je suis arrivé(e) de l’étranger',
            de: 'Ja, ich bin aus dem Ausland zugezogen',
            it: 'Sì, sono arrivato o arrivata dall’estero',
          }
        notSupported:
          {
            en: 'Arriving from abroad during the year',
            fr: 'Une arrivée de l’étranger en cours d’année',
            de: 'Ein Zuzug aus dem Ausland während des Jahres',
            it: 'L’arrivo dall’estero nel corso dell’anno',
          }
      - value: leaving_switzerland
        label:
          {
            en: 'I left, or I’m leaving, Switzerland',
            fr: 'J’ai quitté ou je quitte la Suisse',
            de: 'Ich habe die Schweiz verlassen oder verlasse sie',
            it: 'Ho lasciato o sto per lasciare la Svizzera',
          }
        notSupported:
          {
            en: 'Leaving Switzerland',
            fr: 'Un départ de Suisse',
            de: 'Ein Wegzug ins Ausland',
            it: 'La partenza dalla Svizzera',
          }

  # Church tax (impôt ecclésiastique): the parish's coefficients on income and wealth, in percent of
  # the cantonal base tax (fr-2025-guide-instructions-generales p. 46; the canton's parish tables).
  # Two churches levy it in every commune, the Roman Catholic and the Evangelical Reformed. Opt-in:
  # Taxpresso adds it only for members. Spouses of different churches: not computed
  # (packages/rules-fr, NOTE.churchMixed).
  - id: church
    key: fr.church
    group: detail
    type: choice
    perPerson: true
    explain:
      en: 'Members of the Roman Catholic or Evangelical Reformed church pay church tax (impôt ecclésiastique) at their parish’s coefficients. Taxpresso adds it only for members.'
      fr: 'Les membres de l’Église catholique romaine ou évangélique réformée paient l’impôt ecclésiastique selon les coefficients de leur paroisse. Taxpresso ne l’ajoute que pour les membres.'
      de: 'Mitglieder der römisch-katholischen oder der evangelisch-reformierten Kirche zahlen Kirchensteuer (impôt ecclésiastique) nach den Steuerfüssen ihrer Pfarrei. Taxpresso rechnet sie nur für Mitglieder dazu.'
      it: 'I membri della Chiesa cattolica romana o evangelica riformata pagano l’imposta di culto (impôt ecclésiastique) secondo i moltiplicatori della loro parrocchia. Taxpresso la aggiunge solo per chi ne è membro.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=46'
      label:
        en: 'Fribourg tax guide 2025, p. 46: communal and church tax'
        fr: 'Instructions générales 2025, p. 46 : Impôt communal et ecclésiastique'
        de: 'Wegleitung Freiburg 2025, S. 46: Gemeinde- und Kirchensteuer, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 46: imposta comunale e imposta di culto'
    text:
      p1:
        en: 'On 31 December 2026, were you a member of one of these churches?'
        fr: 'Au 31 décembre 2026, étiez-vous membre de l’une de ces Églises ?'
        de: 'Warst du am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026, eri membro di una di queste Chiese?'
      p2:
        en: 'On 31 December 2026, was your spouse or partner a member of one of these churches?'
        fr: 'Au 31 décembre 2026, votre conjoint ou partenaire était-il membre de l’une de ces Églises ?'
        de: 'War dein Partner oder deine Partnerin am 31. Dezember 2026 Mitglied einer dieser Kirchen?'
        it: 'Il 31 dicembre 2026, il tuo coniuge o partner era membro di una di queste Chiese?'
    help:
      en: 'Another religion, or none, pays no church tax.'
      fr: 'Une autre religion, ou aucune, ne paie pas d’impôt ecclésiastique.'
      de: 'Eine andere Religion oder keine zahlt keine Kirchensteuer.'
      it: 'Con un’altra religione, o nessuna, non si paga l’imposta di culto.'
    options:
      - value: catholic
        label:
          {
            en: 'Roman Catholic (catholique romaine)',
            fr: 'Catholique romaine',
            de: 'Römisch-katholisch (catholique romaine)',
            it: 'Cattolica romana (catholique romaine)',
          }
        chip: { en: 'Catholic', fr: 'Catholique', de: 'Katholisch', it: 'Chiesa cattolica' }
      - value: reformed
        label:
          {
            en: 'Evangelical Reformed (évangélique réformée)',
            fr: 'Évangélique réformée',
            de: 'Evangelisch-reformiert (évangélique réformée)',
            it: 'Evangelica riformata (évangélique réformée)',
          }
        chip: { en: 'Reformed', fr: 'Réformé(e)', de: 'Reformiert', it: 'Chiesa riformata' }
      - value: none
        label:
          {
            en: 'None of these',
            fr: 'Aucune de ces Églises',
            de: 'Keine davon',
            it: 'Nessuna di queste',
          }

  # In 15 communes the parishes of one church levy different coefficients (the canton's 2026 parish
  # tables, fr-2026-parish-coefficients-catholic-opendata and -reformed-opendata): asked only there,
  # of a member of that church; elsewhere the commune's parish applies. The options are
  # packages/rules-fr's parishOptions(2026), each offered only in its own commune for its church; a
  # test keeps them equal. The names are the tables'.
  - id: parish
    key: fr.parish
    group: detail
    type: choice
    when:
      any:
        - all:
            - key: profile.commune
              in:
                [
                  '2113',
                  '2114',
                  '2220',
                  '2236',
                  '2239',
                  '2262',
                  '2293',
                  '2295',
                  '2296',
                  '2304',
                  '2305',
                  '2306',
                ]
            - { key: fr.church, in: [catholic], anyPerson: true }
        - all:
            - { key: profile.commune, in: ['2262', '2275', '2293'] }
            - { key: fr.church, in: [reformed], anyPerson: true }
    explain:
      en: 'Your commune has several parishes of your church, with different coefficients. Choose the parish you belonged to on 31 December.'
      fr: 'Votre commune compte plusieurs paroisses de votre Église, avec des coefficients différents. Choisissez la paroisse dont vous faisiez partie au 31 décembre.'
      de: 'Deine Gemeinde hat mehrere Pfarreien deiner Kirche, mit verschiedenen Steuerfüssen. Wähl die Pfarrei, zu der du am 31. Dezember gehört hast.'
      it: 'Il tuo Comune ha più parrocchie della tua Chiesa, con moltiplicatori diversi. Scegli la parrocchia a cui appartenevi il 31 dicembre.'
    learnMore:
      url: 'https://www.fr.ch/impots/personnes-physiques/coefficients-communaux-et-paroisses'
      label:
        en: 'Fribourg: communal and parish tax coefficients'
        fr: 'Coefficients communaux et paroisses'
        de: 'Freiburg: Gemeinde- und Pfarreisteuerfüsse, auf Französisch'
        it: 'Friburgo: moltiplicatori d’imposta dei Comuni e delle parrocchie'
    text:
      en: 'Which parish did you belong to on 31 December 2026?'
      fr: 'De quelle paroisse faisiez-vous partie au 31 décembre 2026 ?'
      de: 'Zu welcher Pfarrei hast du am 31. Dezember 2026 gehört?'
      it: 'A quale parrocchia appartenevi il 31 dicembre 2026?'
    help:
      en: 'Not sure? Your parish or your commune knows.'
      fr: 'Un doute ? Votre paroisse ou votre commune le sait.'
      de: 'Unsicher? Deine Pfarrei oder deine Gemeinde weiss es.'
      it: 'Hai un dubbio? Lo sa la tua parrocchia o il tuo Comune.'
