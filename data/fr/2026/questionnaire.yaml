  # fr-2025-guide-instructions-generales p. 8 (1.110: proven by the salary certificate of each
  # employer).
  - use: employers
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=8'
      label:
        en: 'Fribourg tax guide 2025, p. 8: salaried work'
        fr: 'Instructions générales 2025, p. 8 : Activité salariée principale'
        de: 'Wegleitung Freiburg 2025, S. 8: unselbständige Erwerbstätigkeit, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 8: attività dipendente'
    help:
      en: 'Each one gives you a salary certificate (certificat de salaire).'
      fr: 'Chacun vous remet un certificat de salaire.'
      de: 'Jeder gibt dir einen Lohnausweis (certificat de salaire).'
      it: 'Ognuno ti dà un certificato di salario (certificat de salaire).'

  # Swiss, a C permit or another permit: whether tax is taken at source follows from it and the
  # income (ch-na-law-lifd p. 49, art. 83 al. 1 and 2; data/ch/2026/questions.yaml).
  - use: residence

  # Tax at source (impôt à la source): an ordinary assessment afterwards (TOU) automatically above a
  # salary threshold, or on request by 31 March of the next year, which can't be withdrawn
  # (fr-2026-source-tax-ordonnance art. 11, 12). Not covered by packages/rules-fr.
  - use: taxed_at_source
    yesNotSupported:
      en: 'Tax at source in Fribourg (impôt à la source) and the ordinary assessment that follows it (taxation ordinaire ultérieure, TOU)'
      fr: 'L’impôt à la source dans le canton de Fribourg et la taxation ordinaire ultérieure (TOU) qui le suit'
      de: 'Die Quellensteuer im Kanton Freiburg (impôt à la source) und die nachträgliche ordentliche Veranlagung (taxation ordinaire ultérieure, TOU)'
      it: 'L’imposta alla fonte nel Cantone di Friburgo (impôt à la source) e la tassazione ordinaria ulteriore che la segue (taxation ordinaire ultérieure, TOU)'
    learnMore:
      url: 'https://www.fr.ch/impots/impot-a-la-source'
      label:
        en: 'Fribourg: tax at source'
        fr: 'Impôt à la source'
        de: 'Freiburg: Quellensteuer, auf Französisch'
        it: 'Friburgo: imposta alla fonte'
    help:
      en: 'If so, it shows on the salary certificate (certificat de salaire).'
      fr: 'Si c’est le cas, cela figure sur le certificat de salaire.'
      de: 'Wenn ja, steht es auf dem Lohnausweis (certificat de salaire).'
      it: 'Se è così, lo trovi sul certificato di salario (certificat de salaire).'

  # Travel to work (frais de transport, code 2.110): fr-2025-guide-instructions-generales p. 11 (public
  # transport, what it cost; a bike or moped, a flat amount; a car or motorbike, what public transport
  # would have cost, or per km with no usable public transport), up to the cantonal limit; the federal
  # one, p. 47. No "over 2 hours a day" choice: only Geneva's meal rule needs it.
  - use: commute
    explain:
      en: 'Getting to work is deducted as travel costs (frais de transport, code 2.110), for the cantonal tax and, up to its own yearly limit, the federal tax. How you get there decides how they are counted.'
      fr: 'Le trajet pour le travail se déduit comme frais de transport (code 2.110), pour l’impôt cantonal et, jusqu’à sa propre limite annuelle, pour l’impôt fédéral. Votre moyen de transport décide comment ils sont comptés.'
      de: 'Der Arbeitsweg wird als Fahrkosten (frais de transport, Code 2.110) abgezogen, bei der Kantonssteuer und, bis zu ihrem eigenen jährlichen Höchstbetrag, bei der Bundessteuer. Wie du hinkommst, entscheidet, wie sie gezählt werden.'
      it: 'Il tragitto per andare al lavoro si deduce come spese di trasporto (frais de transport, codice 2.110), per l’imposta cantonale e, fino al suo limite annuo, per l’imposta federale. Il mezzo che usi decide come vengono calcolate.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=11'
      label:
        en: 'Fribourg tax guide 2025, p. 11: travel to work'
        fr: 'Instructions générales 2025, p. 11 : Frais de transport'
        de: 'Wegleitung Freiburg 2025, S. 11: Fahrkosten, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 11: tragitto casa-lavoro'
    help:
      en: 'Choose how you went on most work days. On the return: code 2.110, frais de transport (annex 03 gives the details).'
      fr: 'Choisissez comment vous y alliez la plupart des jours de travail. Sur la déclaration : code 2.110, frais de transport (l’annexe 03 en donne le détail).'
      de: 'Wähl, wie du an den meisten Arbeitstagen hingekommen bist. Auf der Steuererklärung: Code 2.110, frais de transport (die Beilage 03 gibt die Einzelheiten).'
      it: 'Scegli come ci andavi nella maggior parte dei giorni di lavoro. Nella dichiarazione: codice 2.110, frais de transport (l’allegato 03 riporta i dettagli).'
    options:
      - value: public_transport
        label:
          {
            en: 'Public transport',
            fr: 'Transports publics',
            de: 'Öffentlicher Verkehr',
            it: 'Trasporti pubblici',
          }
      - { value: car, label: { en: 'Car', fr: 'Voiture', de: 'Auto', it: 'Auto' } }
      - value: motorbike
        label:
          {
            en: 'Motorbike or scooter with a white number plate',
            fr: 'Moto ou scooter à plaque blanche',
            de: 'Motorrad oder Roller mit weissem Kontrollschild',
            it: 'Moto o scooter con targa bianca',
          }
      - value: bike
        label:
          {
            en: 'Bike, e-bike or moped with a yellow number plate',
            fr: 'Vélo, vélo électrique ou cyclomoteur à plaque jaune',
            de: 'Velo, E-Bike oder Mofa mit gelbem Kontrollschild',
            it: 'Bicicletta, e-bike o ciclomotore con targa gialla',
          }
      - { value: walk, label: { en: 'On foot', fr: 'À pied', de: 'Zu Fuss', it: 'A piedi' } }
      - value: mostly_home
        label:
          {
            en: 'From home, almost every day',
            fr: 'Depuis chez moi, presque tous les jours',
            de: 'Von zu Hause, fast jeden Tag',
            it: 'Da casa, quasi tutti i giorni',
          }
        chip: { en: 'Works from home', fr: 'Télétravail', de: 'Homeoffice', it: 'Telelavoro' }

  - use: commute_transit_cost
    explain:
      en: 'You deduct what public transport to work cost you, 2nd class (frais de transport, code 2.110), for the cantonal tax and, up to its own yearly limit, the federal tax.'
      fr: 'Vous déduisez ce que les transports publics vous ont coûté pour aller au travail, en 2e classe (frais de transport, code 2.110), pour l’impôt cantonal et, jusqu’à sa propre limite annuelle, pour l’impôt fédéral.'
      de: 'Du ziehst ab, was dich der öffentliche Verkehr zur Arbeit gekostet hat, 2. Klasse (frais de transport, Code 2.110), bei der Kantonssteuer und, bis zu ihrem eigenen jährlichen Höchstbetrag, bei der Bundessteuer.'
      it: 'Deduci quanto ti sono costati i trasporti pubblici per andare al lavoro, in seconda classe (frais de transport, codice 2.110), per l’imposta cantonale e, fino al suo limite annuo, per l’imposta federale.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=11'
      label:
        en: 'Fribourg tax guide 2025, p. 11: travel to work'
        fr: 'Instructions générales 2025, p. 11 : Frais de transport'
        de: 'Wegleitung Freiburg 2025, S. 11: Fahrkosten, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 11: tragitto casa-lavoro'

  # fr-2025-guide-instructions-generales p. 11: per km only with proof that there is no public
  # transport or it can't be used (disability, distance, unsuitable timetable).
  - use: commute_transit_usable
    explain:
      en: 'A driver deducts what public transport would have cost. The kilometres count only if you can show there is no public transport for the trip or you can’t use it: a disability, the distance to a stop, or a timetable that doesn’t fit.'
      fr: 'Un conducteur déduit ce qu’auraient coûté les transports publics. Les kilomètres ne comptent que si vous prouvez qu’il n’y a pas de transports publics pour ce trajet ou que vous ne pouvez pas les utiliser : infirmité, éloignement, horaire défavorable.'
      de: 'Wer fährt, zieht ab, was der öffentliche Verkehr gekostet hätte. Die Kilometer zählen nur, wenn du zeigst, dass es für diesen Weg keinen öffentlichen Verkehr gibt oder du ihn nicht benutzen kannst: eine Behinderung, die Entfernung zur Haltestelle oder ein ungünstiger Fahrplan.'
      it: 'Chi guida deduce quanto sarebbero costati i trasporti pubblici. I chilometri contano solo se puoi dimostrare che per quel tragitto non ci sono trasporti pubblici o che non puoi usarli: una disabilità, la distanza da una fermata o un orario che non va bene.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=11'
      label:
        en: 'Fribourg tax guide 2025, p. 11: travel to work'
        fr: 'Instructions générales 2025, p. 11 : Frais de transport'
        de: 'Wegleitung Freiburg 2025, S. 11: Fahrkosten, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 11: tragitto casa-lavoro'
    options:
      - value: 'yes'
        label:
          {
            en: 'Yes, I could have used public transport',
            fr: 'Oui, j’aurais pu prendre les transports publics',
            de: 'Ja, ich hätte den öffentlichen Verkehr nutzen können',
            it: 'Sì, avrei potuto usare i trasporti pubblici',
          }
      - value: 'no'
        label:
          {
            en: 'No: none for the trip, a disability, the distance to a stop, or the timetable',
            fr: 'Non : aucun pour ce trajet, une infirmité, l’éloignement ou l’horaire',
            de: 'Nein: keiner für diesen Weg, eine Behinderung, die Entfernung oder der Fahrplan',
            it: 'No: non ce ne sono per quel tragitto, una disabilità, la distanza da una fermata o l’orario',
          }

  - use: commute_transit_equivalent
    explain:
      en: 'That price is what you deduct for driving to work (frais de transport, code 2.110), for the cantonal tax and, up to its own yearly limit, the federal tax.'
      fr: 'C’est ce prix que vous déduisez pour le trajet en véhicule (frais de transport, code 2.110), pour l’impôt cantonal et, jusqu’à sa propre limite annuelle, pour l’impôt fédéral.'
      de: 'Diesen Preis ziehst du für die Fahrt zur Arbeit ab (frais de transport, Code 2.110), bei der Kantonssteuer und, bis zu ihrem eigenen jährlichen Höchstbetrag, bei der Bundessteuer.'
      it: 'È questo prezzo che deduci per andare al lavoro con il tuo veicolo (frais de transport, codice 2.110), per l’imposta cantonale e, fino al suo limite annuo, per l’imposta federale.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=11'
      label:
        en: 'Fribourg tax guide 2025, p. 11: travel to work'
        fr: 'Instructions générales 2025, p. 11 : Frais de transport'
        de: 'Wegleitung Freiburg 2025, S. 11: Fahrkosten, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 11: tragitto casa-lavoro'

  - use: commute_distance
    explain:
      en: 'With a reason to drive, Fribourg counts a rate per kilometre, there and back once a day, lower for a long yearly mileage; the federal tax counts its own, each up to a yearly limit.'
      fr: 'Avec une raison de prendre le véhicule, Fribourg compte un montant par kilomètre, un aller et retour par jour, plus bas pour un long kilométrage annuel ; l’impôt fédéral compte le sien, chacun jusqu’à une limite annuelle.'
      de: 'Mit einem Grund fürs Fahren zählt Freiburg einen Betrag pro Kilometer, einmal hin und zurück pro Tag, tiefer bei vielen Kilometern im Jahr; die Bundessteuer zählt ihren eigenen, jeweils bis zu einem jährlichen Höchstbetrag.'
      it: 'Se hai un motivo per usare il veicolo, Friburgo conta un importo per chilometro, andata e ritorno una volta al giorno, più basso se percorri molti chilometri all’anno; l’imposta federale conta il proprio, ciascuno fino a un limite annuo.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=11'
      label:
        en: 'Fribourg tax guide 2025, p. 11: travel by car'
        fr: 'Instructions générales 2025, p. 11 : Frais de transport'
        de: 'Wegleitung Freiburg 2025, S. 11: Fahrkosten mit dem Auto, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 11: tragitto in auto'

  # fr-2025-guide-instructions-generales p. 12 (220 working days a year; none for telework days).
  - use: commute_drive_days
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=12'
      label:
        en: 'Fribourg tax guide 2025, p. 12: working days'
        fr: 'Instructions générales 2025, p. 12 : Frais de transport et repas'
        de: 'Wegleitung Freiburg 2025, S. 12: Arbeitstage, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 12: giorni lavorativi'
    help:
      en: 'The days you actually worked there; a full year of work counts 220 days. Leave out holidays, sick days and days worked from home.'
      fr: 'Les jours effectivement travaillés sur place ; une année entière compte 220 jours. Sans les vacances, les jours de maladie et les jours de télétravail.'
      de: 'Die effektiven Arbeitstage am Arbeitsort; ein ganzes Jahr zählt 220 Tage. Ohne Ferien, Krankheitstage und Tage im Homeoffice.'
      it: 'I giorni in cui hai effettivamente lavorato sul posto; un anno intero di lavoro conta 220 giorni. Senza le vacanze, i giorni di malattia e i giorni di telelavoro.'

  # fr-2025-guide-instructions-generales p. 12 (2.120: lunch away from home, a fixed amount per day up
  # to a yearly limit, half with a canteen or meal vouchers; none for telework days).
  - use: meal_days
    explain:
      en: 'Lunch away from home because of work counts as a fixed amount per day, up to a yearly limit (repas hors du domicile, code 2.120), for both taxes; half of it when your employer pays part of the meal (box G of your salary certificate).'
      fr: 'Le repas de midi pris hors du domicile à cause du travail compte pour un montant fixe par jour, jusqu’à une limite annuelle (repas hors du domicile, code 2.120), pour les deux impôts ; la moitié quand l’employeur paie une partie du repas (case G du certificat de salaire).'
      de: 'Das Mittagessen auswärts wegen der Arbeit zählt mit einem festen Betrag pro Tag, bis zu einem jährlichen Höchstbetrag (repas hors du domicile, Code 2.120), bei beiden Steuern; die Hälfte, wenn dein Arbeitgeber einen Teil bezahlt (Feld G des Lohnausweises).'
      it: 'Il pranzo fuori casa per motivi di lavoro conta come un importo fisso al giorno, fino a un limite annuo (repas hors du domicile, codice 2.120), per entrambe le imposte; la metà quando il tuo datore di lavoro paga una parte del pasto (casella G del tuo certificato di salario).'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=12'
      label:
        en: 'Fribourg tax guide 2025, p. 12: lunch away from home'
        fr: 'Instructions générales 2025, p. 12 : Repas hors du domicile'
        de: 'Wegleitung Freiburg 2025, S. 12: Mahlzeiten auswärts, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 12: pranzo fuori casa'

  # fr-2025-guide-instructions-generales p. 15 and 16 (annex 01, état des titres: accounts, securities
  # and other investments, the children's included, code 3.210).
  - use: banks
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=15'
      label:
        en: 'Fribourg tax guide 2025, p. 15: securities and accounts'
        fr: 'Instructions générales 2025, p. 15 : Titres et autres placements de capitaux'
        de: 'Wegleitung Freiburg 2025, S. 15: Wertschriften und Guthaben, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 15: titoli e conti'
    help:
      en: 'Count PostFinance too, your minor children’s accounts, and online or foreign brokers. On the return: annex 01, état des titres, code 3.210.'
      fr: 'Comptez aussi PostFinance, les comptes de vos enfants mineurs et les courtiers en ligne ou étrangers. Sur la déclaration : annexe 01, état des titres, code 3.210.'
      de: 'Zähl auch PostFinance, die Konten deiner minderjährigen Kinder und Online- oder ausländische Broker. Auf der Steuererklärung: Beilage 01, état des titres (Wertschriftenverzeichnis), Code 3.210.'
      it: 'Conta anche PostFinance, i conti dei tuoi figli minorenni e i broker online o esteri. Nella dichiarazione: allegato 01, état des titres, codice 3.210.'

  # fr-2025-guide-instructions-generales p. 16 (crypto-monnaies in annex 01).
  - use: crypto
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=16'
      label:
        en: 'Fribourg tax guide 2025, p. 16: what to declare in annex 01, crypto-assets included'
        fr: 'Instructions générales 2025, p. 16 : Ce qu’il faut déclarer dans l’annexe 01'
        de: 'Wegleitung Freiburg 2025, S. 16: was in die Beilage 01 gehört, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 16: cosa dichiarare nell’allegato 01, criptovalute comprese'

  # fr-2025-guide-instructions-generales p. 24 (4.110: the flat amounts per insured person; those
  # with a premium reduction deduct only the difference between the flat amount and the subsidy the
  # ECAS paid; unknown, the tax office counts it itself).
  - id: health_subsidy
    key: fr.health_subsidy
    group: detail
    type: money
    explain:
      en: 'Fribourg deducts a flat amount for each insured person’s health and accident insurance (caisse-maladie et accidents, code 4.110), whatever premiums you paid, less any premium subsidy (réduction des primes) you received.'
      fr: 'Fribourg déduit un montant forfaitaire pour l’assurance-maladie et accidents de chaque personne assurée (caisse-maladie et accidents, code 4.110), quelles que soient les primes payées, moins la réduction des primes que vous avez reçue.'
      de: 'Freiburg zieht für die Kranken- und Unfallversicherung jeder versicherten Person einen Pauschalbetrag ab (caisse-maladie et accidents, Code 4.110), egal welche Prämien du bezahlt hast, abzüglich einer erhaltenen Prämienverbilligung (réduction des primes).'
      it: 'Friburgo deduce un importo forfettario per l’assicurazione malattia e infortuni di ogni persona assicurata (caisse-maladie et accidents, codice 4.110), indipendentemente dai premi che hai pagato, meno l’eventuale riduzione dei premi (réduction des primes) che hai ricevuto.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=24'
      label:
        en: 'Fribourg tax guide 2025, p. 24: health and accident insurance'
        fr: 'Instructions générales 2025, p. 24 : Caisse-maladie et accidents'
        de: 'Wegleitung Freiburg 2025, S. 24: Kranken- und Unfallversicherung, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 24: assicurazione malattia e infortuni'
    text:
      en: 'How much premium subsidy (réduction des primes) did your household receive in 2026?'
      fr: 'Combien de réduction des primes votre ménage a-t-il reçue en 2026 ?'
      de: 'Wie viel Prämienverbilligung (réduction des primes) hat dein Haushalt 2026 erhalten?'
      it: 'Quanto ha ricevuto la tua economia domestica nel 2026 come riduzione dei premi (réduction des primes)?'
    help:
      en: 'In CHF, 0 if none. The ECAS pays it to your health insurer: its decision or your insurer’s statement shows it. Your answer replaces any Taxpresso read from your documents.'
      fr: 'En CHF, 0 si aucune. L’ECAS la verse à votre caisse-maladie : sa décision ou le décompte de votre caisse l’indique. Votre réponse remplace celle que Taxpresso aurait lue dans vos documents.'
      de: 'In CHF, 0, wenn keine. Die ECAS zahlt sie deiner Krankenkasse: Der Entscheid der ECAS oder die Abrechnung deiner Kasse zeigt sie. Deine Antwort ersetzt, was Taxpresso aus deinen Dokumenten gelesen hat.'
      it: 'In CHF, 0 se nessuna. L’ECAS la versa alla tua cassa malati: lo indica la sua decisione o il conteggio della tua cassa malati. La tua risposta sostituisce l’importo che Taxpresso ha eventualmente letto nei tuoi documenti.'

  # fr-2025-guide-instructions-generales p. 24 (4.120: life insurance with or without a surrender
  # value, pure-risk, daily-allowance and life annuity insurance not deducted elsewhere, up to a
  # limit; rubric A of the last page).
  - id: life_insurance
    key: fr.life_insurance
    group: deduction
    type: money
    explain:
      en: 'Fribourg deducts premiums for life insurance, pure-risk insurance and daily-allowance insurance up to a limit (autres primes et cotisations, 3e pilier b, code 4.120).'
      fr: 'Fribourg déduit les primes d’assurance-vie, d’assurance risque pur et d’assurance pour indemnités journalières jusqu’à une limite (autres primes et cotisations, 3e pilier b, code 4.120).'
      de: 'Freiburg zieht Prämien für Lebens-, Risiko- und Taggeldversicherungen bis zu einem Höchstbetrag ab (autres primes et cotisations, 3e pilier b, Code 4.120).'
      it: 'Friburgo deduce i premi per l’assicurazione sulla vita, l’assicurazione di rischio puro e l’assicurazione d’indennità giornaliera fino a un limite (autres primes et cotisations, 3e pilier b, codice 4.120).'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=24'
      label:
        en: 'Fribourg tax guide 2025, p. 24: other insurance premiums'
        fr: 'Instructions générales 2025, p. 24 : Autres primes et cotisations (3e pilier b)'
        de: 'Wegleitung Freiburg 2025, S. 24: übrige Versicherungsprämien, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 24: altri premi assicurativi'
    text:
      en: 'How much did your household pay in 2026 for life, pure-risk or daily-allowance insurance?'
      fr: 'Combien votre ménage a-t-il payé en 2026 pour des assurances-vie, risque pur ou indemnités journalières ?'
      de: 'Wie viel hat dein Haushalt 2026 für Lebens-, Risiko- oder Taggeldversicherungen bezahlt?'
      it: 'Quanto ha pagato la tua economia domestica nel 2026 per assicurazioni sulla vita, di rischio puro o d’indennità giornaliera?'
    help:
      en: 'In CHF, 0 if none. Not your health insurance (Fribourg deducts a flat amount for it), nor pillar 3a. On the return: rubric A of the last page.'
      fr: 'En CHF, 0 si aucune. Pas votre caisse-maladie (Fribourg déduit un forfait pour elle), ni le pilier 3a. Sur la déclaration : rubrique A de la dernière page.'
      de: 'In CHF, 0, wenn keine. Nicht deine Krankenkasse (Freiburg zieht dafür einen Pauschalbetrag ab) und nicht die Säule 3a. Auf der Steuererklärung: Rubrik A der letzten Seite.'
      it: 'In CHF, 0 se nessuna. Non la tua cassa malati (per quella Friburgo deduce un importo forfettario), né il pilastro 3a. Nella dichiarazione: rubrica A dell’ultima pagina.'

  # fr-2025-guide-instructions-generales p. 25 (4.130: only with the attestation).
  - use: pillar3a
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=25'
      label:
        en: 'Fribourg tax guide 2025, p. 25: pillar 3a'
        fr: 'Instructions générales 2025, p. 25 : Prévoyance individuelle liée (3e pilier a)'
        de: 'Wegleitung Freiburg 2025, S. 25: Säule 3a, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 25: pilastro 3a'
    help:
      en: 'Your bank or insurer sends an attestation: attach it to your return. On the return: code 4.130, formes reconnues de prévoyance individuelle liée (3e pilier a).'
      fr: 'Votre banque ou votre assurance vous envoie une attestation : joignez-la à votre déclaration. Sur la déclaration : code 4.130, formes reconnues de prévoyance individuelle liée (3e pilier a).'
      de: 'Deine Bank oder Versicherung schickt dir eine Bescheinigung: Leg sie der Steuererklärung bei. Auf der Steuererklärung: Code 4.130, formes reconnues de prévoyance individuelle liée (Säule 3a).'
      it: 'La tua banca o la tua assicurazione ti manda un’attestazione: allegala alla dichiarazione. Nella dichiarazione: codice 4.130, formes reconnues de prévoyance individuelle liée (3e pilier a).'

  # fr-2025-guide-instructions-generales p. 25 and 26 (4.140: only buy-ins the salary certificate
  # doesn't show, box 10.2 being already deducted).
  - use: lpp_buyin
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=25'
      label:
        en: 'Fribourg tax guide 2025, p. 25: pension fund buy-ins'
        fr: 'Instructions générales 2025, p. 25 : Rachats d’années d’assurance'
        de: 'Wegleitung Freiburg 2025, S. 25: Einkäufe in die Pensionskasse, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 25: riscatti nella cassa pensione'
    help:
      en: 'A voluntary payment on top of the usual contributions. Count only a buy-in your salary certificate doesn’t show (box 10.2). On the return: code 4.140.'
      fr: 'Un versement volontaire en plus des cotisations habituelles. Ne comptez qu’un rachat que votre certificat de salaire n’indique pas (chiffre 10.2). Sur la déclaration : code 4.140.'
      de: 'Eine freiwillige Zahlung zusätzlich zu den üblichen Beiträgen. Zähl nur einen Einkauf, den dein Lohnausweis nicht zeigt (Ziffer 10.2). Auf der Steuererklärung: Code 4.140.'
      it: 'Un versamento volontario oltre ai contributi abituali. Conta solo un riscatto che il tuo certificato di salario non indica (cifra 10.2). Nella dichiarazione: codice 4.140.'

  # Interest on savings (code 4.150): only when the accounts and securities have an income, up to a
  # limit, never more than that income (fr-2025-guide-instructions-generales p. 26). When not
  # answered, the accounts' interest read from the bank documents is used; an answer replaces it
  # (packages/rules-fr, canton.ts, FribourgCantonal.savingsInterest).
  - id: savings_interest
    key: fr.savings_interest
    group: detail
    type: money
    when: { key: profile.banks, gt: 0 }
    explain:
      en: 'Fribourg deducts the interest on savings (déduction des intérêts de capitaux d’épargne, code 4.150) up to a limit, never more than the income of your accounts and securities: interest on bank accounts, bonds and loans you made. Not dividends or investment funds.'
      fr: 'Fribourg déduit les intérêts de capitaux d’épargne (code 4.150) jusqu’à une limite, jamais plus que le rendement de vos titres et placements : intérêts de comptes bancaires, d’obligations et de prêts que vous avez accordés. Pas les dividendes ni les fonds de placement.'
      de: 'Freiburg zieht die Zinsen auf Sparkapitalien (déduction des intérêts de capitaux d’épargne, Code 4.150) bis zu einem Höchstbetrag ab, nie mehr als der Ertrag deiner Wertschriften und Guthaben: Zinsen von Bankkonten, Obligationen und Darlehen, die du gewährt hast. Nicht Dividenden oder Anlagefonds.'
      it: 'Friburgo deduce gli interessi sui capitali di risparmio (déduction des intérêts de capitaux d’épargne, codice 4.150) fino a un limite, mai più del reddito dei tuoi conti e titoli: interessi su conti bancari, obbligazioni e prestiti che hai concesso. Non i dividendi né i fondi d’investimento.'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=26'
      label:
        en: 'Fribourg tax guide 2025, p. 26: interest on savings'
        fr: 'Instructions générales 2025, p. 26 : Déduction des intérêts de capitaux d’épargne'
        de: 'Wegleitung Freiburg 2025, S. 26: Zinsen auf Sparkapitalien, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 26: interessi sui risparmi'
    text:
      en: 'How much interest on savings did you receive in 2026?'
      fr: 'Combien d’intérêts de capitaux d’épargne avez-vous reçus en 2026 ?'
      de: 'Wie viel Zinsen auf Sparkapitalien (intérêts de capitaux d’épargne) hast du 2026 erhalten?'
      it: 'Quanti interessi sui risparmi hai ricevuto nel 2026?'
    help:
      en: 'In CHF for the household, your children’s accounts included; 0 if none. Your answer replaces the interest Taxpresso reads from your bank documents. Not sure? Skip it: Taxpresso then uses your bank documents.'
      fr: 'En CHF pour le ménage, comptes de vos enfants compris ; 0 si aucun. Votre réponse remplace les intérêts que Taxpresso lit dans vos documents bancaires. Un doute ? Passez la question : Taxpresso utilise alors vos documents bancaires.'
      de: 'In CHF für den Haushalt, die Konten deiner Kinder eingeschlossen; 0, wenn keine. Deine Antwort ersetzt die Zinsen, die Taxpresso aus deinen Bankunterlagen liest. Unsicher? Überspring die Frage: Taxpresso nimmt dann deine Bankunterlagen.'
      it: 'In CHF per tutta l’economia domestica, compresi i conti dei tuoi figli; 0 se nessuno. La tua risposta sostituisce gli interessi che Taxpresso legge nei tuoi documenti bancari. Hai un dubbio? Salta la domanda: Taxpresso usa allora i tuoi documenti bancari.'

  # fr-2025-guide-instructions-generales p. 26 and 27 (4.210, annex 02), p. 31 (4.340), p. 33 and 34
  # (5.110, 5.120, rubrics B and C of the last page).
  - use: payments
    explain:
      en: 'Each of these can lower your tax if you keep the proof: debt interest (intérêts passifs privés, code 4.210), alimony paid (pension alimentaire versée, 4.340), medical and dental costs (frais médicaux, 5.110) and donations (versements bénévoles, 5.120).'
      fr: 'Chacun de ces frais peut diminuer votre impôt si vous en gardez la preuve : intérêts passifs privés (code 4.210), pension alimentaire versée (4.340), frais médicaux et dentaires (5.110) et versements bénévoles (5.120).'
      de: 'Jede dieser Ausgaben kann deine Steuer senken, wenn du den Beleg aufbewahrst: Schuldzinsen (intérêts passifs privés, Code 4.210), bezahlte Unterhaltsbeiträge (pension alimentaire versée, 4.340), Arzt- und Zahnarztkosten (frais médicaux, 5.110) und Spenden (versements bénévoles, 5.120).'
      it: 'Ognuna di queste spese può ridurre le tue imposte se ne conservi la prova: interessi passivi (intérêts passifs privés, codice 4.210), alimenti versati (pension alimentaire versée, 4.340), spese mediche e dentarie (frais médicaux, 5.110) e donazioni (versements bénévoles, 5.120).'
    learnMore:
      url: 'https://www.fr.ch/document/57721#page=33'
      label:
        en: 'Fribourg tax guide 2025, p. 33: medical costs and donations'
        fr: 'Instructions générales 2025, p. 33 : Frais médicaux'
        de: 'Wegleitung Freiburg 2025, S. 33: Krankheitskosten und Spenden, auf Französisch'
        it: 'Guida fiscale di Friburgo 2025, p. 33: spese di malattia e donazioni'

  # What Taxpresso can't prepare for Fribourg yet: property (3.310 to 3.350, annex 04), inheritances
  # and gifts, income from abroad, capital payments from pension schemes (taxed apart, rubric E of the
  # last page, p. 40). FriTax is the canton's free program (fr-2025-fritax-accueil).
  - use: special
    learnMore:
      url: 'https://www.fr.ch/impots/personnes-physiques/fritax'
      label:
        en: 'FriTax, the canton’s free program'
        fr: 'FriTax, le programme gratuit du canton'
        de: 'FriTax, das kostenlose Programm des Kantons, auf Französisch'
        it: 'FriTax, il programma gratuito del Cantone'
    options:
      - value: real_estate
        label:
          {
            en: 'I own real estate, in Switzerland or abroad',
            fr: 'Je suis propriétaire d’un bien immobilier, en Suisse ou à l’étranger',
            de: 'Ich besitze eine Liegenschaft, in der Schweiz oder im Ausland',
            it: 'Sono proprietario o proprietaria di un immobile, in Svizzera o all’estero',
          }
        notSupported:
          {
            en: 'Real estate (immeubles, annex 04)',
            fr: 'Les immeubles (annexe 04)',
            de: 'Liegenschaften (immeubles, Beilage 04)',
            it: 'Gli immobili (immeubles, allegato 04)',
          }
      - value: inheritance_or_gift
        label:
          {
            en: 'I received an inheritance or a large gift',
            fr: 'J’ai reçu un héritage ou une donation importante',
            de: 'Ich habe eine Erbschaft oder eine grosse Schenkung erhalten',
            it: 'Ho ricevuto un’eredità o una donazione importante',
          }
        notSupported:
          {
            en: 'An inheritance or a gift',
            fr: 'Un héritage ou une donation',
            de: 'Eine Erbschaft oder Schenkung',
            it: 'Un’eredità o una donazione',
          }
      - value: foreign_income
        label:
          {
            en: 'I had income from abroad (salary, pension, rent)',
            fr: 'J’ai eu des revenus de l’étranger (salaire, rente, loyer)',
            de: 'Ich hatte Einkünfte aus dem Ausland (Lohn, Rente, Miete)',
            it: 'Ho avuto redditi dall’estero (salario, rendita, affitto)',
          }
        notSupported:
          {
            en: 'Income from abroad',
            fr: 'Des revenus de l’étranger',
            de: 'Einkünfte aus dem Ausland',
            it: 'Redditi dall’estero',
          }
      - value: pension_capital
        label:
          {
            en: 'I withdrew pension capital (2nd or 3rd pillar)',
            fr: 'J’ai retiré un capital de prévoyance (2e ou 3e pilier)',
            de: 'Ich habe Vorsorgekapital bezogen (2. Säule oder Säule 3a)',
            it: 'Ho prelevato un capitale di previdenza (2° o 3° pilastro)',
          }
        notSupported:
          {
            en: 'A pension capital withdrawal (prestations en capital)',
            fr: 'Un retrait de capital de prévoyance (prestations en capital)',
            de: 'Ein Kapitalbezug aus der Vorsorge (prestations en capital)',
            it: 'Un prelievo di capitale di previdenza (prestations en capital)',
          }

