name: Suggest an idea
description: A feature, a canton, a clearer word, anything that would make Taxpresso better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        We read everything. Please don't include real tax data.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Taxpresso to do, and why would it help you?
    validations:
      required: true
